合端口不能相同。&lt;/p&gt;&lt;/details&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 无 JavaScript 也可展开\u003c/li>\u003cli>□ 屏幕阅读器读出折叠状态\u003c/li>\u003cli>□ 展开内容无布局动画\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/divider","title":"分隔与层级","html":"\u003ch1>分隔与层级\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 布局 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>把相关组分开；只在必要处添加分界线。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>1px 语义 line\u003c/li>\u003cli>上下 20px 间距\u003c/li>\u003cli>可选组标题\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>分隔不参与 Tab；语义分隔使用 hr；装饰边框不新增地标。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>留白能表达分组时不再叠加线条。\u003c/li>\u003cli>避免每个列表行都加粗边框。\u003c/li>\u003cli>高对比模式保留清楚的分组边界。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;p&gt;网络设置&lt;/p&gt;&lt;hr class=&quot;ds-divider&quot;&gt;&lt;p&gt;系统集成&lt;/p&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 分组标题依然可读\u003c/li>\u003cli>□ 没有无意义焦点\u003c/li>\u003cli>□ 边界不替代信息标题\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/dock","title":"桌面悬浮应用坞","html":"\u003ch1>桌面悬浮应用坞\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS 与 iPadOS 标志性的桌面悬浮 Dock 工具坞；悬浮于界面边缘，提供大圆角毛玻璃与放大动效。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>药丸圆角磨砂悬浮坞\u003c/li>\u003cli>高层级环境阴影\u003c/li>\u003cli>独立图标按钮\u003c/li>\u003cli>当前运行活跃小圆点\u003c/li>\u003cli>垂直分割线\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 进入应用坞；左右方向键移动高亮；Enter 打开对应应用或工具面板。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>悬停图标具备自然放大的弹簧手感（scale(1.25) translateY(-4px)）。\u003c/li>\u003cli>活动项目底部附带微指示点（.ds-dock__dot），清晰指示当前开启的面板。\u003c/li>\u003cli>两端保持饱满圆角与深色高景深阴影。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-dock&quot; role=&quot;toolbar&quot; aria-label=&quot;悬浮快捷应用坞&quot;&gt;&lt;button class=&quot;ds-dock__item&quot; aria-label=&quot;仪表盘&quot; data-toast=&quot;打开仪表盘&quot;&gt;📊&lt;/button&gt;&lt;button class=&quot;ds-dock__item is-active&quot; aria-label=&quot;实时节点&quot; data-toast=&quot;切换至节点&quot;&gt;🌐&lt;span class=&quot;ds-dock__dot&quot;&gt;&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;ds-dock__item&quot; aria-label=&quot;日志终端&quot; data-toast=&quot;打开终端&quot;&gt;💻&lt;/button&gt;&lt;div class=&quot;ds-dock__separator&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;button class=&quot;ds-dock__item&quot; aria-label=&quot;偏好设置&quot; data-toast=&quot;打开系统设置&quot;&gt;⚙️&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FloatingDock items={dockApps} activeId=&quot;nodes&quot; onSelect={handleLaunch} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 悬停放大动效使用 transform compositor 运行无卡顿\u003c/li>\u003cli>□ 活跃圆点居中对齐图标下方\u003c/li>\u003cli>□ 减弱动效偏好下放大动效优雅平息\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/dropdown-menu","title":"下拉菜单","html":"\u003ch1>下拉菜单\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>收敛非核心操作与上下文动作；具备 macOS 弹出层质感、快捷键对齐与危险操作区分。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>触发按钮\u003c/li>\u003cli>浮层气泡容器\u003c/li>\u003cli>动作项列表\u003c/li>\u003cli>右侧快捷键对齐\u003c/li>\u003cli>可选分割线\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Enter/Space 打开；方向键 ↑/↓ 移动；Enter 执行动作并关闭；Escape 取消并回到触发按钮。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>菜单项按相关性分组；破坏性操作（如删除）放在底部并使用 danger 强调。\u003c/li>\u003cli>快捷键与真实键盘绑定一致，不要陈列未实现的修饰键。\u003c/li>\u003cli>移动端菜单项点击区域至少 44px。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-dropdown-wrapper&quot;&gt;&lt;button class=&quot;ds-button ds-button--secondary&quot; data-toggle-menu aria-haspopup=&quot;true&quot; aria-expanded=&quot;false&quot;&gt;操作菜单 ▾&lt;/button&gt;&lt;ul class=&quot;ds-menu&quot; role=&quot;menu&quot;&gt;&lt;li role=&quot;menuitem&quot; class=&quot;ds-menu__item&quot; data-toast=&quot;已复制节点配置&quot;&gt;&lt;span&gt;复制节点配置&lt;/span&gt;&lt;kbd class=&quot;ds-key&quot;&gt;⌘C&lt;/kbd&gt;&lt;/li&gt;&lt;li role=&quot;menuitem&quot; class=&quot;ds-menu__item&quot; data-toast=&quot;已导出规则文件&quot;&gt;&lt;span&gt;导出当前规则&lt;/span&gt;&lt;kbd class=&quot;ds-key&quot;&gt;⌘E&lt;/kbd&gt;&lt;/li&gt;&lt;li class=&quot;ds-menu__divider&quot;&gt;&lt;/li&gt;&lt;li role=&quot;menuitem&quot; class=&quot;ds-menu__item ds-menu__item--danger&quot; data-toast=&quot;已重置节点缓存&quot;&gt;&lt;span&gt;重置并清空缓存&lt;/span&gt;&lt;kbd class=&quot;ds-key&quot;&gt;⌫&lt;/kbd&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;DropdownMenu trigger={&lt;Button variant=&quot;secondary&quot;&gt;操作 ▾&lt;/Button&gt;} items={menuItems} onSelect={runAction} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 打开时焦点被安全管理\u003c/li>\u003cli>□ Escape 键可关闭菜单并恢复焦点\u003c/li>\u003cli>□ 危险动作有明确视觉与语义区分\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/dropzone","title":"文件拖拽上传区","html":"\u003ch1>文件拖拽上传区\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub 与 Linear 风格的虚线拖放区域；支持点击文件选择、拖拽高亮与文件类型规范提示。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>双像素虚线外框\u003c/li>\u003cli>上传语义微图标\u003c/li>\u003cli>主引导操作文案\u003c/li>\u003cli>限制与格式辅助说明\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 获得焦点并呈现双层焦点环；Enter 或 Space 打开原生系统文件选择对话框。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>拖拽进入（is-dragover）时平滑上浮（scale(1.01)）并高亮边框。\u003c/li>\u003cli>原生隐藏 input[type=file] 保证键盘和无障碍屏幕阅读器兼容。\u003c/li>\u003cli>支持多种文件格式扩展名限制说明。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-dropzone&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;点击或拖拽配置文件上传&quot; data-toast=&quot;打开文件选择器&quot; style=&quot;width:100%&quot;&gt;&lt;span class=&quot;ds-dropzone__icon&quot; aria-hidden=&quot;true&quot;&gt;📂&lt;/span&gt;&lt;p class=&quot;ds-dropzone__title&quot;&gt;点击或拖拽节点订阅至此区域&lt;/p&gt;&lt;p class=&quot;ds-dropzone__hint&quot;&gt;支持 .yaml, .json, .conf 规则文件（最大 10MB）&lt;/p&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FileDropzone onFileDrop={handleFiles} hint=&quot;支持 .yaml, .json 配置文件&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 键盘 Enter 能够触发文件选择对话框\u003c/li>\u003cli>□ 拖拽悬停时焦点高亮平滑自然\u003c/li>\u003cli>□ 无障碍焦点指示明显不被容器裁剪\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/dynamic-media-island","title":"iOS 18 灵动岛多态媒体波形收缩胶囊","html":"\u003ch1>iOS 18 灵动岛多态媒体波形收缩胶囊\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 18 与 iPhone 16 Pro 风格的动态变态媒体播放灵动岛胶囊；集成微缩封面、曲目标题副标与动态音频律动跳动条，支持微交互悬浮放缩。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>44px 高度纯黑物理药丸胶囊 (.ds-dynamic-island)\u003c/li>\u003cli>左侧微缩圆形/圆角专辑封面图元 (.ds-dynamic-island__art)\u003c/li>\u003cli>中部曲目与艺术家两行文字 (.ds-dynamic-island__meta)\u003c/li>\u003cli>右侧 4 柱多频段跳动声波律动柱 (.ds-dynamic-island__bars)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦灵动岛胶囊；Enter 或 Space 打开完整媒体播放器视图。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>纯黑高光物理超椭圆底座，内发光 inset 0 0 0 1px rgba(255,255,255,0.12) 还原真实 OLED 边框质感。\u003c/li>\u003cli>声波柱基于硬件加速百分比高度瞬态缩放，极致流畅且零重排。\u003c/li>\u003cli>极度紧凑（44px 高度），完美适应顶部状态栏、系统浮层与悬浮控制条。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-dynamic-island&quot; role=&quot;region&quot; aria-label=&quot;灵动岛媒体播放胶囊&quot; tabindex=&quot;0&quot;&gt;&lt;div class=&quot;ds-dynamic-island__art&quot; aria-hidden=&quot;true&quot;&gt;🎵&lt;/div&gt;&lt;div class=&quot;ds-dynamic-island__meta&quot;&gt;&lt;span class=&quot;ds-dynamic-island__title&quot;&gt;Cyberpunk 2077 OST&lt;/span&gt;&lt;span class=&quot;ds-dynamic-island__artist&quot;&gt;Marcin Przybyłowicz&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-dynamic-island__bars&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;ds-dynamic-island__bar&quot; style=&quot;height:40%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-dynamic-island__bar&quot; style=&quot;height:80%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-dynamic-island__bar&quot; style=&quot;height:60%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-dynamic-island__bar&quot; style=&quot;height:95%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;DynamicMediaIsland title=&quot;Cyberpunk 2077 OST&quot; artist=&quot;Marcin Przybyłowicz&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 纯黑 OLED 质感与微光内边框自然\u003c/li>\u003cli>□ 声波柱跳动高度平滑\u003c/li>\u003cli>□ 键盘聚焦与回车触发动作完整\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/empty","title":"空状态","html":"\u003ch1>空状态\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>解释数据不存在的原因，并提供一个明确的下一步。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>明确标题\u003c/li>\u003cli>一两句原因\u003c/li>\u003cli>主要行动\u003c/li>\u003cli>可选低干扰图标\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>行动按钮可 Tab；空状态插画不可获得无意义焦点。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>区分首次使用、搜索无结果、权限不足和请求失败。\u003c/li>\u003cli>没有节点引导导入；搜索无结果引导清除筛选。\u003c/li>\u003cli>不提供虚构演示数据伪装为空状态解决方案。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-empty&quot;&gt;&lt;strong&gt;还没有节点&lt;/strong&gt;&lt;p&gt;添加订阅地址或粘贴分享链接，开始配置你的连接。&lt;/p&gt;&lt;button class=&quot;ds-button&quot; data-toast=&quot;在实际产品中打开导入框&quot;&gt;添加订阅&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;EmptyState title=&quot;还没有节点&quot; description=&quot;添加订阅地址开始配置&quot; action={action} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 提示和当前空的原因一致\u003c/li>\u003cli>□ 主要动作真实可完成\u003c/li>\u003cli>□ 图标有意义或标记装饰\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/fab","title":"悬浮操作按钮","html":"\u003ch1>悬浮操作按钮\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Android 原生 AOSP Material 3 悬浮操作按钮与速度拨号（Speed Dial）展开盘；在单屏内提供最高优先级的快捷操作入口。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆形/圆角主悬浮按钮\u003c/li>\u003cli>触感高光与微仰角阴影\u003c/li>\u003cli>展开旋转图标 (+)\u003c/li>\u003cli>垂直展开的操作项菜单\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦主按钮；Enter/Space 展开菜单；上下方向键移动至菜单项；Escape 关闭菜单。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>主按钮固定于右下黄金操作区，或作为内联快捷入口。\u003c/li>\u003cli>展开时主图标顺滑旋转 45 度成为关闭标志 (×)。\u003c/li>\u003cli>操作子项附带微阴影与白色胶囊标签，辨识度极高。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-fab-wrapper&quot;&gt;&lt;div class=&quot;ds-fab-menu&quot; id=&quot;gallery-fab-menu&quot; hidden&gt;&lt;button class=&quot;ds-fab-item&quot; data-toast=&quot;导入剪贴板节点&quot;&gt;&lt;span&gt;📥&lt;/span&gt;&lt;span&gt;导入订阅&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;ds-fab-item&quot; data-toast=&quot;测速所有节点&quot;&gt;&lt;span&gt;⚡&lt;/span&gt;&lt;span&gt;批量测速&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;button class=&quot;ds-fab&quot; id=&quot;gallery-fab-btn&quot; aria-label=&quot;快捷悬浮菜单&quot; aria-expanded=&quot;false&quot; onclick=&quot;const m=document.getElementById(&#39;gallery-fab-menu&#39;);m.hidden=!m.hidden;this.classList.toggle(&#39;is-open&#39;,!m.hidden);this.setAttribute(&#39;aria-expanded&#39;,String(!m.hidden))&quot;&gt;&lt;span class=&quot;ds-fab__icon&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FloatingActionButton icon=&quot;+&quot; items={quickActions} onSelect={handleAction} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 按 Escape 键能够迅速收起展开的子操作\u003c/li>\u003cli>□ 图标旋转动效使用 transform compositor 线程\u003c/li>\u003cli>□ 高对比度模式下按钮边缘不模糊\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/field","title":"浮动标签输入框","html":"\u003ch1>浮动标签输入框\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>输入单行数据，标签始终保留；支持帮助、错误与禁用状态。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>浮动标签\u003c/li>\u003cli>填充型输入区域\u003c/li>\u003cli>底部焦点指示\u003c/li>\u003cli>帮助或错误文本\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 进入；原生文本编辑快捷键；标签使用 for/id 关联。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>标签为空会破坏理解，placeholder 仅用于示例。\u003c/li>\u003cli>focus 时标签上移并缩放，输入后保持浮动。\u003c/li>\u003cli>出错后保留输入内容，aria-invalid 和 aria-describedby 同步更新。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-field&quot;&gt;&lt;div class=&quot;ds-field__control&quot;&gt;&lt;input id=&quot;gallery-url&quot; placeholder=&quot; &quot; type=&quot;url&quot;&gt;&lt;label class=&quot;ds-field__label&quot; for=&quot;gallery-url&quot;&gt;订阅地址&lt;/label&gt;&lt;/div&gt;&lt;span class=&quot;ds-field__hint&quot;&gt;支持 HTTPS 订阅链接&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Field label=&quot;订阅地址&quot; value={url} onChange={change} error={error} hint=&quot;支持 HTTPS&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 粘贴完整地址不截断数据\u003c/li>\u003cli>□ 错误不清空内容\u003c/li>\u003cli>□ 帮助文本能被屏幕阅读器读取\u003c/li>\u003cli>□ IME 输入时不提前提交\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/figma-canvas-auto-layout-flow","title":"Figma 自动布局流向与间距控制条","html":"\u003ch1>Figma 自动布局流向与间距控制条\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 布局 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma 属性检查器核心的 Auto Layout 自动布局流向控制器；包含水平排列（→）、垂直排列（↓）、换行自适应（↩）三态切选，以及子项间距 Gap 像素调节微胶囊。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>紧凑胶囊型容器 (.ds-autolayout-flow)\u003c/li>\u003cli>三态方向选择微钮组 (.ds-autolayout-flow__group, .ds-autolayout-flow__btn)\u003c/li>\u003cli>激活项实底高亮微投影 (.ds-autolayout-flow__btn.is-active)\u003c/li>\u003cli>垂直分割细线 (.ds-autolayout-flow__divider)\u003c/li>\u003cli>子项间距 Gap 像素微指示器 (.ds-autolayout-flow__gap)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>ArrowLeft / ArrowRight 在方向按钮间切换；Enter 或 Space 选择流向。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;toolbar&quot; 与内部方向选项 role=&quot;radiogroup&quot; 及 aria-checked。\u003c/li>\u003cli>方向符号清晰直观，高对比度区分当前选中方向。\u003c/li>\u003cli>适合设计工具面板、Flexbox/Grid 布局控制、可视化低代码属性栏。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-autolayout-flow&quot; role=&quot;toolbar&quot; aria-label=&quot;自动布局流向控制器&quot;&gt;&lt;div class=&quot;ds-autolayout-flow__group&quot; role=&quot;radiogroup&quot; aria-label=&quot;排列方向&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-autolayout-flow__btn is-active&quot; aria-label=&quot;水平排列&quot; aria-checked=&quot;true&quot; role=&quot;radio&quot;&gt;→&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-autolayout-flow__btn&quot; aria-label=&quot;垂直排列&quot; aria-checked=&quot;false&quot; role=&quot;radio&quot;&gt;↓&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-autolayout-flow__btn&quot; aria-label=&quot;换行排列&quot; aria-checked=&quot;false&quot; role=&quot;radio&quot;&gt;↩&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ds-autolayout-flow__divider&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-autolayout-flow__gap&quot; title=&quot;子项间距 (Gap)&quot;&gt;&lt;span class=&quot;ds-autolayout-flow__gap-icon&quot; aria-hidden=&quot;true&quot;&gt;⇥⇤&lt;/span&gt;&lt;span&gt;16px&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FigmaAutoLayoutFlowIndicator direction=&quot;horizontal&quot; gap={16} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 三向切换钮平分且紧凑\u003c/li>\u003cli>□ 水平箭头激活带微阴影实底\u003c/li>\u003cli>□ 间距 16px 等宽显示清晰\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/figma-canvas-bounding-box-handles","title":"Figma 无限画布选中变换包围框与控制手柄","html":"\u003ch1>Figma 无限画布选中变换包围框与控制手柄\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 布局 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma 与 Illustrator 矢量设计画布图元选中状态下的变换外框（Transform Bounding Box &amp; Handles）；包含 8 个角点和边缘白色微方手柄、主色外框线、半透明选中底色及底边居中浮动尺寸标签。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>微亮蓝选中外边框 (.ds-bounding-box)\u003c/li>\u003cli>8 方位白色正方手柄点 (.ds-bounding-box__handle)\u003c/li>\u003cli>微透明手柄投影 (.ds-bounding-box__handle)\u003c/li>\u003cli>底边居中几何宽高标签 (.ds-bounding-box__tag)\u003c/li>\u003cli>轻微主色内衬填充\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>方向键微调元素坐标（Shift+方向键以 10px 步进）；Ctrl/Cmd+R 触发旋转。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>role=&quot;region&quot; 配合 aria-label 实时报读当前被选中对象的宽高尺寸与方位。\u003c/li>\u003cli>手柄自带白色底板与蓝色边框，在深浅画布底色下均精准可见。\u003c/li>\u003cli>适合图形编辑器、原型排版工具、图片裁剪视窗及矢量路径变换。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-bounding-box&quot; role=&quot;region&quot; aria-label=&quot;画布图元变换包围框，尺寸 W: 280 H: 160&quot;&gt;&lt;span class=&quot;ds-bounding-box__handle ds-bounding-box__handle--nw&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-bounding-box__handle ds-bounding-box__handle--ne&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-bounding-box__handle ds-bounding-box__handle--se&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-bounding-box__handle ds-bounding-box__handle--sw&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-bounding-box__handle ds-bounding-box__handle--n&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-bounding-box__handle ds-bounding-box__handle--s&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-bounding-box__handle ds-bounding-box__handle--w&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-bounding-box__handle ds-bounding-box__handle--e&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-bounding-box__tag&quot;&gt;W: 280 H: 160&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FigmaCanvasBoundingBox width={280} height={160} label=&quot;W: 280 H: 160&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 8 个手柄均匀对称分布在四个角和中点\u003c/li>\u003cli>□ 蓝色边框精细 1.5px\u003c/li>\u003cli>□ 底部尺寸胶囊居中微阴影\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/figma-canvas-color-picker-eyedropper","title":"Figma 9×9 像素网格画布放大取色镜","html":"\u003ch1>Figma 9×9 像素网格画布放大取色镜\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma 与 macOS 原生 Digital Color Meter 风格的画布拾色放大镜（Eyedropper Loupe HUD）；带有 9x9 像素格放大透镜视窗、准星标线、悬浮 HEX 色值胶囊与取色方块。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>浮动 HUD 垂直容器 (.ds-eyedropper-hud)\u003c/li>\u003cli>圆形像素放大透镜视窗 (.ds-eyedropper-hud__loupe)\u003c/li>\u003cli>中央十字高精度准星对齐线 (.ds-eyedropper-hud__reticle)\u003c/li>\u003cli>色值代码胶囊微标 (.ds-eyedropper-hud__badge)\u003c/li>\u003cli>拾色微样本色块 (.ds-eyedropper-hud__swatch)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>方向键可用于单像素步进微调取色坐标，Enter 锁定取色，Escape 退出取色模式。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>通过 role=&quot;region&quot; 与清晰的 aria-label 报读当前捕获色彩的 HEX 与 RGB 值。\u003c/li>\u003cli>十字准星自带黑白双层边缘，在极黑或极白像素下均清晰可见。\u003c/li>\u003cli>适合设计软件拾色器、调色板构建工具、图像编辑插件及前景色采样工具。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-eyedropper-hud&quot; role=&quot;region&quot; aria-label=&quot;画布拾色放大镜，当前取色 #3B82F6&quot;&gt;&lt;div class=&quot;ds-eyedropper-hud__loupe&quot; style=&quot;background-color:#3b82f6&quot;&gt;&lt;div class=&quot;ds-eyedropper-hud__reticle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-eyedropper-hud__badge&quot;&gt;&lt;span class=&quot;ds-eyedropper-hud__swatch&quot; style=&quot;background:#3b82f6&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span&gt;#3B82F6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FigmaEyedropperLoupe hex=&quot;#3B82F6&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 透镜正圆且边缘微反光自然\u003c/li>\u003cli>□ 准星在透镜几何中心精准居中\u003c/li>\u003cli>□ 色值等宽字符居中排列\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/figma-canvas-color-swatch-chip","title":"Figma 设计变量双色样本色卡胶囊","html":"\u003ch1>Figma 设计变量双色样本色卡胶囊\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma 设计系统调色板变量色块卡片（Design Token Swatch Chip）；左右分割展示同一语义 Token 在 Light/Dark 模式下的色值对比、等宽变量名、HEX 代码及一键快捷复制按钮。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>紧凑圆角样本条 (.ds-color-swatch-chip)\u003c/li>\u003cli>深浅双拼半透明视窗 (.ds-color-swatch-chip__preview)\u003c/li>\u003cli>左浅右深对比分割色块 (.ds-color-swatch-chip__split-l, .ds-color-swatch-chip__split-r)\u003c/li>\u003cli>等宽 Token 变量标识 (.ds-color-swatch-chip__name)\u003c/li>\u003cli>微型复制动作按钮 (.ds-color-swatch-chip__copy)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦复制按钮；Enter 或 Space 快捷复制当前 Token 变量代码。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>role=&quot;region&quot; 与 aria-label 完整宣布 Token 变量名称与深浅色值。\u003c/li>\u003cli>复制按钮具备独立 aria-label=&quot;复制 $color-brand-primary 颜色值&quot;。\u003c/li>\u003cli>适合设计系统变量手册、CSS/Swift 变量提取工具、主题调色调试台。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-color-swatch-chip&quot; role=&quot;region&quot; aria-label=&quot;设计变量色卡: $color-brand-primary, 浅色 #3B82F6, 深色 #1D4ED8&quot; style=&quot;--ds-swatch-light:#3b82f6;--ds-swatch-dark:#1d4ed8&quot;&gt;&lt;div class=&quot;ds-color-swatch-chip__preview&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;ds-color-swatch-chip__split-l&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-color-swatch-chip__split-r&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-color-swatch-chip__meta&quot;&gt;&lt;span class=&quot;ds-color-swatch-chip__name&quot;&gt;$color-brand-primary&lt;/span&gt;&lt;span class=&quot;ds-color-swatch-chip__hex&quot;&gt;#3B82F6 / #1D4ED8&lt;/span&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ds-color-swatch-chip__copy&quot; aria-label=&quot;复制 $color-brand-primary 颜色值&quot;&gt;⧉&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FigmaColorSwatchToken tokenName=&quot;$color-brand-primary&quot; hexLight=&quot;#3B82F6&quot; hexDark=&quot;#1D4ED8&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 双拼色块对半平分严谨\u003c/li>\u003cli>□ Token 等宽字体清晰\u003c/li>\u003cli>□ 复制按钮小巧且右对齐\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/figma-canvas-cursor-presence","title":"Figma 无限画布实时协同多人光标徽标","html":"\u003ch1>Figma 无限画布实时协同多人光标徽标\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma、FigJam 及 Miro 级别的实时多人协作光标与现场状态存在感组件；带有专色矢量小箭头、用户名彩色飘带、实时快捷打字发言气泡及选区指示。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>空间绝对/相对定位基座 (.ds-multiplayer-cursor)\u003c/li>\u003cli>矢量斜角协作光标箭头 (.ds-multiplayer-cursor__arrow)\u003c/li>\u003cli>用户名专色铭牌标签 (.ds-multiplayer-cursor__flag)\u003c/li>\u003cli>悬浮实时聊天对白气泡 (.ds-multiplayer-cursor__bubble)\u003c/li>\u003cli>变量注入协同专色 (--ds-cursor-color)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>在协同视窗中作为协作者位置感知元，提供全局快捷键（如 Esc 取消聊天气泡，/ 触发打字聊天）。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>外层具备 role=&quot;region&quot; 与清晰的协作者名称 aria-label 标识。\u003c/li>\u003cli>气泡声明 role=&quot;status&quot;，内容变化时可被屏幕阅读器平缓报读。\u003c/li>\u003cli>适合多人协同设计画布、在线白板、协同文档编辑器及多人结对编程工作区。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-multiplayer-cursor&quot; role=&quot;region&quot; aria-label=&quot;协同协作者 Sarah Jenkins 光标位置&quot; style=&quot;--ds-cursor-color:#0ea5e9&quot;&gt;&lt;svg class=&quot;ds-multiplayer-cursor__arrow&quot; viewBox=&quot;0 0 16 16&quot; fill=&quot;currentColor&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M0 0 L16 6 L8 9 L5 16 Z&quot;&gt;&lt;/path&gt;&lt;/svg&gt;&lt;span class=&quot;ds-multiplayer-cursor__flag&quot;&gt;Sarah Jenkins&lt;/span&gt;&lt;div class=&quot;ds-multiplayer-cursor__bubble&quot; role=&quot;status&quot;&gt;&lt;span&gt;💬 正在校验图层边距与排版网格&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FigmaMultiplayerCursorPresence userName=&quot;Sarah Jenkins&quot; userColor=&quot;#0ea5e9&quot; message=&quot;正在校验图层边距与排版网格&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 箭头与标签衔接平整自然\u003c/li>\u003cli>□ 发言气泡阴影与背景对比清晰\u003c/li>\u003cli>□ 专色变量可自由传入适配多用户\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/figma-canvas-nudge-scrubber","title":"Figma 属性标签横向拖拽数值微调输入框","html":"\u003ch1>Figma 属性标签横向拖拽数值微调输入框\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma 与 Adobe 标志性的属性微调输入框（Scrubbable Numeric Label Input）；光标悬浮在标签（W、H、X、Y 等）上时呈现左右双向拖拽箭头 ↔，按住拖拽即可无级步进微调数值，单击则进入精准数值键盘编辑。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>紧凑组合输入框 (.ds-nudge-scrubber)\u003c/li>\u003cli>前置双向拖拽属性标签 (.ds-nudge-scrubber__label)\u003c/li>\u003cli>等宽右对齐数值编辑区 (.ds-nudge-scrubber__input)\u003c/li>\u003cli>右侧静态单位提示 (.ds-nudge-scrubber__unit)\u003c/li>\u003cli>悬浮变色与双向拖拽鼠标指针光标\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦数值框；ArrowUp / ArrowDown 步进增减；Shift+Arrow 10倍步进。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;group&quot; 与 aria-label，输入框具备明确的数字步进属性。\u003c/li>\u003cli>标签与输入框色彩层次分明，高亮对比度符合规范。\u003c/li>\u003cli>适合设计画布属性面板、3D 变换视窗、音视频调色推子栏。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-nudge-scrubber&quot; role=&quot;group&quot; aria-label=&quot;可横向拖拽调节数值输入框 W&quot;&gt;&lt;span class=&quot;ds-nudge-scrubber__label&quot; title=&quot;按住鼠标左右拖拽快速微调&quot; aria-hidden=&quot;true&quot;&gt;W&lt;/span&gt;&lt;input type=&quot;number&quot; class=&quot;ds-nudge-scrubber__input&quot; value=&quot;320&quot; step=&quot;1&quot; aria-label=&quot;W 数值输入&quot;&gt;&lt;span class=&quot;ds-nudge-scrubber__unit&quot; aria-hidden=&quot;true&quot;&gt;px&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FigmaCanvasNudgeScrubber axis=&quot;W&quot; value={320} unit=&quot;px&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ W 标签灰色实底\u003c/li>\u003cli>□ 320 等宽数字右对齐\u003c/li>\u003cli>□ px 单位紧凑贴合\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/figma-canvas-pixel-grid-toggle","title":"Figma 画布像素网格与对齐切换控制栏","html":"\u003ch1>Figma 画布像素网格与对齐切换控制栏\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma 矢量设计画布超高倍率缩放时的像素网格与像素吸附动态指示栏（Pixel Grid &amp; Snap Toggle Bar）；显示当前画布放大倍数（如 1200%）、网格显示开关状态与图元对齐到整数像素（Snap to Pixel）快捷切换按键。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>紧凑长圆角工作栏 (.ds-pixel-grid-toggle)\u003c/li>\u003cli>前置矢量像素网格微图标 (.ds-pixel-grid-toggle__icon)\u003c/li>\u003cli>等宽放大率数字标签 (.ds-pixel-grid-toggle__zoom)\u003c/li>\u003cli>像素网格显示状态微胶囊 (.ds-pixel-grid-toggle__btn)\u003c/li>\u003cli>像素吸附对齐开关微胶囊 (.ds-pixel-grid-toggle__btn.is-active)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Ctrl+Shift+&#39; 切换像素网格；Ctrl+Alt+&#39; 切换对齐像素；Tab 导航按键。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;toolbar&quot; 与 aria-label 说明 Figma 画布像素网格控制。\u003c/li>\u003cli>按钮具备 aria-pressed 状态，放大率等宽对齐。\u003c/li>\u003cli>适合设计画布视图控制、像素画编辑器、位图矢量混合工作区。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-pixel-grid-toggle&quot; role=&quot;toolbar&quot; aria-label=&quot;Figma 画布像素网格控制&quot;&gt;&lt;span class=&quot;ds-pixel-grid-toggle__icon&quot; aria-hidden=&quot;true&quot;&gt;▦&lt;/span&gt;&lt;span class=&quot;ds-pixel-grid-toggle__zoom&quot;&gt;1200%&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-pixel-grid-toggle__btn is-active&quot; aria-pressed=&quot;true&quot;&gt;像素网格&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-pixel-grid-toggle__btn is-active&quot; aria-pressed=&quot;true&quot;&gt;对齐像素&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FigmaCanvasPixelGridToggle zoom={1200} isGridVisible={true} isSnapToPixel={true} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ ▦ 图标与 1200% 标签紧凑连体\u003c/li>\u003cli>□ 像素网格与对齐像素按钮微圆角规范\u003c/li>\u003cli>□ 悬浮与激活反馈灵敏\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/figma-canvas-ruler-guides","title":"Figma 无限画布毫米像素对齐标尺与参考线","html":"\u003ch1>Figma 无限画布毫米像素对齐标尺与参考线\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 布局 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma 与 Photoshop 风格的画布顶部与左侧像素标尺视窗（Canvas Ruler &amp; Guide Overlays）；带有交汇原点角落、等距刻度微字、青色十字对齐导线与坐标悬浮数值徽标。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>画布工作区双轴容器 (.ds-canvas-ruler)\u003c/li>\u003cli>顶部水平刻度尺条 (.ds-canvas-ruler__top)\u003c/li>\u003cli>左侧垂直刻度尺条 (.ds-canvas-ruler__left)\u003c/li>\u003cli>荧光青色对齐参考线 (.ds-canvas-ruler__guide-x, .ds-canvas-ruler__guide-y)\u003c/li>\u003cli>微型坐标浮动气泡徽标 (.ds-canvas-ruler__tag)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Shift+R 快捷键切换标尺显隐，方向键微调参考线坐标。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>role=&quot;region&quot; 与 aria-label 报读当前捕获参考线的实时坐标。\u003c/li>\u003cli>参考线带有微发光阴影，在深浅画布底色下均高保真可见。\u003c/li>\u003cli>适合网页原型画布、海报排版编辑器、矢量图形工具及设计走查系统。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-canvas-ruler&quot; role=&quot;region&quot; aria-label=&quot;画布标尺辅助线，X坐标 140px，Y坐标 65px&quot;&gt;&lt;div class=&quot;ds-canvas-ruler__corner&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-canvas-ruler__top&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;50&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;span&gt;150&lt;/span&gt;&lt;span&gt;200&lt;/span&gt;&lt;span&gt;250&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-canvas-ruler__left&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;50&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-canvas-ruler__guide-x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-canvas-ruler__guide-y&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-canvas-ruler__tag&quot;&gt;X:140 Y:65&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FigmaCanvasRulerGuides xGuide={140} yGuide={65} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 角落正方交汇块边框对齐\u003c/li>\u003cli>□ 刻度文字等宽且微弱不刺眼\u003c/li>\u003cli>□ 青色参考线发光微投影自然\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/figma-canvas-snap-alignment-guides","title":"Figma 画布磁吸对齐参考线与间距指示","html":"\u003ch1>Figma 画布磁吸对齐参考线与间距指示\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 布局 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma 与 Sketch 矢量画板动态磁吸对齐指示器（Dynamic Canvas Snap Guidelines &amp; Spacing Tags）；拖拽图元时动态呈现的洋红高亮中心水平/垂直对齐基准线、精准像素测距微胶囊（16px）与元素包围虚框。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>深色矢量画布容器 (.ds-canvas-snap-guides)\u003c/li>\u003cli>图元半透明高亮线框 (.ds-canvas-snap-guides__box)\u003c/li>\u003cli>洋红水平与垂直对齐导线 (.ds-canvas-snap-guides__line-x, .ds-canvas-snap-guides__line-y)\u003c/li>\u003cli>导线上叠放的像素测距数字药丸 (.ds-canvas-snap-guides__tag)\u003c/li>\u003cli>完全不阻挡点击交互的穿透指针 (pointer-events: none)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>拖拽图元靠近边界时自动吸附；按住 Alt 查看全向相对间距。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;region&quot; 与 aria-label 描述 Figma 画布磁吸对齐参考线与间距指示。\u003c/li>\u003cli>洋红高亮线在深色画布上具有 10:1 以上对比度，辨识度高。\u003c/li>\u003cli>适合图形设计编辑器、低代码拖拽画布、网页排版构建器。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-canvas-snap-guides&quot; role=&quot;region&quot; aria-label=&quot;Figma 画布磁吸对齐参考线与间距指示&quot;&gt;&lt;div class=&quot;ds-canvas-snap-guides__box&quot; style=&quot;left:24px;top:20px;width:90px;height:50px&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-canvas-snap-guides__box&quot; style=&quot;left:170px;top:70px;width:120px;height:50px&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-canvas-snap-guides__line-x&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-canvas-snap-guides__line-y&quot;&gt;&lt;/div&gt;&lt;span class=&quot;ds-canvas-snap-guides__tag&quot;&gt;16px&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FigmaCanvasSnapGuides snapDist=&quot;16px&quot; activeAxis=&quot;both&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 深色画布中洋红参考线极其醒目\u003c/li>\u003cli>□ 16px 间距标签精准贴合\u003c/li>\u003cli>□ 两个元素线框层级分明\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/figma-canvas-zoom-hud","title":"Figma 无限画布缩放与视口浮动控制条","html":"\u003ch1>Figma 无限画布缩放与视口浮动控制条\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma 与 Miro 风格的悬浮画布缩放与漫游控制药丸；集成抓手工具切换、网格对齐开关、步进缩放按钮与等宽缩放百分比。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>悬浮胶囊底座 (.ds-canvas-hud)\u003c/li>\u003cli>抓手漫游切换按钮 (.ds-canvas-hud__btn)\u003c/li>\u003cli>像素网格对齐按钮\u003c/li>\u003cli>细分割线 (.ds-canvas-hud__divider)\u003c/li>\u003cli>放大/缩小步进操作按钮\u003c/li>\u003cli>等宽缩放比例显示 (.ds-canvas-hud__val)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在各按钮间跳转；Enter/Space 激活工具或增减缩放比；点击数值恢复 100%。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>采用 backdrop-filter: blur(16px) 与四周柔和扩散阴影，悬浮于任意复杂画布之上而不破坏底层内容。\u003c/li>\u003cli>百分比数字点击可快速重置至 100%，使用等宽字体杜绝位移抖动。\u003c/li>\u003cli>适合设计工具、流程图编辑器、大屏拓扑图及网络拓扑工作区。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-canvas-hud&quot; role=&quot;toolbar&quot; aria-label=&quot;画布缩放视口浮动控制条&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-canvas-hud__btn&quot; aria-label=&quot;抓手漫游工具&quot;&gt;✋&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-canvas-hud__btn is-active&quot; aria-label=&quot;像素网格对齐&quot;&gt;#&lt;/button&gt;&lt;div class=&quot;ds-canvas-hud__divider&quot;&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ds-canvas-hud__btn&quot; aria-label=&quot;缩小画布&quot;&gt;−&lt;/button&gt;&lt;span class=&quot;ds-canvas-hud__val&quot;&gt;100%&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-canvas-hud__btn&quot; aria-label=&quot;放大画布&quot;&gt;+&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FigmaCanvasZoomHud zoom={100} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 悬浮药丸毛玻璃背景通透\u003c/li>\u003cli>□ 缩放百分比点击可快速重置\u003c/li>\u003cli>□ 按钮点击交互无布局抖动\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/figma-layer-tree-item","title":"Figma 画布层级图层树节点行","html":"\u003ch1>Figma 画布层级图层树节点行\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma 与 Sketch 现代设计工具标志性的图层目录树节点行；支持类型指示图标（Frame/Component/Vector/Text）、层级深度缩进、悬停即出的眼睛显隐与锁扣锁定操作。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>图层单行外壳 (.ds-figma-layer)\u003c/li>\u003cli>动态深度缩进 (.ds-depth)\u003c/li>\u003cli>图层语义图标 (.ds-figma-layer__icon)\u003c/li>\u003cli>自适应截断图层名称 (.ds-figma-layer__name)\u003c/li>\u003cli>悬停操作浮现按钮组 (.ds-figma-layer__actions)\u003c/li>\u003cli>显隐与加锁微按钮 (.ds-figma-layer__btn)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>上下箭头在各图层间遍历；空格键选中当前图层；Cmd/Ctrl+H 切换隐藏；Cmd/Ctrl+L 切换锁定。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>操作按钮常态透明（opacity:0），悬停或选中时平滑淡入（opacity:1），大幅减少面板视觉杂讯。\u003c/li>\u003cli>选中行使用主题强调浅底色（--ds-accent-soft），文字与图标保持高清晰对比。\u003c/li>\u003cli>适合设计软件图层面板、数据模型字段树、3D 场景层级管理及文档大纲目录。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-figma-layer is-selected&quot; style=&quot;--ds-depth:1&quot; role=&quot;treeitem&quot; aria-selected=&quot;true&quot;&gt;&lt;div class=&quot;ds-figma-layer__left&quot;&gt;&lt;span class=&quot;ds-figma-layer__icon&quot; aria-hidden=&quot;true&quot;&gt;❖&lt;/span&gt;&lt;span class=&quot;ds-figma-layer__name&quot;&gt;Button / Primary Glow&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-figma-layer__actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-figma-layer__btn&quot; aria-label=&quot;显示图层&quot;&gt;👁&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-figma-layer__btn&quot; aria-label=&quot;解锁图层&quot;&gt;🔓&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FigmaLayerTreeRow name=&quot;Button / Primary Glow&quot; type=&quot;component&quot; depth={1} isSelected={true} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 缩进层级清晰可辨\u003c/li>\u003cli>□ 悬停操作按钮淡入灵敏\u003c/li>\u003cli>□ 选中态对比度达标\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/file-tree-node","title":"IDE 文件树 Git 状态节点","html":"\u003ch1>IDE 文件树 Git 状态节点\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>VS Code 与 JetBrains 工作区风格的代码与配置文件树形行；支持层级缩进、展开折叠三角、类型图标与 Git 增删改状态标签。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>缩进层级指示偏移量 (--ds-file-indent)\u003c/li>\u003cli>折叠/展开旋转三角箭头\u003c/li>\u003cli>文件类型矢量微图标\u003c/li>\u003cli>文件名正文\u003c/li>\u003cli>右侧 M/U/D 彩色 Git 状态角标\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 或方向键在文件节点间上下浏览；Enter 打开文件；Space 或右方向键展开目录。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>缩进通过 CSS 变量 --ds-file-indent 参数化计算，支持多级深度平滑缩进。\u003c/li>\u003cli>Git 状态角标使用 warning 黄色 (M)、success 绿色 (U)、danger 红色 (D)，与行业标准完全统一。\u003c/li>\u003cli>悬停与激活态背景与侧边栏融合自然，单行文本溢出时平滑省略。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div style=&quot;width:100%;display:flex;flex-direction:column;gap:2px&quot;&gt;&lt;div class=&quot;ds-file-node is-expanded&quot; style=&quot;--ds-file-indent:10px&quot; role=&quot;treeitem&quot; aria-expanded=&quot;true&quot;&gt;&lt;div class=&quot;ds-file-node__main&quot;&gt;&lt;span class=&quot;ds-file-node__chevron&quot; aria-hidden=&quot;true&quot;&gt;▶&lt;/span&gt;&lt;span class=&quot;ds-file-node__icon&quot;&gt;📁&lt;/span&gt;&lt;span class=&quot;ds-file-node__name&quot;&gt;src/core&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-file-node is-active&quot; style=&quot;--ds-file-indent:24px&quot; role=&quot;treeitem&quot; aria-selected=&quot;true&quot;&gt;&lt;div class=&quot;ds-file-node__main&quot;&gt;&lt;span style=&quot;width:12px&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-file-node__icon&quot;&gt;📄&lt;/span&gt;&lt;span class=&quot;ds-file-node__name&quot;&gt;quic_engine.ts&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-file-node__badge ds-file-node__badge--m&quot;&gt;M&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-file-node&quot; style=&quot;--ds-file-indent:24px&quot; role=&quot;treeitem&quot;&gt;&lt;div class=&quot;ds-file-node__main&quot;&gt;&lt;span style=&quot;width:12px&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-file-node__icon&quot;&gt;📄&lt;/span&gt;&lt;span class=&quot;ds-file-node__name&quot;&gt;tunnel.spec.ts&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-file-node__badge ds-file-node__badge--u&quot;&gt;U&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FileTreeGitNode name=&quot;quic_engine.ts&quot; gitStatus=&quot;M&quot; depth={1} isActive={true} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 三角箭头展开折叠旋转平滑利落\u003c/li>\u003cli>□ 多级缩进排版严格垂直对齐\u003c/li>\u003cli>□ Git 状态字符等宽且背景色弱对比达标\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/floating-action-toolbar","title":"划词悬浮富文本动作条","html":"\u003ch1>划词悬浮富文本动作条\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Notion 与 Medium 风格的富文本悬浮快捷操作气泡条；带毛玻璃半透明材质、加粗、斜体、插入超链接、代码块微按钮与垂直分割细线。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>毛玻璃半透明容器 (.ds-float-toolbar)\u003c/li>\u003cli>加粗 (B)、斜体 (I) 格式微按钮\u003c/li>\u003cli>14px 高度极细垂直分隔线 (.ds-float-sep)\u003c/li>\u003cli>链接与行内代码快捷按钮\u003c/li>\u003cli>微立体柔和浮层阴影\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在工具栏按钮间循环；Enter/Space 触发格式化；Escape 隐藏工具栏；快捷键 Ctrl+B/Ctrl+I 同步映射。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>采用 backdrop-filter: blur(16px) 毛玻璃与 --ds-chrome 材质，与底层文字产生细腻的物理景深穿透感。\u003c/li>\u003cli>按钮尺寸 26px × 26px，紧凑精致，hover 时平滑提供 --ds-surface 背景高亮。\u003c/li>\u003cli>适合放置于选中文本正上方 8px 处作为划词悬浮菜单。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-float-toolbar&quot; role=&quot;toolbar&quot; aria-label=&quot;格式化选项&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-float-btn is-active&quot; aria-label=&quot;加粗&quot; data-toast=&quot;加粗选中文字&quot;&gt;&lt;b&gt;B&lt;/b&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-float-btn&quot; aria-label=&quot;斜体&quot; data-toast=&quot;斜体选中文字&quot;&gt;&lt;i&gt;I&lt;/i&gt;&lt;/button&gt;&lt;span class=&quot;ds-float-sep&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-float-btn&quot; aria-label=&quot;插入超链接&quot; data-toast=&quot;添加超链接&quot;&gt;🔗&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-float-btn&quot; aria-label=&quot;行内代码&quot; data-toast=&quot;转换为代码块&quot;&gt;`&amp;lt;&amp;gt;`&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FloatingTextToolbar onBold={toggleBold} onItalic={toggleItalic} onLink={insertLink} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 毛玻璃半透明质感在深浅主题下均显高级\u003c/li>\u003cli>□ 各格式按钮激活与悬停对比度达标\u003c/li>\u003cli>□ 键盘焦点移动流畅且无死循环\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/git-branch-graph","title":"Git 分支拓扑图元","html":"\u003ch1>Git 分支拓扑图元\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub 与 GitLab 风格的提交拓扑节点；集成时间线竖轴连接线、分支胶囊、提交摘要与 SHA 哈希。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>垂直时间线轨道与分支连接线\u003c/li>\u003cli>分支高亮实心锚点 (Dot)\u003c/li>\u003cli>分支名微胶囊标签\u003c/li>\u003cli>提交摘要标题\u003c/li>\u003cli>SHA 校验码与时间戳\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不
