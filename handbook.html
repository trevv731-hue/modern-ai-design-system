 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/raycast-hotkey-overlay","title":"Raycast 键盘全景快捷键指引浮层","html":"\u003ch1>Raycast 键盘全景快捷键指引浮层\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Raycast 与 Linear 风格的全局模态快捷键速查面板；双列网格陈列系统核心动作指令、微凹键帽徽章与关闭控件。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>浮层容器外框 (.ds-hotkey-sheet)\u003c/li>\u003cli>顶部标题栏与关闭动作 (.ds-hotkey-sheet__head)\u003c/li>\u003cli>双列操作与快捷键网格 (.ds-hotkey-sheet__grid)\u003c/li>\u003cli>单行快捷键对照行 (.ds-hotkey-sheet__row)\u003c/li>\u003cli>微凸键帽标签组 (.ds-hotkey-sheet__keys, .ds-hotkey-sheet__key)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 移动焦点；Escape 关闭面板；组合快捷键在当前页面全局有效。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>键帽标签利用微阴影 box-shadow: 0 1px 0 rgba(0,0,0,0.1) 还原真实键盘微机械质感。\u003c/li>\u003cli>双列等宽自适应布局，支持移动端单列自适应回退。\u003c/li>\u003cli>与整个界面的语义变量无缝联动，深浅模式下键盘字符始终清晰辨识。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-hotkey-sheet&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;快捷键指引面板&quot;&gt;&lt;div class=&quot;ds-hotkey-sheet__head&quot;&gt;&lt;h4 class=&quot;ds-hotkey-sheet__title&quot;&gt;全景键盘快捷键一览&lt;/h4&gt;&lt;button type=&quot;button&quot; class=&quot;ds-button ds-button--ghost&quot; aria-label=&quot;关闭面板&quot;&gt;×&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ds-hotkey-sheet__grid&quot;&gt;&lt;div class=&quot;ds-hotkey-sheet__row&quot;&gt;&lt;span&gt;全局搜索面板&lt;/span&gt;&lt;div class=&quot;ds-hotkey-sheet__keys&quot;&gt;&lt;kbd class=&quot;ds-hotkey-sheet__key&quot;&gt;⌘&lt;/kbd&gt;&lt;kbd class=&quot;ds-hotkey-sheet__key&quot;&gt;K&lt;/kbd&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-hotkey-sheet__row&quot;&gt;&lt;span&gt;打开侧边标签页&lt;/span&gt;&lt;div class=&quot;ds-hotkey-sheet__keys&quot;&gt;&lt;kbd class=&quot;ds-hotkey-sheet__key&quot;&gt;⌘&lt;/kbd&gt;&lt;kbd class=&quot;ds-hotkey-sheet__key&quot;&gt;B&lt;/kbd&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-hotkey-sheet__row&quot;&gt;&lt;span&gt;切换深浅模式&lt;/span&gt;&lt;div class=&quot;ds-hotkey-sheet__keys&quot;&gt;&lt;kbd class=&quot;ds-hotkey-sheet__key&quot;&gt;⌘&lt;/kbd&gt;&lt;kbd class=&quot;ds-hotkey-sheet__key&quot;&gt;⇧&lt;/kbd&gt;&lt;kbd class=&quot;ds-hotkey-sheet__key&quot;&gt;D&lt;/kbd&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-hotkey-sheet__row&quot;&gt;&lt;span&gt;唤出终端控制台&lt;/span&gt;&lt;div class=&quot;ds-hotkey-sheet__keys&quot;&gt;&lt;kbd class=&quot;ds-hotkey-sheet__key&quot;&gt;⌃&lt;/kbd&gt;&lt;kbd class=&quot;ds-hotkey-sheet__key&quot;&gt;&amp;#96;&lt;/kbd&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;RaycastHotkeyOverlay onClose={handleClose} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 双列键帽排版规整对齐\u003c/li>\u003cli>□ 键帽微阴影与字符等宽居中\u003c/li>\u003cli>□ Escape 键可正确关闭对话框\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/raycast-quick-ai-chip","title":"Raycast & Perplexity 灵动 AI 快捷操作胶囊","html":"\u003ch1>Raycast &amp; Perplexity 灵动 AI 快捷操作胶囊\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Raycast、Perplexity 与 Warp 风格的 AI 快捷动作微胶囊；自带多彩流光渐变细边框、左侧星芒指示及右侧物理热键提示。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>双层圆角流光边框胶囊 (.ds-ai-chip)\u003c/li>\u003cli>AI 魔法星芒指示 (.ds-ai-chip__spark)\u003c/li>\u003cli>动作提示词文本\u003c/li>\u003cli>右侧等宽物理快捷键徽章 (.ds-key)\u003c/li>\u003cli>悬停微浮与投影扩散\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦胶囊；Enter 或直接敲击右侧提示的物理全局快捷键触发对应 AI 指令。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>利用 mask-composite 与双层渐变实现 1px 高精度流光渐变描边，不污染背景透明度。\u003c/li>\u003cli>悬停时微浮 translateY(-1px) 配合投影轻微扩散，提供明确可点击预期。\u003c/li>\u003cli>适合 AI 搜索建议词、智能补全动作条、命令行辅助建议及智能体工作台。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;button type=&quot;button&quot; class=&quot;ds-ai-chip&quot; aria-label=&quot;AI 快捷提示词: 总结当前文档要点&quot;&gt;&lt;span class=&quot;ds-ai-chip__spark&quot; aria-hidden=&quot;true&quot;&gt;✦&lt;/span&gt;&lt;span&gt;总结当前文档要点&lt;/span&gt;&lt;kbd class=&quot;ds-key&quot; style=&quot;min-width:auto;padding:1px 5px;font-size:10px&quot;&gt;⌘J&lt;/kbd&gt;&lt;/button&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;RaycastQuickAiActionChip prompt=&quot;总结当前文档要点&quot; shortcut=&quot;⌘J&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 渐变流光细边框清晰细腻\u003c/li>\u003cli>□ 文本与快捷键对齐紧凑\u003c/li>\u003cli>□ 键盘激活反馈可靠\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/reaction-group","title":"互动反应气泡","html":"\u003ch1>互动反应气泡\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Slack 与 GitHub PR 风格的微表情互动胶囊；用于为社区规则、节点测速报告或工单提供点赞和即时反馈。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角微胶囊气泡\u003c/li>\u003cli>Emoji 表情符号\u003c/li>\u003cli>动态计数指示\u003c/li>\u003cli>添加表情动作按钮 (+)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>左右方向键或 Tab 在各反应胶囊间移动；Space 或 Enter 切换当前用户的反应状态。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>未选中状态保持细腻灰色线框与微底色；选中时切换为 accent 主题色并加亮。\u003c/li>\u003cli>悬停与点击具备弹性缩放手感（scale(1.08)），富有动感。\u003c/li>\u003cli>读屏软件朗读“14 人赞同”等完整上下文。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-reaction-group&quot; role=&quot;group&quot; aria-label=&quot;互动反应&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-reaction is-active&quot; aria-pressed=&quot;true&quot; aria-label=&quot;14 人赞同&quot; data-toast=&quot;已赞同&quot;&gt;&lt;span class=&quot;ds-reaction__emoji&quot;&gt;👍&lt;/span&gt;&lt;span class=&quot;ds-reaction__count&quot;&gt;14&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-reaction&quot; aria-pressed=&quot;false&quot; aria-label=&quot;5 人比心&quot; data-toast=&quot;已比心&quot;&gt;&lt;span class=&quot;ds-reaction__emoji&quot;&gt;❤️&lt;/span&gt;&lt;span class=&quot;ds-reaction__count&quot;&gt;5&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-reaction&quot; aria-pressed=&quot;false&quot; aria-label=&quot;8 人觉得很棒&quot; data-toast=&quot;已标记为火箭&quot;&gt;&lt;span class=&quot;ds-reaction__emoji&quot;&gt;🚀&lt;/span&gt;&lt;span class=&quot;ds-reaction__count&quot;&gt;8&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-reaction ds-reaction--add&quot; aria-label=&quot;添加表情反应&quot; data-toast=&quot;打开表情选择器&quot;&gt;+&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;ReactionGroup reactions={[{ emoji: &quot;👍&quot;, count: 14, active: true }, { emoji: &quot;❤️&quot;, count: 5 }]} onToggle={toggleReaction} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 点击时反应计数与激活状态即时联动\u003c/li>\u003cli>□ 键盘 Space/Enter 可正常切换状态\u003c/li>\u003cli>□ 高对比度模式下外边框分明\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/resizable-pane","title":"可拖拽分栏容器","html":"\u003ch1>可拖拽分栏容器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 布局 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>VS Code 与 Linear 风格的左右比例可调分栏容器；带灵敏感应手柄与平滑宽度分配。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>左侧内容分栏 Pane\u003c/li>\u003cli>中央可拖拽分割条 (Divider)\u003c/li>\u003cli>高亮把手指示芯 (Handle)\u003c/li>\u003cli>右侧自适应弹性 Pane\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>分割条可获得键盘焦点；按 Left / Right 方向键每次以 5% 步长调整左右栏宽度分配。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>分栏手柄在鼠标悬停或拖拽时高亮变色，指示芯纵向伸长 (scaleY(1.4))。\u003c/li>\u003cli>使用 CSS 自定义属性 (--ds-split-pos) 控制比例，零冗余重排。\u003c/li>\u003cli>内置 minRatio 与 maxRatio 边界保护，防止内容折叠损毁。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-split-container&quot; style=&quot;--ds-split-pos:40%&quot;&gt;&lt;div class=&quot;ds-split-pane ds-split-pane--left&quot;&gt;&lt;strong style=&quot;font-size:13px;display:block;margin-bottom:8px&quot;&gt;订阅规则列表&lt;/strong&gt;&lt;p style=&quot;font-size:12px;color:var(--ds-muted);margin:0&quot;&gt;香港专线&lt;br&gt;东京 BGP&lt;br&gt;新加坡 IPLC&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ds-split-divider&quot; role=&quot;separator&quot; aria-orientation=&quot;vertical&quot; tabindex=&quot;0&quot; title=&quot;左右拖动调整分栏&quot;&gt;&lt;div class=&quot;ds-split-divider__handle&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-split-pane ds-split-pane--right&quot;&gt;&lt;strong style=&quot;font-size:13px;display:block;margin-bottom:8px&quot;&gt;节点详细参数&lt;/strong&gt;&lt;p style=&quot;font-size:12px;color:var(--ds-muted);margin:0&quot;&gt;协议: Shadowsocks-2022&lt;br&gt;端口: 8443&lt;br&gt;多径 TCP: 开启&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;ResizablePanes left={&lt;SidebarList /&gt;} right={&lt;DetailView /&gt;} defaultRatio={40} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 分栏拖拽手柄触碰灵敏顺滑\u003c/li>\u003cli>□ 键盘方向键支持步进调节比例\u003c/li>\u003cli>□ 双侧内容超出支持独立滚动\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/retro-cassette-tape","title":"Teenage Engineering 复古机械磁带播放机","html":"\u003ch1>Teenage Engineering 复古机械磁带播放机\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 多媒体 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Teenage Engineering 工业美学与经典复古磁带卡带机；展示物理双转轴齿轮、透视磁带观察视窗与平滑旋转动效。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>深色卡带控制壳体 (.ds-cassette-tape)\u003c/li>\u003cli>经典暖色调卡带贴纸 (.ds-cassette-tape__label)\u003c/li>\u003cli>暗色透视带仓观察窗 (.ds-cassette-tape__window)\u003c/li>\u003cli>双旋转白色导轮齿轮 (.ds-cassette-tape__spool)\u003c/li>\u003cli>中间连接磁带桥 (.ds-cassette-tape__bridge)\u003c/li>\u003cli>暂停状态控制 (.is-paused)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Space 或 Enter 切换磁带播放/暂停动效；遵循 role=&quot;region&quot;。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>齿轮旋转使用 GPU 加速的 keyframes 无限循环，暂停时使用 animation-play-state:paused。\u003c/li>\u003cli>标签贴纸采用经典暖杏色复古渐变，传递极具情怀的拟物与现代融合质感。\u003c/li>\u003cli>适合播客播放器封面、复古音乐控制台、加载动效及音频剪辑工具。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-cassette-tape&quot; role=&quot;region&quot; aria-label=&quot;复古机械磁带播放机：Mixtape 2026&quot;&gt;&lt;div class=&quot;ds-cassette-tape__label&quot;&gt;&lt;span&gt;Mixtape 2026 Side-A&lt;/span&gt;&lt;span&gt;45 RPM&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-cassette-tape__window&quot;&gt;&lt;div class=&quot;ds-cassette-tape__spool&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;ds-cassette-tape__gear&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-cassette-tape__bridge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-cassette-tape__spool&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;ds-cassette-tape__gear&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;RetroCassettePlayer title=&quot;Mixtape 2026 Side-A&quot; speed=&quot;45 RPM&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 双轮齿轮旋转同步平顺\u003c/li>\u003cli>□ 观察窗比例协调\u003c/li>\u003cli>□ 磁带桥居中对齐\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ribbon","title":"角标微缎带","html":"\u003ch1>角标微缎带\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Stripe 与 GitHub Pro 标志性的倾斜角标微缎带；在卡片或面板右上角醒目标记“专线”、“PRO”、“Beta”或“推荐”。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>相对定位包裹卡片\u003c/li>\u003cli>45° 旋转微缎带\u003c/li>\u003cli>语义背景色条\u003c/li>\u003cli>加粗高对比度英文/中文标贴\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>纯视觉徽章不阻碍父容器或子控件的键盘焦点；读屏器直接朗读其文本内容。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>父容器必须设置 position: relative 与 overflow: hidden，缎带自动贴合右上斜角。\u003c/li>\u003cli>支持 action、success、warning 多种语义主题。\u003c/li>\u003cli>文字使用 uppercase 与 letter-spacing 强化徽章质感。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div style=&quot;position:relative;width:100%;max-width:320px;overflow:hidden;border-radius:18px&quot;&gt;&lt;div class=&quot;ds-panel&quot; style=&quot;padding:24px&quot;&gt;&lt;span class=&quot;ds-ribbon ds-ribbon--success&quot; aria-label=&quot;极速专线&quot;&gt;极速专线&lt;/span&gt;&lt;h4 style=&quot;margin:0 0 6px&quot;&gt;香港 IPLC 独享&lt;/h4&gt;&lt;p style=&quot;margin:0;font-size:13px;color:var(--ds-muted)&quot;&gt;端到端低抖动传输通道，峰值保证 10Gbps 带宽。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;CornerRibbon label=&quot;极速专线&quot; tone=&quot;success&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 缎带 45 度角平滑无锯齿断裂\u003c/li>\u003cli>□ 文字在对应底色上满足 4.5:1 对比度\u003c/li>\u003cli>□ 父容器圆角溢出裁剪利落不漏边\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/safari-compact-tab-pill","title":"Safari 15+ 紧凑流体浮动标签胶囊","html":"\u003ch1>Safari 15+ 紧凑流体浮动标签胶囊\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS Safari 与 iPadOS 经典的紧凑流体式标签栏药丸；整合网站 Favicon 图标、智能截断标题、正在播放音频微动效及悬浮渐显关闭按钮。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角微浮岛药丸外壳 (.ds-safari-tab)\u003c/li>\u003cli>网站 Favicon 占位 (.ds-safari-tab__favicon)\u003c/li>\u003cli>自适应单行截断文本 (.ds-safari-tab__title)\u003c/li>\u003cli>音频播放声波状态图标 (.ds-safari-tab__audio)\u003c/li>\u003cli>悬浮半透明微型关闭手柄 (.ds-safari-tab__close)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 键在各标签页间切换；Enter 激活标签；Delete 或 Backspace 可触发关闭。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>外层具备 role=&quot;tab&quot; 与 aria-selected 属性，完全融入选项卡语义。\u003c/li>\u003cli>关闭按钮带有独立 aria-label=&quot;关闭标签页&quot;，按键事件阻止冒泡。\u003c/li>\u003cli>适合多标签浏览器界面、工作台多文档分流、IDE 紧凑打开文件栏。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-safari-tab is-active&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;&lt;span class=&quot;ds-safari-tab__favicon&quot; aria-hidden=&quot;true&quot;&gt;🌐&lt;/span&gt;&lt;span class=&quot;ds-safari-tab__title&quot;&gt;Modern AI · Design System&lt;/span&gt;&lt;span class=&quot;ds-safari-tab__audio&quot; title=&quot;正在播放音频&quot; aria-label=&quot;正在播放音频&quot;&gt;🔊&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-safari-tab__close&quot; aria-label=&quot;关闭标签页&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SafariCompactTabPill title=&quot;Modern AI · Design System&quot; active={true} audioPlaying={true} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 标签胶囊高度紧凑对称\u003c/li>\u003cli>□ 音频图标与标题平齐对齐\u003c/li>\u003cli>□ 关闭按钮悬浮展示顺滑\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/segmented-gauge","title":"分段电量刻度指示","html":"\u003ch1>分段电量刻度指示\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS 菜单栏与 iOS 状态栏风格的物理分段电量/信号计；展示节点负载、电池状态或信号强度。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角外框底槽\u003c/li>\u003cli>微型物理刻度方块组\u003c/li>\u003cli>闪电/信号状态图标\u003c/li>\u003cli>数字或容量辅助标签\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为状态展示器无需键盘操作；提供 role=&quot;meter&quot; 与当前数值的 aria-valuenow。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>各分段采用 4px 宽矩形与 1px 微圆角，紧凑利落。\u003c/li>\u003cli>支持不同色调：正常为绿色，警告（warning）为橙色，告急（danger）为红色。\u003c/li>\u003cli>等宽字符确保数字变化时不产生布局跳动。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-gauge&quot; data-tone=&quot;default&quot; role=&quot;meter&quot; aria-valuenow=&quot;4&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;5&quot; aria-label=&quot;剩余电量&quot;&gt;&lt;span class=&quot;ds-gauge__icon&quot; aria-hidden=&quot;true&quot;&gt;⚡&lt;/span&gt;&lt;div class=&quot;ds-gauge__bars&quot;&gt;&lt;span class=&quot;ds-gauge__segment is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-gauge__segment is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-gauge__segment is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-gauge__segment is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-gauge__segment&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;span&gt;80% 容量&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SegmentedGauge segments={5} active={4} label=&quot;80% 容量&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 分段刻度清晰无粘连\u003c/li>\u003cli>□ 异常状态下红黄绿警示色分明\u003c/li>\u003cli>□ 读屏器能正确朗读当前格数与百分比\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/segmented-pill-tabs","title":"iOS 18 浮动滑动胶囊分段栏","html":"\u003ch1>iOS 18 浮动滑动胶囊分段栏\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 18 与 iPadOS 风格的流体弹性滑动分段药丸标签条；带有沉浸式下凹跑道槽底座、浮动圆角白色/高光滑块背景与即时跟手移动动画。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>超椭圆胶囊下凹跑道槽 (.ds-pill-tabs)\u003c/li>\u003cli>浮动滑块指示背板 (.ds-pill-tabs__thumb)\u003c/li>\u003cli>水平排列的各选项药丸按钮 (.ds-pill-tab)\u003c/li>\u003cli>激活选项粗体与高对比文字\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦分段栏；左右方向键在各选项间移动；Enter/Space 确认激活当前项。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>滑块背景采用 translateX() 硬件加速位移与 spring 缓动，在切换选项时如水银般平滑流动。\u003c/li>\u003cli>跑道槽采用 --ds-inset 微凹陷背景，与凸起悬浮的滑块形成清晰的物理高低落差。\u003c/li>\u003cli>标签按钮外边距自适应，文字两端留白舒适。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-pill-tabs&quot; role=&quot;tablist&quot; aria-label=&quot;节点分类切换&quot;&gt;&lt;div class=&quot;ds-pill-tabs__thumb&quot; style=&quot;width:calc(33.33% - 6px);transform:translateX(0%)&quot;&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ds-pill-tab is-active&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; data-toast=&quot;切换为全部节点&quot;&gt;全部节点&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-pill-tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-toast=&quot;切换为 Anycast 专线&quot;&gt;Anycast 专线&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-pill-tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-toast=&quot;切换为边缘网关&quot;&gt;边缘网关&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SlidingPillTabs tabs={[&quot;全部节点&quot;, &quot;Anycast 专线&quot;, &quot;边缘网关&quot;]} onChange={handleTabChange} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 滑块位移与选项边界严丝合缝\u003c/li>\u003cli>□ 激活与未激活标签色差符合无障碍要求\u003c/li>\u003cli>□ 键盘方向键切换顺畅\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/segmented-timeline-bar","title":"YouTube 章节分段视频进度条","html":"\u003ch1>YouTube 章节分段视频进度条\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>YouTube 与 Final Cut Pro 风格的带微隙章节分段视频播放控制条；集成多段独立跑道槽、当前章节进度填充、悬停增粗微动效及底部章节名称与时间指示。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>章节进度条外层容器 (.ds-chapter-bar)\u003c/li>\u003cli>多段微间隙分段轨道 (.ds-chapter-track)\u003c/li>\u003cli>独立章节物理胶囊段 (.ds-chapter-segment)\u003c/li>\u003cli>内部瞬态填充进度条 (.ds-chapter-fill)\u003c/li>\u003cli>底部当前章节与时间指示 (.ds-chapter-footer)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦分段条；左右方向键快进/快退；Enter/Space 暂停或播放。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>各章节之间使用 3px 微间隙分隔，悬停整个轨道时高度从 6px 弹性展开至 8px，提供更舒适的点击命中区。\u003c/li>\u003cli>填充条采用 scaleX() 变换，硬件加速零重排。\u003c/li>\u003cli>底部左侧展示当前章节名称，右侧等宽字体呈现当前时间与总时长。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-chapter-bar&quot; role=&quot;region&quot; aria-label=&quot;视频章节分段控制条&quot;&gt;&lt;div class=&quot;ds-chapter-track&quot;&gt;&lt;div class=&quot;ds-chapter-segment&quot; title=&quot;引言与架构背景&quot;&gt;&lt;div class=&quot;ds-chapter-fill&quot; style=&quot;--ds-chapter-pct:1&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-chapter-segment&quot; title=&quot;流式网络核心解析&quot;&gt;&lt;div class=&quot;ds-chapter-fill&quot; style=&quot;--ds-chapter-pct:0.65&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-chapter-segment&quot; title=&quot;边缘缓存实战评测&quot;&gt;&lt;div class=&quot;ds-chapter-fill&quot; style=&quot;--ds-chapter-pct:0&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-chapter-footer&quot;&gt;&lt;span&gt;流式网络核心解析&lt;/span&gt;&lt;span&gt;08:42 / 14:20&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;ChapterTimelineBar chapters={[{title:&quot;引言&quot;,pct:1},{title:&quot;核心&quot;,pct:0.65},{title:&quot;总结&quot;,pct:0}]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 分段之间微间隙清晰规整\u003c/li>\u003cli>□ 悬停时轨道平滑增粗无抖动\u003c/li>\u003cli>□ 底部文字与时间等宽对齐\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/segmented","title":"分段控件","html":"\u003ch1>分段控件\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>切换少量互斥的显示或运行模式；不是长列表的替代。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>中性底板\u003c/li>\u003cli>2–5 个选项\u003c/li>\u003cli>浮动选中胶囊\u003c/li>\u003cli>明确组标签\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>当前 React 版本为 button group：每项 Tab 可达，Enter/Space 激活；aria-pressed 表示选择。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>组 label 说明这些选项控制什么。\u003c/li>\u003cli>选中状态使用 opaque surface，不做全区域玻璃。\u003c/li>\u003cli>标签不足宽时换行或改为 select，禁止裁切不可见。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-segment&quot; role=&quot;group&quot; aria-label=&quot;路由模式&quot;&gt;&lt;button aria-pressed=&quot;true&quot;&gt;规则&lt;/button&gt;&lt;button aria-pressed=&quot;false&quot;&gt;全局&lt;/button&gt;&lt;button aria-pressed=&quot;false&quot;&gt;直连&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SegmentedControl label=&quot;路由模式&quot; value={mode} options={modes} onChange={setMode} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 只能有一个按下状态\u003c/li>\u003cli>□ 所有选项都有文字\u003c/li>\u003cli>□ 模式失败后回滚或显示错误\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/select","title":"选择器","html":"\u003ch1>选择器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>在有限的已知选项中选择一个值，优先使用原生 select。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>可见标签\u003c/li>\u003cli>原生下拉框\u003c/li>\u003cli>当前选项\u003c/li>\u003cli>错误说明\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>使用平台原生键盘行为；方向键切换；不要覆盖系统下拉交互。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>选项超过约 20 个时考虑可搜索选择器。\u003c/li>\u003cli>无合法值时使用明确占位，不自动默认危险操作。\u003c/li>\u003cli>表单字段命名与设置中一致。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;label&gt;默认路由&lt;select class=&quot;ds-button ds-button--secondary&quot; aria-label=&quot;默认路由&quot;&gt;&lt;option&gt;规则分流&lt;/option&gt;&lt;option&gt;全局代理&lt;/option&gt;&lt;option&gt;完全直连&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 未使用 div 模拟原生选择器\u003c/li>\u003cli>□ 标签和当前值均可被读取\u003c/li>\u003cli>□ 缩放后菜单可使用\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/sheet","title":"抽屉面板","html":"\u003ch1>抽屉面板\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>从屏幕边缘滑出的辅助面板；兼顾 macOS 侧边检查器 (Inspector) 与 Android 底部抽屉 (Bottom Sheet)，用于深度配置或实时日志。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>背景暗化遮罩\u003c/li>\u003cli>边缘滑动主体\u003c/li>\u003cli>顶部标题与关闭操作\u003c/li>\u003cli>独立垂直滚动区域\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>打开后焦点移入抽屉；Tab 环留在抽屉内；Escape 或点击遮罩关闭；关闭后焦点回到触发按钮。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>适于承载单项复杂配置或详情审计，避免离开当前列表视图。\u003c/li>\u003cli>桌面端从右侧滑出，移动端可自适应为底部升起。\u003c/li>\u003cli>抽屉展开时不影响底层数据的未保存状态。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-toolbar&quot;&gt;&lt;button class=&quot;ds-button ds-button--secondary&quot; data-open-drawer&gt;查看节点详情抽屉&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Drawer open={open} onClose={() =&gt; setOpen(false)} title=&quot;节点高级属性&quot;&gt;{content}&lt;/Drawer&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 滑出动效符合减弱动效偏好\u003c/li>\u003cli>□ Escape 键可关闭抽屉且恢复原焦点\u003c/li>\u003cli>□ 抽屉打开期间底层内容不可键盘交互\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/skeleton","title":"加载占位","html":"\u003ch1>加载占位\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>在已知布局上预留即将到来的内容位置，降低视觉跳变。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>稳定的内容轮廓\u003c/li>\u003cli>aria-hidden 装饰\u003c/li>\u003cli>单一加载说明\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>占位不接受焦点；容器 aria-busy=true，完成后解除。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>不要为每一条占位单独朗读“加载”。\u003c/li>\u003cli>骨架与最终内容高度近似。\u003c/li>\u003cli>加载失败必须结束骨架，转为错误状态。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div aria-busy=&quot;true&quot; aria-label=&quot;正在加载节点&quot;&gt;&lt;div class=&quot;ds-skeleton&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-skeleton&quot; style=&quot;width:70%&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-skeleton&quot; style=&quot;width:45%&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 无永久加载\u003c/li>\u003cli>□ 减少动效下保持静态\u003c/li>\u003cli>□ 最终内容不发生大幅跳动\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/slider","title":"滑块调节器","html":"\u003ch1>滑块调节器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>在连续或离散区间内直观调节数值；具备 macOS 精准刻度感与 Android M3 触感扩大滑块。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>横向导轨\u003c/li>\u003cli>当前填充条\u003c/li>\u003cli>圆形操作滑块\u003c/li>\u003cli>数值与单位显示\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦；左/下箭头减少，右/上箭头增加；Home/End 跳转极值；PageUp/PageDown 步进调整。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>必须提供可见或 aria-label 标签说明调节的属性。\u003c/li>\u003cli>数值显示采用 tabular-nums 避免跳动。\u003c/li>\u003cli>非线性或敏感配置（如端口）建议搭配微调输入框。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-slider-row&quot;&gt;&lt;label class=&quot;ds-sr-only&quot; for=&quot;gallery-speed-slider&quot;&gt;并发连接限制&lt;/label&gt;&lt;input id=&quot;gallery-speed-slider&quot; class=&quot;ds-slider&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;64&quot; value=&quot;16&quot;&gt;&lt;span class=&quot;ds-slider-value&quot;&gt;16 个&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Slider label=&quot;并发连接限制&quot; value={threads} onChange={setThreads} min={1} max={64} unit=&quot; 个&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 键盘方向键能够顺畅步进\u003c/li>\u003cli>□ 高对比度模式下滑块边界可见\u003c/li>\u003cli>□ 拖拽过程中数值实时同步\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/snippet","title":"代码微胶囊","html":"\u003ch1>代码微胶囊\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>高频单行命令、Token 或订阅链接的极简展示与一键复制；兼顾 Vercel / Stripe 终端微交互。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>等宽代码文本容器\u003c/li>\u003cli>一键复制动作按钮\u003c/li>\u003cli>成功对勾状态过渡\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦复制按钮；Enter/Space 触发复制；屏幕阅读器通过 live region 获取反馈。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>长链接或凭据自动溢出省略，避免撑坏父容器。\u003c/li>\u003cli>敏感数据支持脱敏显示或点击后展示。\u003c/li>\u003cli>复制成功必须给出微反馈（如对勾形变或 Toast）。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-snippet&quot;&gt;&lt;code&gt;clash -d ~/.config/clash -f config.yaml&lt;/code&gt;&lt;button class=&quot;ds-snippet__copy&quot; data-snippet=&quot;clash -d ~/.config/clash -f config.yaml&quot; aria-label=&quot;复制终端命令&quot; title=&quot;复制&quot;&gt;⧉&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Snippet code=&quot;clash -d ~/.config/clash -f config.yaml&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 文本可手动鼠标选中复制\u003c/li>\u003cli>□ 一键复制按钮具备状态反馈\u003c/li>\u003cli>□ 在小屏窄容器内文本自动省略\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/sparkline-stat-grid","title":"微型遥测指标多列走势网格","html":"\u003ch1>微型遥测指标多列走势网格\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Datadog 与 Grafana 风格的分布式多指标紧凑走势卡片网格；每列卡片集成指标标题、百分比涨跌、加粗主数值与底部 SVG 微型趋势折线。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>3列等宽网格容器 (.ds-spark-grid)\u003c/li>\u003cli>独立指标卡片 (.ds-spark-tile)\u003c/li>\u003cli>顶部标题与趋势徽章 (.ds-spark-tile__top)\u003c/li>\u003cli>等宽核心统计数字 (.ds-spark-tile__val)\u003c/li>\u003cli>平滑 SVG 走势折线 (.ds-spark-tile__chart)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为数据展示区域，各指标卡片可通过 Tab 聚焦查看详情提示。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>折线采用矢量 stroke-width=&quot;2&quot; 与 stroke-linecap=&quot;round&quot;，在微型 24px 高度内清晰呈现瞬态波动。\u003c/li>\u003cli>数值与涨跌色彩使用语义变量，绿色上行与红色下行对比分明。\u003c/li>\u003cli>响应式自适应，桌面三列平铺，移动端可自动折行。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spark-grid&quot; role=&quot;region&quot; aria-label=&quot;微型指标遥测矩阵&quot;&gt;&lt;div class=&quot;ds-spark-tile&quot;&gt;&lt;div class=&quot;ds-spark-tile__top&quot;&gt;&lt;span&gt;QPS 吞吐&lt;/span&gt;&lt;span style=&quot;color:var(--ds-success)&quot;&gt;↑ 12%&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-spark-tile__val&quot;&gt;48.2k&lt;/span&gt;&lt;svg class=&quot;ds-spark-tile__chart&quot; viewBox=&quot;0 0 70 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;&gt;&lt;polyline points=&quot;0,20 10,18 20,12 30,15 40,8 50,4 60,7 70,2&quot;&gt;&lt;/polyline&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;ds-spark-tile&quot;&gt;&lt;div class=&quot;ds-spark-tile__top&quot;&gt;&lt;span&gt;P99 延迟&lt;/span&gt;&lt;span style=&quot;color:var(--ds-success)&quot;&gt;↓ 4ms&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-spark-tile__val&quot;&gt;12.4ms&lt;/span&gt;&lt;svg class=&quot;ds-spark-tile__chart&quot; viewBox=&quot;0 0 70 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;&gt;&lt;polyline points=&quot;0,5 10,8 20,6 30,14 40,9 50,11 60,8 70,6&quot;&gt;&lt;/polyline&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;ds-spark-tile&quot;&gt;&lt;div class=&quot;ds-spark-tile__top&quot;&gt;&lt;span&gt;缓存命中&lt;/span&gt;&lt;span style=&quot;color:var(--ds-success)&quot;&gt;↑ 99%&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-spark-tile__val&quot;&gt;99.4%&lt;/span&gt;&lt;svg class=&quot;ds-spark-tile__chart&quot; viewBox=&quot;0 0 70 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;&gt;&lt;polyline points=&quot;0,18 10,16 20,15 30,10 40,8 50,6 60,4 70,2&quot;&gt;&lt;/polyline&gt;&lt;/svg&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SparklineMetricGrid /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ SVG 走势折线在视口缩放时保持锐利\u003c/li>\u003cli>□ 数值与单位对齐规范\u003c/li>\u003cli>□ 深浅主题下折线对比清晰\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/sparkline","title":"微型趋势图","html":"\u003ch1>微型趋势图\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>在极小空间（指标卡、表格行、状态栏）内展示数值走势，如延迟波动或瞬时吞吐量。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>SVG 矢量折线\u003c/li>\u003cli>平滑贝塞尔过渡\u003c/li>\u003cli>端点活跃指示点\u003c/li>\u003cli>数值与单位辅助标签\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>纯视觉数据图表不获得键盘焦点；容器提供 aria-label 供屏幕阅读器朗读概览。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>优先纯 SVG 矢量绘制，零外部图表库依赖。\u003c/li>\u003cli>折线端点带状态呼吸圆点，强化最新时效感。\u003c/li>\u003cli>深浅模式和自定义调色板自适应颜色。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-toolbar&quot; style=&quot;justify-content:flex-start;gap:20px;align-items:center&quot;&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:4px&quot;&gt;&lt;strong&gt;延迟抖动 (RTT)&lt;/strong&gt;&lt;div style=&quot;display:flex;align-items:center;gap:12px&quot;&gt;&lt;svg class=&quot;ds-sparkline&quot; width=&quot;120&quot; height=&quot;32&quot; viewBox=&quot;0 0 120 32&quot; aria-label=&quot;延迟走势：平均 24ms&quot;&gt;&lt;path d=&quot;M0,22 Q15,8 30,18 T60,10 T90,20 T120,6&quot; fill=&quot;none&quot; stroke=&quot;var(--ds-secondary)&quot; stroke-width=&quot;2.2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;120&quot; cy=&quot;6&quot; r=&quot;3.5&quot; fill=&quot;var(--ds-secondary)&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;ds-badge ds-badge--success&quot;&gt;&lt;span class=&quot;ds-status-dot ds-status-dot--live&quot;&gt;&lt;/span&gt; 24ms&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Sparkline data={[22,8,18,10,20,6]} label=&quot;延迟走势&quot; current=&quot;24ms&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ SVG 在高分屏下平滑无锯齿\u003c/li>\u003cli>□ 端点实时指示点随数据高亮\u003c/li>\u003cli>□ 提供清晰的 aria-label 可访问性说明\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/spatial-3d-card","title":"VisionOS 空间拟态交互卡片","html":"\u003ch1>VisionOS 空间拟态交互卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple VisionOS 与 Linear 空间计算拟态卡片；具备 CSS 3D 透视透视景深 (perspective: 800px)、悬停微俯仰旋转 (rotateX/rotateY)、深层环境阴影与分层视差感。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>3D 透视变换外壳 (.ds-spatial-card)\u003c/li>\u003cli>悬浮强调色分类胶囊\u003c/li>\u003cli>主标题与辅助说明文案\u003c/li>\u003cli>带动态右箭头的行动触发链接\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦卡片；Enter/Space 激活卡片关联的任务；悬停触发优雅 3D 浮动。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>通过 perspective: 800px 与 transform-style: preserve-3d 构建真实物理空间透视。\u003c/li>\u003cli>悬停触发 translateY(-4px) rotateX(4deg) rotateY(-4deg)，配合 160ms 弹性平滑缓动。\u003c/li>\u003cli>文字层与边框高光在不同视角下呈现轻微景深位移，营造顶级未来感。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spatial-card&quot; role=&quot;article&quot; tabindex=&quot;0&quot; data-toast=&quot;启动空间计算链路&quot;&gt;&lt;span class=&quot;ds-spatial-card__tag&quot;&gt;VisionOS 3D&lt;/span&gt;&lt;h4 class=&quot;ds-spatial-card__title&quot;&gt;空间计算神经中枢&lt;/h4&gt;&lt;p class=&quot;ds-spatial-card__desc&quot;&gt;利用多层深度缓冲与实时重力光泽投射，呈现近场物理层次。&lt;/p&gt;&lt;span class=&quot;ds-spatial-card__btn&quot;&gt;启动全息投射 →&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SpatialPerspectiveCard tag=&quot;VisionOS 3D&quot; title=&quot;空间计算神经中枢&quot; onClick={launchSpatial} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 3D 俯仰转动自然流畅不突兀\u003c/li>\u003cli>□ 深色与浅色模式下阴影纵深感逼真\u003c/li>\u003cli>□ 卡片内容在不同缩放比下无溢出变形\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/spatial-audio-head-tracker","title":"Apple VisionOS 空间音频 360° 头部追踪仪","html":"\u003ch1>Apple VisionOS 空间音频 360° 头部追踪仪\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple VisionOS 与 AirPods Pro 空间音频（Spatial Audio）动态头部追踪罗盘；展示 360° 方位角刻度、虚拟环绕立体扬声器阵列及用户头部偏航旋转指示。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>正圆刻度追踪罗盘外壳 (.ds-spatial-tracker)\u003c/li>\u003cli>径向渐变仪表盘 (.ds-spatial-tracker__dial)\u003c/li>\u003cli>环形扬声器发声点阵 (.ds-spatial-tracker__speaker)\u003c/li>\u003cli>居中耳机头部指示符 (.ds-spatial-tracker__head)\u003c/li>\u003cli>方向三角鼻尖 (.ds-spatial-tracker__nose)\u003c/li>\u003cli>偏航角度实时读数 (.ds-spatial-tracker__label)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>方向键左/右微调偏航角 Yaw（15° 步进）；Home 键瞬时归零重置正向朝向。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>头部偏航角通过 CSS 变量 --ds-head-yaw 控制旋转，依托 GPU 合成层保持 60fps 平滑追踪。\u003c/li>\u003cli>环绕分布 8 个空间环绕声道点，发声状态点亮系统高亮色并伴随微光。\u003c/li>\u003cli>适合空间计算应用、沉浸式音视频套件、游戏引擎音效调试与外设设置中心。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spatial-tracker&quot; role=&quot;region&quot; aria-label=&quot;空间音频动态头部追踪仪：偏航角 30 度&quot;&gt;&lt;div class=&quot;ds-spatial-tracker__dial&quot; style=&quot;--ds-head-yaw:30deg&quot;&gt;&lt;div class=&quot;ds-spatial-tracker__speaker is-active&quot; style=&quot;left:75px;top:5px&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-spatial-tracker__speaker is-active&quot; style=&quot;left:124px;top:25px&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-spatial-tracker__speaker&quot; style=&quot;left:145px;top:75px&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-spatial-tracker__speaker&quot; style=&quot;left:124px;top:124px&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-spatial-tracker__speaker&quot; style=&quot;left:75px;top:145px&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-spatial-tracker__speaker&quot; style=&quot;left:25px;top:124px&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-spatial-tracker__speaker&quot; style=&quot;left:5px;top:75px&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-spatial-tracker__speaker is-active&quot; style=&quot;left:25px;top:25px&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-spatial-tracker__head&quot;&gt;&lt;div class=&quot;ds-spatial-tracker__nose&quot;&gt;&lt;/div&gt;&lt;span&gt;🎧&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-spatial-tracker__label&quot;&gt;&lt;span&gt;偏航角 Yaw: +30°&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SpatialAudioHeadTracker yaw={30} activeSpeakers={[0, 1, 7]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 罗盘扬声器均匀分布在圆周\u003c/li>\u003cli>□ 鼻尖指向与偏航角严格对应\u003c/li>\u003cli>□ 深色模式下环形微光自然\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/spectrum-meter","title":"音频频谱跳动柱","html":"\u003ch1>音频频谱跳动柱\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>流媒体播放器与空间音频风格的实时音频动态跳动电平指示；使用 GPU 加速的 scaleY 变换展现声音律动。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>等宽圆角跳动柱阵列\u003c/li>\u003cli>自适应音频活动状态 (is-playing)\u003c/li>\u003cli>底部基线对齐容器\u003c/li>\u003cli>读屏器音频电平无障碍标签\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为状态图元提供 role=&quot;img&quot; 与 aria-label；支持点击或 Space 切换播放与静音。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>柱体动画纯粹采用 GPU 合成属性 scaleY 与 transform-origin:bottom，坚决不触发布局重排。\u003c/li>\u003cli>每根柱体设置错落的动画延迟 (50ms~150ms)，模拟真实频谱的起伏韵律。\u003c/li>\u003cli>在 prefers-reduced-motion 开启时静止在基线高度，杜绝多余视觉晃动。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spectrum is-playing&quot; role=&quot;img&quot; aria-label=&quot;音频频谱指示&quot;&gt;&lt;span class=&quot;ds-spectrum__bar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-spectrum__bar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-spectrum__bar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-spectrum__bar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-spectrum__bar&quot;&gt;&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SpectrumMeter bars={5} isPlaying={true} label=&quot;音频播放中&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 柱体跳动丝滑流畅且无布局重排\u003c/li>\u003cli>□ 深浅主题下柱体与背景对比度达标\u003c/li>\u003cli>□ 开启减少动效模式时柱体静止在默认高度\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/speed-dial","title":"浮动扩展快捷轮盘","html":"\u003ch1>浮动扩展快捷轮盘\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Material You (AOSP) 与 Linear 风格的悬浮主操作扩展轮盘；点击平滑展开带标签的子动作组。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角主操作触发按钮\u003c/li>\u003cli>旋转 45 度关闭状态反馈\u003c/li>\u003cli>垂直展开的带标签动作列表\u003c/li>\u003cli>微型动作按钮与高对比阴影\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 导航至主按钮；Enter/Space 展开子动作；展开后方向键在子项间切换，Escape 关闭。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>展开时主按钮旋转 45 度转变为红色关闭按钮（+ 变 ×），手感明确。\u003c/li>\u003cli>子项展开采用垂直位移与微缩放（scale(0.9) -&gt; scale(1)），物理感自然。\u003c/li>\u003cli>操作标签提供实底背景与柔和阴影，避免在复杂背景下辨识困难。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-speed-dial&quot; role=&quot;region&quot; aria-label=&quot;快捷管理&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-speed-dial__trigger&quot; aria-label=&quot;快捷操作&quot; onclick=&quot;this.parentElement.classList.toggle(&#39;is-open&#39;)&quot;&gt;+&lt;/button&gt;&lt;div class=&quot;ds-speed-dial__list&quot; role=&quot;menu&quot;&gt;&lt;div class=&quot;ds-speed-dial__item&quot;&gt;&lt;span class=&quot;ds-speed-dial__label&quot;&gt;导入节点&lt;/span&gt;&lt;button class=&quot;ds-speed-dial__btn&quot; type=&quot;button&quot; data-toast=&quot;打开节点导入&quot;&gt;📥&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ds-speed-dial__item&quot;&gt;&lt;span class=&quot;ds-speed-dial__label&quot;&gt;扫码配置&lt;/span&gt;&lt;button class=&quot;ds-speed-dial__btn&quot; type=&quot;button&quot; data-toast=&quot;打开扫码导入&quot;&gt;📷&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ds-speed-dial__item&quot;&gt;&lt;span class=&quot;ds-speed-dial__label&quot;&gt;新建规则&lt;/span&gt;&lt;button class=&quot;ds-speed-dial__btn&quot; type=&quot;button&quot; data-toast=&quot;新建分流规则&quot;&gt
