被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦至图元；Enter 查看该次提交的 Git diff 变更或复制 SHA。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>时间线连接线通过绝对定位贯穿上下，实现无缝连续的提交拓扑结构。\u003c/li>\u003cli>悬停时运用 translateX(3px) 进行横向微移反馈，保持操作精致感。\u003c/li>\u003cli>SHA 哈希与分支名采用等宽字体 (var(--ds-type-mono))，结构工整严谨。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-git-node&quot; role=&quot;article&quot; tabindex=&quot;0&quot; data-toast=&quot;查看 Commit 详情&quot;&gt;&lt;div class=&quot;ds-git-node__track&quot;&gt;&lt;div class=&quot;ds-git-node__line&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-git-node__dot&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-git-node__content&quot;&gt;&lt;div style=&quot;display:flex;align-items:center;gap:8px;min-width:0&quot;&gt;&lt;span class=&quot;ds-git-node__pill&quot;&gt;⎇ feat/quic&lt;/span&gt;&lt;span class=&quot;ds-git-node__message&quot;&gt;支持 QUIC 0-RTT 握手加速&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;align-items:center;gap:6px;flex-shrink:0&quot;&gt;&lt;span class=&quot;ds-git-node__sha&quot;&gt;7f2a1b9&lt;/span&gt;&lt;span style=&quot;color:var(--ds-muted);font-size:11px&quot;&gt;2m 前&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;GitBranchNode branch=&quot;feat/quic&quot; message=&quot;支持 QUIC 0-RTT 握手加速&quot; sha=&quot;7f2a1b9&quot; time=&quot;2m 前&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 时间线上下连接平滑无断裂错位\u003c/li>\u003cli>□ 悬停微移反馈利落不抖动\u003c/li>\u003cli>□ SHA 哈希等宽对齐规整清晰\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/github-action-step-summary","title":"GitHub Actions CI/CD 流水线步骤概要卡","html":"\u003ch1>GitHub Actions CI/CD 流水线步骤概要卡\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub Actions 与 Vercel 部署控制台风格的任务步骤清单摘要卡片（CI/CD Job Run Step Summary）；深浅自适应、头部运行分支与工作流名、各步骤耗时与绿色勾选状态清单。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>结构化圆角卡片 (.ds-action-summary)\u003c/li>\u003cli>微内陷底色头部栏 (.ds-action-summary__head)\u003c/li>\u003cli>无边框任务步骤条目列表 (.ds-action-summary__list)\u003c/li>\u003cli>绿色高亮成功标记徽标 (.ds-action-summary__icon)\u003c/li>\u003cli>右侧等宽耗时字色 (.ds-action-summary__time)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 键依次聚焦各个步骤以查看该步骤的详细控制台 stdout 日志。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>role=&quot;region&quot; 配合 aria-label 完整概述任务名称与分支。\u003c/li>\u003cli>步骤成功状态由绿色勾选符和文本共同支持，对比度达到 WCAG AAA 标级。\u003c/li>\u003cli>适合持续集成流水线、构建进度展示、自动化测试报告与微服务部署看板。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-action-summary&quot; role=&quot;region&quot; aria-label=&quot;GitHub Actions 工作流概要: CI Pipeline / Test &amp;amp; Build&quot;&gt;&lt;div class=&quot;ds-action-summary__head&quot;&gt;&lt;span&gt;CI Pipeline / Test &amp;amp; Build&lt;/span&gt;&lt;span style=&quot;font-family:var(--ds-type-mono);font-weight:500;opacity:0.8&quot;&gt;(main)&lt;/span&gt;&lt;/div&gt;&lt;ul class=&quot;ds-action-summary__list&quot;&gt;&lt;li class=&quot;ds-action-summary__step&quot;&gt;&lt;span style=&quot;display:inline-flex;align-self:center;align-items:center&quot;&gt;&lt;span class=&quot;ds-action-summary__icon&quot; aria-hidden=&quot;true&quot;&gt;✓&lt;/span&gt;&lt;span&gt;Set up Node.js v24.x&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ds-action-summary__time&quot;&gt;1.2s&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;ds-action-summary__step&quot;&gt;&lt;span style=&quot;display:inline-flex;align-self:center;align-items:center&quot;&gt;&lt;span class=&quot;ds-action-summary__icon&quot; aria-hidden=&quot;true&quot;&gt;✓&lt;/span&gt;&lt;span&gt;Install dependencies&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ds-action-summary__time&quot;&gt;14.5s&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;ds-action-summary__step&quot;&gt;&lt;span style=&quot;display:inline-flex;align-self:center;align-items:center&quot;&gt;&lt;span class=&quot;ds-action-summary__icon&quot; aria-hidden=&quot;true&quot;&gt;✓&lt;/span&gt;&lt;span&gt;Run motion &amp;amp; contrast linter&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ds-action-summary__time&quot;&gt;3.1s&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;ds-action-summary__step&quot;&gt;&lt;span style=&quot;display:inline-flex;align-self:center;align-items:center&quot;&gt;&lt;span class=&quot;ds-action-summary__icon&quot; aria-hidden=&quot;true&quot;&gt;✓&lt;/span&gt;&lt;span&gt;Execute test suite (182 specs)&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ds-action-summary__time&quot;&gt;2.8s&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;GithubActionJobSummary workflowName=&quot;CI Pipeline / Test &amp; Build&quot; branch=&quot;main&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 头部内凹底色与主体清晰区分\u003c/li>\u003cli>□ 步骤列表左右对齐严谨\u003c/li>\u003cli>□ 绿色对勾鲜艳清晰\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/github-commit-flow-node","title":"GitHub 提交流水线状态与检查流节点","html":"\u003ch1>GitHub 提交流水线状态与检查流节点\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub Actions、PR 与 GitLab 风格的提交节点与 CI/CD 流水线状态行；集成圆点状态指示（成功对勾 / 失败红叉）、提交说明、等宽哈希标签及作者时间元信息。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>节点横向外框 (.ds-commit-node)\u003c/li>\u003cli>左侧主信息组 (.ds-commit-node__main)\u003c/li>\u003cli>18px 圆形状态指示器 (.ds-commit-node__status--pass, --fail)\u003c/li>\u003cli>单行自适应提交说明 (.ds-commit-node__msg)\u003c/li>\u003cli>等宽 Git 提交哈希胶囊 (.ds-commit-node__hash)\u003c/li>\u003cli>右侧作者与相对时间元信息 (.ds-commit-node__meta)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦提交节点；Enter 导航跳转至该次提交的 Git diff 页面。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>状态圆点具有明确的 aria-label 说明，提供完整的无障碍支持。\u003c/li>\u003cli>提交说明文本单行自适应弹性伸缩并带省略号，哈希与时间信息固定宽度。\u003c/li>\u003cli>适合用于持续集成监控、代码版本历史查看器及变更发布说明列表。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-commit-node&quot; role=&quot;listitem&quot;&gt;&lt;div class=&quot;ds-commit-node__main&quot;&gt;&lt;div class=&quot;ds-commit-node__status ds-commit-node__status--pass&quot; aria-label=&quot;流水线通过&quot;&gt;✓&lt;/div&gt;&lt;span class=&quot;ds-commit-node__msg&quot;&gt;feat(router): 引入 QUIC 多路复用低延迟流传输&lt;/span&gt;&lt;span class=&quot;ds-commit-node__hash&quot;&gt;8c3d9a1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-commit-node__meta&quot;&gt;&lt;span&gt;Linus&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;10分钟前&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;GitCommitFlowNode message=&quot;feat(router): 引入 QUIC 多路复用低延迟流传输&quot; hash=&quot;8c3d9a1&quot; author=&quot;Linus&quot; time=&quot;10分钟前&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 提交信息长文本自适应截断不溢出\u003c/li>\u003cli>□ 状态圆点符号与颜色对比鲜明\u003c/li>\u003cli>□ 哈希等宽字体对齐规整\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/github-commit-graph-swimlane","title":"GitHub 多分支拓扑提交泳道图","html":"\u003ch1>GitHub 多分支拓扑提交泳道图\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub 与 GitLab 分支提交历史图形化泳道卡（Commit Graph Swimlane）；双轴多轨道垂直拓扑连线、彩色分支提交圆点（主干蓝、合并紫、特性绿）、提交说明摘要、6位等宽 Hash 徽标与作者标识。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>纵向流水线列表卡片 (.ds-commit-swimlane)\u003c/li>\u003cli>左侧紧凑多轨道提交拓扑图元 (.ds-commit-swimlane__graph, .ds-commit-swimlane__node)\u003c/li>\u003cli>分支类型多色圆点 (.ds-commit-swimlane__node--merge, .ds-commit-swimlane__node--feat)\u003c/li>\u003cli>自动截断的提交消息文本 (.ds-commit-swimlane__msg)\u003c/li>\u003cli>等宽 Commit SHA 微标 (.ds-commit-swimlane__sha)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在提交列表项与 Commit SHA 间移动；Enter 查看对应 Commit 详情。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;region&quot; 与 aria-label 说明多分支提交图谱。\u003c/li>\u003cli>各分支色彩区别明显，且依赖位置语义区分主干与分支。\u003c/li>\u003cli>适合 Git 客户端、CI/CD 提交追踪、版本发布日志与代码审查记录。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-commit-swimlane&quot; role=&quot;region&quot; aria-label=&quot;分支提交关系泳道图&quot;&gt;&lt;div class=&quot;ds-commit-swimlane__row&quot;&gt;&lt;div class=&quot;ds-commit-swimlane__graph&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;ds-commit-swimlane__track&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-commit-swimlane__node ds-commit-swimlane__node--feat&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-commit-swimlane__msg&quot; title=&quot;feat: add visionos spatial transport bar&quot;&gt;feat: add visionos spatial transport bar&lt;/span&gt;&lt;code class=&quot;ds-commit-swimlane__sha&quot;&gt;8f3a1c&lt;/code&gt;&lt;span class=&quot;ds-commit-swimlane__author&quot;&gt;trevv&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-commit-swimlane__row&quot;&gt;&lt;div class=&quot;ds-commit-swimlane__graph&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;ds-commit-swimlane__track&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-commit-swimlane__node ds-commit-swimlane__node--merge&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-commit-swimlane__msg&quot; title=&quot;merge branch feat/spatial into main&quot;&gt;merge branch feat/spatial into main&lt;/span&gt;&lt;code class=&quot;ds-commit-swimlane__sha&quot;&gt;b2e04d&lt;/code&gt;&lt;span class=&quot;ds-commit-swimlane__author&quot;&gt;github-actions&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-commit-swimlane__row&quot;&gt;&lt;div class=&quot;ds-commit-swimlane__graph&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;ds-commit-swimlane__track&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-commit-swimlane__node&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-commit-swimlane__msg&quot; title=&quot;fix: align rotary knob detent arc&quot;&gt;fix: align rotary knob detent arc&lt;/span&gt;&lt;code class=&quot;ds-commit-swimlane__sha&quot;&gt;69c5e2&lt;/code&gt;&lt;span class=&quot;ds-commit-swimlane__author&quot;&gt;trevv&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;GithubCommitGraphSwimlane /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 三行提交记录行高规整\u003c/li>\u003cli>□ 绿、紫、蓝三色提交节点层次分明\u003c/li>\u003cli>□ 等宽 SHA 标签居右对齐\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/github-dependabot-alert-card","title":"GitHub Dependabot 安全漏洞告警与一键修复卡","html":"\u003ch1>GitHub Dependabot 安全漏洞告警与一键修复卡\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub Security 仓库依赖安全警报横幅卡片（Dependabot Vulnerability Alert Card）；包含 Critical 红色高危严重性胶囊徽标、CVE 编号、漏洞中文摘要、受影响包版本等宽提示及自动创建修复 PR 动作按键。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>浅红微光边框告警卡片 (.ds-dependabot-alert)\u003c/li>\u003cli>顶部纯红实心危险等级徽标 (.ds-dependabot-alert__badge)\u003c/li>\u003cli>等宽漏洞标识号 (.ds-dependabot-alert__cve)\u003c/li>\u003cli>受影响软件包规范代码徽章 (.ds-dependabot-alert__pkg)\u003c/li>\u003cli>一键创建修复 PR 快速操作按钮 (.ds-dependabot-alert__btn)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦修复按钮；Enter 触发一键自动提交安全更新 Pull Request。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;alert&quot; 与 aria-label 说明依赖安全警报与 CVE 标识。\u003c/li>\u003cli>严重性等级红色背景符合 WCAG AA 4.5:1 对比度规范。\u003c/li>\u003cli>适合软件供应链安全面板、CI 漏洞扫描报告、包管理依赖升级通知。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-dependabot-alert&quot; role=&quot;alert&quot; aria-label=&quot;Dependabot 安全漏洞告警: CVE-2026-4029&quot;&gt;&lt;div class=&quot;ds-dependabot-alert__head&quot;&gt;&lt;span class=&quot;ds-dependabot-alert__badge&quot;&gt;critical&lt;/span&gt;&lt;span class=&quot;ds-dependabot-alert__cve&quot;&gt;CVE-2026-4029&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-dependabot-alert__body&quot;&gt;&lt;div class=&quot;ds-dependabot-alert__title&quot;&gt;任意路径遍历解包文件覆盖漏洞&lt;/div&gt;&lt;div class=&quot;ds-dependabot-alert__pkg&quot;&gt;受影响包：&lt;code&gt;tar@6.1.1&lt;/code&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-dependabot-alert__foot&quot;&gt;&lt;span style=&quot;font-size:11px;color:var(--ds-muted)&quot;&gt;升级至 &lt;b&gt;tar@6.2.0&lt;/b&gt; 可修复&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-dependabot-alert__btn&quot;&gt;自动创建修复 PR ↗&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;GithubDependabotAlertCard severity=&quot;critical&quot; cve=&quot;CVE-2026-4029&quot; packageSpec=&quot;tar@6.1.1&quot; summary=&quot;任意路径遍历解包文件覆盖漏洞&quot; fixVersion=&quot;tar@6.2.0&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ critical 红色圆角药丸显眼\u003c/li>\u003cli>□ CVE 编号等宽居右\u003c/li>\u003cli>□ 底部动作按钮规整\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/github-merge-box-matrix","title":"GitHub PR 自动化合并状态检查卡","html":"\u003ch1>GitHub PR 自动化合并状态检查卡\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub Pull Request 底部的合并就绪状态盒（PR Merge Box）；呈现无冲突绿底对勾、自动化检查通过提示、合并分支说明及醒目的 Squash and Merge 操作按钮。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角结构卡片外壳 (.ds-merge-box)\u003c/li>\u003cli>绿色圆形微章徽标 (.ds-merge-box__icon)\u003c/li>\u003cli>状态标题与检查小结 (.ds-merge-box__title, .ds-merge-box__desc)\u003c/li>\u003cli>内凹操作底栏 (.ds-merge-box__actions)\u003c/li>\u003cli>主操作分支合并按键与等宽代码分支指示\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 导航至合并主按钮；Enter 或 Space 执行分支合并。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>包含 role=&quot;region&quot; 与 aria-label=&quot;PR 合并状态检查&quot;。\u003c/li>\u003cli>绿色状态符合 WCAG 4.5:1 对比度标准，分支名称以语义化 code 标签包裹。\u003c/li>\u003cli>适合版本控制工作台、DevOps 流水线发布门禁、代码评审看板及 CI/CD 审核中心。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-merge-box&quot; role=&quot;region&quot; aria-label=&quot;PR 合并状态检查&quot;&gt;&lt;div class=&quot;ds-merge-box__header&quot;&gt;&lt;div class=&quot;ds-merge-box__icon&quot; aria-hidden=&quot;true&quot;&gt;✓&lt;/div&gt;&lt;div class=&quot;ds-merge-box__status&quot;&gt;&lt;h4 class=&quot;ds-merge-box__title&quot;&gt;This branch has no conflicts with the base branch&lt;/h4&gt;&lt;p class=&quot;ds-merge-box__desc&quot;&gt;Merging can be performed automatically. 2 checks passed.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-merge-box__actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-button ds-button--primary&quot; style=&quot;background:var(--ds-success);min-height:32px;font-size:12px&quot;&gt;Squash and merge&lt;/button&gt;&lt;span style=&quot;font-size:11px;color:var(--ds-muted);margin-left:8px&quot;&gt;from &lt;code style=&quot;font-family:var(--ds-type-mono)&quot;&gt;feature/batch-24&lt;/code&gt; into &lt;code style=&quot;font-family:var(--ds-type-mono)&quot;&gt;main&lt;/code&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;GithubPrMergeBox branch=&quot;feature/batch-24&quot; base=&quot;main&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 绿色图标圆润居左无拉伸\u003c/li>\u003cli>□ 底栏背景与卡片主体自然分层\u003c/li>\u003cli>□ 文字换行与边距自适应良好\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/github-pr-review-verdict","title":"GitHub PR 评审决策裁决卡片","html":"\u003ch1>GitHub PR 评审决策裁决卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub Pull Request 审查流中标志性的评审决策状态卡片；鲜明指示 Approved（审核通过）、Changes Requested（要求修改）或 Commented（仅评论），包含审查者头像与留言。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>裁决卡片外壳 (.ds-review-verdict)\u003c/li>\u003cli>顶部状态色带条 (.ds-review-verdict__head)\u003c/li>\u003cli>审核通过绿色主题变体 (.ds-review-verdict__head--approved)\u003c/li>\u003cli>要求修改红色主题变体 (.ds-review-verdict__head--changes)\u003c/li>\u003cli>审查者信息与头像 (.ds-review-verdict__author)\u003c/li>\u003cli>评审留言正文 (.ds-review-verdict__comment)\u003c/li>\u003cli>右下时间戳 (.ds-review-verdict__stamp)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为语义化 article 展示；若卡片含操作按钮可通过 Tab 依次获取焦点。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>顶部横条使用主题语义色（--ds-success-soft / --ds-danger-soft），一目了然传递审查结论。\u003c/li>\u003cli>右下角灰色等宽时间戳，提供精确的时间审计信息。\u003c/li>\u003cli>适合代码审查工作台、合规审批流、设计交付评审及团队工单验收系统。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-review-verdict&quot; role=&quot;article&quot; aria-label=&quot;代码评审裁决：octocat 审核通过&quot;&gt;&lt;div class=&quot;ds-review-verdict__head ds-review-verdict__head--approved&quot;&gt;&lt;span&gt;✓ 审核通过 (Approved)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-review-verdict__body&quot;&gt;&lt;div class=&quot;ds-review-verdict__author&quot;&gt;&lt;span class=&quot;ds-avatar ds-avatar--xs&quot;&gt;O&lt;/span&gt;&lt;span&gt;octocat&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;ds-review-verdict__comment&quot;&gt;代码架构严谨，100% 测试通过，可以随时合入主分支。&lt;/p&gt;&lt;span class=&quot;ds-review-verdict__stamp&quot;&gt;10分钟前&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;GithubReviewVerdictCard author=&quot;octocat&quot; verdict=&quot;approved&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 状态色带与文字对比度满足无障碍要求\u003c/li>\u003cli>□ 卡片内边距饱满紧凑\u003c/li>\u003cli>□ 多行评论自适应折行\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/github-pull-request-merge-queue-node","title":"GitHub 合并队列处理中节点卡片","html":"\u003ch1>GitHub 合并队列处理中节点卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub Enterprise 自动合并队列流水线节点卡片（Merge Queue Pipeline Node）；呈现队列排队序号（#2 QUEUE）、目标分支、推测性构建（Speculative Execution）测试状态微标及移出队列操作。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>规整圆角卡片容器 (.ds-pr-merge-queue-node)\u003c/li>\u003cli>左侧高亮队列序号药丸徽章 (.ds-pr-merge-queue-node__badge)\u003c/li>\u003cli>主体 PR 标题与分支引用提示 (.ds-pr-merge-queue-node__title, .ds-pr-merge-queue-node__meta)\u003c/li>\u003cli>沙盒测试中状态与动态沙漏 (.ds-pr-merge-queue-node__meta)\u003c/li>\u003cli>右侧移出队列操作微按钮 (.ds-pr-merge-queue-node__cancel)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦移出队列按键；Enter 触发移出确认操作。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;region&quot; 与 aria-label 说明合并队列位次与 PR 编号。\u003c/li>\u003cli>排队徽标色彩清晰，测试状态提示明晰。\u003c/li>\u003cli>适合自动化 CI/CD 流水线看板、代码审查合并中心、DevOps 交付控制台。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-pr-merge-queue-node&quot; role=&quot;region&quot; aria-label=&quot;GitHub 合并队列第 2 位：PR #1042&quot;&gt;&lt;span class=&quot;ds-pr-merge-queue-node__badge&quot;&gt;#2 QUEUE&lt;/span&gt;&lt;div class=&quot;ds-pr-merge-queue-node__body&quot;&gt;&lt;span class=&quot;ds-pr-merge-queue-node__title&quot;&gt;#1042 feat(tokens): add spatial hover halo ring &amp; standby clock&lt;/span&gt;&lt;span class=&quot;ds-pr-merge-queue-node__meta&quot;&gt;&lt;span&gt;codex/batch-30&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span style=&quot;color:var(--ds-accent)&quot;&gt;⏳ 运行中 4/5&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ds-pr-merge-queue-node__cancel&quot;&gt;移出队列&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;GithubPrMergeQueueNode queuePosition={2} prNumber={1042} branch=&quot;codex/batch-30&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 蓝色队列序号鲜明\u003c/li>\u003cli>□ PR 标题溢出截断自然\u003c/li>\u003cli>□ 移出队列按钮低调整齐\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/github-sponsor-tier-card","title":"GitHub Sponsors 赞助档位订阅卡片","html":"\u003ch1>GitHub Sponsors 赞助档位订阅卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub Sponsors 开发者赞助生态中的档位卡片；包含粉色爱心徽标、周期性赞助金额（如 $10/月）、专属特权权益列表及突出赞助按钮。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>档位卡片外壳 (.ds-sponsor-card)\u003c/li>\u003cli>顶栏档位名与粉红心形微章 (.ds-sponsor-card__heart)\u003c/li>\u003cli>大号等宽月度定价 (.ds-sponsor-card__price)\u003c/li>\u003cli>特权列表 (.ds-sponsor-card__desc)\u003c/li>\u003cli>底部行动号召主按钮\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 导航至赞助主按钮；Enter 或 Space 唤起赞助结账模态窗。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>心形微章自带柔和粉色外发光，强化社区回馈与感恩心理暗示。\u003c/li>\u003cli>月度价格大字号加粗展示，特权清晰枚举，信息架构层次分明。\u003c/li>\u003cli>适合开源项目主页、创作者众筹面板、SaaS 会员订阅方案及赞助墙展示。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-sponsor-card&quot; role=&quot;article&quot; aria-label=&quot;GitHub 赞助档位: Supporter Tier&quot;&gt;&lt;div class=&quot;ds-sponsor-card__head&quot;&gt;&lt;span class=&quot;ds-sponsor-card__tier&quot;&gt;Supporter Tier&lt;/span&gt;&lt;span class=&quot;ds-sponsor-card__heart&quot; aria-hidden=&quot;true&quot;&gt;❤&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;ds-sponsor-card__price&quot;&gt;$10&lt;/span&gt;&lt;span class=&quot;ds-sponsor-card__per&quot;&gt;/ per month&lt;/span&gt;&lt;/div&gt;&lt;ul style=&quot;margin:0;padding-left:16px;font-size:12px;color:var(--ds-muted);line-height:1.6&quot;&gt;&lt;li&gt;专属 Discord 赞助者身份徽章&lt;/li&gt;&lt;li&gt;抢先体验 Beta 新功能与组件库更新&lt;/li&gt;&lt;/ul&gt;&lt;button type=&quot;button&quot; class=&quot;ds-button ds-button--primary&quot; style=&quot;margin-top:auto;min-height:34px;font-size:12px&quot;&gt;赞助此档位 (Sponsor)&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;GithubSponsorTierCard tierName=&quot;Supporter Tier&quot; price=&quot;$10&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 心形粉色徽标光晕自然\u003c/li>\u003cli>□ 价格排版大方居左\u003c/li>\u003cli>□ 特权列表间距舒适紧凑\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/glass-dock-tile","title":"拟物立体圆角应用图示","html":"\u003ch1>拟物立体圆角应用图示\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS Sonoma 与 visionOS 风格的拟物超椭圆应用图标；带内发光倒角高光与按压物理形变。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>22% 平滑超椭圆轮廓 (Squircle)\u003c/li>\u003cli>顶部内嵌 1px 高光镜面反光\u003c/li>\u003cli>中央层次丰富的应用微图标\u003c/li>\u003cli>红底未读消息角标 (Badge)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦至图标应用；Enter 启动应用；按压时触发 scale(0.94) 物理深按反馈。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>渐变底板采用表面色与内嵌色的斜向线性过渡，充满层次感。\u003c/li>\u003cli>悬停时轻微跃起（translateY(-4px) scale(1.05)），按压时微缩放。\u003c/li>\u003cli>右上角未读角标带 2px 衬边，防止与底色黏连。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-app-tile&quot; role=&quot;button&quot; tabindex=&quot;0&quot; data-toast=&quot;启动 AetherLink&quot;&gt;&lt;span class=&quot;ds-app-tile__glyph&quot; aria-hidden=&quot;true&quot;&gt;🪐&lt;/span&gt;&lt;span class=&quot;ds-app-tile__badge&quot;&gt;3&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;AppIconTile glyph=&quot;🪐&quot; badge={3} label=&quot;AetherLink&quot; onClick={launch} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 悬停上浮与按压微缩放动效平滑利落\u003c/li>\u003cli>□ 超椭圆边角平滑自然无锯齿\u003c/li>\u003cli>□ 角标数字居中且边缘清晰\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/haptic-slider","title":"触觉厚胶囊物理滑杆","html":"\u003ch1>触觉厚胶囊物理滑杆\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 18 控制中心与 macOS 菜单栏风格的加厚胶囊物理滑条；支持连续拖拽、音量/亮度图标、实时百分比数值与高亮填充层。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>44px 加厚超椭圆圆角底槽\u003c/li>\u003cli>高亮填充色彩层 (scaleX 合成器驱动)\u003c/li>\u003cli>内部左侧状态微图标与说明\u003c/li>\u003cli>内部右侧等宽实时百分比读数\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦滑杆；左右方向键以 step 增减数值；PageUp / PageDown 快速跨步。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>填充层纯通过 CSS 变量 --ds-slider-pct 与 transform: scaleX() 驱动，保证 120fps 丝滑拖拽且无重排。\u003c/li>\u003cli>文字与图标位于填充层上方 (z-index: 2)，文字在浅色与深色背景下均具备清晰对比度。\u003c/li>\u003cli>采用 44px 舒适触摸高度，符合移动端与触控板首选操作尺寸。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-haptic-slider&quot; role=&quot;meter&quot; aria-valuenow=&quot;68&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot; style=&quot;--ds-slider-pct:0.68&quot;&gt;&lt;div class=&quot;ds-haptic-slider__fill&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-haptic-slider__content&quot;&gt;&lt;div class=&quot;ds-haptic-slider__label&quot;&gt;&lt;span&gt;🔊&lt;/span&gt;&lt;span&gt;动态出口带宽配额&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-haptic-slider__val&quot;&gt;68%&lt;/span&gt;&lt;/div&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;68&quot; class=&quot;ds-haptic-slider__input&quot; aria-label=&quot;带宽配额&quot;&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;HapticStepSlider value={68} icon=&quot;🔊&quot; label=&quot;出口带宽配额&quot; onChange={setBandwidth} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 拖拽填充层响应跟手无延迟重排\u003c/li>\u003cli>□ 百分比数值等宽排版不抖动\u003c/li>\u003cli>□ 读屏器能正确感知实时当前值\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/heatmap","title":"活跃度热力矩阵","html":"\u003ch1>活跃度热力矩阵\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub 与 LeetCode 风格的 365 天活动频次矩阵；直观展现提交密度、调用频次或健康指标。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>7 行星期维度网格 (Mon-Sun)\u003c/li>\u003cli>月份时间戳指示栏\u003c/li>\u003cli>5 级热度色阶单元格\u003c/li>\u003cli>底部活跃度图例与总计文案\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 或方向键在矩阵单元格之间遍历焦点；Enter 激活选中日期的详细事件浮层。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>单元格悬浮具备 scale(1.4) 放大反馈，突出微观细节。\u003c/li>\u003cli>色阶梯度采用主题强调色透明度插值，保证各主题下统一和谐。\u003c/li>\u003cli>提供 aria-label 包含准确日期与活动次数，对屏幕阅读器友好。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-heatmap&quot;&gt;&lt;div class=&quot;ds-heatmap__header&quot;&gt;&lt;span&gt;节点健康检测矩阵&lt;/span&gt;&lt;span style=&quot;font-size:11px;color:var(--ds-muted)&quot;&gt;共 864 次检测&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-heatmap__months&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;1月&lt;/span&gt;&lt;span&gt;2月&lt;/span&gt;&lt;span&gt;3月&lt;/span&gt;&lt;span&gt;4月&lt;/span&gt;&lt;span&gt;5月&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-heatmap__body&quot;&gt;&lt;div class=&quot;ds-heatmap__days&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;一&lt;/span&gt;&lt;span&gt;三&lt;/span&gt;&lt;span&gt;五&lt;/span&gt;&lt;span&gt;日&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-heatmap__grid&quot; role=&quot;grid&quot; aria-label=&quot;健康检测热力图&quot;&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;0&quot; title=&quot;无异常&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;1&quot; title=&quot;1次波动&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;2&quot; title=&quot;3次波动&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;3&quot; title=&quot;5次波动&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;4&quot; title=&quot;12次波动&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;0&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;3&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;4&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;0&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;0&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;4&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;3&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;0&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;3&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-heatmap__footer&quot;&gt;&lt;span&gt;近 6 个月健康度&lt;/span&gt;&lt;div class=&quot;ds-heatmap__legend&quot; aria-label=&quot;图例&quot;&gt;&lt;span&gt;少&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;0&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;3&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-heatmap__cell&quot; data-level=&quot;4&quot;&gt;&lt;/span&gt;&lt;span&gt;多&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;ActivityHeatmap data={calendarEvents} label=&quot;近半年节点探测&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 热力色块在深色与浅色下层级分明\u003c/li>\u003cli>□ 悬浮放大手感平滑无重排抖动\u003c/li>\u003cli>□ 单元格无障碍辅助文本包含日期与数值\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/icon-button","title":"图标按钮","html":"\u003ch1>图标按钮\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>提供窗口、工具栏中的紧凑动作，必须有可访问名称。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>18–20px 图标\u003c/li>\u003cli>至少 36px 桌面点击区\u003c/li>\u003cli>可访问名称\u003c/li>\u003cli>可选原生 tooltip\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 导航；Enter/Space 激活。不要让 tooltip 成为唯一名称。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>只有高辨识度动作可以省略可见文字。\u003c/li>\u003cli>移动端点击区扩大到 48px。\u003c/li>\u003cli>窗口控制区不参与拖拽。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;button class=&quot;ds-button ds-button--secondary ds-button--icon&quot; aria-label=&quot;刷新列表&quot; title=&quot;刷新列表&quot; data-toast=&quot;列表已刷新&quot;&gt;↻&lt;/button&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 屏幕阅读器读出“刷新列表，按钮”\u003c/li>\u003cli>□ 键盘焦点完整可见\u003c/li>\u003cli>□ 图标与文字动作结果一致\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/interactive-numpad","title":"iOS / Android 锁屏触感数字拨号键盘","html":"\u003ch1>iOS / Android 锁屏触感数字拨号键盘\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 与 Android 锁屏 PIN 码解锁及金融支付场景的 3×4 矩阵触感数字键盘；配备 64px 物理圆形高亮按键、等宽数字、字母副标与退格删除键。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>3×4 网格底座 (.ds-numpad)\u003c/li>\u003cli>64px 物理圆形微凸按键 (.ds-numpad__btn)\u003c/li>\u003cli>等宽主数字 (.ds-numpad__num)\u003c/li>\u003cli>字母辅助标注 (.ds-numpad__letters)\u003c/li>\u003cli>退格与空白占位位\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在按键间移动或支持物理键盘 0-9 数字键与 Backspace 映射输入；Enter 确认。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>按键按下时伴随 scale(0.92) 瞬时微下沉缩放与色彩反馈，重现真实机械微动触感。\u003c/li>\u003cli>退格键具有独立 aria-label=&quot;退格删除&quot;，为空白占位保留物理对齐几何位置。\u003c/li>\u003cli>数字采用 20px 粗体等宽居中，在深浅主题下均达 4.5:1 对比度。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-numpad&quot; role=&quot;group&quot; aria-label=&quot;数字拨号键盘&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-numpad__btn&quot; aria-label=&quot;数字 1&quot;&gt;&lt;span class=&quot;ds-numpad__num&quot;&gt;1&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-numpad__btn&quot; aria-label=&quot;数字 2&quot;&gt;&lt;span class=&quot;ds-numpad__num&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;ds-numpad__letters&quot;&gt;ABC&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-numpad__btn&quot; aria-label=&quot;数字 3&quot;&gt;&lt;span class=&quot;ds-numpad__num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;ds-numpad__letters&quot;&gt;DEF&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-numpad__btn&quot; aria-label=&quot;数字 4&quot;&gt;&lt;span class=&quot;ds-numpad__num&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;ds-numpad__letters&quot;&gt;GHI&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-numpad__btn&quot; aria-label=&quot;数字 5&quot;&gt;&lt;span class=&quot;ds-numpad__num&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;ds-numpad__letters&quot;&gt;JKL&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-numpad__btn&quot; aria-label=&quot;数字 6&quot;&gt;&lt;span class=&quot;ds-numpad__num&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;ds-numpad__letters&quot;&gt;MNO&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-numpad__btn&quot; aria-label=&quot;数字 7&quot;&gt;&lt;span class=&quot;ds-numpad__num&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;ds-numpad__letters&quot;&gt;PQRS&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-numpad__btn&quot; aria-label=&quot;数字 8&quot;&gt;&lt;span class=&quot;ds-numpad__num&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;ds-numpad__letters&quot;&gt;TUV&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-numpad__btn&quot; aria-label=&quot;数字 9&quot;&gt;&lt;span class=&quot;ds-numpad__num&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;ds-numpad__letters&quot;&gt;WXYZ&lt;/span&gt;&lt;/button&gt;&lt;div style=&quot;width:64px;height:64px&quot;&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ds-numpad__btn&quot; aria-label=&quot;数字 0&quot;&gt;&lt;span class=&quot;ds-numpad__num&quot;&gt;0&lt;/span&gt;&lt;span class=&quot;ds-numpad__letters&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-numpad__btn&quot; aria-label=&quot;退格删除&quot;&gt;&lt;span class=&quot;ds-numpad__num&quot;&gt;⌫&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;TactileNumpad onKeyPress={handlePress} onBackspace={handleBackspace} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 按键点击微下沉动效自然\u003c/li>\u003cli>□ 屏幕阅读器逐个读出按键语义\u003c/li>\u003cli>□ 数字与字母排版规整无溢出\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/interactive-tour-popover","title":"新手引导气泡浮层","html":"\u003ch1>新手引导气泡浮层\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>产品功能导览与新手旅程引导卡片；带有指向性三角箭头、步数进度计数、主次行动按钮与关闭按钮。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>指向目标元素的 45 度小箭头\u003c/li>\u003cli>步数徽标 (如 引导 2 / 5)\u003c/li>\u003cli>引导标题与描述正文\u003c/li>\u003cli>跳过与下一步主行动按钮\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在跳过与下一步按钮间导航；Enter 激活下一步；Escape 触发跳过并关闭导览。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>小箭头采用 10px 45 度旋转方块精确定位，自动与被引导目标产生物理指向联系。\u003c/li>\u003cli>步数徽标采用强调色半粗体，让用户清晰预期剩余探索旅程。\u003c/li>\u003cli>深浅模式下气泡浮层带 32px 柔和阴影，与背景页面清晰脱离。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-tour-popover&quot; role=&quot;dialog&quot; aria-modal=&quot;false&quot; aria-label=&quot;功能引导&quot;&gt;&lt;div class=&quot;ds-tour-popover__arrow&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-tour-popover__header&quot;&gt;&lt;span class=&quot;ds-tour-popover__step&quot;&gt;引导 2 / 5&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-button ds-button--ghost&quot; style=&quot;min-height:20px;font-size:11px;padding:2px 4px&quot; data-toast=&quot;跳过引导&quot;&gt;×&lt;/button&gt;&lt;/div&gt;&lt;h4 class=&quot;ds-tour-popover__title&quot;&gt;多径负载均衡&lt;/h4&gt;&lt;div class=&quot;ds-tour-popover__body&quot;&gt;开启后系统将自动聚合多个可用边缘通道，并发传输大流量文件。&lt;/div&gt;&lt;div class=&quot;ds-tour-popover__actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-button ds-button--ghost&quot; style=&quot;min-height:28px;font-size:11px&quot; data-toast=&quot;跳过引导&quot;&gt;跳过&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-button ds-button--primary&quot; style=&quot;min-height:28px;font-size:11px;margin-left:auto&quot; data-toast=&quot;进入下一步&quot;&gt;下一步 →&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;TourPopover step=&quot;2 / 5&quot; title=&quot;多径负载均衡&quot; description=&quot;聚合多通道并发传输。&quot; onNext={nextStep} onSkip={skip} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 指示箭头与气泡边缘无缝融合\u003c/li>\u003cli>□ 按钮文字在各种主题下对比达标\u003c/li>\u003cli>□ 读屏器能正确感知弹窗标题与步数\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-action-battery-spark-widget","title":"iOS 18 锁屏环形电量与设备能量小组件","html":"\u003ch1>iOS 18 锁屏环形电量与设备能量小组件\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 18 锁屏界面环形电量进度小组件（Lockscreen Circular Battery Widget）；SVG 矢量高精度环形进度圈、中央设备微图标与实时电量百分比、低电量自动变色。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>正圆微阴影小组件容器 (.ds-battery-widget)\u003c/li>\u003cli>SVG 矢量高精度圆环 (.ds-battery-widget__svg, .ds-battery-widget__fill)\u003c/li>\u003cli>圆心设备类型小图标 (.ds-battery-widget__icon)\u003c/li>\u003cli>等宽加粗居中百分比数值 (.ds-battery-widget__val)\u003c/li>\u003cli>端点圆角无接缝闭合\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦组件；Enter 查看设备电池健康度与预计剩余使用时长。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>role=&quot;meter&quot; 与 aria-valuenow 完整反映当前电量数值。\u003c/li>\u003cli>电量颜色由绿色/黄色/红色语义化支持，不单独依赖颜色传达低电量状态。\u003c/li>\u003cli>适合锁屏常驻监控、外接蓝牙设备电量、硬件仪表板与车载能耗卡。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-battery-widget&quot; role=&quot;meter&quot; aria-valuenow=&quot;78&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot; aria-label=&quot;MacBook Pro 电池电量: 78%&quot; style=&quot;--ds-bat-offset:41.4&quot;&gt;&lt;svg class=&quot;ds-battery-widget__svg&quot; viewBox=&quot;0 0 70 70&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle class=&quot;ds-battery-widget__track&quot; cx=&quot;35&quot; cy=&quot;35&quot; r=&quot;30&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;ds-battery-widget__fill&quot; cx=&quot;35&quot; cy=&quot;35&quot; r=&quot;30&quot;&gt;&lt;/circle&gt;&lt;/svg&gt;&lt;span class=&quot;ds-battery-widget__icon&quot; aria-hidden=&quot;true&quot;&gt;⚡&lt;/span&gt;&lt;span class=&quot;ds-battery-widget__val&quot;&gt;78%&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;IosBatteryLockscreenWidget level={78} deviceName=&quot;MacBook Pro&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 环形进度弧线平滑顺畅\u003c/li>\u003cli>□ 闪电图标与百分比垂直居中\u003c/li>\u003cli>□ 绿色填充鲜艳高对比\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-action-corner-badge","title":"iOS TestFlight 斜角折叠角标","html":"\u003ch1>iOS TestFlight 斜角折叠角标\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple iOS TestFlight、App Store 与 SaaS 软件中经典的斜角折叠角标（Corner Ribbon Badge）；放置在卡片或面板右上角，展示 BETA、PRO、NEW 或限免状态。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>父容器相对定位裁剪壳 (.ds-corner-badge-wrap)\u003c/li>\u003cli>45度旋转折叠缎带 (.ds-corner-badge)\u003c/li>\u003cli>PRO 渐变色变体 (.ds-corner-badge--pro)\u003c/li>\u003cli>BETA 次要色变体 (.ds-corner-badge--beta)\u003c/li>\u003cli>高对比大写状态字符\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>纯视觉徽标，由父级卡片提供焦点；自身 pointer-events:none 防止阻断下方交互。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>通过父容器 overflow:hidden 配合旋转 45deg 与负定位实现折叠缎带效果，零额外复杂 DOM。\u003c/li>\u003cli>大写字母与加粗字重保障在极小尺寸下的可读性。\u003c/li>\u003cli>适合订阅方案卡片、功能尝鲜弹窗、商品推荐位及应用内测入口。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-corner-badge-wrap&quot;&gt;&lt;span class=&quot;ds-corner-badge ds-corner-badge--pro&quot;&gt;PRO&lt;/span&gt;&lt;div style=&quot;font-weight:700;font-size:13px;color:var(--ds-ink);margin-bottom:4px&quot;&gt;企业级协作工作流&lt;/div&gt;&lt;p style=&quot;font-size:12px;color:var(--ds-muted);margin:0&quot;&gt;无限制云端同步与多租户隔离架构。&lt;/p&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;ActionCornerRibbonBadge text=&quot;PRO&quot; variant=&quot;pro&quot;&gt;&lt;div&gt;卡片内容&lt;/div&gt;&lt;/ActionCornerRibbonBadge&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 45度折叠缎带严密贴合卡片右上角\u003c/li>\u003cli>□ 投影柔和无毛刺\u003c/li>\u003cli>□ 浅色与深色主题下对比度达标\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-action-drawer-pill","title":"iOS 18 悬浮手势抽屉拖拽胶囊手柄","html":"\u003ch1>iOS 18 悬浮手势抽屉拖拽胶囊手柄\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple iOS 18 控制中心与灵动岛交互抽屉风格的悬浮拖拽手柄药丸；集成磨砂毛玻璃底座、居中触感凹槽抓手棒、左侧功能标题与右侧就绪微标。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>44px 悬浮药丸胶囊 (.ds-drawer-pill)\u003c/li>\u003cli>左侧图标与标题组 (.ds-drawer-pill__lead)\u003c/li>\u003cli>居中 32px 物理触感抓手横条 (.ds-drawer-pill__handle)\u003c/li>\u003cli>右侧高亮状态指示胶囊 (.ds-drawer-pill__badge)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦手柄；Enter 或 Space 展开或收起对应的内容抽屉面板；支持触摸上下滑动手势。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>采用 backdrop-filter: blur(20px) 与微柔阴影，在深色和浅色壁纸上均具有极佳悬浮立体感。\u003c/li>\u003cli>抓手横条默认居中且透明度 0.6，交互按压微缩放（scale(0.97)），触感真实。\u003c/li>\u003cli>适合作为底部半屏抽屉、快捷控制中心入口及侧边功能呼出条。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-drawer-pill&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;Siri 建议快捷指令 抽屉操作手柄&quot;&gt;&lt;div class=&quot;ds-drawer-pill__lead&quot;&gt;&lt;span&gt;✨&lt;/span&gt;&lt;span&gt;Siri 建议快捷指令&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-drawer-pill__handle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;ds-drawer-pill__badge&quot;&gt;就绪&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;IosActionDrawerPill title=&quot;Siri 建议快捷指令&quot; badge=&quot;就绪&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 手柄抓手条几何居中无偏移\u003c/li>\u003cli>□ 按压微缩放物理反馈自然\u003c/li>\u003cli>□ 毛玻璃背景磨砂通透\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-action-multitask-switcher","title":"iOS 18 多任务后台应用切换卡片","html":"\u003ch1>iOS 18 多任务后台应用切换卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 18 底部上滑多任务切换界面的浮动应用缩略图卡片（App Switcher Swipe Card）；圆角大曲率视窗、顶部应用图标与名称标题栏、骨架占位视窗、底部手势指示横条及轻微按压缩放反馈。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>高大圆角悬浮卡片 (.ds-app-switcher-card)\u003c/li>\u003cli>应用图标标题胶囊栏 (.ds-app-switcher-card__bar)\u003c/li>\u003cli>微缩内容骨架展示区 (.ds-app-switcher-card__body)\u003c/li>\u003cli>底部手势药丸横杠 (.ds-app-switcher-card__pill)\u003c/li>\u003cli>悬浮与拖拽轻微物理缩放\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>ArrowLeft / ArrowRight 切换卡片；Enter 切换进入该应用；Delete 或向上滑动手势关闭应用。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;button&quot; 与 tabindex=&quot;0&quot;，通过 aria-label 完整宣布应用名称与状态。\u003c/li>\u003cli>支持纯键盘 Enter/Space 激活及 Delete 退出。\u003c/li>\u003cli>适合移动端网页样机、多任务应用后台管理、多标签页 3D 轮播。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-app-switcher-card&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;多任务切换卡片: Terminal Pro&quot;&gt;&lt;div class=&quot;ds-app-switcher-card__bar&quot;&gt;&lt;span class=&quot;ds-app-switcher-card__icon&quot; aria-hidden=&quot;true&quot;&gt;⚡&lt;/span&gt;&lt;span class=&quot;ds-app-switcher-card__title&quot;&gt;Terminal Pro&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-app-switcher-card__body&quot;&gt;&lt;div class=&quot;ds-app-switcher-card__skeleton&quot; style=&quot;width:80%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-app-switcher-card__skeleton&quot; style=&quot;width:60%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-app-switcher-card__skeleton&quot; style=&quot;width:90%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-app-switcher-card__pill&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;IosAppSwitcherCard appName=&quot;Terminal Pro&quot; icon=&quot;⚡&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 28px 超大圆角自然顺滑\u003c/li>\u003cli>□ 悬浮缩放无毛边\u003c/li>\u003cli>□ 顶部栏与内容区分界清晰\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-action-slider-unlock","title":"iOS 18 经典滑动确认与解锁滑槽","html":"\u003ch1>iOS 18 经典滑动确认与解锁滑槽\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>经典 iOS &quot;Slide to Unlock&quot; 及移动支付 &quot;滑动以确认&quot; 触感滑轨；包含微内陷胶囊轨道、居中微光文字、触觉右箭头圆形拖拽滑块及全填充完成状态。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>胶囊轨道外壳 (.ds-slide-unlock)\u003c/li>\u003cli>内部进度填充遮罩 (.ds-slide-unlock__fill)\u003c/li>\u003cli>轨道居中指引文字 (.ds-slide-unlock__text)\u003c/li>\u003cli>高反差圆形抓取手柄 (.ds-slide-unlock__thumb)\u003c/li>\u003cli>拖拽与点击完成双模态交互\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦至滑动滑块；Space 或 Enter 可直接触发行程推进确认，Right Arrow 模拟滑动。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>外层滑槽声明 role=&quot;slider&quot; 并具备 aria-valuemin、aria-valuemax 与 aria-valuenow。\u003c/li>\u003cli>手柄具备可抓取游标光标提示（cursor: grab / grabbing），核验成功即刻报读。\u003c/li>\u003cli>适合高风险安全操作确认（如删除仓库、关机重启、大额支付划转及身份解锁）。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-slide-unlock&quot; role=&quot;slider&quot; aria-label=&quot;滑动以确认操作&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot; aria-valuenow=&quot;0&quot; style=&quot;--ds-slide-x:0px;--ds-slide-fill:52px&quot;&gt;&lt;div class=&quot;ds-slide
