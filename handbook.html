003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;button class=&quot;ds-button ds-button--secondary&quot; data-toast=&quot;已复制示例代码&quot;&gt;触发通知&lt;/button&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 关闭通知不会丢失焦点\u003c/li>\u003cli>□ 屏幕阅读器收到一次通知\u003c/li>\u003cli>□ 通知不遮住当前焦点\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/toolbar","title":"工具栏","html":"\u003ch1>工具栏\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 布局 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>聚合与当前内容相关的少量操作，区别于全局导航。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>区域标题\u003c/li>\u003cli>主动作\u003c/li>\u003cli>搜索或筛选\u003c/li>\u003cli>次要动作\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>默认使用普通 Tab 顺序；只有完整实现 roving focus 才使用 role=toolbar。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>主动作在右侧，窄屏可自然换行。\u003c/li>\u003cli>不要同时展示多个抢眼主按钮。\u003c/li>\u003cli>不要把工具栏放入每个内容卡片形成层级噪声。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-toolbar&quot;&gt;&lt;strong&gt;节点中心&lt;/strong&gt;&lt;div&gt;&lt;button class=&quot;ds-button ds-button--secondary&quot;&gt;测速&lt;/button&gt; &lt;button class=&quot;ds-button&quot; data-toast=&quot;打开导入任务&quot;&gt;添加节点&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 320px 宽仍不遮挡\u003c/li>\u003cli>□ 操作依赖状态时正确禁用\u003c/li>\u003cli>□ 工具栏标题说明上下文\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/tooltip","title":"浮动提示","html":"\u003ch1>浮动提示\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>在悬停或获得焦点时，为图标按钮、简写或截断文本提供轻量上下文解释，不抢占主任务焦点。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>指向小三角\u003c/li>\u003cli>高对比微型面板\u003c/li>\u003cli>单行解释文本\u003c/li>\u003cli>无障碍 aria-describedby 绑定\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>不接受独立键盘焦点；随被解释控件的 focus-visible 自动显现，按 Escape 隐藏。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>Tooltip 绝不能包含关键操作或不可缺失的表单错误。\u003c/li>\u003cli>触控设备优先保留可见文本标签，避免过度依赖悬浮。\u003c/li>\u003cli>文本采用反色或中性深色底板，与内容保持至少 4.5:1 对比度。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-toolbar&quot; style=&quot;justify-content:flex-start;gap:12px&quot;&gt;&lt;div class=&quot;ds-tooltip-wrapper&quot;&gt;&lt;button class=&quot;ds-button ds-button--secondary ds-button--icon&quot; aria-label=&quot;网络诊断&quot; aria-describedby=&quot;tip-diag&quot;&gt;⚡&lt;/button&gt;&lt;span role=&quot;tooltip&quot; id=&quot;tip-diag&quot; class=&quot;ds-tooltip&quot;&gt;快速网络与链路诊断&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-tooltip-wrapper&quot;&gt;&lt;button class=&quot;ds-button ds-button--secondary ds-button--icon&quot; aria-label=&quot;导出配置&quot; aria-describedby=&quot;tip-export&quot;&gt;⤓&lt;/button&gt;&lt;span role=&quot;tooltip&quot; id=&quot;tip-export&quot; class=&quot;ds-tooltip&quot;&gt;导出当前脱敏配置&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Tooltip text=&quot;快速网络与链路诊断&quot;&gt;&lt;Button variant=&quot;secondary&quot;&gt;⚡&lt;/Button&gt;&lt;/Tooltip&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 获得键盘焦点时 Tooltip 可见\u003c/li>\u003cli>□ Tooltip 文本不会被外层 overflow 容器裁切\u003c/li>\u003cli>□ 屏幕阅读器通过 aria-describedby 朗读说明\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/tree","title":"树形层级导航","html":"\u003ch1>树形层级导航\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>VS Code 与 GitHub 风格的代码与文件目录树；支持多层级折叠展开、选中指示与键盘无障碍遍历。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>树形外层容器\u003c/li>\u003cli>层级缩进引导线\u003c/li>\u003cli>展开收起箭头 Chevron\u003c/li>\u003cli>文件类型语义图标\u003c/li>\u003cli>项目标签\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>上下方向键移动焦点；右方向键展开目录；左方向键收起目录或跳至父目录；Enter 选中当前项。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>通过 border-left 提供淡淡的垂直层级参考线，多层目录清晰不混乱。\u003c/li>\u003cli>选中项具备圆角背景高光与加粗强调。\u003c/li>\u003cli>展开收起箭头使用 transform 旋转，性能卓越。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-tree&quot; role=&quot;tree&quot; aria-label=&quot;项目配置文件&quot; style=&quot;width:100%;max-width:280px&quot;&gt;&lt;div class=&quot;ds-tree-item is-expanded&quot; role=&quot;treeitem&quot; aria-expanded=&quot;true&quot;&gt;&lt;div class=&quot;ds-tree-item__row is-active&quot; tabindex=&quot;0&quot;&gt;&lt;span class=&quot;ds-tree-item__chevron&quot; aria-hidden=&quot;true&quot;&gt;▶&lt;/span&gt;&lt;span class=&quot;ds-tree-item__icon&quot; aria-hidden=&quot;true&quot;&gt;📁&lt;/span&gt;&lt;span&gt;config/&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-tree-item__group&quot; role=&quot;group&quot;&gt;&lt;div class=&quot;ds-tree-item&quot; role=&quot;treeitem&quot;&gt;&lt;div class=&quot;ds-tree-item__row&quot; tabindex=&quot;-1&quot;&gt;&lt;span style=&quot;width:14px&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-tree-item__icon&quot; aria-hidden=&quot;true&quot;&gt;📄&lt;/span&gt;&lt;span&gt;routes.json&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-tree-item&quot; role=&quot;treeitem&quot;&gt;&lt;div class=&quot;ds-tree-item__row&quot; tabindex=&quot;-1&quot;&gt;&lt;span style=&quot;width:14px&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-tree-item__icon&quot; aria-hidden=&quot;true&quot;&gt;📄&lt;/span&gt;&lt;span&gt;dns.yaml&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;FileTree items={fileTreeData} selectedId=&quot;routes&quot; onSelect={openFile} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 键盘方向键能顺利在层级间导航\u003c/li>\u003cli>□ 缩进连线在高 DPI 下无锯齿断裂\u003c/li>\u003cli>□ 选中项色彩在当前主题下满足对比度\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/uptime-bar","title":"服务状态监控条","html":"\u003ch1>服务状态监控条\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub 与 Stripe 风格的 90 天运行可用性微条矩阵；用于展示节点集群 SLA、故障率与每日健康度。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>服务名称与实时 SLA 徽标\u003c/li>\u003cli>90 天微细竖条刻度槽 (Ticks)\u003c/li>\u003cli>故障/异常色阶状态\u003c/li>\u003cli>起止日期与全部在线指示\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 或方向键在竖条间导航；聚焦竖条可展示对应日期的检测日志。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>竖条采用圆角 2px 细条，悬停时使用 scaleY(1.15) 纵向微挺立，手感精致。\u003c/li>\u003cli>正常状态采用 success 绿色，波动为 warning，故障为 danger。\u003c/li>\u003cli>提供准确的日期与事件 tooltip 文本，保障无障碍感知。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-uptime&quot;&gt;&lt;div class=&quot;ds-uptime__header&quot;&gt;&lt;span&gt;新加坡直连专线可用性&lt;/span&gt;&lt;span class=&quot;ds-badge ds-badge--success&quot;&gt;99.98% SLA&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__bars&quot; aria-label=&quot;近期状态&quot;&gt;&lt;div class=&quot;ds-uptime__tick&quot; title=&quot;10-01: 正常&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; title=&quot;10-02: 正常&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; title=&quot;10-03: 正常&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; data-status=&quot;degraded&quot; title=&quot;10-04: 轻微波动&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; title=&quot;10-05: 正常&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; title=&quot;10-06: 正常&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; title=&quot;10-07: 正常&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; title=&quot;10-08: 正常&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; data-status=&quot;down&quot; title=&quot;10-09: 专线割接中断&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; title=&quot;10-10: 正常&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; title=&quot;10-11: 正常&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; title=&quot;10-12: 正常&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; title=&quot;10-13: 正常&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; title=&quot;10-14: 正常&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__tick&quot; title=&quot;10-15: 正常&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-uptime__footer&quot;&gt;&lt;span&gt;15 天前&lt;/span&gt;&lt;span style=&quot;color:var(--ds-success);font-weight:600&quot;&gt;● 全部系统在线&lt;/span&gt;&lt;span&gt;今天&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;UptimePulseBar name=&quot;香港 01 专线&quot; sla=&quot;99.99%&quot; days={30} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 小竖条密集排列下鼠标悬浮精确\u003c/li>\u003cli>□ 异常红黄绿状态对比明显\u003c/li>\u003cli>□ SLA 徽标文字与背景对比达标\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/vscode-status-bar-item","title":"VS Code & Cursor 底部状态栏微型交互坞","html":"\u003ch1>VS Code &amp; Cursor 底部状态栏微型交互坞\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>VS Code 与 Cursor IDE 底部经典的等宽状态栏组件；包含 SSH 远端连接药丸、Git 分支超前/落后指示器、实时编译同步旋转指示、问题告警计数及行号列号编码指示。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>底栏自适应容器 (.ds-status-bar)\u003c/li>\u003cli>左右两端操作按钮群 (.ds-status-bar__group)\u003c/li>\u003cli>强调色状态药丸项 (.ds-status-bar-item--accent)\u003c/li>\u003cli>微型图标与文本对齐规范 (.ds-status-bar-item__icon)\u003c/li>\u003cli>等宽字符与单行无折行约束\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在底栏各个状态按钮间快速遍历；Enter 或 Space 唤起对应面板（如分支切换器、问题面板、编码选择器）。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>每个底栏按钮均声明明确的 aria-label 与 role=&quot;button&quot;，同步状态声明 aria-live=&quot;polite&quot;。\u003c/li>\u003cli>悬停与聚焦状态提供轻度背景色高亮反馈，对比度符合 WCAG AA 标准。\u003c/li>\u003cli>适合代码编辑器、云开发工作台、实时监控控制台及开发者工具底栏。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-status-bar&quot; role=&quot;toolbar&quot; aria-label=&quot;IDE 状态栏&quot;&gt;&lt;div class=&quot;ds-status-bar__group&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-status-bar-item ds-status-bar-item--accent&quot; aria-label=&quot;远程主机连接&quot;&gt;&lt;span class=&quot;ds-status-bar-item__icon&quot;&gt;⤿&lt;/span&gt;&lt;span&gt;SSH: prod-us&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-status-bar-item&quot; aria-label=&quot;Git 分支 main, 2 超前 1 落后&quot;&gt;&lt;span class=&quot;ds-status-bar-item__icon&quot;&gt;⎇&lt;/span&gt;&lt;span&gt;main* 2↑ 1↓&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-status-bar-item&quot; aria-label=&quot;问题报告: 0 错误, 2 警告&quot;&gt;&lt;span&gt;⊗ 0 ⚠ 2&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ds-status-bar__group&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-status-bar-item&quot; aria-label=&quot;跳转光标位置 行 42 列 18&quot;&gt;&lt;span&gt;Ln 42, Col 18&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-status-bar-item&quot; aria-label=&quot;字符编码 UTF-8&quot;&gt;&lt;span&gt;UTF-8&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-status-bar-item&quot; aria-label=&quot;语言模式 TypeScript JSX&quot;&gt;&lt;span&gt;TypeScript JSX&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;VscodeStatusBarItem branch=&quot;main*&quot; ahead={2} behind={1} line={42} col={18} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 状态栏项高度对齐统一\u003c/li>\u003cli>□ 强调色项与常规项过渡自然\u003c/li>\u003cli>□ 图标与数字文字间距舒适\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/warp-ai-prompt-popover","title":"Warp 终端 AI 指令生成建议气泡","html":"\u003ch1>Warp 终端 AI 指令生成建议气泡\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Warp 与 Cursor 终端风格的 AI 智能指令生成建议卡片；提供模型标签徽章、等宽高亮建议命令、通俗意图解释与一键写回终端动作。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>悬浮卡片主体 (.ds-warp-popover)\u003c/li>\u003cli>顶部模型来源微标题 (.ds-warp-popover__head)\u003c/li>\u003cli>等宽 Shell 指令区域 (.ds-warp-popover__cmd)\u003c/li>\u003cli>自然语言解释段落 (.ds-warp-popover__desc)\u003c/li>\u003cli>底部快速应用动作栏 (.ds-warp-popover__actions)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在复制与写入按钮间移动；Enter 或 ⌘Enter 立即将生成的命令输入当前命令行执行。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>外边框采用强调色 --ds-accent，突出 AI 建议与常规终端历史记录的区分度。\u003c/li>\u003cli>命令区域自带 --ds-inset 微凹背景与等宽字体，支持文本快速选取与拷贝。\u003c/li>\u003cli>解释文本清晰精炼，避免歧义。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-warp-popover&quot; role=&quot;region&quot; aria-label=&quot;终端 AI 指令生成浮层&quot;&gt;&lt;div class=&quot;ds-warp-popover__head&quot;&gt;&lt;span&gt;✨ Warp AI v2 · Claude 3.5 Sonnet&lt;/span&gt;&lt;/div&gt;&lt;pre class=&quot;ds-warp-popover__cmd&quot;&gt;&lt;code&gt;kubectl get pods -A --sort-by=.status.startTime&lt;/code&gt;&lt;/pre&gt;&lt;div class=&quot;ds-warp-popover__desc&quot;&gt;列出所有命名空间下的 Kubernetes Pods，并按照启动就绪时间先后进行降序排序。&lt;/div&gt;&lt;div class=&quot;ds-warp-popover__actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-button ds-button--secondary&quot;&gt;复制指令&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-button&quot;&gt;⌘↵ 写入终端&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;WarpTerminalAiPopover onApply={handleApply} onCopy={handleCopy} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ AI 模型标识醒目且强调色柔和\u003c/li>\u003cli>□ 终端命令行代码等宽无换行错位\u003c/li>\u003cli>□ 复制与写入快捷键标注清晰\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/waterfall-metric","title":"请求延迟阶段瀑布图","html":"\u003ch1>请求延迟阶段瀑布图\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Chrome DevTools 与 Cloudflare Speed 风格的请求握手阶段细分条形图；展示 DNS、TCP、TLS 与 TTFB 用时。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>阶段名称说明\u003c/li>\u003cli>水平累积偏移进度条 (Track)\u003c/li>\u003cli>分阶段彩色甘特矩形块\u003c/li>\u003cli>单阶段毫秒数值读取\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>可作为无障碍状态区读取；支持 Tab 导航至各阶段查看握手协商细节。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>条形基于时间累积百分比计算 left 偏移量，直观还原阶段先后承接关系。\u003c/li>\u003cli>DNS/TCP/TLS 各阶段使用鲜明区分色（蓝、紫、绿、青），一目了然。\u003c/li>\u003cli>提供阶段精确毫秒数字，并配备 tabular-nums 等宽排版。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-waterfall&quot; role=&quot;region&quot; aria-label=&quot;延迟瀑布分析&quot;&gt;&lt;div style=&quot;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ds-ink);margin-bottom:4px&quot;&gt;&lt;span&gt;连接阶段耗时分析&lt;/span&gt;&lt;span&gt;总用时 38ms&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-waterfall__row&quot;&gt;&lt;span class=&quot;ds-waterfall__label&quot;&gt;DNS 查询&lt;/span&gt;&lt;div class=&quot;ds-waterfall__track&quot;&gt;&lt;div class=&quot;ds-waterfall__bar&quot; style=&quot;left:0%;width:12%;background:var(--ds-accent)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;ds-waterfall__time&quot;&gt;4ms&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-waterfall__row&quot;&gt;&lt;span class=&quot;ds-waterfall__label&quot;&gt;TCP 握手&lt;/span&gt;&lt;div class=&quot;ds-waterfall__track&quot;&gt;&lt;div class=&quot;ds-waterfall__bar&quot; style=&quot;left:12%;width:38%;background:var(--ds-action)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;ds-waterfall__time&quot;&gt;14ms&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-waterfall__row&quot;&gt;&lt;span class=&quot;ds-waterfall__label&quot;&gt;TLS 1.3 协商&lt;/span&gt;&lt;div class=&quot;ds-waterfall__track&quot;&gt;&lt;div class=&quot;ds-waterfall__bar&quot; style=&quot;left:50%;width:26%;background:var(--ds-warning)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;ds-waterfall__time&quot;&gt;10ms&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-waterfall__row&quot;&gt;&lt;span class=&quot;ds-waterfall__label&quot;&gt;首字节 TTFB&lt;/span&gt;&lt;div class=&quot;ds-waterfall__track&quot;&gt;&lt;div class=&quot;ds-waterfall__bar&quot; style=&quot;left:76%;width:24%;background:var(--ds-success)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;ds-waterfall__time&quot;&gt;10ms&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;LatencyWaterfall stages={[{label:&quot;DNS&quot;, duration:4}, {label:&quot;TCP&quot;, duration:14}]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 瀑布块水平衔接严密无缝隙错位\u003c/li>\u003cli>□ 毫秒数值等宽对齐不抖动\u003c/li>\u003cli>□ 阶段颜色在深色与浅色下辨识度高\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/waveform-scrubber","title":"音频波形交互进度滑杆","html":"\u003ch1>音频波形交互进度滑杆\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Soundcloud 与 Apple Voice Memos 风格的专业波形拖拽指示滑块；采用镜像对称柱状图、已播放高亮着色、绝对定位拖拽游标针以及时间码悬浮微气泡。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>多柱状波形轨道 (.ds-wave-scrubber__track)\u003c/li>\u003cli>已播放高亮色块 (.is-played)\u003c/li>\u003cli>高亮竖向游标针与时间气泡\u003c/li>\u003cli>底部当前时间与总时长等宽排版\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦波形轨道；左右方向键快进或后退 5 秒；Space 切换播放与暂停；Home/End 跳转起止点。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>波形柱高度采用百分比预先归一化，支持自适应各类音频频谱数据。\u003c/li>\u003cli>播放进度通过 CSS 变量 --ds-scrub-x 驱动游标位置与着色计算，滑动极为平滑。\u003c/li>\u003cli>时间码采用等宽数字 tabular-nums，避免读数跳动时宽度闪烁。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-wave-scrubber&quot; role=&quot;region&quot; aria-label=&quot;音频波形进度控制器&quot; style=&quot;--ds-scrub-x:42%&quot;&gt;&lt;div class=&quot;ds-wave-scrubber__track&quot; tabindex=&quot;0&quot;&gt;&lt;div class=&quot;ds-wave-scrubber__bar is-played&quot; style=&quot;height:25%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-wave-scrubber__bar is-played&quot; style=&quot;height:55%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-wave-scrubber__bar is-played&quot; style=&quot;height:80%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-wave-scrubber__bar is-played&quot; style=&quot;height:45%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-wave-scrubber__bar is-played&quot; style=&quot;height:90%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-wave-scrubber__bar&quot; style=&quot;height:70%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-wave-scrubber__bar&quot; style=&quot;height:40%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-wave-scrubber__bar&quot; style=&quot;height:60%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-wave-scrubber__bar&quot; style=&quot;height:30%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-wave-scrubber__bar&quot; style=&quot;height:20%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-wave-scrubber__needle&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-wave-scrubber__bubble&quot;&gt;01:09&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-wave-scrubber__footer&quot;&gt;&lt;span&gt;01:09&lt;/span&gt;&lt;span&gt;02:45&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;WaveformAudioScrubber progress={42} currentTime=&quot;01:09&quot; duration=&quot;02:45&quot; onSeek={handleSeek} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 波形柱高度比例真实自然\u003c/li>\u003cli>□ 游标针与时间微气泡精准定位\u003c/li>\u003cli>□ 已播放与未播放对比清晰\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/waveform","title":"音频频谱波形","html":"\u003ch1>音频频谱波形\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 语音备忘录与现代 AI 语音助手声波柱；用于麦克风实时输入、音频播放进度与语音会话律动可视化。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>水平排列胶囊声波条\u003c/li>\u003cli>高度缩放变换因子 (--ds-bar-h)\u003c/li>\u003cli>实时语音呼吸动效 (Live)\u003c/li>\u003cli>激活播放进度色阶\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>纯视觉频谱不获得焦点；若是可拖拽音频进度条，支持左右键步进。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>采用 transform: scaleY 而非 height 驱动声波高低，彻底规避布局重排。\u003c/li>\u003cli>两端保持饱满胶囊圆角，柱间距均匀美观。\u003c/li>\u003cli>支持 --ds-bar-h CSS 自定义属性动态注入实时振幅。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-toolbar&quot; style=&quot;justify-content:flex-start;gap:16px;align-items:center&quot;&gt;&lt;div class=&quot;ds-waveform&quot; role=&quot;img&quot; aria-label=&quot;麦克风声波输入&quot;&gt;&lt;span class=&quot;ds-waveform-bar is-active is-live&quot; style=&quot;--ds-bar-h:0.35&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-waveform-bar is-active is-live&quot; style=&quot;--ds-bar-h:0.75&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-waveform-bar is-active is-live&quot; style=&quot;--ds-bar-h:1.0&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-waveform-bar is-active is-live&quot; style=&quot;--ds-bar-h:0.55&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-waveform-bar is-active is-live&quot; style=&quot;--ds-bar-h:0.85&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-waveform-bar is-live&quot; style=&quot;--ds-bar-h:0.4&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-waveform-bar is-live&quot; style=&quot;--ds-bar-h:0.65&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-waveform-bar is-live&quot; style=&quot;--ds-bar-h:0.3&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-badge ds-badge--info&quot;&gt;AI 语音监听中&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;AudioWaveform bars={[35, 75, 100, 55, 85, 40, 65, 30]} isLive /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 声波律动在 60fps 下无掉帧\u003c/li>\u003cli>□ 使用 scaleY 变换无布局回流\u003c/li>\u003cli>□ 减弱动效模式下保持静态柱状图\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"guides/accessibility","title":"无障碍与输入方式","html":"\u003ch1>无障碍与输入方式\u003c/h1>\n\u003cp>本节将 WCAG 2.2 和原生交互原则转为工程约定。通过静态检查不代表整套产品已通过无障碍认证。\u003c/p>\n\u003ch2>键盘完成路径\u003c/h2>\n\u003cp>使用原生 button、input、select、details 和 dialog。只有完整实现焦点、状态和键盘行为后才考虑自定义角色。用户应能只用 Tab、Shift+Tab、Enter、Space 和 Escape 完成主要任务。\u003c/p>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">控件\u003c/th>\u003cth scope=\"col\">行为\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>按钮\u003c/td>\u003ctd>Enter/Space 激活，disabled 不可激活\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Switch/Checkbox\u003c/td>\u003ctd>Space 切换，标签也可点击\u003c/td>\u003c/tr>\u003ctr>\u003ctd>单选组\u003c/td>\u003ctd>方向键在同 name 组内选择\u003c/td>\u003c/tr>\u003ctr>\u003ctd>真正的标签页\u003c/td>\u003ctd>roving tabindex，方向键、Home、End；面板关联\u003c/td>\u003c/tr>\u003ctr>\u003ctd>分段按钮组\u003c/td>\u003ctd>各按钮 Tab 可达，aria-pressed 表示状态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>模态对话框\u003c/td>\u003ctd>showModal，焦点进入并受限；Escape 退出；返回触发点\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>名称、角色和值\u003c/h2>\n\u003cp>图标按钮有 aria-label，输入框有真正的 label，所有操作有明确名称。加载、已连接、未连接和错误状态通过文本表达，不只靠色点。帮助/错误文本使用 aria-describedby。不要同时把相同消息放到多个 live region。\u003c/p>\n\u003ch2>焦点可见\u003c/h2>\n\u003cp>焦点环采用 2px focus 角色色与 3px offset，这是本系统视觉选择。容器 overflow:hidden 不应裁切焦点。固定标题栏或通知不能完全遮住正在操作的控件。表格滚动容器应能获得键盘焦点和可访问名称。\u003c/p>\n\u003ch2>颜色与缩放\u003c/h2>\n\u003cp>普通文本对比度至少 4.5:1；大文本至少 3:1。必要的控件识别线和状态图形应有足够对比度。200% 页面缩放与增大字体时，文字能重排，主要操作不被隐藏。\u003c/p>\n\u003ch2>状态播报\u003c/h2>\n\u003cp>普通成功使用 polite。必须处理的错误可使用 role=alert，但不要每秒播报流量数值。加载容器用 aria-busy；占位装饰 aria-hidden。搜索结果可播报总数，避免每个字符都立即重复播报。\u003c/p>\n\u003ch2>动效与强制颜色\u003c/h2>\n\u003cp>减少动效时停用位移、缩放、旋转和持续闪烁；状态变化保持清楚。forced-colors 时采用系统边框和可辨识开关轨道，不依赖透明影子。产品主题按钮不能覆盖操作系统高对比设置的基本可读性。\u003c/p>\n\u003ch2>手动检查\u003c/h2>\n\u003cp>以键盘走完整导入流程，检查屏幕阅读器读出的 label、帮助文本、错误与按钮加载状态。检查 dialog 关闭后焦点回到原按钮。使用没有鼠标悬停的触摸方式验证 tooltip 之外仍有足够说明。\u003c/p>\n\u003cp>来源：\u003ca href=\"https://www.w3.org/TR/WCAG22/\" target=\"_blank\" rel=\"noopener noreferrer\">W3C WCAG 2.2\u003c/a>、\u003ca href=\"https://www.w3.org/WAI/WCAG22/Understanding/focus-not-obscured-minimum\" target=\"_blank\" rel=\"noopener noreferrer\">焦点不被遮挡\u003c/a>。\u003c/p>","group":"实施指南"},{"id":"guides/assets","title":"图标、插画和资源管理","html":"\u003ch1>图标、插画和资源管理\u003c/h1>\n\u003ch2>图标\u003c/h2>\n\u003cp>业务应用优先沿用现有 Lucide 图标系统：同一区域采用统一尺寸和笔画。常规图标 18–20px；辅助图标 14–16px。装饰图标 aria-hidden，独立图标按钮必须有名称。\u003c/p>\n\u003cp>不要混用多种线条风格；无需为每个空状态生成巨大的插画。应用标识可以使用本地 SVG，保留 viewBox，避免硬编码主题颜色。图标中的颜色尽量使用 currentColor。\u003c/p>\n\u003ch2>图片\u003c/h2>\n\u003cp>图片需注明来源、用途、许可、原始尺寸和导出规格。没有实际使用需求时不下载大量壁纸和字体来凑体积。组件截图应来自可运行目录，标明主题、密度和日期。\u003c/p>\n\u003ch2>字体\u003c/h2>\n\u003cp>Web 产物内置 Noto Sans SC 可变字体，通过本地 @font-face 加载，中文与拉丁文字统一排版。字体源和 SIL OFL 许可在 web/fonts/，构建复制到 dist/web/fonts/；fallback 包含 Microsoft YaHei UI，不依赖公网字体请求。AetherLink 安装包同时包含 OFL 许可。\u003c/p>\n\u003ch2>输出结构\u003c/h2>\n\u003cp>桌面应用品牌图标保留 SVG 原件，导出 512px PNG 和包含 16／32／48／64／128／256px 的 ICO；检查任务栏、窗口标题和高缩放下的可读性。示例实现已用于 SSH Desk。业务图标继续沿用统一笔画，不把每个动作换成品牌标识。\u003c/p>\n\u003cp>字体源文件和许可放在 \u003ccode>web/fonts/\u003c/code>，构建 CSS/JSON 放在 \u003ccode>dist/\u003c/code>。既有截图和旧压缩包已移入项目同级的整理备份；运行 \u003ccode>npm run package\u003c/code> 时才创建 \u003ccode>artifacts/\u003c/code> 输出目录。不把 node_modules 体积当作设计系统的内容价值。原始资源与演示资源分离。\u003c/p>","group":"实施指南"},{"id":"guides/content","title":"文字、错误与隐私","html":"\u003ch1>文字、错误与隐私\u003c/h1>\n\u003ch2>常规文字\u003c/h2>\n\u003cp>按钮使用明确动词：“添加订阅”“解析并添加”“停止代理”“恢复设置”。避免“确定”承载多个不明确动作。区域标题使用自然中文；协议名和关键单位保留标准英文。\u003c/p>\n\u003ch2>状态用语\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">实际状态\u003c/th>\u003cth scope=\"col\">推荐\u003c/th>\u003cth scope=\"col\">避免\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>请求已发出\u003c/td>\u003ctd>正在连接\u003c/td>\u003ctd>已建立安全连接\u003c/td>\u003c/tr>\u003ctr>\u003ctd>内核健康检查成功\u003c/td>\u003ctd>内核运行中\u003c/td>\u003ctd>永久稳定运行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>未测速\u003c/td>\u003ctd>未测速\u003c/td>\u003ctd>0ms / 随机低延迟\u003c/td>\u003c/tr>\u003ctr>\u003ctd>下载超时\u003c/td>\u003ctd>下载超时，请稍后重试\u003c/td>\u003ctd>未能识别格式\u003c/td>\u003c/tr>\u003ctr>\u003ctd>没有节点\u003c/td>\u003ctd>添加订阅地址开始配置\u003c/td>\u003ctd>自动添加虚构节点\u003c/td>\u003c/tr>\u003ctr>\u003ctd>未实现\u003c/td>\u003ctd>尚未支持\u003c/td>\u003ctd>已开启，但只改变 UI\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>错误结构\u003c/h2>\n\u003cp>先说明出了什么问题，再给出具体下一步。HTTP 错误可以展示状态码，但不展示带 token 的完整地址。输入错误与输入框相邻，网络错误保持输入值，系统代理恢复失败应说明需要检查 Windows 设置。\u003c/p>\n\u003ch2>隐私边界\u003c/h2>\n\u003cp>订阅地址通常包含令牌。不要在日志、异常栈、截图、公开示例和 Git 文件中保存用户真实链接。下载时只发送到用户提供的地址及其重定向目标。不要把该链接发送到搜索引擎或外部转换网站。\u003c/p>\n\u003cp>导入节点确实会包含凭据；本地持久化必须在产品说明中体现。不要宣称“零泄漏”“绝对安全”等无法验证的保证。产品中的示例节点应明确仅为示例，不能假装已经可连接。\u003c/p>\n\u003ch2>长度和信息密度\u003c/h2>\n\u003cp>短成功消息可 Toast；需要处理的错误应在页面保留。较长说明放在帮助区或 details。技术细节只在帮助用户做决定时出现，例如代理端口和被占用的端口。\u003c/p>","group":"实施指南"},{"id":"guides/data","title":"数据、图表和真实反馈","html":"\u003ch1>数据、图表和真实反馈\u003c/h1>\n\u003ch2>数据原则\u003c/h2>\n\u003cp>所有实时指标来自同一真实数据源。接口不可用时展示断开、未知或空状态；不能随机生成流量、延迟、命中次数和连接记录。\u003c/p>\n\u003ch2>数值显示\u003c/h2>\n\u003cp>字节单位使用 KB/MB，并说明二进制换算；时间、日期和单位采用统一格式。延迟 0 表示未测速时应显示“未测速”，超时单独显示。数值使用 tabular-nums。\u003c/p>\n\u003ch2>流量图\u003c/h2>\n\u003cp>曲线颜色对应上传/下载图例。纵轴动态范围跟随数据，不用固定最大值裁掉峰值；曲线之外保留当前数值和采样说明。Canvas 图表需有文本替代和可理解的图例。\u003c/p>\n\u003cp>窗口大小变化时按 devicePixelRatio 更新画布，避免模糊；不以无限 requestAnimationFrame 绘制没有变化的数据。组件卸载后清理 ResizeObserver、定时器和 WebSocket。\u003c/p>\n\u003ch2>表格\u003c/h2>\n\u003cp>金额、流量和延迟等可比較数值右对齐；名称左对齐；协议等短值保持固定宽。排序必须真的改变数据并同步 aria-sort。记录很多时引入分页或虚拟化，并验证读屏和焦点行为。\u003c/p>\n\u003ch2>状态过期\u003c/h2>\n\u003cp>接口断开时清理或标记缓存为过期，避免把旧数据继续当实时。连接操作成功后再更新状态。未知数量不编造具体数字；一次请求失败不清空用户已经保存的配置。\u003c/p>","group":"实施指南"},{"id":"guides/foundations","title":"基础视觉与层级","html":"\u003ch1>基础视觉与层级\u003c/h1>\n\u003ch2>产品定位\u003c/h2>\n\u003cp>面向长时间使用的生产力软件、配置工具和数据工作区。视觉表达保持安静，以信息层级、清楚的状态和明确操作帮助用户完成任务。避免用装饰动画制造“正在工作”的错觉。\u003c/p>\n\u003ch2>三层结构\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">层\u003c/th>\u003cth scope=\"col\">包含内容\u003c/th>\u003cth scope=\"col\">材质\u003c/th>\u003cth scope=\"col\">约束\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>内容层\u003c/td>\u003ctd>列表、配置、表单、数据、聊天\u003c/td>\u003ctd>实底 surface/canvas\u003c/td>\u003ctd>不使用 backdrop-filter；正文可选中\u003c/td>\u003c/tr>\u003ctr>\u003ctd>导航层\u003c/td>\u003ctd>窗口标题栏、侧栏、工具栏\u003c/td>\u003ctd>可用 chrome\u003c/td>\u003ctd>一屏可见 blur 区域最多 2 个，这是本系统性能预算\u003c/td>\u003c/tr>\u003ctr>\u003ctd>临时层\u003c/td>\u003ctd>菜单、dialog、toast\u003c/td>\u003ctd>实底 elevated/surface\u003c/td>\u003ctd>正确处理焦点、遮罩和关闭\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>透明材质是区分导航与内容的手段。低性能或高对比模式应能回退为实底。静态 CSS 中存在多个材料类不等于运行时存在多个模糊区域，需要检查实际可见元素。\u003c/p>\n\u003ch2>颜色角色\u003c/h2>\n\u003cp>不要在业务组件直接使用“灰 900”“蓝 500”来同时表示文本和背景。使用 \u003ccode>ink\u003c/code>、\u003ccode>muted\u003c/code>、\u003ccode>surface\u003c/code>、\u003ccode>line\u003c/code>、\u003ccode>action\u003c/code>、\u003ccode>on-action\u003c/code>。状态采用 success/warning/danger，并包含文字。\u003c/p>\n\u003cp>蓝色是主要操作色，紫色只在输入焦点、开关、少量选择状态中出现；成功绿表示已经确认的成功。连接请求发出时只能显示“正在连接”，不能立即显示“已连接”。\u003c/p>\n\u003ch2>排版\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">角色\u003c/th>\u003cth scope=\"col\">默认 Web 值\u003c/th>\u003cth scope=\"col\">用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>页面标题\u003c/td>\u003ctd>28px / 1.2 / 600\u003c/td>\u003ctd>每页一个主要标题\u003c/td>\u003c/tr>\u003ctr>\u003ctd>区域标题\u003c/td>\u003ctd>16–20px / 1.4 / 600\u003c/td>\u003ctd>卡片与分组\u003c/td>\u003c/tr>\u003ctr>\u003ctd>正文、控件\u003c/td>\u003ctd>14px / 1.6 / 400–600\u003c/td>\u003ctd>常规工作区\u003c/td>\u003c/tr>\u003ctr>\u003ctd>说明、徽标\u003c/td>\u003ctd>12px / 1.5\u003c/td>\u003ctd>时间、状态、补充说明\u003c/td>\u003c/tr>\u003ctr>\u003ctd>核心指标\u003c/td>\u003ctd>32px / 1.2 / 600\u003c/td>\u003ctd>数值和单位\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>中文与英文统一使用随包分发的 Noto Sans SC 可变黑体，缺失时回退 Microsoft YaHei UI；无需网络下载。数值启用 tabular-nums；代码用 Cascadia Code/Consolas。长段文字尽量控制在 680–760px 宽，不将全屏宽度用于连续阅读。\u003c/p>\n\u003ch2>间距与形状\u003c/h2>\n\u003cp>以 4px 为最小单位、8px 为主要节奏；主要页面内边距 24–40px，卡片内边距 24px，组间距 24–32px。小控件圆角 8–12px，内容面板 20px，dialog 24px。圆角表达组件大小，不能每个元素都使用胶囊。\u003c/p>\n\u003ch2>层级检查\u003c/h2>\n\u003cp>先去掉所有阴影和颜色，页面仍应靠标题、间距和分组表达主要任务。然后只恢复必要的主操作色。静态卡片不做悬停上浮，不给不可操作区域加 pointer。\u003c/p>","group":"实施指南"},{"id":"guides/governance","title":"版本、维护与贡献","html":"\u003ch1>版本、维护与贡献\u003c/h1>\n\u003ch2>内容归属\u003c/h2>\n\u003cp>设计源为 tokens/web.json、web/components.css、web/react.tsx、web/catalog.cjs 和手写 docs。自动产物为 dist/web、index.html、token-reference.md 与 docs/components。不要仅编辑产物，随后构建会覆盖。\u003c/p>\n\u003ch2>版本约定\u003c/h2>\n\u003cp>增加向后兼容的组件和角色升级次版本；修复样式、说明和验证升级补丁版本；移除变量或改变交互语义升级主版本。新增组件必须包括真实预览、键盘行为、状态和验收条件。\u003c/p>\n\u003ch2>评审流程\u003c/h2>\n\u003cp>先写清楚要解决的真实任务，再提交状态矩阵和组件代码。评审比较默认、错误、加载和禁用状态，而不只看漂亮截图。未实现业务行为不能通过 toast 文案伪装为成功。\u003c/p>\n\u003ch2>产物维护\u003c/h2>\n\u003cp>构建应确定性输出；不用当前时间改变每个文件的内容。锁文件与 package.json 版本一致。增加资产记录来源和许可；不要上传 node_modules 或为了体积复制无用资源。\u003c/p>\n\u003ch2>文档更新\u003c/h2>\n\u003cp>用户长期约定：每次项目或实质迭代结束后，主动评估可回流经验，补充相关模式、组件或验证记录。优先更新现有专题，不重复积累；没有新增经验时说明即可。记录适用条件、实际验证与待验证范围，避免把单产品偏好写成全局规则。经验同步修改源文件，随后按变更范围构建和验证，不修改备份，不包含私人数据。\u003c/p>\n\u003cp>组件 JSON 是逐组件规范的真值。手写专题是横向工程约定。源引用记录访问日期，并区分官方要求和本系统主动选择的数值。新官方规范不自动覆盖产品已确定的交互，需评审实际影响。\u003c/p>","group":"实施指南"},{"id":"guides/internationalization","title":"国际化和本地格式","html":"\u003ch1>国际化和本地格式\u003c/h1>\n\u003ch2>文本和布局\u003c/h2>\n\u003cp>界面文字保留在应用的语言层，不写入颜色 Token。中文标签短不代表英文标签也短：以扩展 40% 的文案检查工具栏、按钮和标签页。用户节点名称可以含 emoji 和多种文字，应保留原始 Unicode。\u003c/p>\n\u003ch2>数据\u003c/h2>\n\u003cp>时间使用用户时区和本地格式；文件名、服务器地址和协议名称保持原文。排序不要依赖英文小写转换作为所有语言的通用排序规则。数字使用 Intl.NumberFormat 时明确是否需要单位和最大精度。\u003c/p>\n\u003ch2>凭据和解析\u003c/h2>\n\u003cp>Base64 内容需要按 UTF-8 解码，不能假设 ASCII。分享链接的 percent encoding 正确还原，错误输入不能触发整个界面崩溃。URL token、密码、UUID 不执行自动翻译或大小写修改。\u003c/p>\n\u003ch2>方向和输入法\u003c/h2>\n\u003cp>新建 Web 组件尽量使用逻辑属性 inline/block；代码和 URL 区域保持适当的 LTR 表达。中文输入法 composition 期间不把 Enter 当作提交，待输入完成后再响应键盘提交。\u003c/p>\n\u003ch2>第三方界面的显示层翻译\u003c/h2>\n\u003cp>第三方桌面壳或嵌入式 Web 界面没有可用的 i18n 接口时，可以把 DOM 显示层翻译作为受限兼容方案，但不应把它当成产品自身国际化的替代品。只对已知界面节点和 \u003ccode>placeholder\u003c/code>、\u003ccode>title\u003c/code>、\u003ccode>aria-label\u003c/code> 等属性做整段精确匹配；明确跳过输入框、聊天消息、代码块、日志、文件名和用户生成标题，避免翻译或改写用户内容。动态界面可用 \u003ccode>MutationObserver\u003c/code> 处理后续渲染，同时需要控制观察范围并保证重复执行幂等。\u003c/p>\n\u003cp>实施前保留可恢复的原始资源，并把翻译词典与注入逻辑分离，便于升级后重新应用或单独修正词条。验收不能停在“进程已启动”和“注入标记存在”：还要确认主窗口可见、本地界面请求完成、核心导航可操作，并在失败时立即恢复原资源。曾有 Electron 桌面壳在解包注入后仍能启动进程和本地服务，但主界面请求超时；因此进程级检查只能证明启动链的一部分。\u003c/p>\n\u003cp>本方案只在界面显示层验证有效；模型生成内容、服务端文案、图片内文字以及新版中未命中的字符串仍可能保持原文。桌面壳、界面服务和远程鉴权同时参与启动时，应分别记录本地注入兼容性与网络可达性，不能把所有白屏都归因于翻译。若产品提供正式语言资源，应优先迁移到官方机制。\u003c/p>","group":"实施指南"},{"id":"guides/layout","title":"布局与响应式","html":"\u003ch1>布局与响应式\u003c/h1>\n\u003ch2>桌面骨架\u003c/h2>\n\u003cp>标题栏 52px；侧栏默认 212px；内容最大 1280px；页内边距默认 32px。主操作放在页面标题或任务卡片附近，系统开关放在稳定的辅助区域。列表、表单与统计数据之间使用明确的分组标题。\u003c/p>\n\u003ch2>建议断点\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">宽度\u003c/th>\u003cth scope=\"col\">结构\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>≥1280px\u003c/td>\u003ctd>完整侧栏；数据或组件目录可两列；页面外侧保留留白\u003c/td>\u003c/tr>\u003ctr>\u003ctd>960–1279px\u003c/td>\u003ctd>完整侧栏；辅助信息减少；卡片两列或单列\u003c/td>\u003c/tr>\u003ctr>\u003ctd>720–959px\u003c/td>\u003ctd>收紧页边距；长表单单列；优先保留核心操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&lt;720px\u003c/td>\u003ctd>网站侧栏折叠为可访问菜单；表单单列；表格局部水平滚动\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>断点是布局变化点而不是设备名称。AetherLink 当前是桌面窗口，有原生最小宽度；组件目录支持窄屏，两者不能混为同一产品能力。\u003c/p>\n\u003ch2>网格\u003c/h2>\n\u003cp>主要任务卡片可使用 \u003ccode>minmax(0,1fr)\u003c/code>，避免长地址撑开网格。超过容器的服务器地址允许换行或显示可复制详情；不要在所有区域一律截断。指标区 3–4 列只适用于足够宽的容器。\u003c/p>\n\u003ch2>滚动和固定区\u003c/h2>\n\u003cp>整个窗口仅一个主要内容滚动区。侧栏和标题栏保持稳定；表格与代码允许必要的局部滚动。sticky 元素不应覆盖焦点；设置 scroll-padding-top 给锚点留空间。\u003c/p>\n\u003ch2>弹窗\u003c/h2>\n\u003cp>宽度使用 \u003ccode>min(480px, calc(100vw - 32px))\u003c/code>；高度不超过视口减去 48px；正文可滚动。小屏不把确认按钮放到视口之外。表单太长时应采用页面。\u003c/p>\n\u003ch2>内容长度测试\u003c/h2>\n\u003cp>用 80 字标题、很长服务器名、1000 字错误解释、空数据和 200% 字体验证。布局不以当前中文短文本为唯一依据。数字与单位尽量同组，不把单位甩到下一行。\u003c/p>","group":"实施指南"},{"id":"guides/migration","title":"v2 到 v3 迁移","html":"\u003ch1>v2 到 v3 迁移\u003c/h1>\n\u003ch2>保留什么\u003c/h2>\n\u003cp>原来的 tokens、原生示例和历史设计偏好仍保留。旧版 A/B 对比页与重复的长篇设计规范已移入项目同级的整理备份，不再作为日常入口。v3 在 Web 工程中采用独立语义角色、可访问状态和详细验收。既有历史偏好矩阵是源项目文档，不代表用户在当前会话中新授予了额外权限。\u003c/p>\n\u003ch2>新入口\u003c/h2>\n\u003cp>\u003ccode>index.html\u003c/code> 为 v3 离线组件目录；\u003ccode>docs/README.md\u003c/code> 为详细手册。原 \u003ccode>.cursor/skills/hybrid-native-ui/code/demo.html\u003c/code> 作为 v2 参考保留。新业务页面采用 \u003ccode>dist/web/theme.css\u003c/code> 与 \u003ccode>components.css\u003c/code>。\u003c/p>\n\u003ch2>推荐迁移次序\u003c/h2>\n\u003col>\u003cli>先引入语义主题，确认正文和操作颜色。\u003c/li>\u003cli>替换按钮、输入框、开关和徽标。\u003c/li>\u003cli>分离导航材质和内容实底。\u003c/li>\u003cli>接入真实异步状态，移除随机数据与虚假成功。\u003c/li>\u003cli>检查键盘、缩放和减少动效。\u003c/li>\u003cli>最后再统一复杂表格、弹窗和平台特有行为。\u003c/li>\u003c/ol>\n\u003ch2>API 与风险\u003c/h2>\n\u003cp>v3 React 封装为新增源码 API，没有已发布包的兼容承诺。表单 value/onChange 保持业务控制。颜色角色 on-action/action 一起使用，不能只替换按钮背景。Dialog 使用原生模态行为，旧版显示隐藏逻辑不要同时控制。\u003c/p>\n\u003ch2>AetherLink\u003c/h2>\n\u003cp>通过 \u003ccode>npm run sync:ui\u003c/code> 从指定目录同步固定产物到 \u003ccode>src/design-system/\u003c/code>，应用运行时不会依赖 D 盘路径。同步后重新构建并跑桌面测试；同步不包含用户节点或订阅凭据。\u003c/p>","group":"实施指南"},{"id":"guides/motion","title":"动效和性能","html":"\u003ch1>动效和性能\u003c/h1>\n\u003ch2>系统动效表\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">参数\u003c/th>\u003cth scope=\"col\">目的\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>按钮\u003c/td>\u003ctd>色变 120–160ms；按压 scale(.98) 100ms\u003c/td>\u003ctd>确认操作可触发\u003c/td>\u003c/tr>\u003ctr>\u003ctd>可点击卡片\u003c/td>\u003ctd>translateY(-1px) 200ms\u003c/td>\u003ctd>表达可导航；静态卡片不使用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>页面进入\u003c/td>\u003ctd>opacity 180ms\u003c/td>\u003ctd>保留上下文，不做大幅飞入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>对话框\u003c/td>\u003ctd>translateY(6px)+scale(.98)+opacity 200ms\u003c/td>\u003ctd>集中注意力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>开关\u003c/td>\u003ctd>滑块 translateX(18px) 200ms\u003c/td>\u003ctd>表达二元状态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>加载\u003c/td>\u003ctd>小范围 spinner\u003c/td>\u003ctd>表示任务进行中，不能伪装进度\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这些是产品约定，并不是声称所有动画都采用某一平台的原生物理算法。当前 Web 卡片采用有界缓动；原有 SwiftUI/Compose 弹簧参考保留。\u003c/p>\n\u003ch2>空间与效果\u003c/h2>\n\u003cp>位移和缩放属于空间反馈；颜色与透明度属于效果反馈。颜色不做带 overshoot 的弹簧。避免 transition:all；明确列出 transform、opacity 或必要颜色属性。\u003c/p>\n\u003ch2>渲染预算\u003c/h2>\n\u003cp>优先在 transform/opacity 上运动，避免动画修改 top/left/width/height/margin/padding。阴影通常带来绘制开销，不能声称它必然由合成器处理。大区域持续模糊和多层滤镜需要实际性能分析。\u003c/p>\n\u003cp>一屏可见 blur 区域最多 2 个，是该系统为普通桌面硬件设置的预算。静态检查只能检查规则，不知道多少类被同时使用；浏览器测试检查实际可见节点的 computed backdrop-filter。\u003c/p>\n\u003ch2>中断和重复操作\u003c/h2>\n\u003cp>用户快速重复切换时状态保持正确。CSS transition 可以从当前值反向过渡，网络任务则需要取消或串行协调。不得让过场动画阻止取消按钮和错误处理。\u003c/p>\n\u003ch2>减少动效\u003c/h2>\n\u003cp>减少动效时停止位移、缩放与连续旋转，保留文字“正在加载”。不把动效当作唯一加载信号。移除原来的 bounce Toast 和连接环持续呼吸动画，避免干扰长时间工作。\u003c/p>\n\u003ch2>测试与声明\u003c/h2>\n\u003cp>运行 \u003ccode>npm run lint:motion\u003c/code> 检查明确违例，并在实际页面检查 blur 数量。60fps 是体验目标，需要对应硬件分析才能宣称实测达标；本系统不因静态检查通过而声称所有设备都达到 60fps。\u003c/p>\n\u003ch2>桌面产品动效细化\u003c/h2>\n\u003cp>可选引入 \u003ccode>dist/web/motion.css\u003c/code> 与 \u003ccode>dist/web/motion.js\u003c/code>。Vanilla DOM 接口 \u003ccode>DSMotion.create()\u003c/code> 提供 \u003ccode>enter\u003c/code>（页面短淡入）、\u003ccode>update\u003c/code>（确认改变的数值短淡入）和 \u003ccode>cancel\u003c/code>；连续操作取消同一节点的旧动画，读取系统减少动效偏好。该模块不包含品牌配色或业务状态，已在 SSH Desk 的原生 Electron 弹窗、服务器卡片和实时监控页验证。具体接入见 \u003ca href=\"#patterns/live-telemetry\">实时监控工作区\u003c/a>。\u003c/p>\n\u003cp>参考 \u003ca href=\"https://fluent2.microsoft.design/motion\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft Fluent 2 Motion\u003c/a>：顶层导航采用短淡入，避免用大面积滑动暗示页面层级。AetherLink 使用 180ms opacity 动画，切换页面时取消旧动画；控件状态仍立即更新，不等待动画结束。\u003c/p>\n\u003cp>悬停位移控制在 1px；按钮按压缩小到 .98，连接按钮为 .96。连接状态用静态外环和文字表达，不使用循环呼吸。列表超过 20 条时不逐条延迟进场。减少动效模式下禁用这些动画，保留加载文字和状态播报。\u003c/p>\n\u003cp>动画参数属于产品约定；不能据此宣称实现了 Apple 原生弹簧或已测得所有设备 60fps。\u003c/p>","group":"实施指南"},{"id":"guides/platforms","title":"平台实现与验证边界","html":"\u003ch1>平台实现与验证边界\u003c/h1>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">平台\u003c/th>\u003cth scope=\"col\">当前资产\u003c/th>\u003cth scope=\"col\">验证方式\u003c/th>\u003cth scope=\"col\">交付声明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Web\u003c/td>\u003ctd>v3 theme.css、components.css、交互目录\u003c/td>\u003ctd>静态检查、浏览器交互和截图\u003c/td>\u003ctd>可运行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>React / Electron\u003c/td>\u003ctd>11 个 TSX 封装、AetherLink 集成\u003c/td>\u003ctd>TypeScript、构建、桌面冒烟\u003c/td>\u003ctd>当前 Windows 工程已验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SwiftUI / UIKit\u003c/td>\u003ctd>既有示例和 Swift tokens\u003c/td>\u003ctd>需要 Xcode 和真实平台测试\u003c/td>\u003ctd>参考实现，当前未编译验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Jetpack Compose / XML\u003c/td>\u003ctd>既有示例和 XML 资源\u003c/td>\u003ctd>需要 Android 工程与设备测试\u003c/td>\u003ctd>参考实现，当前未编译验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>JavaFX\u003c/td>\u003ctd>既有 theme.css 与 Java 常量\u003c/td>\u003ctd>需要 JavaFX 场景验证\u003c/td>\u003ctd>参考输出\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>不直接复制的行为\u003c/h2>\n\u003cp>Web 的 px 不等于 Android sp/dp，CSS 的 cubic-bezier 不等于 SwiftUI 的 spring，浏览器 dialog 不等于移动端 sheet。平台已有组件优先采用本平台语义和可访问行为，再映射色彩与间距角色。\u003c/p>\n\u003ch2>多平台构建\u003c/h2>\n\u003cp>\u003ccode>npm run build\u003c/code> 继续输出原来的跨平台文件，并增加 v3 Web 产物。增加 \u003ccode>tokens/web.json\u003c/code> 不意味着原生代码自动具备完整的 Web 组件行为；原生产品迁移应逐个映射语义角色并在对应平台测试。\u003c/p>\n\u003ch2>真实能力\u003c/h2>\n\u003cp>不要宣称已经在所有平台自动适配或测试达到 60fps。README 与版本记录应列出实际运行的环境、测试命令和仍需手动验证的部分。\u003c/p>","group":"实施指南"},{"id":"guides/quality","title":"验证与交付","html":"\u003ch1>验证与交付\u003c/h1>\n\u003ch2>自动验证\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"bash示例\">\u003ccode>npm run build\nnpm test\nnpm run lint:motion\u003c/code>\u003c/pre>\n\u003cp>构建生成跨平台 Token、Web 主题、React 源码副本、组件文档和离线目录。验证检查主题完整性、对比度、示例 ID 唯一性、文档链接和禁用动效规则。动效检查报告静态声明，运行时 blur 数量通过浏览器测试确认。\u003c/p>\n\u003ch2>浏览器验证\u003c/h2>\n\u003cp>分别检查浅色与深色、舒适与紧凑、宽窗口与窄视口。搜索能过滤组件，Ctrl/Command+K 进入搜索，复制动作有失败回退，标签页方向键可用，dialog 能 Escape 关闭并恢复焦点。\u003c/p>\n\u003ch2>应用验证\u003c/h2>\n\u003cp>AetherLink 用真实 Electron 加载打包后的 file 页面。测试页面导航、预加载 IPC、Base64 解析、HTTP 订阅地址导入、直连启停和 REST 通信。订阅下载测试覆盖重定向、HTTP 错误、超时、HTML、空内容及过大内容。\u003c/p>\n\u003ch2>手动验证\u003c/h2>\n\u003cp>屏幕阅读器、forced-colors、触摸、200% 字体、慢网速和真实远程节点连通性需要额外检查。普通测试不能替代安全审计、无障碍认证和性能分析。\u003c/p>\n\u003ch2>交付清单\u003c/h2>\n\u003cul>\u003cli>□ 代码、规范和实际组件命名一致。\u003c/li>\u003cli>□ 新主题变量从源 JSON 构建，业务没有另一套硬编码配色。\u003c/li>\u003cli>□ 真实功能可运行；未实现功能明确禁用或标明预览。\u003c/li>\u003cli>□ 用户真实订阅和凭据没有进入代码、文档与截图。\u003c/li>\u003cli>□ 提供可打开的入口和清楚的启动方式。\u003c/li>\u003cli>□ 记录实际通过的测试，列出未验证的平台。\u003c/li>\u003c/ul>","group":"实施指南"},{"id":"guides/react","title":"React 接入与组件 API","html":"\u003ch1>React 接入与组件 API\u003c/h1>\n\u003ch2>源码方式接入\u003c/h2>\n\u003cp>当前提供源码分发，未发布 npm 包。复制或同步 \u003ccode>dist/web/theme.css\u003c/code>、\u003ccode>dist/web/components.css\u003c/code>、\u003ccode>web/react.tsx\u003c/code> 到工程并保留版本清单。React 18/19 可使用；AetherLink 当前使用 React 19。\u003c/p>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>import { Button, Field, Switch, Panel } from &#39;./design-system/react&#39;;\nimport &#39;./design-system/theme.css&#39;;\nimport &#39;./design-system/components.css&#39;;\n\n&lt;Panel&gt;\n  &lt;Field label=&quot;订阅地址&quot; value={url} onChange={e =&gt; setUrl(e.target.value)}\n    error={error} hint=&quot;粘贴 HTTP/HTTPS 客户端订阅链接&quot; /&gt;\n  &lt;Button loading={importing} onClick={importSubscription}&gt;解析并添加&lt;/Button&gt;\n  &lt;Switch label=&quot;系统代理&quot; checked={enabled} onChange={toggle} /&gt;\n&lt;/Panel&gt;\u003c/code>\u003c/pre>\n\u003ch2>已实现封装\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">组件\u003c/th>\u003cth scope=\"col\">特有属性\u003c/th>\u003cth scope=\"col\">说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Button\u003c/td>\u003ctd>variant、loading\u003c/td>\u003ctd>支持原生 button 属性；loading 禁用重复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Field\u003c/td>\u003ctd>label、hint、error\u003c/td>\u003ctd>自动生成 id；保留原生输入属性\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Switch\u003c/td>\u003ctd>label\u003c/td>\u003ctd>原生 checkbox 与 role=switch；使用 checked/onChange\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Badge\u003c/td>\u003ctd>tone\u003c/td>\u003ctd>neutral/info/success/warning/danger\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Panel\u003c/td>\u003ctd>标准 HTMLElement 属性\u003c/td>\u003ctd>静态内容 section\u003c/td>\u003c/tr>\u003ctr>\u003ctd>StatCard\u003c/td>\u003ctd>label、value、note\u003c/td>\u003ctd>展示数值，不生成数值\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EmptyState\u003c/td>\u003ctd>title、description、action\u003c/td>\u003ctd>区分原因和下一步\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Alert\u003c/td>\u003ctd>tone\u003c/td>\u003ctd>info=status，danger=alert\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Progress\u003c/td>\u003ctd>value、label\u003c/td>\u003ctd>无 value 时不确定进度\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SegmentedControl\u003c/td>\u003ctd>label、value、options、onChange\u003c/td>\u003ctd>button group，不伪装为 tablist\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dialog\u003c/td>\u003ctd>open、onClose、title\u003c/td>\u003ctd>原生 showModal；外部控制状态\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>状态与业务分离\u003c/h2>\n\u003cp>组件不下载订阅、不保存节点、不读系统注册表。业务层完成这些行为，再通过 loading/error/value 反映结果。共享组件不能将服务凭据写到 DOM data 属性或调试日志。\u003c/p>\n\u003ch2>样式边界\u003c/h2>\n\u003cp>\u003ccode>.ds-*\u003c/code> 控制基础语义。业务 CSS 控制网格和业务布局，不覆盖底层控件的 aria 状态逻辑。Tailwind 集成应把颜色映射到 CSS 变量，而非为每个主题复制一套组件。\u003c/p>\n\u003ch2>验证\u003c/h2>\n\u003cp>AetherLink 构建包含同步后的 \u003ccode>react.tsx\u003c/code>，所有导出都接受 TypeScript 检查。桌面冒烟测试覆盖产品使用的输入框、按钮、开关、主题和导航；完整屏幕阅读器验证仍需手动进行。\u003c/p>","group":"实施指南"},{"id":"guides/review","title":"设计评审清单","html":"\u003ch1>设计评审清单\u003c/h1>\n\u003ch2>任务和信息\u003c/h2>\n\u003cul>\u003cli>用户进入页面后是否知道能做什么？\u003c/li>\u003cli>每个区域是否只有一个清晰的主动作？\u003c/li>\u003cli>标题、说明和数据是否与真实业务状态一致？\u003c/li>\u003cli>是否把未实现功能标为已启用？\u003c/li>\u003c/ul>\n\u003ch2>视觉\u003c/h2>\n\u003cul>\u003cli>内容层是否实底，导航层是否最多两处可见模糊？\u003c/li>\u003cli>颜色是否引用语义变量，暗色状态是否单独检查？\u003c/li>\u003cli>主次文字、间距和分组能否在灰度下成立？\u003c/li>\u003cli>是否删除无意义的持续呼吸、闪烁和 bounce？\u003c/li>\u003c/ul>\n\u003ch2>行为\u003c/h2>\n\u003cul>\u003cli>待处理状态是否防止重复提交？\u003c/li>\u003cli>失败是否保留输入并提供可执行恢复？\u003c/li>\u003cli>快速切换、页面离开、内核退出是否正确清理？\u003c/li>\u003cli>空状态是否区分首次使用和筛选无结果？\u003c/li>\u003c/ul>\n\u003ch2>无障碍\u003c/h2>\n\u003cul>\u003cli>所有主要任务能否只用键盘完成？\u003c/li>\u003cli>label、名称、aria 状态和焦点顺序是否正确？\u003c/li>\u003cli>缩放、高对比、减少动效下是否仍可操作？\u003c/li>\u003cli>是否只靠颜色、图标或动效传达信息？\u003c/li>\u003c/ul>\n\u003ch2>交付\u003c/h2>\n\u003cul>\u003cli>文档有没有准确列出实现与未实现范围？\u003c/li>\u003cli>测试是否验证行为，而不只重复实现细节？\u003c/li>\u003cli>截图和日志有没有用户凭据？\u003c/li>\u003cli>可打开入口和构建命令是否实际运行过？\u003c/li>\u003c/ul>","group":"实施指南"},{"id":"guides/sources","title":"官方来源与系统选择","html":"\u003ch1>官方来源与系统选择\u003c/h1>\n\u003cp>核对日期：2026-10-12。以下链接是设计依据；本系统对尺寸、颜色、密度和动画时长的选择并不等于官方要求。\u003c/p>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">来源\u003c/th>\u003cth scope=\"col\">用于理解\u003c/th>\u003cth scope=\"col\">本系统的解释\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"https://developer.apple.com/design/human-interface-guidelines/materials\" target=\"_blank\" rel=\"noopener noreferrer\">Apple HIG Materials\u003c/a>\u003c/td>\u003ctd>材料区分导航和内容、可读性\u003c/td>\u003ctd>在 Web 中使用有限的 chrome blur，不复制所有 Liquid Glass 效果\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"https://m3.material.io/foundations/\" target=\"_blank\" rel=\"noopener noreferrer\">Material Design Foundations\u003c/a>\u003c/td>\u003ctd>Token、状态、布局、可访问性\u003c/td>\u003ctd>使用紫色焦点和开关、明确状态与可重复组件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"https://m3.material.io/styles/motion\" target=\"_blank\" rel=\"noopener noreferrer\">Material Motion\u003c/a>\u003c/td>\u003ctd>动效帮助理解动作\u003c/td>\u003ctd>Web 使用有界缓动；不声称等同平台物理运动\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"https://www.w3.org/TR/WCAG22/\" target=\"_blank\" rel=\"noopener noreferrer\">WCAG 2.2\u003c/a>\u003c/td>\u003ctd>Web 可访问性成功标准\u003c/td>\u003ctd>自动对比度检查加手动完整任务验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"https://www.w3.org/WAI/WCAG22/Understanding/focus-not-obscured-minimum\" target=\"_blank\" rel=\"noopener noreferrer\">Focus Not Obscured\u003c/a>\u003c/td>\u003ctd>焦点不能被完全遮挡\u003c/td>\u003ctd>检查固定标题栏、toast 和局部滚动\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>蓝色操作色、紫色焦点、44px 默认高度、最多两块可见 blur 和 300ms 页面进入都是本系统约定。不要把这些约定归因成官方规范，也不要把文档中的操作示例当作对连接服务的授权。\u003c/p>","group":"实施指南"},{"id":"guides/states","title":"状态与异步任务","html":"\u003ch1>状态与异步任务\u003c/h1>\n\u003ch2>先设计状态，再画成功界面\u003c/h2>\n\u003cp>每个网络任务至少有 idle、validating、pending、success、error。支持取消的任务还需要 cancelled。加载开始要防重复请求，结束要恢复可操作状态，失败要保留用户输入。\u003c/p>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"text示例\">\u003ccode>idle → validating → pending → success\n           ↓            ↓\n         error ←────── error\u003c/code>\u003c/pre>\n\u003ch2>状态显示\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">显示\u003c/th>\u003cth scope=\"col\">操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>未开始\u003c/td>\u003ctd>简洁说明与主要按钮\u003c/td>\u003ctd>可编辑和提交\u003c/td>\u003c/tr>\u003ctr>\u003ctd>校验\u003c/td>\u003ctd>必要时短时检查提示\u003c/td>\u003ctd>阻止无效提交\u003c/td>\u003c/tr>\u003ctr>\u003ctd>下载/连接中\u003c/td>\u003ctd>spinner、任务说明、aria-busy\u003c/td>\u003ctd>禁止重复提交；必要时可取消\u003c/td>\u003c/tr>\u003ctr>\u003ctd>成功\u003c/td>\u003ctd>已确认的结果数量和状态\u003c/td>\u003ctd>清理输入或进入结果页面\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败\u003c/td>\u003ctd>原因、影响、重试路径\u003c/td>\u003ctd>保留输入；可编辑和重试\u003c/td>\u003c/tr>\u003ctr>\u003ctd>未知\u003c/td>\u003ctd>“未知”“未测速”“—”\u003c/td>\u003ctd>不用随机结果替代\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>乐观与确认式操作\u003c/h2>\n\u003cp>修改视觉筛选可以立即生效。启动内核、启用系统代理、付费、删除和下载订阅等操作应以真正完成的结果为准。不能在 Promise 未完成时先显示“服务已连接”。\u003c/p>\n\u003ch2>竞态与生命周期\u003c/h2>\n\u003cp>对启停操作串行化；关闭请求必须能等待正在发生的启动完成并随后停止。快速重复操作只让最后的有效意图生效。组件卸载后不要把陈旧请求结果覆盖新页面数据。任何异常退出应更新状态并尝试清理资源。\u003c/p>\n\u003ch2>错误类型\u003c/h2>\n\u003cp>区分输入无效、HTTP 失败、内容为空、内容是 HTML、格式不支持、超时、端口冲突和权限失败。面向用户说明可执行的下一步；完整网络异常可能携带 URL/token，不应直接显示或写日志。\u003c/p>\n\u003ch2>空状态\u003c/h2>\n\u003cp>首次使用引导添加数据；无搜索结果提供清除筛选；删除后空列表不重新生成演示记录；请求失败不被解释为“没有记录”。未知数量不显示 0，除非已确认确实为空。\u003c/p>","group":"实施指南"},{"id":"guides/themes","title":"主题、密度与设计变量","html":"\u003ch1>主题、密度与设计变量\u003c/h1>\n\u003ch2>引入顺序\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"css示例\">\u003ccode>@import &#39;./dist/web/theme.css&#39;;\n@import &#39;./dist/web/components.css&#39;;\u003c/code>\u003c/pre>\n\u003cp>在根元素设置 \u003ccode>data-theme=&quot;light&quot;\u003c/code> 或 \u003ccode>data-theme=&quot;dark&quot;\u003c/code>。默认浅色，应用可以读取系统偏好并保存用户选择。不要用 filter:invert 实现深色。\u003c/p>\n\u003ch2>Token 层级\u003c/h2>\n\u003col>\u003cli>既有 \u003ccode>tokens/color.json\u003c/code> 等保留 v2 原生基础值。\u003c/li>\u003cli>\u003ccode>tokens/web.json\u003c/code> 定义 v3 Web 的 light/dark 角色和共享尺度。\u003c/li>\u003cli>\u003ccode>dist/web/theme.css\u003c/code> 生成 \u003ccode>--ds-*\u003c/code> 变量。\u003c/li>\u003cli>CSS/React 组件引用变量；业务组件不重复拷贝主题值。\u003c/li>\u003c/ol>\n\u003cp>变更源 JSON 后执行构建，产物不要手工修改。使用版本控制核对产物差异。暗色主题的 muted、border 和状态字色均独立设定，以避免把浅色灰简单反相。\u003c/p>\n\u003ch2>三种密度\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">模式\u003c/th>\u003cth scope=\"col\">控件最小高度\u003c/th>\u003cth scope=\"col\">数据表行间距\u003c/th>\u003cth scope=\"col\">使用场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>compact\u003c/td>\u003ctd>36px\u003c/td>\u003ctd>9px 12px 单元格内边距\u003c/td>\u003ctd>精细指针和密集数据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>comfortable\u003c/td>\u003ctd>44px\u003c/td>\u003ctd>14px 16px\u003c/td>\u003ctd>默认桌面工作区\u003c/td>\u003c/tr>\u003ctr>\u003ctd>touch\u003c/td>\u003ctd>48px\u003c/td>\u003ctd>不压缩\u003c/td>\u003ctd>触摸和混合输入\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>data-density\u003c/code> 控制组件尺寸。36px 是桌面系统约定，不是普遍的无障碍认证；如果命中区域或周边间距不足，需要进一步扩大。不要缩小正文字号来获得更高密度。\u003c/p>\n\u003ch2>主题测试\u003c/h2>\n\u003cp>检查正文 ink/surface、muted/surface、on-action/action 和每个状态字色/状态背景。普通文本目标至少 4.5:1。本系统 \u003ccode>npm test\u003c/code> 验证这些确定的不透明色对；玻璃覆盖背景的实际对比度仍需视觉和工具测试。\u003c/p>\n\u003cp>输入边界引用 \u003ccode>control-line\u003c/code>，细分隔线引用 \u003ccode>line\u003c/code>；不能用低对比的装饰分隔线代替必要的控件轮廓。透明 chrome 的可读性不只依赖 alpha 值，也依赖实际背景。\u003c/p>","group":"实施指南"},{"id":"guides/token-reference","title":"Web 语义 Token 参考","html":"\u003ch1>Web 语义 Token 参考\u003c/h1>\n\u003cp>源文件：\u003ccode>tokens/web.json\u003c/code>。运行 \u003ccode>npm run build\u003c/code> 更新产物。\u003c/p>\n\u003ch2>颜色角色\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">CSS 变量\u003c/th>\u003cth scope=\"col\">浅色\u003c/th>\u003cth scope=\"col\">深色\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>--ds-canvas\u003c/code>\u003c/td>\u003ctd>#F6F7F9\u003c/td>\u003ctd>#121418\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-surface\u003c/code>\u003c/td>\u003ctd>#FFFFFF\u003c/td>\u003ctd>#1C1F25\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-inset\u003c/code>\u003c/td>\u003ctd>#F0F2F5\u003c/td>\u003ctd>#262A32\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-chrome\u003c/code>\u003c/td>\u003ctd>rgba(247,248,251,0.86)\u003c/td>\u003ctd>rgba(26,28,34,0.90)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-ink\u003c/code>\u003c/td>\u003ctd>#20232B\u003c/td>\u003ctd>#F3F4F8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-muted\u003c/code>\u003c/td>\u003ctd>#596170\u003c/td>\u003ctd>#B1B7C5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-line\u003c/code>\u003c/td>\u003ctd>#E1E4EA\u003c/td>\u003ctd>#343944\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-control-line\u003c/code>\u003c/td>\u003ctd>#788293\u003c/td>\u003ctd>#8B95A9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-accent\u003c/code>\u003c/td>\u003ctd>#1D4ED8\u003c/td>\u003ctd>#9ABBFF\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-accent-soft\u003c/code>\u003c/td>\u003ctd>#E8EFFF\u003c/td>\u003ctd>#233457\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-action\u003c/code>\u003c/td>\u003ctd>#2563EB\u003c/td>\u003ctd>#9ABBFF\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-on-action\u003c/code>\u003c/td>\u003ctd>#FFFFFF\u003c/td>\u003ctd>#10213D\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-action-hover\u003c/code>\u003c/td>\u003ctd>#1D4ED8\u003c/td>\u003ctd>#B3CAFF\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-secondary\u003c/code>\u003c/td>\u003ctd>#1D4ED8\u003c/td>\u003ctd>#9ABBFF\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-secondary-soft\u003c/code>\u003c/td>\u003ctd>#E8EFFF\u003c/td>\u003ctd>#233457\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-success\u003c/code>\u003c/td>\u003ctd>#08734F\u003c/td>\u003ctd>#75D9B0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-success-soft\u003c/code>\u003c/td>\u003ctd>#E4F5ED\u003c/td>\u003ctd>#153A2D\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-warning\u003c/code>\u003c/td>\u003ctd>#92400E\u003c/td>\u003ctd>#FFD18D\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-warning-soft\u003c/code>\u003c/td>\u003ctd>#FFF2D5\u003c/td>\u003ctd>#44321A\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-danger\u003c/code>\u003c/td>\u003ctd>#B42332\u003c/td>\u003ctd>#FFADB8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-danger-soft\u003c/code>\u003c/td>\u003ctd>#FDE9ED\u003c/td>\u003ctd>#47232D\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-focus\u003c/code>\u003c/td>\u003ctd>#1D4ED8\u003c/td>\u003ctd>#9ABBFF\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-overlay\u003c/code>\u003c/td>\u003ctd>rgba(20,24,35,0.42)\u003c/td>\u003ctd>rgba(0,0,0,0.65)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-shadow\u003c/code>\u003c/td>\u003ctd>0 4px 18px rgba(22,29,45,0.05)\u003c/td>\u003ctd>0 4px 18px rgba(0,0,0,0.18)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>尺寸、字体、动效和层级\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">CSS 变量\u003c/th>\u003cth scope=\"col\">值\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>--ds-space-1\u003c/code>\u003c/td>\u003ctd>4px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-space-2\u003c/code>\u003c/td>\u003ctd>8px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-space-3\u003c/code>\u003c/td>\u003ctd>12px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-space-4\u003c/code>\u003c/td>\u003ctd>16px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-space-5\u003c/code>\u003c/td>\u003ctd>20px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-space-6\u003c/code>\u003c/td>\u003ctd>24px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-space-8\u003c/code>\u003c/td>\u003ctd>32px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-space-10\u003c/code>\u003c/td>\u003ctd>40px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-space-12\u003c/code>\u003c/td>\u003ctd>48px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-radius-small\u003c/code>\u003c/td>\u003ctd>8px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-radius-control\u003c/code>\u003c/td>\u003ctd>10px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-radius-panel\u003c/code>\u003c/td>\u003ctd>16px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-radius-modal\u003c/code>\u003c/td>\u003ctd>20px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-radius-pill\u003c/code>\u003c/td>\u003ctd>999px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-size-control\u003c/code>\u003c/td>\u003ctd>44px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-size-control-compact\u003c/code>\u003c/td>\u003ctd>36px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-size-control-touch\u003c/code>\u003c/td>\u003ctd>48px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-size-sidebar\u003c/code>\u003c/td>\u003ctd>212px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-size-titlebar\u003c/code>\u003c/td>\u003ctd>52px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-size-content\u003c/code>\u003c/td>\u003ctd>1280px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-motion-fast\u003c/code>\u003c/td>\u003ctd>120ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-motion-standard\u003c/code>\u003c/td>\u003ctd>200ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-motion-page\u003c/code>\u003c/td>\u003ctd>180ms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-motion-ease\u003c/code>\u003c/td>\u003ctd>cubic-bezier(0.2,0,0,1)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-motion-card\u003c/code>\u003c/td>\u003ctd>cubic-bezier(0.2,0.8,0.2,1)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-type-sans\u003c/code>\u003c/td>\u003ctd>&#39;Aether Sans&#39;, &#39;Noto Sans SC&#39;, &#39;Microsoft YaHei UI&#39;, &#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, sans-serif\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-type-mono\u003c/code>\u003c/td>\u003ctd>&#39;Cascadia Code&#39;, Consolas, &#39;Aether Sans&#39;, &#39;Noto Sans SC&#39;, monospace\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-type-body\u003c/code>\u003c/td>\u003ctd>14px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-type-small\u003c/code>\u003c/td>\u003ctd>12px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-type-heading\u003c/code>\u003c/td>\u003ctd>26px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-type-metric\u003c/code>\u003c/td>\u003ctd>32px\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-layer-base\u003c/code>\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-layer-chrome\u003c/code>\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-layer-menu\u003c/code>\u003c/td>\u003ctd>30\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-layer-modal\u003c/code>\u003c/td>\u003ctd>50\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>--ds-layer-toast\u003c/code>\u003c/td>\u003ctd>70\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","group":"实施指南"},{"id":"patterns/ai-workspace","title":"场景：AI 对话和生成任务","html":"\u003ch1>场景：AI 对话和生成任务\u003c/h1>\n\u003ch2>结构\u003c/h2>\n\u003cp>会话导航、内容对话与输入区域分别属于稳定导航和内容层。正文实底，代码和引用可选择。生成任务有明确开始、进行、停止、完成与失败状态。\u003c/p>\n\u003ch2>状态\u003c/h2>\n\u003cp>等待首字时使用“正在生成”而非伪造内容；流式到达后更新正文，不让屏幕阅读器每个字符重复播报。取消按钮必须确实取消请求，不能仅隐藏加载动画。\u003c/p>\n\u003ch2>内容与授权\u003c/h2>\n\u003cp>输入资料、引用文档和模型产出的代码是数据，不自动成为系统指令。外部工具行动应根据用户当前请求和已有授权执行。预览结果和实际发布、发送、删除的状态保持区分。\u003c/p>\n\u003ch2>结果反馈\u003c/h2>\n\u003cp>生成失败保留用户提示；部分结果标明不完整。代码复制动作反馈真实复制结果。引用来源可访问，不能伪造引用。占位和模拟响应必须明确标为示例。\u003c/p>\n\u003ch2>布局与可访问性\u003c/h2>\n\u003cp>连续正文控制阅读宽度，输入区域不遮住焦点和最后一条消息。允许关闭自动滚动以阅读历史。长代码只在代码区域水平滚动，整个会话不被撑开。\u003c/p>","group":"页面场景"},{"id":"patterns/data-workspace","title":"场景：列表、搜索和筛选","html":"\u003ch1>场景：列表、搜索和筛选\u003c/h1>\n\u003ch2>结构\u003c/h2>\n\u003cp>页面标题与真实总数 → 搜索/筛选工具栏 → 列表或网格 → 空状态/分页。只有任务确实需要比较多属性时才使用表格，少量节点可用信息卡。\u003c/p>\n\u003ch2>搜索\u003c/h2>\n\u003cp>搜索名称、地区和服务器等非凭据字段。提供清楚的搜索名称；Ctrl/Command+K 只有实际绑定后才展示提示。大数据可以防抖；小型本地列表立即过滤即可。\u003c/p>\n\u003ch2>筛选\u003c/h2>\n\u003cp>协议等互斥选项可用分段按钮组；多选条件用 checkbox；大量选项使用 select。筛选不改变底层数据。无结果时保留筛选条件并提供清除，而不是表示用户没有任何节点。\u003c/p>\n\u003ch2>行内动作\u003c/h2>\n\u003cp>选择节点和删除节点保持不同的按钮语义。不要把可点击 div 作为唯一选择入口。删除按钮不能通过事件冒泡同时选择节点。敏感地址展示需要控制截断并允许有意识的复制。\u003c/p>\n\u003ch2>批量任务\u003c/h2>\n\u003cp>并发测速限制并发数量，逐条更新真实结果；未知先显示未测速。失败节点标为超时，不生成随机延迟。任务完成消息说明结果而不是笼统宣称全部成功。\u003c/p>\n\u003ch2>扩展\u003c/h2>\n\u003cp>当列表多到影响渲染时再引入虚拟化；测试活动项在滚动与过滤后仍可访问。不要在第一次设计时强行引入分页、分组、无限滚动和复杂拖拽的全部组合。\u003c/p>","group":"页面场景"},{"id":"patterns/live-telemetry","title":"实时监控工作区","html":"\u003ch1>实时监控工作区\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回手册\u003c/a> · 已在 SSH Desk Electron 桌面工程集成\u003c/p>\n\u003ch2>页面层级\u003c/h2>\n\u003cp>连接选择与采样状态置顶；CPU、内存、磁盘、网络是概况；每张 GPU 独立卡片展示利用率、显存、温度、功耗和使用账号；进程表补充 PID、进程名、运行时间和图形／计算类型。低频查看的 UUID、驱动、PCIe、时钟等放在折叠详情中。\u003c/p>\n\u003cp>内容卡片保持实底。GPU 卡片用于读数，不做悬停漂浮；可导航的服务器卡片可采用 1px 位移反馈。\u003c/p>\n\u003ch2>数据语义\u003c/h2>\n\u003cul>\u003cli>缺失、N/A、权限不足与已确认零值分开处理，未知不是空闲。\u003c/li>\u003cli>利用率采样、显存分配与进程列表回答不同问题，不能互相代替。\u003c/li>\u003cli>CPU／网络通过两次计数器差值计算；处理计数器重置、时间间隔过长和网卡切换。\u003c/li>\u003cli>用户名代表操作系统账号，同一账号的多位使用者无法进一步区分。\u003c/li>\u003cli>“驱动支持 CUDA”不等于已安装 CUDA Toolkit。不要从某一版本字段推导环境已就绪。\u003c/li>\u003cli>短趋势只反映已采样数据；不要填充随机历史或把暂停间隔画成连续测量。\u003c/li>\u003c/ul>\n\u003ch2>采样生命周期\u003c/h2>\n\u003cp>请求串行，每次完成后才安排下一次采样。页面离开、窗口隐藏、暂停后停止定时请求。服务器切换生成新的请求序号；旧回复不能覆盖当前页面。出错保留上次结果，显示更新时间和错误，并提供重试。不得用整页 aria-live 每三秒反复播报所有读数。\u003c/p>\n\u003cp>统计更新保留滚动位置、展开面板、筛选条件和控件焦点。监控任务只查询，不隐式启动训练、安装软件或终止进程。\u003c/p>\n\u003ch2>动效接入\u003c/h2>\n\u003cp>构建后复制 \u003ca href=\"web/motion.css\">motion.css\u003c/a> 和 \u003ca href=\"web/motion.js\">motion.js\u003c/a>，在产品样式后加载 CSS。它们不强制主题和配色。\u003c/p>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;link rel=&quot;stylesheet&quot; href=&quot;design-system/motion.css&quot;&gt;\n&lt;script src=&quot;design-system/motion.js&quot;&gt;&lt;/script&gt;\u003c/code>\u003c/pre>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"js示例\">\u003ccode>const motion = DSMotion.create();\n// 只在实际导航时调用，采样刷新不重新播放整页动画。\nmotion.enter(currentSection);\n// 只在读数已确认改变时淡入新值，不虚构中间读数。\nmotion.update(changedValueElement);\u003c/code>\u003c/pre>\n\u003cp>使用 ds-motion-button、ds-motion-hover、ds-motion-dialog 提供按压、可导航卡片、原生对话框反馈。空间和透明度分离；快速操作取消旧动画；减少动效立即生效。效果层不包含循环呼吸，也不承诺未经硬件测量的 60fps。\u003c/p>\n\u003ch2>标识资源\u003c/h2>\n\u003cp>应用标识优先保留 SVG 原件，再导出 PNG 和包含 16／32／48／64／128／256px 的 Windows ICO。小尺寸确认轮廓和对比度；业务图标沿用统一笔画。品牌标识可以有独立配色，不把品牌色写入通用组件。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>两张卡及不同账号进程能对应正确，图形服务不会误报为训练任务。\u003c/li>\u003cli>首次采样不会伪造 CPU／网络速率；断线不会显示“没有任务”。\u003c/li>\u003cli>连续切换、暂停／继续、隐藏窗口与返回页面不会积累定时器或覆盖状态。\u003c/li>\u003cli>键盘可操作全部控件；原生弹窗保留焦点行为。\u003c/li>\u003cli>减少动效下无位移、缩放或连续旋转；实时读数不闪烁。\u003c/li>\u003cli>真实环境与演示截图区分，演示值不流入正式状态。\u003c/li>\u003c/ul>\n\u003ch2>AI 用量与费用监控\u003c/h2>\n\u003cp>问题：本地会话日志可能反复输出同一累积计数；同一流式消息可能有多个内容块。直接逐行累加会放大用量。另一个常见误导是将 API 单价折算金额当成订阅扣费，或者将未接入数据源的应用显示为零消耗。\u003c/p>\n\u003cp>决策与适用条件：\u003c/p>\n\u003cul>\u003cli>累积计数按差值记录，重复检查点不新增用量；计数器重置时需要独立处理。消息级日志按会话与消息标识合并重复快照。日志条目数应标为“用量记录”，未经 HTTP 证据不能称为精确请求数。\u003c/li>\u003cli>分开记录应用、供应商、原始模型名。应用使用第三方模型时，不能根据应用名称套用原厂模型价格；当前配置也不能证明历史日志的供应商。模型别名和缓存计费字段需要验证。\u003c/li>\u003cli>“实际账单”“按单价估算”“手动记录的订阅月费”分别展示。未配置单价显示未知，部分定价必须显示覆盖条数；缓存读取和写入不能无条件采用同一单价。\u003c/li>\u003cli>检测到应用目录，只能证明存在本地数据目录，不能证明已接入 Token 或账单。数据源卡片应显示已采集、等待有效记录、读取失败、暂不可获取等状态。\u003c/li>\u003cli>额度窗口显示最近快照时间，过了重置时间标记过期，不能将旧百分比作为实时剩余额度。\u003c/li>\u003cli>固定时间范围的热力图若不跟随明细日期筛选，要在图旁明确说明。无日志格表示无记录，不能推断当天完全没有使用。\u003c/li>\u003cli>隐藏窗口停止周期刷新，但首次读取仍可完成，避免后台启动后一直停留在“准备读取”。保留筛选、搜索和分页状态，逐次刷新不覆盖用户正在编辑的定价表单。\u003c/li>\u003c/ul>\n\u003cp>验证：在本地 Electron 用量监控迭代中，9 项自动测试覆盖累积计数重复与重置、流式消息合并、未知定价、设置校验、时区、文件追加／删除／未完整行及重定向配置目录的保存兼容性；打包后的桌面窗口验证真实日志渲染、应用筛选、设置弹窗、设置保存／重读与无整页横向溢出。\u003c/p>\n\u003cp>未验证边界：不同版本第三方接口的缓存字段、其他设备的日志、真实账单对账，以及未接入的封闭客户端用量。以上统计语义属于通用原则；具体应用列表、配色和刷新间隔属于单产品选择，不作为设计系统默认值。\u003c/p
