· \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/matrix-hex-dump-stream","title":"IDA Pro & Ghidra 十六进制字节流检查器","html":"\u003ch1>IDA Pro &amp; Ghidra 十六进制字节流检查器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>IDA Pro、Ghidra 与 Wireshark 风格的二进制内存与数据包十六进制字节流查看器；包含内存基址列、16字节十六进制双字分组、高亮选定字节与 ASCII 文本解码对照列。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>等宽字节流容器 (.ds-hexdump-stream)\u003c/li>\u003cli>单行字节流记录 (.ds-hexdump-stream__row)\u003c/li>\u003cli>8位十六进制内存偏移列 (.ds-hexdump-stream__offset)\u003c/li>\u003cli>8+8 字节十六进制块 (.ds-hexdump-stream__byte-group)\u003c/li>\u003cli>单字节悬停高亮块 (.ds-hexdump-stream__byte)\u003c/li>\u003cli>右侧 ASCII 字符映射列 (.ds-hexdump-stream__ascii)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>方向键在字节矩阵间定位选区；PageUp/PageDown 翻页查看；Ctrl+C 复制选定字节 Hex 文本。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>严格采用等宽字体（--ds-type-mono），确保十六进制列与 ASCII 列在任意分辨率下垂直对齐绝对无偏差。\u003c/li>\u003cli>支持单字节悬浮与选中高亮（.is-highlight），鼠标移动时反馈即时。\u003c/li>\u003cli>适合底层协议分析、逆向工程、网络抓包检视与嵌入式设备固件调试。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-hexdump-stream&quot; role=&quot;region&quot; aria-label=&quot;十六进制字节流检查器&quot;&gt;&lt;div class=&quot;ds-hexdump-stream__row&quot;&gt;&lt;span class=&quot;ds-hexdump-stream__offset&quot;&gt;00401000&lt;/span&gt;&lt;div class=&quot;ds-hexdump-stream__bytes&quot;&gt;&lt;div class=&quot;ds-hexdump-stream__byte-group&quot;&gt;&lt;span class=&quot;ds-hexdump-stream__byte is-highlight&quot;&gt;48&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;89&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;5C&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;24&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;08&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;48&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;89&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;6C&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-hexdump-stream__byte-group&quot;&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;24&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;48&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;89&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;74&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;24&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;18&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;57&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;ds-hexdump-stream__ascii&quot;&gt;H.[$.H.l$.H.t$.W&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-hexdump-stream__row&quot;&gt;&lt;span class=&quot;ds-hexdump-stream__offset&quot;&gt;00401010&lt;/span&gt;&lt;div class=&quot;ds-hexdump-stream__bytes&quot;&gt;&lt;div class=&quot;ds-hexdump-stream__byte-group&quot;&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;48&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;83&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;EC&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;20&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;48&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;8B&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;D9&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;E8&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-hexdump-stream__byte-group&quot;&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;A2&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;FE&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;FF&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;FF&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;48&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;8B&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;C8&lt;/span&gt;&lt;span class=&quot;ds-hexdump-stream__byte&quot;&gt;B8&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;ds-hexdump-stream__ascii&quot;&gt;H.. H...H...H...&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;HexdumpByteStream highlightByteIndex={0} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 字节与 ASCII 严格垂直对齐\u003c/li>\u003cli>□ 高亮字节颜色突出醒目\u003c/li>\u003cli>□ 容器横向滚动条按需出现\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/matrix-led-scoreboard","title":"点阵式复古体育馆与航班 LED 记分牌","html":"\u003ch1>点阵式复古体育馆与航班 LED 记分牌\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>复古体育馆比分牌与国际机场航显点阵屏（Dot-Matrix LED Display）；黑化外壳、双队/双向状态、等宽超大琥珀色点阵发光大数字及实时 LIVE 状态指示器。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>黑化点阵屏机壳 (.ds-led-scoreboard)\u003c/li>\u003cli>顶栏周期与现场指示行 (.ds-led-scoreboard__head)\u003c/li>\u003cli>双队比分三列栅格网格 (.ds-led-scoreboard__teams)\u003c/li>\u003cli>超大琥珀色点阵荧光数字 (.ds-led-scoreboard__score)\u003c/li>\u003cli>中置半透明发光冒号 (.ds-led-scoreboard__colon)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为数据看板呈现，支持 Tab 快速遍历或通过屏幕阅读器直接读取赛事状态。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>外层声明 role=&quot;region&quot; 与 aria-label，比分更新时利用等宽数字杜绝排版重排抖动。\u003c/li>\u003cli>对比度高达 10:1 以上，发光文字阴影柔和自然。\u003c/li>\u003cli>适合实时体育赛事比分直播、金融交易所撮合数字牌、工业生产节拍看板及复古游戏大厅。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-led-scoreboard&quot; role=&quot;region&quot; aria-label=&quot;实时比分记分牌：主队 98 对 客队 95&quot;&gt;&lt;div class=&quot;ds-led-scoreboard__head&quot;&gt;&lt;span&gt;PERIOD Q4&lt;/span&gt;&lt;span style=&quot;color:#00ff66&quot;&gt;● LIVE 02:14&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-led-scoreboard__teams&quot;&gt;&lt;div class=&quot;ds-led-scoreboard__side&quot;&gt;&lt;span class=&quot;ds-led-scoreboard__name&quot;&gt;HOME&lt;/span&gt;&lt;span class=&quot;ds-led-scoreboard__score&quot;&gt;98&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-led-scoreboard__colon&quot;&gt;:&lt;/span&gt;&lt;div class=&quot;ds-led-scoreboard__side&quot;&gt;&lt;span class=&quot;ds-led-scoreboard__name&quot;&gt;AWAY&lt;/span&gt;&lt;span class=&quot;ds-led-scoreboard__score&quot;&gt;95&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;RetroLedScoreboardDisplay homeTeam=&quot;HOME&quot; homeScore={98} awayTeam=&quot;AWAY&quot; awayScore={95} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 点阵数字荧光柔和不糊\u003c/li>\u003cli>□ 主客队比分对称平衡\u003c/li>\u003cli>□ 冒号间距舒适无偏斜\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/matrix-ticker-badge","title":"实时行情涨跌数字指示微标","html":"\u003ch1>实时行情涨跌数字指示微标\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>纳斯达克与顶级加密货币交易所风格的实时跳动资产行情胶囊；支持代码简称、等宽实时现价、涨跌三角箭头指示器以及涨跌变化瞬间的背景色瞬时闪烁反馈。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>资产代码徽标 (如 BTC / USD)\u003c/li>\u003cli>等宽排版大字号现价读数\u003c/li>\u003cli>绿色上涨 ▲ / 红色下跌 ▼ 趋势指示符\u003c/li>\u003cli>语义状态软底色 (.is-up / .is-down)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为动态数据行提供 role=&quot;status&quot; 与完整更新说明，屏幕阅读器按需播报。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>数字严格采用 tabular-nums 等宽字体，价格在万分之一秒级跳变时绝不发生任何抖动。\u003c/li>\u003cli>上涨采用 success 绿色与向上三角，下跌采用 danger 红色与向下三角，国际金融惯例统一。\u003c/li>\u003cli>悬停微边框高亮，支持点击快速弹出历史 K 线深度图。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-ticker-badge is-up&quot; role=&quot;status&quot; aria-label=&quot;BTC/USD 报价 $98,420.50 上涨 3.42%&quot;&gt;&lt;span class=&quot;ds-ticker-badge__symbol&quot;&gt;BTC / USD&lt;/span&gt;&lt;span class=&quot;ds-ticker-badge__price&quot;&gt;$98,420.50&lt;/span&gt;&lt;span class=&quot;ds-ticker-badge__delta ds-ticker-badge__delta--up&quot;&gt;▲ +3.42%&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;RealtimePriceTicker symbol=&quot;BTC / USD&quot; price=&quot;$98,420.50&quot; delta=&quot;+3.42%&quot; isUp={true} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 等宽数字排版稳定无位移抖动\u003c/li>\u003cli>□ 红绿配色在深浅模式下对比均达标\u003c/li>\u003cli>□ 屏幕阅读器无障碍读出完整行情\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/mention-pill","title":"用户与实体提及胶囊","html":"\u003ch1>用户与实体提及胶囊\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub、Notion 与 Slack 风格的行内人员/实体提及药丸；用于在文本、工单或会话中引用对象。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>前置微型圆形头像\u003c/li>\u003cli>前缀符号 (@ 或 #)\u003c/li>\u003cli>实体/人员名称\u003c/li>\u003cli>主题强调色微背景\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 可聚焦至提及药丸；Enter 打开人员名片或实体引用详情。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>药丸圆润修长，行高与正文完全一致，行内嵌入不撑高段落。\u003c/li>\u003cli>鼠标悬停时轻微放大（scale(1.04)）并点亮主题强调色边框。\u003c/li>\u003cli>支持图片头像或首字母缩略头像自适应降级。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;span style=&quot;font-size:13px;color:var(--ds-ink);line-height:1.6&quot;&gt;该节点已由 &lt;a class=&quot;ds-mention&quot; href=&quot;#&quot; data-toast=&quot;查看人员名片&quot;&gt;&lt;span class=&quot;ds-mention__avatar&quot;&gt;T&lt;/span&gt;&lt;span class=&quot;ds-mention__prefix&quot;&gt;@&lt;/span&gt;&lt;span&gt;trevv&lt;/span&gt;&lt;/a&gt; 完成多径拥塞控制优化。&lt;/span&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MentionPill name=&quot;trevv&quot; prefix=&quot;@&quot; onClick={viewProfile} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 行内嵌入不破坏正文行高排版\u003c/li>\u003cli>□ 首字母微头像居中且清晰可辨\u003c/li>\u003cli>□ 深浅模式下文字对比度符合标准\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/meter","title":"仪表刻度条","html":"\u003ch1>仪表刻度条\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>精确表达物理资源（内存、带宽容量、CPU 峰值）的消耗分布与安全阈值。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>分类说明标签\u003c/li>\u003cli>当前数值与占比\u003c/li>\u003cli>物理容量刻度槽\u003c/li>\u003cli>动态安全/警告色阶\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>使用语义原生 meter 元素或 role=meter，读屏软件自动朗读当前值与极值。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>依据阈值区间自动呈现 secondary、warning 或 danger 警示状态。\u003c/li>\u003cli>两端保持饱满胶囊圆角，不产生溢出白边。\u003c/li>\u003cli>数值和单位使用等宽字体。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div style=&quot;display:grid;gap:6px;width:100%&quot;&gt;&lt;div class=&quot;ds-toolbar&quot;&gt;&lt;small&gt;物理内存负载&lt;/small&gt;&lt;small style=&quot;font-weight:600;font-variant-numeric:tabular-nums&quot;&gt;1.8 / 4.0 GB (45%)&lt;/small&gt;&lt;/div&gt;&lt;meter class=&quot;ds-meter&quot; value=&quot;45&quot; min=&quot;0&quot; max=&quot;100&quot; low=&quot;70&quot; high=&quot;85&quot; optimum=&quot;40&quot; aria-label=&quot;物理内存负载&quot;&gt;&lt;/meter&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Meter label=&quot;物理内存负载&quot; value={45} max={100} note=&quot;1.8 / 4.0 GB&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 进度刻度平滑填充\u003c/li>\u003cli>□ 高负载状态下色阶自动切换\u003c/li>\u003cli>□ 读屏器正确播报当前百分比\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/metric-pill-group","title":"多维指标微徽章群","html":"\u003ch1>多维指标微徽章群\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub 代码仓属性与 Cloudflare 遥测控制台风格的多维指标微胶囊集群；紧凑展示 Stars、延迟、并发等关键指标。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>多组双色微胶囊药丸 (Pills)\u003c/li>\u003cli>左侧描述标签 (Label) 浅色底\u003c/li>\u003cli>右侧核心数据 (Value) 深色底与等宽字体\u003c/li>\u003cli>悬停微放缩反馈\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 可依次在可交互指标药丸间移动；Enter 触发下钻指标详情或历史图表。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>微药丸采用 999px 全圆角，左标签与右数值通过 1px 细线分隔，排版紧凑专业。\u003c/li>\u003cli>悬停时采用 scale(1.04) 与边框高亮，给用户明确的可点击认知。\u003c/li>\u003cli>多个药丸采用 flex-wrap 自适应折行，适配各种宽度侧边栏或卡片。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-metric-group&quot; role=&quot;group&quot; aria-label=&quot;指标集群&quot;&gt;&lt;div class=&quot;ds-metric-group__item&quot; role=&quot;button&quot; tabindex=&quot;0&quot; data-toast=&quot;查看延迟走势&quot;&gt;&lt;span class=&quot;ds-metric-group__label&quot;&gt;RTT&lt;/span&gt;&lt;span class=&quot;ds-metric-group__val&quot;&gt;18ms&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-metric-group__item&quot; role=&quot;button&quot; tabindex=&quot;0&quot; data-toast=&quot;查看丢包详情&quot;&gt;&lt;span class=&quot;ds-metric-group__label&quot;&gt;丢包率&lt;/span&gt;&lt;span class=&quot;ds-metric-group__val&quot;&gt;0.0%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-metric-group__item&quot; role=&quot;button&quot; tabindex=&quot;0&quot; data-toast=&quot;查看在线节点&quot;&gt;&lt;span class=&quot;ds-metric-group__label&quot;&gt;节点池&lt;/span&gt;&lt;span class=&quot;ds-metric-group__val&quot;&gt;48/48&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MetricPillGroup metrics={[{label:&quot;RTT&quot;, value:&quot;18ms&quot;}, {label:&quot;丢包率&quot;, value:&quot;0.0%&quot;}]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 左右分区边框对齐分明\u003c/li>\u003cli>□ 数值字体等宽无抖动\u003c/li>\u003cli>□ 可交互药丸在键盘聚焦时呈现高亮环\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/multi-action-card","title":"横向分栏操作卡片","html":"\u003ch1>横向分栏操作卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Android Material 3 与 iOS 控制中心风格的一体化横向快捷卡片；整合左侧微图标、标题描述与右侧行内开关或动作。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>左侧圆角功能微图标底槽\u003c/li>\u003cli>中央标题与描述文本组\u003c/li>\u003cli>右侧行内操作区 (开关、徽标或按钮)\u003c/li>\u003cli>悬停浮起微动效\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 可聚焦卡片或右侧直接交互控件；Enter/Space 触发主卡片关联动作。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>左侧图标底槽使用 accent-soft 语义底色与 accent 强调色图标，视觉识别度极高。\u003c/li>\u003cli>右侧操作区自适应包裹开关或按钮，不破坏横向单行平衡。\u003c/li>\u003cli>悬停时轻微上浮 translateY(-2px) 并高亮边框，传达灵敏的操作反馈。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-action-tile&quot; role=&quot;article&quot;&gt;&lt;div class=&quot;ds-action-tile__left&quot;&gt;&lt;div class=&quot;ds-action-tile__icon&quot;&gt;⚡&lt;/div&gt;&lt;div&gt;&lt;h4 class=&quot;ds-action-tile__title&quot;&gt;BGP Anycast 加速&lt;/h4&gt;&lt;p class=&quot;ds-action-tile__desc&quot;&gt;自动选择物理距离最近的骨干网接入点&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-action-tile__right&quot;&gt;&lt;label class=&quot;ds-switch&quot; style=&quot;min-height:auto&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;ds-switch__input&quot; checked&gt;&lt;span class=&quot;ds-switch__track&quot;&gt;&lt;span class=&quot;ds-switch__thumb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;HorizontalActionTile icon=&quot;⚡&quot; title=&quot;BGP Anycast 加速&quot; description=&quot;优选骨干网&quot; action={&lt;Switch checked /&gt;} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 左中右三栏在窄屏下自适应不折行破损\u003c/li>\u003cli>□ 开关组件在卡片内无障碍操作正常\u003c/li>\u003cli>□ 边框与背景在深浅模式下对比符合标准\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/multi-step-inline-wizard","title":"行内紧凑流水线多步骤向导","html":"\u003ch1>行内紧凑流水线多步骤向导\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Linear 与 GitHub PR Checks 风格的单行横向微型多步状态流组件；集成完成态绿色对勾、进行中强调色微圆点、未开始虚线以及步骤连接微连线。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>横向单行流式向导容器\u003c/li>\u003cli>已完成绿色勾选微圆标 (.ds-inline-step.is-done)\u003c/li>\u003cli>当前进行中高亮微圆标 (.ds-inline-step.is-active)\u003c/li>\u003cli>步骤间 1px 极细中继连接线\u003c/li>\u003cli>步骤文字标签\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在可交互的步骤节点间移动；Enter 跳转至该步骤的控制面板或日志详情。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>适合嵌入在 Pull Request、部署任务或卡片顶部，仅占用单行紧凑垂直高度。\u003c/li>\u003cli>已完成状态使用 success 绿色与对勾符号，进行中采用 accent 强调色，层级极简分明。\u003c/li>\u003cli>连接线采用 1px 柔和线条自适应居中对齐，不随文字换行变形。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-inline-wizard&quot; role=&quot;region&quot; aria-label=&quot;部署流水线步骤&quot;&gt;&lt;div class=&quot;ds-inline-wizard__steps&quot;&gt;&lt;div class=&quot;ds-inline-step is-done&quot;&gt;&lt;span class=&quot;ds-inline-step__circle&quot;&gt;✓&lt;/span&gt;&lt;span&gt;构建完成&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-inline-step__sep&quot;&gt;&lt;/span&gt;&lt;div class=&quot;ds-inline-step is-done&quot;&gt;&lt;span class=&quot;ds-inline-step__circle&quot;&gt;✓&lt;/span&gt;&lt;span&gt;单元测试&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-inline-step__sep&quot;&gt;&lt;/span&gt;&lt;div class=&quot;ds-inline-step is-active&quot;&gt;&lt;span class=&quot;ds-inline-step__circle&quot;&gt;3&lt;/span&gt;&lt;span&gt;灰度金丝雀&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-inline-step__sep&quot;&gt;&lt;/span&gt;&lt;div class=&quot;ds-inline-step&quot;&gt;&lt;span class=&quot;ds-inline-step__circle&quot;&gt;4&lt;/span&gt;&lt;span&gt;全量上线&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;InlineStepWizard steps={[{label:&quot;构建完成&quot;, isDone:true}, {label:&quot;单元测试&quot;, isDone:true}, {label:&quot;灰度金丝雀&quot;, isActive:true}, {label:&quot;全量上线&quot;}]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 步骤徽标圆点与文字基线水平居中\u003c/li>\u003cli>□ 已完成与当前进行中色彩语义清晰区分\u003c/li>\u003cli>□ 窄屏容器下自动水平伸缩\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/navigation","title":"侧边导航","html":"\u003ch1>侧边导航\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>表达产品的信息架构和当前页面位置。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>产品标识\u003c/li>\u003cli>主导航\u003c/li>\u003cli>当前页胶囊\u003c/li>\u003cli>底部辅助设置\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>链接按 Tab 顺序进入；当前页设置 aria-current=page；导航区提供 aria-label。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>导航放在 chrome 层；内容卡片保持实底。\u003c/li>\u003cli>最多两层层级，不把一切都放到侧栏。\u003c/li>\u003cli>数量徽标反映真实计数，未知时不填模拟值。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;nav class=&quot;ds-nav&quot; aria-label=&quot;应用导航&quot;&gt;&lt;a href=&quot;#overview&quot; aria-current=&quot;page&quot;&gt;概览&lt;/a&gt;&lt;a href=&quot;#components&quot;&gt;组件&lt;/a&gt;&lt;a href=&quot;#tokens&quot;&gt;设计变量&lt;/a&gt;&lt;/nav&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 当前页无需只靠颜色识别\u003c/li>\u003cli>□ 导航折叠仍有可访问名称\u003c/li>\u003cli>□ 长标签不挤压图标\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/notion-callout-emoji-box","title":"Notion & Linear 柔色高亮说明引述块","html":"\u003ch1>Notion &amp; Linear 柔色高亮说明引述块\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Notion、Linear 与 GitHub 文档中经典的带图标说明引述块（Rich Callout Box）；支持左侧 prominent 表情图标徽标与右侧优雅排版的提示正文。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角微内凹背景卡片 (.ds-notion-callout)\u003c/li>\u003cli>左侧 20px 语义 Emoji 图标 (.ds-notion-callout__icon)\u003c/li>\u003cli>右侧自适应正文段落 (.ds-notion-callout__body)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为语义化 role=&quot;note&quot; 展示，无障碍屏幕阅读器自动按批注/备忘报读。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>背景采用柔和内陷浅色（--ds-inset），保持低饱和不刺眼，自然融入正文段落流。\u003c/li>\u003cli>左侧图标默认 flex-shrink:0，防止多行文本折行时挤压图标。\u003c/li>\u003cli>适合技术文档备忘提示、重要系统通知、前置注意事项及最佳实践推荐。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-notion-callout&quot; role=&quot;note&quot;&gt;&lt;span class=&quot;ds-notion-callout__icon&quot; aria-hidden=&quot;true&quot;&gt;💡&lt;/span&gt;&lt;div class=&quot;ds-notion-callout__body&quot;&gt;系统已自动启用增量快照备份，所有关键状态与设计 Token 均支持 100% 离线完整回溯。&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;NotionRichCalloutBox icon=&quot;💡&quot;&gt;说明文字&lt;/NotionRichCalloutBox&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 图标与首行文字基线对齐舒适\u003c/li>\u003cli>□ 边框线细腻柔和\u003c/li>\u003cli>□ 浅深色主题下字色对比度充足\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/pin-input","title":"独立六位密钥输入框","html":"\u003ch1>独立六位密钥输入框\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS、Telegram 与 2FA 认证风格的分隔方块输入框；支持粘贴自动填充、退格跳转与安全掩码。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>单字方框容器 (Box)\u003c/li>\u003cli>居中大字号数字显示\u003c/li>\u003cli>闪烁主题色光标\u003c/li>\u003cli>激活态微外扩阴影\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>输入数字自动前进至下一格；Backspace 退格并返回前一格；支持全局 Ctrl+V / ⌘V 粘贴 6 位码。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>方格使用等宽字体 (ds-type-mono) 与 20px 加粗字号，清晰防错。\u003c/li>\u003cli>聚焦时具备 scale(1.05) 微放大与主题焦点环反馈。\u003c/li>\u003cli>支持 type=&quot;password&quot; 掩码圆点，保护节点密码或私钥隐私。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-pin-group&quot; role=&quot;group&quot; aria-label=&quot;动态验证码&quot;&gt;&lt;input class=&quot;ds-pin-box is-filled&quot; type=&quot;text&quot; maxlength=&quot;1&quot; value=&quot;8&quot; aria-label=&quot;第 1 位&quot;&gt;&lt;input class=&quot;ds-pin-box is-filled&quot; type=&quot;text&quot; maxlength=&quot;1&quot; value=&quot;4&quot; aria-label=&quot;第 2 位&quot;&gt;&lt;input class=&quot;ds-pin-box is-filled&quot; type=&quot;text&quot; maxlength=&quot;1&quot; value=&quot;2&quot; aria-label=&quot;第 3 位&quot;&gt;&lt;input class=&quot;ds-pin-box&quot; type=&quot;text&quot; maxlength=&quot;1&quot; placeholder=&quot; &quot; aria-label=&quot;第 4 位&quot;&gt;&lt;input class=&quot;ds-pin-box&quot; type=&quot;text&quot; maxlength=&quot;1&quot; placeholder=&quot; &quot; aria-label=&quot;第 5 位&quot;&gt;&lt;input class=&quot;ds-pin-box&quot; type=&quot;text&quot; maxlength=&quot;1&quot; placeholder=&quot; &quot; aria-label=&quot;第 6 位&quot;&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;PinInput length={6} onComplete={verifyCode} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 输入单字后焦点自动平滑递进\u003c/li>\u003cli>□ 粘贴 6 位数字能准确填入各个方格\u003c/li>\u003cli>□ 深浅主题下方格边框与焦点环对比清晰\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/pip-card","title":"画中画微浮窗","html":"\u003ch1>画中画微浮窗\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS 原生视窗与流媒体画中画 (PiP) 风格的可折叠轻量浮窗；集成实时视频/图表监视画面与浮动快捷控制钮。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>画中画画面承载区\u003c/li>\u003cli>悬浮半透明快捷控制组 (关闭/恢复)\u003c/li>\u003cli>实时运行指示点 (Live)\u003c/li>\u003cli>浮窗底部标题栏\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 导航至放大/关闭控制按钮；Enter/Space 触发放大恢复或关闭浮窗。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>悬停时运用 scale(1.02) 与 36px 大投影，强化物理层级的悬浮感知。\u003c/li>\u003cli>控制按钮位于视频区域右上角，半透明暗色背景确保在各种明暗视频画面中清晰可见。\u003c/li>\u003cli>标题栏与视频区域实底隔离，文字自动单行省略截断。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-pip&quot; role=&quot;region&quot; aria-label=&quot;画中画监视器&quot;&gt;&lt;div class=&quot;ds-pip__screen&quot;&gt;&lt;span&gt;实时拓扑监控&lt;/span&gt;&lt;div class=&quot;ds-pip__overlay&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-pip__btn&quot; aria-label=&quot;放大恢复&quot; data-toast=&quot;恢复大窗口&quot;&gt;⤢&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-pip__btn&quot; aria-label=&quot;关闭画中画&quot; data-toast=&quot;关闭浮窗&quot;&gt;×&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-pip__caption&quot;&gt;&lt;span class=&quot;ds-pip__title&quot;&gt;新加坡 Core-01 流量流向&lt;/span&gt;&lt;span class=&quot;ds-pip__live&quot;&gt;● 实时&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;PipCard title=&quot;Core-01 流量监控&quot; isLive={true} onExpand={expand} onClose={close} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 浮窗投影深邃自然层次分明\u003c/li>\u003cli>□ 右上角操作按钮悬浮微放大平滑\u003c/li>\u003cli>□ 标题文字过长时自动平滑省略\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/privacy-banner","title":"隐私与合规许可栏","html":"\u003ch1>隐私与合规许可栏\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS 系统弹窗与 GDPR/数据合规风格的隐私授权通告栏；支持灵活自定义配置、快速授权与政策链接。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>隐私条款说明文案与跳转链接\u003c/li>\u003cli>自定义偏好设置次要按钮\u003c/li>\u003cli>接受全部主行动按钮\u003c/li>\u003cli>深层阴影与圆角底板\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在政策链接与操作按钮间流转；Enter 激活选择；Escape 或回车可响应默认动作。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>许可栏横向满宽或居底停靠，提供 24px 柔和立体阴影，与背景页面清晰分离。\u003c/li>\u003cli>主行动按钮突出高对比色彩，次要按钮采用幽灵按钮 (ghost) 风格降低认知负担。\u003c/li>\u003cli>正文内链接带有下划线与强调色，确保色弱与弱视用户无障碍识别。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;aside class=&quot;ds-privacy-banner&quot; role=&quot;complementary&quot; aria-label=&quot;隐私授权&quot;&gt;&lt;div class=&quot;ds-privacy-banner__text&quot;&gt;我们仅使用必要的本地会话凭证来保障网络路由加密与延迟测试。详见&lt;a href=&quot;#&quot; data-toast=&quot;打开隐私政策&quot;&gt;数据合规白皮书&lt;/a&gt;。&lt;/div&gt;&lt;div class=&quot;ds-privacy-banner__actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-button ds-button--ghost&quot; style=&quot;min-height:32px;font-size:12px&quot; data-toast=&quot;打开偏好设置&quot;&gt;自定义&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-button ds-button--primary&quot; style=&quot;min-height:32px;font-size:12px&quot; data-toast=&quot;已授权同意&quot;&gt;接受全部&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;PrivacyConsentBanner description=&quot;仅收集必要指标。&quot; onAccept={accept} onManage={manage} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 按钮文字与背景对比度达标\u003c/li>\u003cli>□ 移动端小屏幕下自适应换行\u003c/li>\u003cli>□ 政策链接具有清晰下划线与语义\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/progress","title":"进度条","html":"\u003ch1>进度条\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>展示可计量任务的真实进度；未知长度用不确定状态。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>任务标签\u003c/li>\u003cli>progress 元素\u003c/li>\u003cli>百分比或不确定说明\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>不参与 Tab；使用 aria-label；不要每帧播报数值。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>仅当知道总量时显示百分比。\u003c/li>\u003cli>下载未知总量使用 spinner 与“正在下载”。\u003c/li>\u003cli>完成后展示成功状态，失败后展示可重试操作。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;label&gt;导入进度 &lt;progress class=&quot;ds-progress&quot; value=&quot;64&quot; max=&quot;100&quot; aria-label=&quot;导入进度&quot;&gt;&lt;/progress&gt;64%&lt;/label&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Progress value={progress} label=&quot;导入进度&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 0、100 和未知状态均可表达\u003c/li>\u003cli>□ 不使用随机模拟进度\u003c/li>\u003cli>□ 进度名称可被读取\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/prompt-input","title":"AI 提示词输入框","html":"\u003ch1>AI 提示词输入框\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Claude 与 Cursor 风格的 AI 智能输入框；集成模型选择胶囊、附件指示、自动多行伸缩与提交动效。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>大圆角发光输入容器\u003c/li>\u003cli>多行自动高度文本域\u003c/li>\u003cli>底部模型与附件工具条\u003c/li>\u003cli>圆形发送/停止微按钮\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 遍历内部控件；⌘↵ 或 Ctrl↵ 快捷发送；Escape 取消焦点。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>focus-within 时高亮边框并显示发光柔光，聚焦感突出。\u003c/li>\u003cli>底部工具栏常驻模型选择与上下文胶囊，便于单手点按。\u003c/li>\u003cli>提交按钮在文本为空时可处于平视状态，有内容时高亮。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-prompt-box&quot; style=&quot;width:100%&quot;&gt;&lt;textarea class=&quot;ds-prompt-box__input&quot; rows=&quot;2&quot; placeholder=&quot;输入提示词或路由规则，按 ⌘↵ 发送…&quot; aria-label=&quot;AI 智能提示词输入&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;ds-prompt-box__toolbar&quot;&gt;&lt;div class=&quot;ds-prompt-box__tags&quot;&gt;&lt;span class=&quot;ds-chip ds-chip--sm&quot;&gt;⚡ Claude-3.5-Sonnet&lt;/span&gt;&lt;span class=&quot;ds-chip ds-chip--sm&quot;&gt;📎 附加上下文&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;ds-button ds-prompt-box__submit&quot; aria-label=&quot;发送消息&quot; data-toast=&quot;提示词已提交给 AI 模型&quot;&gt;↑&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;PromptInput placeholder=&quot;询问代理或配置规则…&quot; tags={&lt;span className=&quot;ds-chip ds-chip--sm&quot;&gt;⚡ Sonnet&lt;/span&gt;} onSubmit={handleSend} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 输入框获得焦点时边框高亮清晰\u003c/li>\u003cli>□ ⌘↵ 能快速无障碍触发表单提交\u003c/li>\u003cli>□ 移动端触摸时软键盘不被底部工具栏遮挡\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/qr-card","title":"配置扫码卡片","html":"\u003ch1>配置扫码卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Clash、Shadowrocket 与 WireGuard 移动端配置导入卡片；带对准标线与快捷复制 URI 动作。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>白色扫描衬底方框\u003c/li>\u003cli>四角科技感对齐准星 (Crosshairs)\u003c/li>\u003cli>SVG 矢量二维码栅格\u003c/li>\u003cli>配置名称与快捷复制按钮\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦至卡片底部的“复制 URI”按钮；Enter 复制密钥或协议链接。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>四角采用细微的主题色准星微描边，强化扫码与专业仪器感。\u003c/li>\u003cli>二维码底部提供实底白衬，不受系统深色主题反相干扰，保证扫描成功率 100%。\u003c/li>\u003cli>底部提供备用 URI 复制按钮，兼顾电脑与移动设备。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-qr-card&quot;&gt;&lt;div class=&quot;ds-qr-frame&quot;&gt;&lt;span class=&quot;ds-qr-crosshair ds-qr-crosshair--tl&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-qr-crosshair ds-qr-crosshair--tr&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-qr-crosshair ds-qr-crosshair--bl&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-qr-crosshair ds-qr-crosshair--br&quot;&gt;&lt;/span&gt;&lt;svg width=&quot;100&quot; height=&quot;100&quot; viewBox=&quot;0 0 100 100&quot; aria-label=&quot;配置二维码&quot;&gt;&lt;rect width=&quot;100&quot; height=&quot;100&quot; fill=&quot;#fff&quot;/&gt;&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;28&quot; height=&quot;28&quot; fill=&quot;#000&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;16&quot; y=&quot;16&quot; width=&quot;16&quot; height=&quot;16&quot; fill=&quot;#fff&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;8&quot; height=&quot;8&quot; fill=&quot;#000&quot;/&gt;&lt;rect x=&quot;62&quot; y=&quot;10&quot; width=&quot;28&quot; height=&quot;28&quot; fill=&quot;#000&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;68&quot; y=&quot;16&quot; width=&quot;16&quot; height=&quot;16&quot; fill=&quot;#fff&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;72&quot; y=&quot;20&quot; width=&quot;8&quot; height=&quot;8&quot; fill=&quot;#000&quot;/&gt;&lt;rect x=&quot;10&quot; y=&quot;62&quot; width=&quot;28&quot; height=&quot;28&quot; fill=&quot;#000&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;16&quot; y=&quot;68&quot; width=&quot;16&quot; height=&quot;16&quot; fill=&quot;#fff&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;20&quot; y=&quot;72&quot; width=&quot;8&quot; height=&quot;8&quot; fill=&quot;#000&quot;/&gt;&lt;rect x=&quot;44&quot; y=&quot;44&quot; width=&quot;12&quot; height=&quot;12&quot; fill=&quot;var(--ds-accent)&quot; rx=&quot;2&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;strong style=&quot;font-size:14px&quot;&gt;香港专线 01 凭证&lt;/strong&gt;&lt;small style=&quot;color:var(--ds-muted);margin-top:4px&quot;&gt;Shadowsocks-2022&lt;/small&gt;&lt;button class=&quot;ds-button ds-button--ghost&quot; style=&quot;margin-top:12px;min-height:28px;font-size:11px&quot; data-toast=&quot;URI 已复制到剪贴板&quot;&gt;复制 URI&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;QrCard title=&quot;香港专线 01&quot; subtitle=&quot;SS-2022&quot; uri=&quot;ss://...&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 二维码在深色模式下保持纯白衬底\u003c/li>\u003cli>□ 四角准星规整对齐无错位\u003c/li>\u003cli>□ 复制按钮具备明确的剪贴板反馈\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/radial-gauge-cluster","title":"多环同心资源利用率仪表盘","html":"\u003ch1>多环同心资源利用率仪表盘\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Tesla 车载仪表与 Cyberpunk 服务器监控大盘风格的同心圆环仪表盘；单图元集成 CPU、GPU、内存等同心嵌套环形进度条、中央核心负载数值与图例行。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>同心多重 SVG 环形轨道与彩色进度圈\u003c/li>\u003cli>圆环中央大号等宽核心百分比\u003c/li>\u003cli>右侧多维资源彩色圆点图例\u003c/li>\u003cli>右侧等宽即时利用率读数\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦仪表簇；Enter 打开系统活动监视器进程明细。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>多环使用 stroke-dasharray 与 stroke-dashoffset 计算进度，完全由 SVG 矢量引擎驱动。\u003c/li>\u003cli>三种资源分别绑定 action 蓝色、accent 亮色与 warning 琥珀金，色彩层次分明。\u003c/li>\u003cli>紧凑卡片横向布局，在仪表盘栅格中占用极小空间却承载极高信息密度。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-radial-cluster&quot; role=&quot;region&quot; aria-label=&quot;硬件资源仪表盘&quot;&gt;&lt;div class=&quot;ds-radial-cluster__graphic&quot;&gt;&lt;svg class=&quot;ds-radial-cluster__svg&quot; viewBox=&quot;0 0 88 88&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle class=&quot;ds-radial-cluster__track&quot; cx=&quot;44&quot; cy=&quot;44&quot; r=&quot;36&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;ds-radial-cluster__track&quot; cx=&quot;44&quot; cy=&quot;44&quot; r=&quot;28&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;ds-radial-cluster__track&quot; cx=&quot;44&quot; cy=&quot;44&quot; r=&quot;20&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;ds-radial-cluster__meter&quot; cx=&quot;44&quot; cy=&quot;44&quot; r=&quot;36&quot; stroke=&quot;var(--ds-action)&quot; stroke-dasharray=&quot;226.2&quot; stroke-dashoffset=&quot;49.7&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;ds-radial-cluster__meter&quot; cx=&quot;44&quot; cy=&quot;44&quot; r=&quot;28&quot; stroke=&quot;var(--ds-accent)&quot; stroke-dasharray=&quot;175.9&quot; stroke-dashoffset=&quot;66.8&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;ds-radial-cluster__meter&quot; cx=&quot;44&quot; cy=&quot;44&quot; r=&quot;20&quot; stroke=&quot;var(--ds-warning)&quot; stroke-dasharray=&quot;125.6&quot; stroke-dashoffset=&quot;20.1&quot;&gt;&lt;/circle&gt;&lt;/svg&gt;&lt;div class=&quot;ds-radial-cluster__center&quot;&gt;78%&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-radial-cluster__legend&quot;&gt;&lt;div class=&quot;ds-radial-cluster__item&quot;&gt;&lt;span class=&quot;ds-radial-cluster__dot&quot; style=&quot;background:var(--ds-action)&quot;&gt;&lt;/span&gt;&lt;span&gt;CPU 负载&lt;/span&gt;&lt;span class=&quot;ds-radial-cluster__val&quot;&gt;78%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-radial-cluster__item&quot;&gt;&lt;span class=&quot;ds-radial-cluster__dot&quot; style=&quot;background:var(--ds-accent)&quot;&gt;&lt;/span&gt;&lt;span&gt;GPU 计算&lt;/span&gt;&lt;span class=&quot;ds-radial-cluster__val&quot;&gt;62%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-radial-cluster__item&quot;&gt;&lt;span class=&quot;ds-radial-cluster__dot&quot; style=&quot;background:var(--ds-warning)&quot;&gt;&lt;/span&gt;&lt;span&gt;RAM 占用&lt;/span&gt;&lt;span class=&quot;ds-radial-cluster__val&quot;&gt;84%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;RadialGaugeCluster cpu={78} gpu={62} ram={84} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 同心圆环圆心严格重合对齐\u003c/li>\u003cli>□ 圆环端点带 round 圆润倒角\u003c/li>\u003cli>□ 数值与图例文本基线对齐\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/radio","title":"单选项","html":"\u003ch1>单选项\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>从一组选项中选择且只选择一个；用于需要说明的较少选项。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>fieldset/legend 分组\u003c/li>\u003cli>同名 radio\u003c/li>\u003cli>选项标签\u003c/li>\u003cli>可选次要说明\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 进入组；方向键在组内选择；Space 选择当前项。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>同组 name 必须相同。\u003c/li>\u003cli>超过 5 项考虑 select。\u003c/li>\u003cli>切换选择不能自动提交整个表单。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;fieldset style=&quot;border:0;padding:0&quot;&gt;&lt;legend&gt;刷新策略&lt;/legend&gt;&lt;label class=&quot;ds-check&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;refresh&quot; checked&gt;手动刷新&lt;/label&gt;&lt;label class=&quot;ds-check&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;refresh&quot;&gt;每 6 小时刷新&lt;/label&gt;&lt;/fieldset&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 方向键切换只选中一项\u003c/li>\u003cli>□ 组名称可读\u003c/li>\u003cli>□ 用户可以撤销尚未提交的选择\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/rating","title":"评级星级","html":"\u003ch1>评级星级\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>为节点线路稳定性、服务质量或重要度赋予 1–5 星级评分或收藏标记。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>星形图标序列\u003c/li>\u003cli>悬停微放大交互反馈\u003c/li>\u003cli>激活/未激活星形状态\u003c/li>\u003cli>语义 radiogroup 描述\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 进入评级组；左右方向键增减星级；Enter 或 Space 确定评级。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>每个星形具备独立的 aria-label 标注（如“3 星”）。\u003c/li>\u003cli>鼠标悬停时有微缩放弹性手感（scale(1.2)）。\u003c/li>\u003cli>评分操作后即时给予轻量 Toast 反馈。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-rating&quot; role=&quot;radiogroup&quot; aria-label=&quot;线路满意度评级&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-rating__star is-active&quot; aria-label=&quot;1 星&quot; data-toast=&quot;已标记为 1 星&quot;&gt;★&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-rating__star is-active&quot; aria-label=&quot;2 星&quot; data-toast=&quot;已标记为 2 星&quot;&gt;★&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-rating__star is-active&quot; aria-label=&quot;3 星&quot; data-toast=&quot;已标记为 3 星&quot;&gt;★&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-rating__star is-active&quot; aria-label=&quot;4 星&quot; data-toast=&quot;已标记为 4 星&quot;&gt;★&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-rating__star&quot; aria-label=&quot;5 星&quot; data-toast=&quot;已标记为 5 星&quot;&gt;☆&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Rating value={rating} onChange={setRating} max={5} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 每个星形可通过键盘顺畅导航\u003c/li>\u003cli>□ 悬停与选中状态对比度合格\u003c/li>\u003cli>□ 点击星形可即时更新评级\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/raycast-confetti-celebration-canvas","title":"Raycast 里程碑达成彩带礼花卡片","html":"\u003ch1>Raycast 里程碑达成彩带礼花卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Raycast 与 Linear 任务全量交付时的彩带礼花与里程碑庆祝卡片（Milestone Celebration Confetti Canvas）；全圆角轻拟物白底/暗底浮层、居中奖杯金徽标、高亮彩屑飘散效果、达成总结文案及一键继续动作按键。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角轻阴影卡片基底 (.ds-confetti-canvas)\u003c/li>\u003cli>多色飘散细长彩带与五彩纸屑 (.ds-confetti-canvas__particles, .ds-confetti-canvas__p)\u003c/li>\u003cli>居中胜利庆祝奖杯图标 (.ds-confetti-canvas__trophy)\u003c/li>\u003cli>加粗里程碑达成大标题与说明 (.ds-confetti-canvas__title, .ds-confetti-canvas__desc)\u003c/li>\u003cli>醒目操作确认按键 (.ds-confetti-canvas__btn)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦确认按键；Enter 或 Space 关闭庆祝卡片。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;region&quot; 与 aria-label 说明里程碑达成庆祝卡片。\u003c/li>\u003cli>彩屑动效轻量优雅，在 prefers-reduced-motion 下自动静态停靠。\u003c/li>\u003cli>适合任务完成、迭代交付、打卡里程碑、成就解锁庆祝场景。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-confetti-canvas&quot; role=&quot;region&quot; aria-label=&quot;里程碑达成庆祝卡片：全部里程碑已达成！&quot;&gt;&lt;div class=&quot;ds-confetti-canvas__particles&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;ds-confetti-canvas__p&quot; style=&quot;left:15%;top:20%;background-color:#ff3b88&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-confetti-canvas__p&quot; style=&quot;left:45%;top:15%;background-color:#00f0ff&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-confetti-canvas__p&quot; style=&quot;left:75%;top:25%;background-color:#84cc16&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-confetti-canvas__content&quot;&gt;&lt;span class=&quot;ds-confetti-canvas__trophy&quot; aria-hidden=&quot;true&quot;&gt;🎉&lt;/span&gt;&lt;h4 class=&quot;ds-confetti-canvas__title&quot;&gt;全部里程碑已达成！&lt;/h4&gt;&lt;p class=&quot;ds-confetti-canvas__desc&quot;&gt;本季度交付任务 100% 验收通过，系统稳定性指标达标。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;ds-confetti-canvas__btn&quot;&gt;太棒了，继续前进&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;RaycastConfettiCelebration title=&quot;全部里程碑已达成！&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 奖杯与文字居中平衡\u003c/li>\u003cli>□ 微型彩屑飘散点缀\u003c/li>\u003cli>□ 确认按键颜色鲜明\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/raycast-floating-ai-dock-pill","title":"Raycast 悬浮 AI 智能体应用坞胶囊","html":"\u003ch1>Raycast 悬浮 AI 智能体应用坞胶囊\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Raycast 与 Apple Intelligence 风格的悬浮桌面 AI 快捷唤醒胶囊（Floating Desktop AI Assistant Dock Pill）；外环霓虹光晕微发光呼吸、模型版本药丸（Claude 3.7 Sonnet）、多模态实时语音拾音按钮与 Esc 快捷键关闭徽标。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>流体磨砂半透明长胶囊 (.ds-ai-dock-pill)\u003c/li>\u003cli>外环微弱辐射脉冲呼吸光环 (.ds-ai-dock-pill__aura)\u003c/li>\u003cli>当前大模型名称微标签 (.ds-ai-dock-pill__model)\u003c/li>\u003cli>居中单行提示文案 (.ds-ai-dock-pill__query)\u003c/li>\u003cli>独立麦克风拾音圆钮与 Esc 键帽徽标 (.ds-ai-dock-pill__mic, .ds-ai-dock-pill__esc)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>⌘Space 快速唤醒；Esc 关闭浮动胶囊；Tab 聚焦拾音按钮。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;region&quot; 与 aria-label 说明 Raycast 悬浮 AI 应用坞胶囊。\u003c/li>\u003cli>麦克风按钮具备明确 aria-label，Esc 键帽结构清晰。\u003c/li>\u003cli>适合全局桌面级助手、IDE 悬浮生成胶囊、AI 智能工作区。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-ai-dock-pill&quot; role=&quot;region&quot; aria-label=&quot;Raycast 悬浮 AI 智能体应用坞胶囊&quot;&gt;&lt;div class=&quot;ds-ai-dock-pill__aura&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;ds-ai-dock-pill__model&quot;&gt;✦ Claude 3.7 Sonnet&lt;/span&gt;&lt;span class=&quot;ds-ai-dock-pill__query&quot;&gt;询问任何问题或输入 / 调用系统指令…&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-ai-dock-pill__mic&quot; aria-label=&quot;实时语音听写&quot;&gt;🎙&lt;/button&gt;&lt;kbd class=&quot;ds-ai-dock-pill__esc&quot;&gt;esc&lt;/kbd&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;RaycastFloatingAiDockPill model=&quot;Claude 3.7 Sonnet&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 全圆角胶囊通透悬浮\u003c/li>\u003cli>□ 左侧呼吸光环精致微跳\u003c/li>\u003cli>□ esc 键帽清晰靠右\u003c/li>\u003cli>□ 浅色、深色、200%
