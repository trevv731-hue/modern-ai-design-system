 \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/cassette-vu-peak-led-limiter-meter","title":"复古音频峰值限制器 LED 电平指示表","html":"\u003ch1>复古音频峰值限制器 LED 电平指示表\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 多媒体 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>专业机架音频处理器与复古开盘机峰值限制器电平表（VU Peak LED Limiter &amp; GR Meter）；10 段多色彩 LED 光柱排布（绿、黄、红过载）、独立 CLIP 过载告警指示、分贝刻度标尺（-24dB 到 +6dB）及压限增益衰减读数。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>专业硬件深灰纯铝机架槽体 (.ds-vu-peak-limiter)\u003c/li>\u003cli>多色 LED 光柱阶梯排布 (.ds-vu-peak-limiter__ladder, .ds-vu-peak-limiter__led)\u003c/li>\u003cli>顶部 CLIP 红色过载点阵指示灯 (.ds-vu-peak-limiter__head)\u003c/li>\u003cli>底部 -24 到 +6dB 精准分贝标尺 (.ds-vu-peak-limiter__scale)\u003c/li>\u003cli>微光晕发光拟物物理质感\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>接收实时音频流瞬态信号，超过 0dBFS 时点亮黄色段，+2dB 以上亮红灯。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;meter&quot; 与 aria-valuenow 完整反映分贝量化值。\u003c/li>\u003cli>LED 发光段采用高对比度绿色、黄色与红色光晕，明暗分明。\u003c/li>\u003cli>适合专业调音台、母带限制器插件、直播推流音频状态栏。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-vu-peak-limiter&quot; role=&quot;meter&quot; aria-label=&quot;模拟峰值电平指示器：-4 dB&quot; aria-valuenow=&quot;-4&quot;&gt;&lt;div class=&quot;ds-vu-peak-limiter__head&quot;&gt;&lt;span&gt;PEAK LIMITER &amp; GR&lt;/span&gt;&lt;span style=&quot;color:#64748b&quot;&gt;○ NORMAL&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-peak-limiter__ladder&quot;&gt;&lt;div class=&quot;ds-vu-peak-limiter__led ds-vu-peak-limiter__led--green is-lit&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-peak-limiter__led ds-vu-peak-limiter__led--green is-lit&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-peak-limiter__led ds-vu-peak-limiter__led--green is-lit&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-peak-limiter__led ds-vu-peak-limiter__led--green is-lit&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-peak-limiter__led ds-vu-peak-limiter__led--green is-lit&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-peak-limiter__led ds-vu-peak-limiter__led--green&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-peak-limiter__led ds-vu-peak-limiter__led--yellow&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-peak-limiter__led ds-vu-peak-limiter__led--red&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-peak-limiter__led ds-vu-peak-limiter__led--red&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-peak-limiter__led ds-vu-peak-limiter__led--red&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-peak-limiter__scale&quot;&gt;&lt;span&gt;-24&lt;/span&gt;&lt;span&gt;-12&lt;/span&gt;&lt;span&gt;-4&lt;/span&gt;&lt;span&gt;0dB&lt;/span&gt;&lt;span&gt;+6dB&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;AnalogVuPeakLimiterMeter levelDb={-4} gainReductionDb={-2} isClipping={false} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 深灰金属底座扎实\u003c/li>\u003cli>□ 绿光段整齐点亮\u003c/li>\u003cli>□ 分贝刻度等宽微距排列\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/chat-bubble","title":"对话消息气泡","html":"\u003ch1>对话消息气泡\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iMessage 与 ChatGPT 风格的对称式会话消息气泡；区隔用户输入与 AI/系统响应。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>发言者微头像/身份标\u003c/li>\u003cli>圆角弧度消息气泡面\u003c/li>\u003cli>时间戳与状态信息\u003c/li>\u003cli>快捷复制或操作悬浮条\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 可聚焦至气泡底部的快捷操作（如复制、重试）；消息正文支持全选。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>用户气泡采用 action 填充色并靠右对齐；AI 气泡采用 surface 实底描边并靠左对齐。\u003c/li>\u003cli>底部保留微小时间戳与状态反馈，避免视觉杂乱。\u003c/li>\u003cli>圆角遵循外大内小的气泡拐角物理质感。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-chat&quot; style=&quot;width:100%&quot;&gt;&lt;div class=&quot;ds-chat-row ds-chat-row--user&quot;&gt;&lt;div class=&quot;ds-chat-bubble&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;请测试新加坡专线节点的往返 RTT 和丢包率。&lt;/p&gt;&lt;div class=&quot;ds-chat-bubble__footer&quot;&gt;&lt;span&gt;11:24&lt;/span&gt;&lt;span&gt;✓ 已送达&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-chat-row ds-chat-row--ai&quot;&gt;&lt;div class=&quot;ds-chat-bubble&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;新加坡 01 延迟 18ms，丢包率 0.00%，已通过 BGP 多径直达测试。&lt;/p&gt;&lt;div class=&quot;ds-chat-bubble__footer&quot;&gt;&lt;button class=&quot;ds-button ds-button--ghost&quot; style=&quot;min-height:22px;padding:2px 6px;font-size:11px&quot; data-toast=&quot;已复制回复&quot;&gt;复制&lt;/button&gt;&lt;span&gt;11:24&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;ChatBubble role=&quot;ai&quot; message=&quot;新加坡 01 延迟 18ms&quot; timestamp=&quot;11:24&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 用户与 AI 气泡视觉对齐严谨\u003c/li>\u003cli>□ 浅深主题下文字对比度符合标准\u003c/li>\u003cli>□ 气泡内操作按钮焦点环完整可见\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/checkbox","title":"复选框","html":"\u003ch1>复选框\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>选择零个或多个独立选项，或者确认知情条件。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>20px 复选框\u003c/li>\u003cli>完整文本标签\u003c/li>\u003cli>可选 indeterminate\u003c/li>\u003cli>44px 标签点击行\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 导航；Space 切换；父级全选需要同步 indeterminate。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>多选使用复选框，立即开关使用 Switch。\u003c/li>\u003cli>点击文字必须选中控件。\u003c/li>\u003cli>隐私许可不得默认勾选。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;label class=&quot;ds-check&quot;&gt;&lt;input type=&quot;checkbox&quot;&gt;仅显示已测速节点&lt;/label&gt;&lt;label class=&quot;ds-check&quot;&gt;&lt;input type=&quot;checkbox&quot; checked&gt;保留本地节点&lt;/label&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 全选和部分选中状态不同\u003c/li>\u003cli>□ 可见标签正确绑定\u003c/li>\u003cli>□ 触摸标签区域也能切换\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/chip","title":"交互胶囊","html":"\u003ch1>交互胶囊\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>用于多维标签过滤、选择与输入标记；兼顾 macOS 筛选胶囊与 Android M3 Filter Chip 的触感与轻量。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角胶囊容器\u003c/li>\u003cli>可选状态指示点或前置图标\u003c/li>\u003cli>文本标签\u003c/li>\u003cli>可选独立移除按钮\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 导航；Space/Enter 切换选择；若包含删除按钮，单独 Tab 或 Backspace 触发移除。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>多选或状态筛选时优先使用 Chip，避免堆叠笨重的下拉菜单。\u003c/li>\u003cli>已选中状态使用 secondary-soft 底色与 secondary 描边，保持高辨识度。\u003c/li>\u003cli>提供独立删除按钮时，删除按钮需有明确的 aria-label 说明移除的对象。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-toolbar&quot; style=&quot;justify-content:flex-start;gap:8px&quot;&gt;&lt;button class=&quot;ds-chip ds-chip--selected&quot; aria-pressed=&quot;true&quot;&gt;&lt;span class=&quot;ds-status-dot ds-status-dot--live&quot;&gt;&lt;/span&gt;全部节点&lt;/button&gt;&lt;button class=&quot;ds-chip&quot; aria-pressed=&quot;false&quot;&gt;香港 (0.1x)&lt;/button&gt;&lt;button class=&quot;ds-chip&quot; aria-pressed=&quot;false&quot;&gt;日本专线&lt;/button&gt;&lt;span class=&quot;ds-chip&quot;&gt;自定义分流 &lt;button class=&quot;ds-chip__remove&quot; aria-label=&quot;移除自定义分流&quot;&gt;×&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Chip label=&quot;全部节点&quot; selected={true} onToggle={toggle} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 键盘 Tab 可以聚焦每一个 Chip\u003c/li>\u003cli>□ 选中状态在浅深模式下对比度均合格\u003c/li>\u003cli>□ 删除按钮有独立的可访问名称且不影响文字点击\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/circular-progress","title":"环形进度仪表盘","html":"\u003ch1>环形进度仪表盘\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple Watch 健身圆环与下载进度风格的矢量环形仪表；用于展示存储容量、流量消耗百分比与电量。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>底色静音圆环轨道\u003c/li>\u003cli>高亮渐进填充进度圆弧\u003c/li>\u003cli>居中大字号百分比读取\u003c/li>\u003cli>辅助说明微标签\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为状态展示控件无需聚焦；读屏器通过 role=&quot;progressbar&quot; 朗读实时数值。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>基于 SVG stroke-dashoffset 驱动，圆弧两端采用 round 圆润封头。\u003c/li>\u003cli>进度条旋转 -90deg 使起点位于正上方 12 点钟物理标准位置。\u003c/li>\u003cli>尺寸与线宽支持参数化缩放，适配桌面小卡片与移动大卡片。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-circle-gauge&quot; role=&quot;progressbar&quot; aria-valuenow=&quot;74&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot;&gt;&lt;svg class=&quot;ds-circle-gauge__svg&quot; viewBox=&quot;0 0 80 80&quot;&gt;&lt;circle class=&quot;ds-circle-gauge__bg&quot; cx=&quot;40&quot; cy=&quot;40&quot; r=&quot;33&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;ds-circle-gauge__fill&quot; cx=&quot;40&quot; cy=&quot;40&quot; r=&quot;33&quot; style=&quot;stroke-dasharray:207.3;stroke-dashoffset:53.9&quot;&gt;&lt;/circle&gt;&lt;/svg&gt;&lt;div class=&quot;ds-circle-gauge__label&quot;&gt;&lt;span&gt;74%&lt;/span&gt;&lt;small style=&quot;font-size:9px;color:var(--ds-muted);font-weight:400&quot;&gt;已用流量&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;CircularProgress value={74} label=&quot;已用流量&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 环形封头圆润无生硬截断\u003c/li>\u003cli>□ 读屏器能正确朗读当前百分比\u003c/li>\u003cli>□ 高分屏下 SVG 边缘矢量清晰锐利\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/circular-slider-dial","title":"旋钮环形温控角度刻度盘","html":"\u003ch1>旋钮环形温控角度刻度盘\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Google Nest 与 Apple Watch 风格的圆形环形旋钮交互控制器；带有同心圆环底槽、当前进度彩色弧线、中央大号等宽数字及温度/参数单位说明。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>140px 直径圆形高光物理底盘\u003c/li>\u003cli>SVG 环形底槽与描边渐变进度弧\u003c/li>\u003cli>中央大字号等宽数值显示\u003c/li>\u003cli>底部微型单位说明文本\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦旋钮；上下或左右方向键以 1 步长增减数值；PageUp / PageDown 跨步 5 调整。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>进度弧通过 SVG stroke-dasharray 与 stroke-dashoffset 计算，弧线两端带 round 柔和圆角。\u003c/li>\u003cli>中心大字号等宽数字严格居中，在旋转数值调节时不发生位移抖动。\u003c/li>\u003cli>旋钮表面带有微立体内阴影与外阴影，还原真实五金或高分子旋钮的手感。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-rotary-dial&quot; role=&quot;slider&quot; aria-valuenow=&quot;24&quot; aria-valuemin=&quot;16&quot; aria-valuemax=&quot;32&quot; aria-label=&quot;设定温度&quot; tabindex=&quot;0&quot;&gt;&lt;svg class=&quot;ds-rotary-dial__svg&quot; viewBox=&quot;0 0 140 140&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle class=&quot;ds-rotary-dial__track&quot; cx=&quot;70&quot; cy=&quot;70&quot; r=&quot;58&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;ds-rotary-dial__meter&quot; cx=&quot;70&quot; cy=&quot;70&quot; r=&quot;58&quot; stroke-dasharray=&quot;364.4&quot; stroke-dashoffset=&quot;182.2&quot;&gt;&lt;/circle&gt;&lt;/svg&gt;&lt;div class=&quot;ds-rotary-dial__center&quot;&gt;&lt;span class=&quot;ds-rotary-dial__val&quot;&gt;24°&lt;/span&gt;&lt;span class=&quot;ds-rotary-dial__unit&quot;&gt;°C 设定温度&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;RotaryKnobDial value={24} min={16} max={32} unit=&quot;°C 设定温度&quot; onChange={setTemp} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 旋钮弧线起点位于正上方 (rotate -90deg)\u003c/li>\u003cli>□ 方向键键盘交互无障碍反馈完整\u003c/li>\u003cli>□ 中心数值与单位垂直居中\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/circular-speed-gauge-cluster","title":"Porsche & Tesla 数字座舱双联双针仪表盘","html":"\u003ch1>Porsche &amp; Tesla 数字座舱双联双针仪表盘\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>保时捷 Taycan 与特斯拉 Model S 风格的数字座舱双联圆形仪表集群；左侧呈现时速（KM/H）、右侧呈现电机动力输出（KW），中置垂直物理分割线。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>黑化运动座舱外壳 (.ds-gauge-cluster)\u003c/li>\u003cli>双独立虚线圆表盘 (.ds-gauge-cluster__dial)\u003c/li>\u003cli>中央等宽大数字读数 (.ds-gauge-cluster__num)\u003c/li>\u003cli>小字号大写物理单位 (.ds-gauge-cluster__unit)\u003c/li>\u003cli>中置纤细垂直分割线 (.ds-gauge-cluster__sep)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为语义化 region 载入，通过 aria-label 报读当前车速与动力数据。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>深黑背景（#0b0f19）配合高亮浅白与青蓝指示，重现豪华跑车全液晶仪表台的尊贵质感。\u003c/li>\u003cli>数据采用 tabular-nums 等宽数字，杜绝数值变动引起的抖动跳字。\u003c/li>\u003cli>适合车载智能座舱大屏、硬件遥测监控、实时计算负载监视器及跑分评测看板。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-gauge-cluster&quot; role=&quot;region&quot; aria-label=&quot;数字座舱双联仪表盘：车速 128 KM/H，功率 84 KW&quot;&gt;&lt;div class=&quot;ds-gauge-cluster__dial&quot;&gt;&lt;div class=&quot;ds-gauge-cluster__readout&quot;&gt;&lt;span class=&quot;ds-gauge-cluster__num&quot;&gt;128&lt;/span&gt;&lt;span class=&quot;ds-gauge-cluster__unit&quot;&gt;KM/H&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-gauge-cluster__sep&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-gauge-cluster__dial&quot;&gt;&lt;div class=&quot;ds-gauge-cluster__readout&quot;&gt;&lt;span class=&quot;ds-gauge-cluster__num&quot; style=&quot;color:var(--ds-accent)&quot;&gt;84&lt;/span&gt;&lt;span class=&quot;ds-gauge-cluster__unit&quot;&gt;KW&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;DualSpeedometerGaugeCluster speed={128} power={84} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 双表盘严格对称水平排列\u003c/li>\u003cli>□ 中线垂直居中无偏斜\u003c/li>\u003cli>□ 等宽数字排版稳定无抖动\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/code-diff-side-by-side","title":"双栏代码差异比对查看器","html":"\u003ch1>双栏代码差异比对查看器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub PR 与 Cursor 风格的左右双栏 Git 代码改动对比卡片；集成行号同步对齐、删除行红色高亮与新增行绿色柔底，适用于代码审查与配置演进。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>卡片标题栏与文件名说明\u003c/li>\u003cli>左右两栏网格等宽并排布局\u003c/li>\u003cli>等宽行号列 (.ds-split-line__num)\u003c/li>\u003cli>红底删除行 (.ds-split-line--del)\u003c/li>\u003cli>绿底新增行 (.ds-split-line--add)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦双栏对比视图；支持鼠标拖拽行选文字进行代码复制。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>左右两栏严格保持行高对齐，利用 CSS grid: 1fr 1fr 消除由于内容不对称引发的垂直错位。\u003c/li>\u003cli>增删颜色严格对应 successSoft 与 dangerSoft 语义变量，在深浅主题下文字均达 4.5:1 对比度。\u003c/li>\u003cli>中间带 1px 细线分隔，视觉清晰规整。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-split-diff&quot; role=&quot;region&quot; aria-label=&quot;配置文件改动比对&quot;&gt;&lt;div class=&quot;ds-split-diff__header&quot;&gt;&lt;span&gt;config/router.rs&lt;/span&gt;&lt;span&gt;双栏比对视图&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-split-diff__panes&quot;&gt;&lt;div class=&quot;ds-split-diff__pane&quot;&gt;&lt;div class=&quot;ds-split-line ds-split-line--del&quot;&gt;&lt;span class=&quot;ds-split-line__num&quot;&gt;42&lt;/span&gt;&lt;span&gt;- proxy_pass: &quot;http://legacy-node:8080&quot;;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-split-line&quot;&gt;&lt;span class=&quot;ds-split-line__num&quot;&gt;43&lt;/span&gt;&lt;span&gt;  timeout_ms: 5000;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-split-diff__pane&quot;&gt;&lt;div class=&quot;ds-split-line ds-split-line--add&quot;&gt;&lt;span class=&quot;ds-split-line__num&quot;&gt;42&lt;/span&gt;&lt;span&gt;+ proxy_pass: &quot;https://quic-mesh:8443&quot;;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-split-line&quot;&gt;&lt;span class=&quot;ds-split-line__num&quot;&gt;43&lt;/span&gt;&lt;span&gt;  timeout_ms: 5000;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;DualPaneCodeDiff fileName=&quot;config/router.rs&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 左右行高严格对齐不产生错位\u003c/li>\u003cli>□ 删除与新增行代码色彩辨识度高\u003c/li>\u003cli>□ 代码字号等宽且单行自适应截断\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/code","title":"代码与日志","html":"\u003ch1>代码与日志\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>展示可选择、复制的技术内容，控制敏感信息暴露。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>语言或日志等级\u003c/li>\u003cli>可选复制动作\u003c/li>\u003cli>等宽内容\u003c/li>\u003cli>横向滚动区域\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>滚动区域可 Tab；复制按钮可 Enter；日志不频繁抢焦点。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>默认脱敏 token、password、uuid 等敏感值。\u003c/li>\u003cli>DOM 使用 textContent 或转义，不将订阅作为 HTML。\u003c/li>\u003cli>不要把代码中的内容当作系统命令自动执行。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;pre class=&quot;ds-code&quot; tabindex=&quot;0&quot; aria-label=&quot;示例日志&quot;&gt;[info] Controller ready\n[info] Subscription imported: 19 nodes\n[info] Credentials: [redacted]&lt;/pre&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 内容可选择复制\u003c/li>\u003cli>□ 脚本字符显示为文字\u003c/li>\u003cli>□ 复制失败有替代办法\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/color-opacity-slider","title":"棋盘格透明度 Alpha 调色滑杆","html":"\u003ch1>棋盘格透明度 Alpha 调色滑杆\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma 与 Sketch 专业设计工具级别的 Alpha 透明度调节滑块；集成国际标准灰白微棋盘格透明度底图、当前基色到透明的渐变图层、圆形定位微滑块与实时百分比。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>棋盘格底层背景 (.ds-checkerboard / conic-gradient)\u003c/li>\u003cli>基准色透明度水平线性渐变层\u003c/li>\u003cli>外圈高对比描边圆滑块\u003c/li>\u003cli>底部标签与等宽实时透明度百分比\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦透明度滑动控件；左右方向键以 1% 精细调整；PageUp / PageDown 跨步 10% 调节；Home / End 直达 0% 与 100%。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>棋盘格底层使用纯 CSS conic-gradient 绘制 8px 像素单元，彻底免除外部图片请求。\u003c/li>\u003cli>渐变层通过 --ds-alpha-color 动态注入当前选中的 Hex/HSL 基准色。\u003c/li>\u003cli>透明度数值严格采用等宽字体与 tabular-nums，百分比数值变化时整体排版不抖动。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-alpha-slider&quot; role=&quot;region&quot; aria-label=&quot;透明度滑杆&quot; style=&quot;--ds-alpha-color:#00ffff;--ds-alpha-pos:75%&quot;&gt;&lt;div class=&quot;ds-alpha-slider__track&quot;&gt;&lt;div class=&quot;ds-alpha-slider__gradient&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-alpha-slider__thumb&quot;&gt;&lt;/div&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;75&quot; class=&quot;ds-alpha-slider__input&quot; aria-label=&quot;Alpha 透明度&quot; id=&quot;alpha-slider-input-batch12&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-alpha-slider__footer&quot;&gt;&lt;span&gt;Alpha 透明度&lt;/span&gt;&lt;span class=&quot;ds-alpha-slider__val&quot;&gt;75%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;AlphaColorSlider value={75} baseColor=&quot;#00ffff&quot; label=&quot;Alpha 透明度&quot; onChange={setAlpha} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 棋盘格图案在浅色与深色主题下均清晰可辨\u003c/li>\u003cli>□ 滑块精准映射实际透明度百分比\u003c/li>\u003cli>□ 拖拽滑动过程中 120fps 无掉帧重排\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/color-picker-wheel","title":"取色盘色相渐变条","html":"\u003ch1>取色盘色相渐变条\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Linear 与 Figma 风格的轻量紧凑调色小组件；带有 360 度彩虹色相连续轨道、定位游标、色块实时预览与 Hex 输入框。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>连续全色相彩虹渐变轨道\u003c/li>\u003cli>可拖动或点击的白色定位圆滑块\u003c/li>\u003cli>当前选定色块圆形/圆角预览窗\u003c/li>\u003cli>十六进制/HSL 数值代码微输入框\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 导航至渐变轨或输入框；方向键可微调选定色相；Enter 确认应用颜色。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>渐变轨采用 CSS 原生 linear-gradient，避免加载任何庞大 canvas 库或图片。\u003c/li>\u003cli>滑块通过 left: var(--ds-color-pos) 驱动，支持点击任意位置直接吸附色相。\u003c/li>\u003cli>等宽字体输入框确保 6 位 Hex 码清晰整齐，便于直接复制或粘贴。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-color-ring&quot; role=&quot;region&quot; aria-label=&quot;色相选择器&quot;&gt;&lt;div class=&quot;ds-color-ring__strip&quot; role=&quot;slider&quot; aria-label=&quot;色相条&quot; tabindex=&quot;0&quot;&gt;&lt;div class=&quot;ds-color-ring__thumb&quot; style=&quot;left:38%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-color-ring__row&quot;&gt;&lt;div class=&quot;ds-color-ring__preview&quot; style=&quot;background:#00e5ff&quot;&gt;&lt;/div&gt;&lt;input type=&quot;text&quot; class=&quot;ds-color-ring__input&quot; value=&quot;#00e5ff&quot; aria-label=&quot;颜色 Hex 代码&quot;&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;ColorPickerWheel color=&quot;#00e5ff&quot; onChange={setColor} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 色相渐变条平滑无断层色带\u003c/li>\u003cli>□ 滑块居中对齐且有高对比描边\u003c/li>\u003cli>□ Hex 代码输入框支持双向数据同步\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/color-swatches","title":"色样选择器","html":"\u003ch1>色样选择器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS 系统偏好与 Figma 风格的圆形色样调色盘；用于个性化主题色、节点标签颜色与分类标识选择。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>水平色盘行\u003c/li>\u003cli>圆形色块单选按钮\u003c/li>\u003cli>1px 内嵌镜面边缘\u003c/li>\u003cli>选中状态白色勾选符号 (✓)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 进入色盘组；左右方向键选择色块；Enter 或 Space 确认选择。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>每个圆盘使用 CSS 变量 --ds-swatch-c 驱动，结构与样式完全解耦。\u003c/li>\u003cli>选中时外圈呈现 focus 强调环，内部呈现对比鲜明的微对勾。\u003c/li>\u003cli>悬停时具备微膨胀触感（scale(1.18)）。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-swatches&quot; role=&quot;radiogroup&quot; aria-label=&quot;主题基色选择&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-swatch-item is-active&quot; style=&quot;--ds-swatch-c:#3B82F6&quot; aria-label=&quot;科技蓝&quot; aria-checked=&quot;true&quot; data-toast=&quot;已选科技蓝&quot;&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-swatch-item&quot; style=&quot;--ds-swatch-c:#10B981&quot; aria-label=&quot;翡翠绿&quot; aria-checked=&quot;false&quot; data-toast=&quot;已选翡翠绿&quot;&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-swatch-item&quot; style=&quot;--ds-swatch-c:#F59E0B&quot; aria-label=&quot;琥珀金&quot; aria-checked=&quot;false&quot; data-toast=&quot;已选琥珀金&quot;&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-swatch-item&quot; style=&quot;--ds-swatch-c:#EF4444&quot; aria-label=&quot;宝石红&quot; aria-checked=&quot;false&quot; data-toast=&quot;已选宝石红&quot;&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-swatch-item&quot; style=&quot;--ds-swatch-c:#8B5CF6&quot; aria-label=&quot;幻紫&quot; aria-checked=&quot;false&quot; data-toast=&quot;已选幻紫&quot;&gt;&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;ColorSwatches colors={presetColors} activeColor=&quot;#3B82F6&quot; onChange={setColor} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 每个色样均拥有独立的无障碍 aria-label 颜色说明\u003c/li>\u003cli>□ 单选组键盘左右键无障碍循环\u003c/li>\u003cli>□ 选中勾选在不同明度颜色下清晰易辨\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/command-breadcrumb","title":"指令面包屑路径","html":"\u003ch1>指令面包屑路径\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Raycast 与 macOS Finder 风格的分层路径导航器；用于快速定位、跳转多级页面或复制层级结构。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>层级微标签胶囊\u003c/li>\u003cli>斜杠/箭头路径分隔符\u003c/li>\u003cli>当前激活末级节点\u003c/li>\u003cli>交互式快捷复制动作\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 遍历每一级父节点链接；Enter 导航跳转至该层级；末节点不可聚焦。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>内陷式 (ds-inset) 背景配合微弱细描边，与主内容区自然区隔。\u003c/li>\u003cli>鼠标悬停时轻微上浮 (translateY(-1px))，强化可点交互意图。\u003c/li>\u003cli>支持键盘快速跳转与辅助设备语义识别。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;nav aria-label=&quot;层级面包屑&quot;&gt;&lt;ol class=&quot;ds-breadcrumb&quot;&gt;&lt;li class=&quot;ds-breadcrumb__item&quot;&gt;&lt;a class=&quot;ds-breadcrumb__link&quot; href=&quot;#&quot; data-toast=&quot;返回工作区&quot;&gt;&lt;span&gt;工作区&lt;/span&gt;&lt;/a&gt;&lt;/li&gt;&lt;li class=&quot;ds-breadcrumb__item&quot;&gt;&lt;span class=&quot;ds-breadcrumb__sep&quot; aria-hidden=&quot;true&quot;&gt;/&lt;/span&gt;&lt;a class=&quot;ds-breadcrumb__link&quot; href=&quot;#&quot; data-toast=&quot;返回网络配置&quot;&gt;&lt;span&gt;网络配置&lt;/span&gt;&lt;/a&gt;&lt;/li&gt;&lt;li class=&quot;ds-breadcrumb__item is-current&quot;&gt;&lt;span class=&quot;ds-breadcrumb__sep&quot; aria-hidden=&quot;true&quot;&gt;/&lt;/span&gt;&lt;span class=&quot;ds-breadcrumb__link&quot; aria-current=&quot;page&quot;&gt;&lt;span&gt;路由分流规则&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/nav&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;CommandBreadcrumb items={[{label: &quot;工作区&quot;}, {label: &quot;网络&quot;, href: &quot;#&quot;}, {label: &quot;路由&quot;, isCurrent: true}]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 分割线视觉轻量不干扰阅读\u003c/li>\u003cli>□ 悬浮微动效不产生布局位移\u003c/li>\u003cli>□ 末级页面正确标记 aria-current\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/command-menu","title":"指令面板","html":"\u003ch1>指令面板\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS Spotlight 与现代极客工具的核心入口；支持键盘全局唤出，即时模糊过滤导航、操作与设置。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>全屏居中悬浮框\u003c/li>\u003cli>实时过滤输入栏\u003c/li>\u003cli>分组命令列表\u003c/li>\u003cli>底栏按键提示\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>全局 ⌘K / Ctrl+K 呼出；方向键 ↑/↓ 移动高亮；Enter 触发命令；Escape 立即退出。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>支持拼音、英文与快捷词模糊匹配。\u003c/li>\u003cli>按类别分组（如“常用动作”、“节点切换”、“系统偏好”）。\u003c/li>\u003cli>高亮条目保持高对比度与平滑跟随，不产生滚动撕裂。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-toolbar&quot;&gt;&lt;button class=&quot;ds-button ds-button--secondary&quot; data-open-command&gt;呼出指令面板 &lt;kbd class=&quot;ds-key&quot; style=&quot;margin-left:6px&quot;&gt;⌘K&lt;/kbd&gt;&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;CommandMenu open={open} onClose={() =&gt; setOpen(false)} items={commands} onSelect={run} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ Ctrl+K / ⌘K 均可唤出指令面板\u003c/li>\u003cli>□ 上下方向键切换高亮项且不触发页面滚动\u003c/li>\u003cli>□ 执行动作后自动关闭面板并给予结果反馈\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/command-palette-modal","title":"Raycast & Linear 全局悬浮指令面板","html":"\u003ch1>Raycast &amp; Linear 全局悬浮指令面板\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Raycast 与 Linear 风格的全局模态指令控制面板；集成模糊搜索输入框、分组操作列表、高亮选中行与右侧快捷键徽章。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>磨砂高斯模糊悬浮弹窗 (.ds-cmd-dialog)\u003c/li>\u003cli>顶部集成搜索栏 (.ds-cmd-dialog__search)\u003c/li>\u003cli>分组类别标题 (.ds-cmd-group-title)\u003c/li>\u003cli>快捷指令操作行 (.ds-cmd-row)\u003c/li>\u003cli>右侧快捷键提示 (.ds-kbd)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>上下方向键在指令列表间导航；Enter 执行当前指令；Escape 关闭指令面板。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>面板采用 backdrop-filter: blur(24px) 拟真多层材质，配合深色大范围扩散阴影带来绝佳悬浮层级感。\u003c/li>\u003cli>选中行切换仅改变背景与强调色，不发生布局抖动或跳动。\u003c/li>\u003cli>输入框内置自动聚焦，键盘上下键循环选择高亮。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-cmd-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;全局指令搜索面板&quot;&gt;&lt;div class=&quot;ds-cmd-dialog__search&quot;&gt;&lt;span aria-hidden=&quot;true&quot;&gt;⌘&lt;/span&gt;&lt;input type=&quot;text&quot; class=&quot;ds-cmd-dialog__input&quot; placeholder=&quot;输入命令或搜索...&quot; value=&quot;Deploy&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-cmd-dialog__list&quot;&gt;&lt;span class=&quot;ds-cmd-group-title&quot;&gt;建议操作&lt;/span&gt;&lt;div class=&quot;ds-cmd-row is-active&quot;&gt;&lt;div class=&quot;ds-cmd-row__lead&quot;&gt;&lt;span&gt;⚡&lt;/span&gt;&lt;span&gt;执行边缘集群热部署&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-kbd&quot;&gt;⌘B&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-cmd-row&quot;&gt;&lt;div class=&quot;ds-cmd-row__lead&quot;&gt;&lt;span&gt;🔍&lt;/span&gt;&lt;span&gt;搜索全局代码与符号...&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-kbd&quot;&gt;⌘P&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-cmd-row&quot;&gt;&lt;div class=&quot;ds-cmd-row__lead&quot;&gt;&lt;span&gt;🌙&lt;/span&gt;&lt;span&gt;切换界面主题配色&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-kbd&quot;&gt;⌘T&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;CommandPaletteModal onSelect={handleSelect} onClose={handleClose} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 弹窗在不同视口宽度下自动适配居中\u003c/li>\u003cli>□ 高亮选中行背景与强调色柔和清晰\u003c/li>\u003cli>□ 快捷键标签尺寸规范无折行\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/compare-slider","title":"前后效果对比滑块","html":"\u003ch1>前后效果对比滑块\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 媒体 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma 与设计系统工具风格的双重视图滑块比对器；用于直观审查原图 vs 滤镜、明暗主题或优化前后差异。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>底层前视图 (Before Layer)\u003c/li>\u003cli>顶层后视图 (After Layer)\u003c/li>\u003cli>居中裁切隔离分割线\u003c/li>\u003cli>带指示箭头的圆形拖动手柄\u003c/li>\u003cli>左右角标文字标签\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 获得对比滑块焦点；通过键盘 Left / Right 方向键以 1% 精细步长滑动裁切位置。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>基于 clip-path: inset() 纯 GPU 加速裁剪，无视容器宽高重绘，性能丝滑。\u003c/li>\u003cli>手柄居中阴影扩散，与任何明暗对比底图均能清晰分离。\u003c/li>\u003cli>隐藏原生范围滑块覆盖整层，触控与鼠标拖拽皆 100% 灵敏顺应。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-compare&quot; style=&quot;--ds-compare-pos:50%&quot;&gt;&lt;div class=&quot;ds-compare__layer ds-compare__layer--before&quot; style=&quot;background:#1e1e2e;color:#89b4fa;font-family:var(--ds-type-mono);font-size:15px;font-weight:700&quot;&gt;&lt;span&gt;BEFORE: 原始渲染模式 (48 FPS)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-compare__layer ds-compare__layer--after&quot; style=&quot;background:#020905;color:#10b981;font-family:var(--ds-type-mono);font-size:15px;font-weight:700&quot;&gt;&lt;span&gt;AFTER: 矩阵超频模式 (120 FPS)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-compare__divider&quot;&gt;&lt;div class=&quot;ds-compare__handle&quot; aria-hidden=&quot;true&quot;&gt;↔&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;ds-compare__badge ds-compare__badge--before&quot;&gt;原始模式&lt;/span&gt;&lt;span class=&quot;ds-compare__badge ds-compare__badge--after&quot;&gt;超频优化&lt;/span&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot; class=&quot;ds-compare__range&quot; aria-label=&quot;渲染对比滑块&quot; oninput=&quot;this.parentElement.style.setProperty(&#39;--ds-compare-pos&#39;, this.value + &#39;%&#39;)&quot;&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;CompareSlider beforeContent={&lt;LegacyView /&gt;} afterContent={&lt;ModernView /&gt;} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 滑块拖动无卡顿重排延迟\u003c/li>\u003cli>□ 左右角标文字在对比底图上清晰可读\u003c/li>\u003cli>□ 键盘方向键支持精细滑动控制\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/copilot-diff-inline-badge","title":"GitHub Copilot 行内代码变更建议微标","html":"\u003ch1>GitHub Copilot 行内代码变更建议微标\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub Copilot、Cursor 与 Claude Code 风格的行内代码补全与差异修改建议操作浮条；包含增删行数统计（+14 -3）、采纳与拒绝快捷操作按键。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>等宽浮条微容器 (.ds-diff-badge)\u003c/li>\u003cli>新增与删除行数统计 (.ds-diff-badge__stat)\u003c/li>\u003cli>细垂直分割线 (.ds-diff-badge__divider)\u003c/li>\u003cli>快捷操作按钮组 (.ds-diff-badge__actions)\u003c/li>\u003cli>采纳与忽略彩色小按钮 (.ds-diff-badge__btn--accept, --reject)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在采纳和拒绝按钮间移动；Enter 或快捷键 Tab 采纳代码建议；Escape 忽略建议。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>绿色表示增行，红色表示删行，严格使用等宽数字，避免文本长度变化引起弹跳。\u003c/li>\u003cli>按钮采用对应半透明色（--ds-success-soft / --ds-danger-soft），保持视觉轻量不喧宾夺主。\u003c/li>\u003cli>适合代码编辑器行内提示、AI 补全浮层、Git 审查行内评论工具。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-diff-badge&quot; role=&quot;group&quot; aria-label=&quot;代码变更建议：增加 14 行，删除 3 行&quot;&gt;&lt;div class=&quot;ds-diff-badge__stat&quot;&gt;&lt;span class=&quot;ds-diff-badge__stat--add&quot;&gt;+14&lt;/span&gt;&lt;span class=&quot;ds-diff-badge__stat--del&quot;&gt;−3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-diff-badge__divider&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-diff-badge__actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-diff-badge__btn ds-diff-badge__btn--accept&quot; aria-label=&quot;采纳建议&quot;&gt;✓ 采纳&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-diff-badge__btn ds-diff-badge__btn--reject&quot; aria-label=&quot;拒绝建议&quot;&gt;× 忽略&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;CopilotDiffInlineBadge additions={14} deletions={3} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 增删统计数字与按钮水平对齐\u003c/li>\u003cli>□ 采纳拒绝按钮悬停明度微增\u003c/li>\u003cli>□ 键盘回车可顺利触发操作\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/credit-card-preview","title":"拟物 Apple Card 质感卡片","html":"\u003ch1>拟物 Apple Card 质感卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple Card 与 Stripe 拟物卡片组件；带有金色微芯片、非接触式射频波形标、凸印隐秘卡号、持卡人姓名、有效期以及悬停 3D 俯仰与微镜面扫光反射 (.ds-card-sheen)。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>16px 圆角高光卡片本体\u003c/li>\u003cli>金色集成电路安全芯片矢量模块\u003c/li>\u003cli>无触感射频徽标\u003c/li>\u003cli>等宽间距脱敏卡号 (•••• 8848)\u003c/li>\u003cli>持卡人姓名与有效期 (VALID THRU)\u003c/li>\u003cli>斜向镜面微反光光泽层 (.ds-card-sheen)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦卡片；Enter 打开卡片详情与安全码查看弹窗；悬停触发 translateY(-4px) 3D 浮动。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>卡片采用 260px × 154px 的 ISO 7810 ID-1 黄金比例（约 1.586:1）。\u003c/li>\u003cli>芯片采用金色微渐变与内阴影，高度还原真实物理智能芯片的质感。\u003c/li>\u003cli>反光微层使用线性 45 度半透明白色渐变，营造出类似钛金属与磨砂聚合物的高级光影。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-bank-card ds-card-sheen&quot; role=&quot;region&quot; aria-label=&quot;企业钛金虚拟卡&quot; tabindex=&quot;0&quot; data-toast=&quot;查看虚拟卡详情&quot;&gt;&lt;div class=&quot;ds-bank-card__top&quot;&gt;&lt;div class=&quot;ds-bank-card__chip&quot;&gt;&lt;/div&gt;&lt;span class=&quot;ds-bank-card__wave&quot; aria-hidden=&quot;true&quot;&gt;无线感应 🛈&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-bank-card__number&quot;&gt;•••• •••• •••• 8848&lt;/div&gt;&lt;div class=&quot;ds-bank-card__bottom&quot;&gt;&lt;span class=&quot;ds-bank-card__holder&quot;&gt;ALEX CHEN&lt;/span&gt;&lt;span class=&quot;ds-bank-card__exp&quot;&gt;VALID THRU 09/29&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SkeuoBankCard holder=&quot;ALEX CHEN&quot; number=&quot;•••• •••• •••• 8848&quot; exp=&quot;09/29&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 悬停 3D 俯仰转动平滑利落\u003c/li>\u003cli>□ 卡号与持卡人文字阴影自然真实\u003c/li>\u003cli>□ 深浅背景下卡片边缘与高光轮廓清晰\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/device-mockup-frame","title":"智能移动设备样机视窗","html":"\u003ch1>智能移动设备样机视窗\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple iPhone 16 Pro 与 Google Pixel 9 风格的移动端原生设备样机外框；带有拟物钛合金金属边框边缘高光、顶部灵动岛胶囊开孔、镜头反光与底部手势横条。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>36px 大超椭圆圆角设备外壳\u003c/li>\u003cli>顶部微型灵动岛传感器开孔与前置微镜头\u003c/li>\u003cli>自适应内容屏幕滚动区域\u003c/li>\u003cli>底部 Home 手势指示横条\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>外框作为预览容器本身提供可访问区域名称；容器内部元素正常流转键盘焦点。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>设备外边框使用 4px 实线与 2px 内部钛金高光双层视觉结构，高度还原真机手感。\u003c/li>\u003cli>灵动岛开孔采用纯黑底色与细小微镜头点缀，比例逼真精致。\u003c/li>\u003cli>适合在桌面端后台中作为移动端 Web 应用、小组件或设计稿的无损高保真沙盒。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-device-mockup&quot; role=&quot;region&quot; aria-label=&quot;移动设备预览&quot;&gt;&lt;div class=&quot;ds-device-mockup__island&quot;&gt;&lt;div class=&quot;ds-device-mockup__lens&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-device-mockup__screen&quot;&gt;&lt;div style=&quot;padding:10px;text-align:center&quot;&gt;&lt;span class=&quot;ds-badge ds-badge--success&quot;&gt;AetherLink iOS&lt;/span&gt;&lt;p style=&quot;font-size:12px;margin:12px 0;color:var(--ds-muted)&quot;&gt;已连接至东京节点 24ms&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;ds-button&quot; style=&quot;width:100%;font-size:11px;min-height:30px&quot; data-toast=&quot;测速完成&quot;&gt;立即测速&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-device-mockup__home&quot;&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;DeviceMockupFrame title=&quot;iOS 18 灵动岛预览&quot;&gt;&lt;div style={{padding:16,textAlign:&quot;center&quot;}}&gt;已连接&lt;/div&gt;&lt;/DeviceMockupFrame&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 设备大圆角平滑无锯齿断裂\u003c/li>\u003cli>□ 内部屏幕内容滚动时不溢出外壳\u003c/li>\u003cli>□ 灵动岛居中且遮挡比例精准\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/dialog","title":"对话框","html":"\u003ch1>对话框\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>需要集中注意或确认的短任务，优先采用原生 dialog。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>可读标题\u003c/li>\u003cli>正文\u003c/li>\u003cli>主要/取消动作\u003c/li>\u003cli>可访问关闭按钮\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>打开后焦点进入；Tab 留在模态范围；Escape 关闭；关闭后恢复触发按钮焦点。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>删除等危险场景把取消作为默认焦点。\u003c/li>\u003cli>长设置流程使用页面而不是不断堆叠弹窗。\u003c/li>\u003cli>dialog 使用 showModal，禁止仅以 display:block 伪造模态。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;button class=&quot;ds-button ds-button--secondary&quot; data-open-dialog&gt;打开对话框&lt;/button&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Dialog open={open} onClose={() =&gt; setOpen(false)} title=&quot;确认操作&quot;&gt;{content}&lt;/Dialog&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 背景不可交互\u003c/li>\u003cli>□ 标题可被读出\u003c/li>\u003cli>□ Escape 和关闭按钮都可用\u003c/li>\u003cli>□ 焦点返回触发按钮\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/diff","title":"差异比对视图","html":"\u003ch1>差异比对视图\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub PR 与 Git CLI 风格的代码/配置增删对比器；清晰标注新增行、删除行与上下文行。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>头部文件名与增减计数\u003c/li>\u003cli>行号安全边距 (Gutter)\u003c/li>\u003cli>增减符号标识符 (+ / -)\u003c/li>\u003cli>语法等宽代码正文\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>滚动条可获得焦点按方向键滚动；代码正文支持双击复制与全选。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>行号区域启用 user-select: none，避免复制时带入无意义行号。\u003c/li>\u003cli>新增行（绿色）与删除行（红色）使用极低透明度软底色，保证字迹对比度。\u003c/li>\u003cli>等宽字体统一使用 var(--ds-type-mono)。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-diff&quot; style=&quot;width:100%&quot;&gt;&lt;div class=&quot;ds-diff__header&quot;&gt;&lt;span&gt;tokens/web.json&lt;/span&gt;&lt;div style=&quot;display:flex;gap:6px&quot;&gt;&lt;span class=&quot;ds-badge ds-badge--success&quot;&gt;+1&lt;/span&gt;&lt;span class=&quot;ds-badge ds-badge--danger&quot;&gt;-1&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-diff__body&quot;&gt;&lt;div class=&quot;ds-diff-line ds-diff-line--del&quot;&gt;&lt;span class=&quot;ds-diff__num&quot;&gt;14&lt;/span&gt;&lt;span class=&quot;ds-diff__marker&quot;&gt;-&lt;/span&gt;&lt;code class=&quot;ds-diff__code&quot;&gt;&quot;timeout&quot;: 5000,&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;ds-diff-line ds-diff-line--add&quot;&gt;&lt;span class=&quot;ds-diff__num&quot;&gt;14&lt;/span&gt;&lt;span class=&quot;ds-diff__marker&quot;&gt;+&lt;/span&gt;&lt;code class=&quot;ds-diff__code&quot;&gt;&quot;timeout&quot;: 12000, // 优化高延迟抖动容限&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;ds-diff-line ds-diff-line--ctx&quot;&gt;&lt;span class=&quot;ds-diff__num&quot;&gt;15&lt;/span&gt;&lt;span class=&quot;ds-diff__marker&quot;&gt; &lt;/span&gt;&lt;code class=&quot;ds-diff__code&quot;&gt;&quot;maxConnections&quot;: 128&lt;/code&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;DiffViewer filename=&quot;tokens/web.json&quot; lines={diffLines} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 增减行文字对比度不低于 4.5:1\u003c/li>\u003cli>□ 代码复制时不夹带行号和标记符号\u003c/li>\u003cli>□ 横向超长行能水平平滑滚动\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/disclosure","title":"折叠面板","html":"\u003ch1>折叠面板\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>按需展示补充信息，避免默认页面堆积所有解释。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>summary 可见标题\u003c/li>\u003cli>details 内容\u003c/li>\u003cli>展开指示\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>原生 details/summary：Tab 聚焦标题；Enter/Space 切换。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>关键信息不藏在默认收起区。\u003c/li>\u003cli>单个信息块使用 details，不强制创建复杂 accordion。\u003c/li>\u003cli>展开状态不改变外部任务数据。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;details class=&quot;ds-panel&quot;&gt;&lt;summary&gt;高级配置说明&lt;/summary&gt;&lt;p&gt;修改端口前请停止代理，控制器与混
