>","group":"页面场景"},{"id":"patterns/network-client","title":"场景：连接客户端与订阅导入","html":"\u003ch1>场景：连接客户端与订阅导入\u003c/h1>\n\u003ch2>页面组合\u003c/h2>\n\u003cp>标题栏显示产品名称、实际内核状态和端口；侧栏提供仪表盘、节点、规则、连接和设置。仪表盘首先回答“是否连接”和“使用哪个节点”，其次展示实际流量，最后提供订阅导入。\u003c/p>\n\u003ch2>订阅任务\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"text示例\">\u003ccode>粘贴地址/内容 → 校验 → 下载（仅 HTTP/HTTPS）→ 解析 → 保存 → 节点列表\n                    失败 ───────────→ 保留输入 + 明确原因 + 重试\u003c/code>\u003c/pre>\n\u003cp>输入框同时接受分享 URI、Base64、多行 URI 和 Clash YAML。HTTP/HTTPS 地址由桌面主进程下载，避免浏览器跨域限制。下载按钮显示 busy 并禁用重复点击；下载失败和解析失败分开说明。\u003c/p>\n\u003ch2>成功反馈\u003c/h2>\n\u003cp>展示实际导入数量。没有有效节点时不清空已有数据。名称重复自动区分，活动节点选择保持稳定。地址及节点凭据不写日志。测试使用隔离用户数据，真实订阅不作为公开 fixture。\u003c/p>\n\u003ch2>连接任务\u003c/h2>\n\u003cp>先校验配置、确认代理和控制器端口、启动内核并等待健康检查；按用户设置启用系统代理；完成后显示运行中。失败清理内核并恢复系统代理。界面不能提前显示已连接。\u003c/p>\n\u003ch2>异常和退出\u003c/h2>\n\u003cp>主窗口关闭至托盘必须可恢复；安全退出要停止内核并恢复原设置。任务管理器强制结束不能保证退出回调执行，因此说明下次启动恢复行为，而不承诺所有崩溃都立即恢复。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cp>真实地址能下载并解析；HTTP 错误、空内容、HTML 和超时能提示；未连接模式不显示虚构流量；没有节点时说明需要导入；直连模式可以独立测试内核；修改主题不重启内核。\u003c/p>","group":"页面场景"},{"id":"patterns/personal-tracker","title":"个人桌面记录工具","html":"\u003ch1>个人桌面记录工具\u003c/h1>\n\u003cp>来源：2026-10-15 LeetCode 桌面工具设计迭代。此页记录可复用经验，不把单个产品偏好强加给所有产品。\u003c/p>\n\u003ch2>内容优先\u003c/h2>\n\u003cp>窗口使用产品名；个人单账号工具默认显示“已登录”，用户名放到确实需要区分账号的设置中。避免同时出现个人品牌、英文副标题、工作台面包屑和鼓励语。主标题写任务名称，主按钮写操作。\u003c/p>\n\u003cp>单一页面默认展示日期、三项核心指标、历史活动和当天明细。侧栏只放真实页面入口；若入口不足两个，优先评估移除侧栏。主界面无需重复解释采集架构。\u003c/p>\n\u003ch2>柔和配色\u003c/h2>\n\u003cp>参考暖纸张和低饱和陶土色，不复制外部产品品牌。可选样式 \u003ccode>web/warm-paper.css\u003c/code> 覆盖语义变量，需在默认主题后载入。单主题产品不展示没有需求的主题切换。强调色集中用于主操作、焦点和选中态；常规统计使用正文色。\u003c/p>\n\u003cp>柔和不等于低对比度。普通文本仍以 4.5:1 为验收目标，小字和禁用状态不能用同一颜色；热力图不能只靠颜色表达数量，应附日期与数量文本（键盘可访问提示或等价明细）。\u003c/p>\n\u003ch2>采集与同步状态\u003c/h2>\n\u003cul>\u003cli>未登录、尚未采集时使用未知值或明确说明范围，不能把缺少数据解释成真实的零。\u003c/li>\u003cli>有采集结果且当天无记录才显示零；首次导入有限制时必须说明覆盖范围。\u003c/li>\u003cli>区分“已获取到本地”和“已上传到网站”，分别显示时间，上传失败不清空本地数据。\u003c/li>\u003cli>时间统计明确时区；题数按题目去重，提交数按提交记录计数。\u003c/li>\u003cli>关闭到托盘与退出不同，保留明确退出操作。\u003c/li>\u003c/ul>\n\u003ch2>经验回流\u003c/h2>\n\u003cp>每次实际产品迭代后，将可复用模式、踩坑、验证范围记录到对应专题；只有重复出现或有实际需求时才提取组件。区分“实现并验证”“方案待验证”“单产品偏好”。不要把一次视觉选择变成全局强制规则，不在设计系统加入账号、密钥或真实提交记录。\u003c/p>\n\u003cp>本次已验证 Windows Electron 启动、设置保存、365 日网格和暖色样式；真实力扣登录采集、网站线上同步及完整无障碍验收尚待验证。\u003c/p>\n\u003ch2>历史记录迭代补充\u003c/h2>\n\u003cp>后续已验证中国站真实账号的历史分页、题目目录匹配和接口末页。经验：列表接口可能不提供题目链接，需要从当前题目目录补齐元数据，不能把缺失链接当成整批记录无效；详情接口逐条调用易触发限流，优先缓存目录并复用。分页导入每页保存，遇到访问限制等待后重试；“完整”以接口末页为依据，不能把批量上限写成完整历史。\u003c/p>\n\u003cp>复习场景默认展示去重题目，保留累计提交数与是否曾通过，并提供所有提交和日期视图、题号及题名搜索。一次通过后再次失败不能抹掉“曾通过”状态。该经验不包含用户实际题目或提交数据；网站同步与完整无障碍验收仍待验证。\u003c/p>\n\u003ch2>分页、日历与后台同步补充\u003c/h2>\n\u003cp>长记录采用固定页容量与页码；搜索、页容量或筛选变化时回到第一页，总页数变化时钳制当前页，禁用无法执行的上一页和下一页。默认采用较小的页容量，避免“显示更多”无限扩展内容高度。\u003c/p>\n\u003cp>热力图的颜色只映射一个明确指标；Accepted 提交次数不等同于去重通过题数。月份与星期提供定位，指针悬停和键盘聚焦显示日期与精确数量，点击某日进入当天记录。浅色与深色不能承担解释指标口径的责任。\u003c/p>\n\u003cp>登录收进紧凑账号入口；主页只保留实际指标与简短同步状态。后台同步使用状态灯和失败详情，不在每次成功后显示“操作完成”。“已同步”必须以服务端实际写入成功为前提。不同软件的数据空间与凭证独立，自动上传不能代替首次设备授权。\u003c/p>\n\u003ch2>动效参考补充\u003c/h2>\n\u003cp>参考用户提供的云顶战绩界面，只吸收按压与弹层的节奏，不复制视觉装饰。按钮按压约 110 ms，分页淡入与 6px 位移约 180 ms，弹层入场约 240 ms、离场约 130 ms。只变换 opacity/transform，快速操作取消前一动画，后台轮询仅在数据变化时更新列表，不重播同一状态。减少动效模式关闭这些动画，保留所有功能。\u003c/p>\n\u003cp>验证范围：Electron 分页容量、搜索后页码、日期数量提示、键盘可达提示、减少动效、真实云端写入与独立临时库恢复。并发编辑采用冲突保留，不宣称自动合并；未来设备的统一账号登录仍需单独实现。参考应用的目录数据库可能是旧副本，必须追踪快捷方式、入口脚本和实际运行数据路径后才迁移数据；统计时区分所有档案总数和当前账号/赛季数。\u003c/p>\n\u003cp>当前配对设备的自动同步与私有云端查看已通过实际打包版验证。同步状态必须区分“已配对”“同步中”“已同步”“待重试”；历史上曾同步成功并不代表现在连接健康。服务域名迁移可能遇到旧解析缓存，接口应固定可信来源并保留 TLS 校验，不能通过随意转发鉴权头或关闭证书检查掩盖连接失败。\u003c/p>\n\u003ch2>独立试用与安静保存\u003c/h2>\n\u003cp>公开工具与私人档案可采用不同权限：工具页面供访客使用，私人保存/导出由后端校验。未授权的正常访客进入本机记录模式，不强制跳转站长授权页，也不把 401 当网络故障无限重试。没有公开入口不能代替接口鉴权。后台管理站点可绑定同一数据空间，避免为接入控制台复制档案；访客记录不能自动进入站长档案。本轮已验证匿名页面返回成功、私人 API 拒绝、站长可读，以及两个站点读到同一份档案；跨浏览器和跨设备访客持久化仍受各自本机存储约束。\u003c/p>\n\u003cp>问题：直接在旧站试做新界面，会把试用与数据迁移混为一件事。新版试用宜使用独立来源、源码分支和数据空间；是否迁移是另一个决定，不能读取旧浏览器记录并默认上传。参考 App 的静态拆解只能支持已观察到的页面结构和字段，不能据此宣称像素级或完整功能还原。\u003c/p>\n\u003cp>本次私人健身试用选择“训练、动作、历史、我的”四入口，主页面只放日常任务，后台保存不展示基础设施面板。这是单产品偏好，不替代其他产品必要的失败反馈。安静保存仍需鉴权、版本条件写入、失败保留与自动重试；进行中的训练在原设备恢复。媒体未包含在记录接口中时，在备份页面说明当前设备存储的边界。\u003c/p>\n\u003cp>复用主题时，保留真正生效的外观控制；若主题覆盖了强调色，就移除无效的颜色选择。手机日历、底栏和模板列表需实际检查 390px 溢出和任务流程，不只看桌面截图。验证记录（2026-10-16）：独立接口鉴权和冲突测试、后台保存/失败重试测试、模板创建到完成训练及历史查看的浏览器流程、浅色/深色切换、手机与桌面布局已验证。iPhone 真机、长期离线、多设备真实并发和像素级一致性未验证。\u003c/p>\n\u003cp>回流验证：专题构建通过，动效校验与动效测试通过；设计系统完整验证在现有组件导出数量断言处失败（当时实际 105、预期 99），没有为本次文档回流改动组件源码或放宽断言。\u003c/p>\n\u003ch2>安装包素材引用与可浏览交付\u003c/h2>\n\u003cp>问题：大小写敏感的资源包在 Windows 落盘时，可能覆盖仅大小写不同的文件；提取目录的数量与可打开状态不足以证明素材完整。适用于 APK、ZIP 等跨文件系统资源迁移。决策：先检查归档条目的大小写冲突，按精确归档路径读取，以唯一编号或路径编码落盘，保留原路径与哈希对照；目录展示可识别动作名并提供搜索，不让用户逐个猜混淆文件名。\u003c/p>\n\u003cp>资源清单分清实际本地文件、包内文本、远程引用与依赖授权的内容。低分辨率动画不标为高清视频；界面写有“会员专享”不能证明正文或视频已随包打入。静态表达式未求值时保留证据，不用猜测值填补数据。\u003c/p>\n\u003cp>验证（2026-10-16）：一次 APK 资源恢复检查了归档路径冲突，直接读取原条目，对所有新输出逐项校验哈希并检查图片解码，建立中文动作和素材关联。未验证目标 App 运行页面、远程内容、会员可见范围或完整动画播放。本次为通用导入与交付原则，未修改组件或 Token 源码；不包含账号、密钥及私人业务数据。\u003c/p>\n\u003ch2>会员预览与内容分发边界\u003c/h2>\n\u003cp>问题：只在客户端截取前三条、加遮罩或隐藏按钮，不能保护已随安装包完整分发的文字与数据。适用于付费教程、会员动作讲解与素材预览。决策：明确公开预览、受保护正文与授权后离线缓存的边界；需要保密的正文由服务端鉴权返回。拥有终端的用户仍可能读取授权缓存，不把客户端加密宣称为绝对保护。\u003c/p>\n\u003cp>验证：一次安装包静态核查同时观察到本地完整讲解数据、预览组件截断前三条及付费提示，未请求业务接口。此为分发边界证据，不代表已验证线上会员归属、服务端漏洞或视频签名失效。公开页面返回 HTTP 200 时仍须核验正文结构，验证码页面不能记作下载成功。本次只更新专题文档，无组件或 Token 源码变更。\u003c/p>\n\u003cp>本地资料交付补充：用户要“直接看内容”时，优先提供可打开的浏览入口与可携带的原文件包，而非仅给资源清单。大素材集合按固定容量分页、延迟加载；详情保留原图尺寸，搜索覆盖中文名称、别名和分类。需支持直接打开的 HTML 宜内嵌索引并用相对路径引用素材，避免依赖 file 协议下受限制的 fetch；打包保留同一相对目录，界面不把远程引用呈现为可播放文件。\u003c/p>\n\u003cp>验证：一次离线内容库通过本机回环 HTTP 的浏览器检查，涵盖中文搜索、完整十条动作讲解、课程多图、空状态、分页、Escape 关闭与焦点恢复，以及 390px 无横向溢出；全部引用文件存在，压缩包另做 CRC 校验。浏览器工具拒绝 file 协议，因此没有把回环 HTTP 验证称为双击模式实测；跨浏览器与移动真机尚未验证。本次只更新专题文档，无组件源码改动。\u003c/p>\n\u003ch2>显式计量与记录复用\u003c/h2>\n\u003cp>问题：数量、显示单位与营养标示基准是不同维度，混在一个数字中会导致编辑或复用时重复换算。适用于食物份量、包装规格和其他按数量折算的个人记录。\u003c/p>\n\u003cp>决策：分别存储实际数量、计量单位、每份规格和统一计算基准；用户明确填写每份克数后才允许克／份换算，缺失值与明确的零分开。展示时舍入，内部换算保留精度；编辑沿用原记录 ID，删除保留可合并的删除标记。历史复用使用已验证的记录，不凭名称编造默认数值。\u003c/p>\n\u003cp>验证（2026-10-16）：手机端记录工具已测试 1.5 份 × 200g、每份160大卡得到240大卡，修改为1份后为160大卡且没有新增重复记录；验证换日隔离、刷新保留、删除与离线档案合并。259项相关回归通过，390px浏览器无横向溢出。未验证多台真实设备并发、移动真机和完整营养数据库；蓝色强调及卡片布局属于该产品偏好，不是共享主题要求。本次仅补充现有专题，无组件或Token源码改动。\u003c/p>\n\u003cp>工程交付隔离补充（2026-10-16）：可运行工程和抓包／逆向输入分别存放；交付目录只带运行所需源码与素材，原始安装包和分析工具保留在外部参考目录。独立文件夹还需验证Git元数据与依赖不是其他项目的worktree或junction。一次手机端记录工程分离已逐文件核对3,113个源码／素材文件哈希、独立安装依赖并构建通过；未因此声称线上部署已更新。此为工程交付原则，不改变共享视觉或组件源码。\u003c/p>","group":"页面场景"},{"id":"patterns/settings","title":"场景：设置和权限","html":"\u003ch1>场景：设置和权限\u003c/h1>\n\u003ch2>分组\u003c/h2>\n\u003cp>按照用户任务分为网络、系统集成、外观和关于，不按照源代码模块命名。设置标题解释作用，帮助文字说明什么时候生效。危险设置要说明影响。\u003c/p>\n\u003ch2>立即生效与保存生效\u003c/h2>\n\u003cp>主题和密度可以立即生效。需要重启连接的端口在连接期间禁用，帮助文字说明断开后可修改。多字段事务使用显式保存按钮；不要让一个表单混合两种生效方式却没有说明。\u003c/p>\n\u003ch2>验证\u003c/h2>\n\u003cp>端口必须整数 1–65535，控制器和代理端口不同；错误出现在字段附近，输入值保留。开关依赖后端确认时显示 pending，失败回到原状态。\u003c/p>\n\u003ch2>未实现功能\u003c/h2>\n\u003cp>开机自启动、TUN 或静默启动未实现时禁用，旁边显示“尚未支持”。不能只改变 checkbox 并提示“已开启”。如果只是概念预览，整块区域明确标明未生效。\u003c/p>\n\u003ch2>权限\u003c/h2>\n\u003cp>请求权限前说明真实功能和必要性，拒绝后提供替代路径。不要在阅读设置或打开页面时自动执行外部修改。\u003c/p>\n\u003ch2>私人数据的设备授权与恢复\u003c/h2>\n\u003cp>问题：仅提供软件令牌入口会使浏览器无法直接查看；只加设备凭证又可能在换机后锁住本人。适用于单人私人数据工作区的决策是：日常设备授权、独立备用恢复、管理端重置分开设计。恢复入口应在未授权状态可找到；管理权限是重新签发凭证的依据，不代表浏览器能自动识别网站拥有者。设备凭证过期、恢复会话到期、撤销与换机各自说明下一步。共享电脑上的免提示访问必须明确其 Windows 用户/浏览器使用边界。\u003c/p>\n\u003cp>软件同步凭证与站长凭证分开；旧客户端新增认证时，同时提供配对与失败提示。本机保存、等待上传、服务端确认三种状态不能混写。密钥不放在网址、静态资源、公开源码或维护文档中，维护代理不保留独立后门。保护需覆盖页面、数据接口及备用域名；私人数据渲染仍需防止脚本注入。\u003c/p>\n\u003cp>验证记录（2026-10-16）：已验证本机证书和恢复会话可读取、匿名和其他来源的请求被拒绝、证书撤销/错误指纹和会话篡改/过期测试、应用令牌隔离、配对验证失败不保存、旧客户端未配对保留本机数据。设备证书优先是本次单产品选择，不作为所有产品的默认登录方式。未验证边界：浏览器完全无提示、其他浏览器/操作系统的证书选择，以及真实丢机后的完整管理端恢复演练；系统策略写入失败时不能显示“自动进入已配置”。本次专题构建通过，设计系统完整测试在既有组件数量校验处失败（实际 81、预期 75），未改写该计数来掩盖问题。\u003c/p>\n\u003ch2>关于\u003c/h2>\n\u003cp>显示真实版本和已验证能力。内核版本从 API 获取，无法获取时显示未知；不填固定的旧版本和随机内存数据。帮助链接和退出托盘说明应可找到。\u003c/p>","group":"页面场景"},{"id":"patterns/subscription-groups","title":"订阅与节点分组","html":"\u003ch1>订阅与节点分组\u003c/h1>\n\u003ch2>导航\u003c/h2>\n\u003cp>订阅页管理来源；节点页选择线路。每个来源独立显示名称、节点数、最近更新时间，并提供更新、重命名、删除、查看节点。地址只展示主机名，不在列表中显示访问令牌。名称可编辑；未命名来源按导入顺序编号。\u003c/p>\n\u003ch2>数据归属\u003c/h2>\n\u003cp>远程来源通过 subscriptionId 关联节点。直接粘贴的单节点与无法确认来源的历史节点归入「手动添加」。旧节点优先按原始链接与协议、端点、凭据匹配来源。提供商轮换域名与凭据时，只对旧节点集合进行匹配：至少三个节点，唯一名称集合覆盖不低于 95%；剩余动态流量标签只有去除数字后唯一匹配才恢复。无法匹配的节点仍保留。新版本手动节点不自动迁移。节点页支持全部来源、单个订阅和手动节点，并在全部视图中分节显示。\u003c/p>\n\u003ch2>更新\u003c/h2>\n\u003cp>相同 URL 再次导入更新已有来源。成功时仅替换本来源节点；失败保留原节点；同一 URL 的并发请求合并。按协议、服务器、端口与凭据匹配旧节点，保留仍有效的活动线路。请求途中删除来源后，响应不得重新创建来源。\u003c/p>\n\u003ch2>简洁文案\u003c/h2>\n\u003cp>默认展示可操作信息，格式说明和技术细节放到文档。导入失败仅在字段附近显示一次。订阅删除需确认范围，不能影响其他来源。节点名称允许跨来源重复，内核名称保持全局唯一。\u003c/p>\n\u003ch2>自定义名称\u003c/h2>\n\u003cp>订阅标题提供「改名」操作。节点原始名称 displayName 与用户别名 customName 分开保存，显示优先使用别名，内核标识做全局去重。刷新通过稳定凭据或本来源唯一原名匹配旧节点，保留其别名与选择；恢复原名只清除别名，不改供应商内容。\u003c/p>\n\u003ch2>连接前测速\u003c/h2>\n\u003cp>可以在未连接时批量测试当前来源的延迟，逐条更新结果，支持取消并按延迟排序。测速使用独立临时内核，不改变主连接、系统代理或首选端口。界面应区分未测试、超时与毫秒值，不能把延迟测试称作下载带宽测试。\u003c/p>","group":"页面场景"},{"id":"README","title":"Modern AI Design System v3 实施手册","html":"\u003ch1>Modern AI Design System v3 实施手册\u003c/h1>\n\u003cp>这是一套用于真实产品的设计和工程约定。v3 增加语义主题、可运行的 Web 组件、React 封装和逐组件验收；原有原生平台产物继续保留。文档的“应当”是系统约定，不代表用户在本次对话中发出了额外命令。\u003c/p>\n\u003ch2>阅读顺序\u003c/h2>\n\u003col>\u003cli>\u003ca href=\"#guides/foundations\">基础视觉与层级\u003c/a>：确定页面骨架和内容优先级。\u003c/li>\u003cli>\u003ca href=\"#guides/themes\">主题与密度\u003c/a>、\u003ca href=\"#guides/token-reference\">完整 Token 表\u003c/a>：选择角色而不是抄色值。\u003c/li>\u003cli>\u003ca href=\"#组件目录\">组件目录\u003c/a>：按任务选组件，再检查状态和键盘行为。\u003c/li>\u003cli>\u003ca href=\"#guides/states\">异步状态\u003c/a>、\u003ca href=\"#guides/accessibility\">无障碍\u003c/a>：保证失败、等待和键盘路径完整。\u003c/li>\u003cli>\u003ca href=\"#guides/react\">React 接入\u003c/a>、\u003ca href=\"#guides/platforms\">跨平台边界\u003c/a>、\u003ca href=\"#guides/migration\">迁移\u003c/a>：把规范接到实际工程。\u003c/li>\u003cli>\u003ca href=\"#guides/quality\">交付检查\u003c/a>：记录已验证的能力，避免宣称未测试的平台支持。\u003c/li>\u003c/ol>\n\u003ch2>专题\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"#guides/layout\">布局与响应式\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guides/motion\">动效与性能\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guides/content\">文字、错误与隐私\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guides/data\">数据与图表\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guides/assets\">图标与资源\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guides/internationalization\">国际化\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guides/governance\">版本与维护\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guides/review\">设计评审清单\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#guides/sources\">官方来源与解释边界\u003c/a>\u003c/li>\u003c/ul>\n\u003ch2>页面场景\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"#patterns/personal-tracker\">个人桌面记录工具\u003c/a>：精简信息、柔和配色、采集与同步状态、经验回流\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003ca href=\"#patterns/network-client\">连接客户端与订阅导入\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#patterns/subscription-groups\">订阅与节点分组\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#patterns/data-workspace\">列表、搜索与筛选工作区\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#patterns/settings\">设置、权限与未实现功能\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#patterns/ai-workspace\">AI 对话与生成任务\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#patterns/live-telemetry\">实时 GPU／服务器监控\u003c/a>：采样生命周期、使用账号、未知与零值、桌面动效\u003c/li>\u003c/ul>\n\u003ch2>组件目录\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">类别\u003c/th>\u003cth scope=\"col\">文档\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>操作\u003c/td>\u003ctd>\u003ca href=\"#components/apple-vision-spatial-hover-halo-ring\">VisionOS 空间注视焦点光环按钮\u003c/a>、\u003ca href=\"#components/ios-focus-mode-status-chip\">iOS 18 锁屏与控制中心专注模式胶囊\u003c/a>、\u003ca href=\"#components/ios-action-slider-unlock\">iOS 18 经典滑动确认与解锁滑槽\u003c/a>、\u003ca href=\"#components/terminal-key-badge-sequence\">Vim &amp; Emacs 连续多段按键动作链徽标\u003c/a>、\u003ca href=\"#components/raycast-quick-ai-chip\">Raycast &amp; Perplexity 灵动 AI 快捷操作胶囊\u003c/a>、\u003ca href=\"#components/android-material-segmented-button\">Android 15 Material 3 连体分段按钮组\u003c/a>、\u003ca href=\"#components/linear-command-hotkey-badge\">Linear 触觉拟物键帽快捷键徽标\u003c/a>、\u003ca href=\"#components/button\">按钮\u003c/a>、\u003ca href=\"#components/icon-button\">图标按钮\u003c/a>、\u003ca href=\"#components/speed-dial\">浮动扩展快捷轮盘\u003c/a>、\u003ca href=\"#components/fab\">悬浮操作按钮\u003c/a>、\u003ca href=\"#components/split-button\">组合分裂按钮\u003c/a>、\u003ca href=\"#components/chip\">交互胶囊\u003c/a>、\u003ca href=\"#components/reaction-group\">互动反应气泡\u003c/a>、\u003ca href=\"#components/rating\">评级星级\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>表单\u003c/td>\u003ctd>\u003ca href=\"#components/macos-safari-reader-font-switcher\">Safari 阅读器字体与版式选择微面板\u003c/a>、\u003ca href=\"#components/figma-canvas-nudge-scrubber\">Figma 属性标签横向拖拽数值微调输入框\u003c/a>、\u003ca href=\"#components/mac-touch-bar-slider-scrub\">MacBook Pro OLED Touch Bar 触控动态滑块\u003c/a>、\u003ca href=\"#components/figma-canvas-color-swatch-chip\">Figma 设计变量色彩微芯片色样标签\u003c/a>、\u003ca href=\"#components/apple-vision-spatial-input-field\">VisionOS 空间拟物浮空毛玻璃单行文本输入框\u003c/a>、\u003ca href=\"#components/apple-vision-spatial-stepper\">VisionOS 3D 浮动触觉景深数字微调步进器\u003c/a>、\u003ca href=\"#components/ios-segmented-control-slider\">iOS 18 弹性滑块分段胶囊选择器\u003c/a>、\u003ca href=\"#components/figma-canvas-color-picker-eyedropper\">Figma 9×9 像素网格画布放大取色镜\u003c/a>、\u003ca href=\"#components/apple-vision-spatial-checkbox\">Apple VisionOS 空间磨砂玻璃全息复选框\u003c/a>、\u003ca href=\"#components/linear-filter-popover\">Linear &amp; Notion 多条件筛选规则微面板\u003c/a>、\u003ca href=\"#components/apple-vision-spatial-slider\">Apple VisionOS 空间浮空景深音量滑块\u003c/a>、\u003ca href=\"#components/ios-passcode-keypad\">iOS 18 锁屏触感磨砂玻璃数字键盘\u003c/a>、\u003ca href=\"#components/macos-color-matrix-palette\">macOS 数码测色计 32 色阵列取色板\u003c/a>、\u003ca href=\"#components/linear-command-shortcut-input\">Linear &amp; Raycast 热键组合录制输入框\u003c/a>、\u003ca href=\"#components/audio-dj-crossfader\">Pioneer DJ 硬件双通道触觉交叉推子\u003c/a>、\u003ca href=\"#components/linear-issue-priority-menu\">Linear 触觉多级工单优先级选择微面板\u003c/a>、\u003ca href=\"#components/ios-action-toggle-row\">iOS 18 分组操作开关行\u003c/a>、\u003ca href=\"#components/biometric-fingerprint-wave\">Android 15 屏下指纹超声波水波纹触感核验器\u003c/a>、\u003ca href=\"#components/interactive-numpad\">iOS / Android 锁屏触感数字拨号键盘\u003c/a>、\u003ca href=\"#components/circular-slider-dial\">旋钮环形温控角度刻度盘\u003c/a>、\u003ca href=\"#components/waveform-scrubber\">音频波形交互进度滑杆\u003c/a>、\u003ca href=\"#components/color-opacity-slider\">棋盘格透明度 Alpha 调色滑杆\u003c/a>、\u003ca href=\"#components/haptic-slider\">触觉厚胶囊物理滑杆\u003c/a>、\u003ca href=\"#components/color-picker-wheel\">取色盘色相渐变条\u003c/a>、\u003ca href=\"#components/field\">输入框\u003c/a>、\u003ca href=\"#components/pin-input\">独立六位密钥输入框\u003c/a>、\u003ca href=\"#components/dropzone\">文件拖拽上传区\u003c/a>、\u003ca href=\"#components/prompt-input\">AI 提示词输入框\u003c/a>、\u003ca href=\"#components/kbd-matrix\">快捷键矩阵画板\u003c/a>、\u003ca href=\"#components/color-swatches\">色样选择器\u003c/a>、\u003ca href=\"#components/textarea\">多行输入\u003c/a>、\u003ca href=\"#components/select\">选择器\u003c/a>、\u003ca href=\"#components/slider\">滑块调节器\u003c/a>、\u003ca href=\"#components/switch\">开关\u003c/a>、\u003ca href=\"#components/checkbox\">复选框\u003c/a>、\u003ca href=\"#components/radio\">单选项\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>导航\u003c/td>\u003ctd>\u003ca href=\"#components/figma-canvas-pixel-grid-toggle\">Figma 画布像素网格与对齐切换控制栏\u003c/a>、\u003ca href=\"#components/raycast-floating-ai-dock-pill\">Raycast 悬浮 AI 智能体应用坞胶囊\u003c/a>、\u003ca href=\"#components/linear-command-fuzzy-search-row\">Linear &amp; Raycast 模糊搜索指令匹配结果行\u003c/a>、\u003ca href=\"#components/apple-vision-spatial-glass-pill\">VisionOS 空间悬浮毛玻璃胶囊快捷栏\u003c/a>、\u003ca href=\"#components/linear-command-hotkey-hint\">Linear &amp; Raycast 浮动快捷键微提示 HUD\u003c/a>、\u003ca href=\"#components/safari-compact-tab-pill\">Safari 15+ 紧凑流体浮动标签胶囊\u003c/a>、\u003ca href=\"#components/vscode-status- >npm test\u003c/code>。浏览器打开 \u003ca href=\"index.html\">index.html\u003c/a> 可直接体验目录，无需安装依赖或启动服务器。\u003c/p>\n\u003cp>Web/CSS 输出在 \u003ccode>dist/web/\u003c/code>；React 源码在 \u003ccode>web/react.tsx\u003c/code>。React 组件通过 AetherLink 的 TypeScript 与打包流程验证。Swift、Compose、JavaFX 等已有输出仍属于需要对应平台验证的参考产物。\u003c/p>","group":"实施指南"}];</script><script>
const guides=window.DS_GUIDES;const list=document.getElementById('document-list');document.getElementById('document-count').textContent=guides.length+' 篇详细规范';
for(const group of ['实施指南','组件规范','页面场景']){const section=document.createElement('details');section.open=true;const summary=document.createElement('summary');summary.textContent=group;section.append(summary);for(const guide of guides.filter(d=>d.group===group)){const link=document.createElement('a');link.href='#'+guide.id;link.textContent=guide.title;link.dataset.id=guide.id;section.append(link)}list.append(section)}
function render(){const id=decodeURIComponent(location.hash.slice(1)||'README');const guide=guides.find(d=>d.id===id)||guides.find(d=>d.id==='guides/'+id)||guides.find(d=>d.id==='README');document.getElementById('document').innerHTML=guide.html+'<div class="document-footnote">Modern AI Design System v3 · 当前文档源：docs/'+guide.id+'.md · 规范为本系统约定，用户当前请求优先。</div>';document.title=guide.title+' · 设计系统';document.getElementById('current-category').textContent=guide.group;list.querySelectorAll('a').forEach(a=>{if(a.dataset.id===guide.id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
document.getElementById('guide-search').oninput=e=>{const q=e.target.value.trim().toLowerCase();list.querySelectorAll('a').forEach(a=>a.hidden=!a.textContent.toLowerCase().includes(q));list.querySelectorAll('details').forEach(d=>{d.hidden=![...d.querySelectorAll('a')].some(a=>!a.hidden)})};
const theme=localStorage.getItem('ds-gallery-theme');if(['light','dark'].includes(theme))document.documentElement.dataset.theme=theme;const button=document.getElementById('theme');const label=()=>button.textContent=document.documentElement.dataset.theme==='light'?'深色主题':'浅色主题';label();button.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';localStorage.setItem('ds-gallery-theme',document.documentElement.dataset.theme);label()};
</script></body></html>
