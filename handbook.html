es/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/audio-frequency-bars","title":"实时音频频谱 10 段均衡跳动柱","html":"\u003ch1>实时音频频谱 10 段均衡跳动柱\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>专业调音台与网易云音乐鲸云特效风格的 10 频段实时音频频谱柱；集成多频段彩色线性渐变跳动条、GPU 变换与底部对齐布局。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>紧凑微型边框底槽 (.ds-freq-eq)\u003c/li>\u003cli>10 个独立频段列槽\u003c/li>\u003cli>双色渐变向上跳动柱 (.ds-freq-eq__bar)\u003c/li>\u003cli>自适应高度变换\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为动态音频状态反馈图元提供 role=&quot;img&quot; 与完整 aria-label。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>高度变化纯使用 scaleY() 或百分比 height，配合 80ms 极快响应模拟音频瞬态动态。\u003c/li>\u003cli>柱子采用 accent 到 action 垂直渐变，色彩鲜活灵动。\u003c/li>\u003cli>外层仅 48px 高度，适合嵌入音频播放器或语音通话控制条中。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-freq-eq&quot; role=&quot;img&quot; aria-label=&quot;10频段音频均衡柱&quot;&gt;&lt;div class=&quot;ds-freq-eq__col&quot;&gt;&lt;div class=&quot;ds-freq-eq__bar&quot; style=&quot;height:35%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-freq-eq__col&quot;&gt;&lt;div class=&quot;ds-freq-eq__bar&quot; style=&quot;height:65%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-freq-eq__col&quot;&gt;&lt;div class=&quot;ds-freq-eq__bar&quot; style=&quot;height:90%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-freq-eq__col&quot;&gt;&lt;div class=&quot;ds-freq-eq__bar&quot; style=&quot;height:50%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-freq-eq__col&quot;&gt;&lt;div class=&quot;ds-freq-eq__bar&quot; style=&quot;height:80%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-freq-eq__col&quot;&gt;&lt;div class=&quot;ds-freq-eq__bar&quot; style=&quot;height:95%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-freq-eq__col&quot;&gt;&lt;div class=&quot;ds-freq-eq__bar&quot; style=&quot;height:70%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-freq-eq__col&quot;&gt;&lt;div class=&quot;ds-freq-eq__bar&quot; style=&quot;height:45%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-freq-eq__col&quot;&gt;&lt;div class=&quot;ds-freq-eq__bar&quot; style=&quot;height:60%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-freq-eq__col&quot;&gt;&lt;div class=&quot;ds-freq-eq__bar&quot; style=&quot;height:75%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;AudioFrequencyEqualizer levels={[35, 65, 90, 50, 80, 95, 70, 45, 60, 75]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 频段柱圆角精致无毛刺\u003c/li>\u003cli>□ 渐变色彩过渡均匀自然\u003c/li>\u003cli>□ 屏幕阅读器无障碍名称准确\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/audio-player","title":"极简浮动播放条","html":"\u003ch1>极简浮动播放条\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 媒体 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Spotify 与 Apple Music 风格的微型浮动音频播控条；支持封面缩略、进度微调与弹簧播放手感。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角微磨砂封面唱片位\u003c/li>\u003cli>曲目与艺术家元信息\u003c/li>\u003cli>高精交互进度拖拽条\u003c/li>\u003cli>物理触感圆形播控键\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦至播放/暂停按钮或进度条；Space 切换播放/暂停；左右方向键快进或后退 5 秒。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>磨砂亚克力玻璃材质搭配 1px 细微光泽边框，悬浮感突出。\u003c/li>\u003cli>播控按钮使用 scale(1.1) 触感反馈与对比反色高亮。\u003c/li>\u003cli>进度条支持直接点击跳转并实时反馈当前与剩余时间。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-audio-player&quot;&gt;&lt;div class=&quot;ds-audio-player__cover&quot; aria-hidden=&quot;true&quot;&gt;📻&lt;/div&gt;&lt;div class=&quot;ds-audio-player__info&quot;&gt;&lt;div class=&quot;ds-audio-player__title&quot;&gt;Cybernetic Horizons (Extended Mix)&lt;/div&gt;&lt;div class=&quot;ds-audio-player__artist&quot;&gt;Kavinsky &amp;amp; The Midnight&lt;/div&gt;&lt;div class=&quot;ds-audio-player__track&quot;&gt;&lt;span class=&quot;ds-audio-player__time&quot;&gt;1:32&lt;/span&gt;&lt;div class=&quot;ds-audio-player__bar&quot;&gt;&lt;div class=&quot;ds-audio-player__fill&quot; style=&quot;width:42%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;ds-audio-player__time&quot;&gt;3:45&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-audio-player__controls&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-audio-player__btn ds-audio-player__btn--play&quot; aria-label=&quot;播放&quot; data-toast=&quot;播放音乐&quot;&gt;▶&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MiniAudioPlayer title=&quot;Cybernetic Horizons&quot; artist=&quot;The Midnight&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 半透明毛玻璃底板与底层内容分离清晰\u003c/li>\u003cli>□ 播放键触感动效利落迅速\u003c/li>\u003cli>□ 进度条圆角与填充平滑匹配\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/audio-vu-meter","title":"专业调音台双声道多段 LED 音频 VU 表","html":"\u003ch1>专业调音台双声道多段 LED 音频 VU 表\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Logic Pro 与专业混音硬件台风格的双声道 (L/R) 多段物理 LED 音频电平指示计；集成绿-黄-红三级预警光段、微弱发光阴影与瞬态跳动响应。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>电平表外框底座 (.ds-vu-meter)\u003c/li>\u003cli>L / R 左右声道独立通道行 (.ds-vu-channel)\u003c/li>\u003cli>声道等宽通道字母标签 (.ds-vu-channel__label)\u003c/li>\u003cli>LED 跑道槽底座 (.ds-vu-track)\u003c/li>\u003cli>三级预警多段矩形光片 (.ds-vu-seg)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为音频动态遥测图元，提供 role=&quot;img&quot; 与精确声道电平无障碍说明。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>分段通过绿 (安全) -&gt; 黄 (近峰值) -&gt; 红 (过载削波) 严格三段分色，激活段带有柔和同色微光扩散 box-shadow。\u003c/li>\u003cli>未激活段保持 0.3 透明度与底色，还原真实 LED 灭灯时的物理透镜质感。\u003c/li>\u003cli>纯 CSS opacity 过渡极速（60ms），不引发几何重排。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-vu-meter&quot; role=&quot;img&quot; aria-label=&quot;双声道音频 VU 电平表&quot;&gt;&lt;div class=&quot;ds-vu-channel&quot;&gt;&lt;span class=&quot;ds-vu-channel__label&quot;&gt;L&lt;/span&gt;&lt;div class=&quot;ds-vu-track&quot;&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--green is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--green is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--green is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--green is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--green is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--green is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--yellow is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--yellow is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--red&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--red&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-channel&quot;&gt;&lt;span class=&quot;ds-vu-channel__label&quot;&gt;R&lt;/span&gt;&lt;div class=&quot;ds-vu-track&quot;&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--green is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--green is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--green is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--green is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--green is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--green is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--yellow is-on&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--yellow&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--red&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-vu-seg ds-vu-seg--red&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;StudioVuMeter leftLevel={8} rightLevel={7} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 红绿黄分段颜色明确符合行业标准\u003c/li>\u003cli>□ 发光阴影柔和自然无光斑瑕疵\u003c/li>\u003cli>□ 左右声道排列间距对称紧凑\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/avatar","title":"头像","html":"\u003ch1>头像\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>标识用户、工作区或服务，提供清楚的无图回退。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>40px 圆形图像或字符\u003c/li>\u003cli>替代文本\u003c/li>\u003cli>可选状态点\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>静态头像不进入 Tab；触发账号菜单时使用带名称的按钮。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>图片失败显示缩写，不显示破图。\u003c/li>\u003cli>与相邻姓名重复的头像可使用空 alt。\u003c/li>\u003cli>状态点不能代替状态文字。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;span class=&quot;ds-avatar&quot; aria-label=&quot;工作区 AL&quot;&gt;AL&lt;/span&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 加载失败有回退\u003c/li>\u003cli>□ 身份名称可读\u003c/li>\u003cli>□ 不从凭据生成公开头像\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/badge","title":"状态徽标","html":"\u003ch1>状态徽标\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>提供短而明确的分类或状态，不能代替完整的错误解释。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>简短状态词\u003c/li>\u003cli>语义底色\u003c/li>\u003cli>可选状态图标\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>静态徽标不参与 Tab；可移除标签另设真正的删除按钮。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>在线、离线、加载中、未知必须区分。\u003c/li>\u003cli>颜色之外必须有文本。\u003c/li>\u003cli>每个徽标最多约 8 个汉字，详细信息放在正文。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-toolbar&quot;&gt;&lt;span class=&quot;ds-badge ds-badge--success&quot;&gt;运行中&lt;/span&gt;&lt;span class=&quot;ds-badge ds-badge--warning&quot;&gt;未测速&lt;/span&gt;&lt;span class=&quot;ds-badge ds-badge--danger&quot;&gt;连接失败&lt;/span&gt;&lt;span class=&quot;ds-badge&quot;&gt;未连接&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Badge tone=&quot;success&quot;&gt;运行中&lt;/Badge&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 灰度状态仍可读\u003c/li>\u003cli>□ 浅深主题对比度合格\u003c/li>\u003cli>□ 文本不是图片\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/banner-carousel","title":"渐变公告微轮播","html":"\u003ch1>渐变公告微轮播\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Stripe 与 GitHub 官网风格的轻量单行公告微轮播栏；支持分类微胶囊、单行要闻跑马轮播与翻页微步切换。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>强调色分类胶囊徽标 (如 动态)\u003c/li>\u003cli>单行要闻正文与外链\u003c/li>\u003cli>翻页切换步进微按钮 (‹ 和 ›)\u003c/li>\u003cli>紧凑圆角卡片边框\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在要闻链接与切换微按钮间导航；方向键或 Enter 触发上一条/下一条。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>高度仅 38px 左右，适合放在控制台顶部或工作区标题栏下方作为轻量广播。\u003c/li>\u003cli>分类标签采用主题 onAction 高亮对比色，快速吸引眼球。\u003c/li>\u003cli>左右微按钮尺寸 22px，紧凑利落，悬停时微高亮边框。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-notice-carousel&quot; role=&quot;region&quot; aria-label=&quot;系统公告&quot;&gt;&lt;div class=&quot;ds-notice-carousel__body&quot;&gt;&lt;span class=&quot;ds-notice-carousel__tag&quot;&gt;动态&lt;/span&gt;&lt;span class=&quot;ds-notice-carousel__text&quot;&gt;东京核心骨干网已接入 100Gbps 专线，延迟降低 18%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-notice-carousel__controls&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-notice-carousel__btn&quot; aria-label=&quot;上一条&quot; data-toast=&quot;切换至上一条通告&quot;&gt;‹&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-notice-carousel__btn&quot; aria-label=&quot;下一条&quot; data-toast=&quot;切换至下一条通告&quot;&gt;›&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;NoticeStripCarousel notices={[{tag:&quot;动态&quot;, text:&quot;东京骨干网已升级&quot;}]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 通告文字过长时单行省略不撑破容器\u003c/li>\u003cli>□ 切换微按钮可清晰点击并提供触感反馈\u003c/li>\u003cli>□ 深浅模式下标签文字对比度符合标准\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/banner","title":"顶部通告横条","html":"\u003ch1>顶部通告横条\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>GitHub 与 Stripe 风格的全局性通告栏；用于展示版本迭代、维护通告或重要活动链接。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>柔和通知背景条\u003c/li>\u003cli>通告文字摘要\u003c/li>\u003cli>行内快捷操作链接\u003c/li>\u003cli>微型关闭动作按钮 (×)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 遍历通告内操作链接与关闭按钮；Enter 触发跳转或关闭通告。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>背景采用低饱和度的软辅助色（secondary-soft），醒目且不喧宾夺主。\u003c/li>\u003cli>关闭按钮具备微缩放动效（scale(1.15)），手感利落。\u003c/li>\u003cli>关闭后读屏器即刻移除相应焦点区。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;aside class=&quot;ds-banner&quot; role=&quot;status&quot; style=&quot;width:100%&quot;&gt;&lt;div class=&quot;ds-banner__content&quot;&gt;&lt;span&gt;⚡ 核心内核已平滑升级至 v3.2.0，建议测试多径 TCP 延迟。&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-banner__action&quot; data-toast=&quot;查看升级日志&quot;&gt;查看更新日志&lt;/button&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ds-banner__close&quot; aria-label=&quot;关闭通告&quot; onclick=&quot;this.closest(&#39;.ds-banner&#39;).remove()&quot;&gt;×&lt;/button&gt;&lt;/aside&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;AnnouncementBanner message=&quot;核心内核已升级&quot; actionLabel=&quot;查看日志&quot; onAction={openLog} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 通告在深浅主题下文字满足 4.5:1 对比度\u003c/li>\u003cli>□ 操作链接与关闭按钮焦点环独立清晰\u003c/li>\u003cli>□ 关闭动作能即时从 DOM 中移除\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/bento-grid","title":"便当网格卡片","html":"\u003ch1>便当网格卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 布局 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple 主题发布会与 Linear 标志性的非对称便当网格；为核心功能矩阵、生态模块与特性演示提供现代卡片舞台。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>网格主容器\u003c/li>\u003cli>1px 镜面内高光边缘\u003c/li>\u003cli>跨列跨行卡片 (Span)\u003c/li>\u003cli>内部视觉展台 (Stage)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 键在可交互卡片间依序切换；Enter 打开卡片对应的详情或跳转链路。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>卡片边框配有 1px 细微光泽，在深色背景下尤显晶莹。\u003c/li>\u003cli>支持 --col-2、--row-2 响应式跨列跨行布局。\u003c/li>\u003cli>鼠标悬停时有轻微 y 轴上浮手感，增强可点击感。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-bento-grid&quot; style=&quot;width:100%&quot;&gt;&lt;article class=&quot;ds-bento-item ds-bento-item--col-2&quot;&gt;&lt;div&gt;&lt;span class=&quot;ds-badge ds-badge--info&quot;&gt;内核矩阵&lt;/span&gt;&lt;h3 class=&quot;ds-bento-item__title&quot; style=&quot;margin-top:8px&quot;&gt;全球 Anycast 多径加速&lt;/h3&gt;&lt;p class=&quot;ds-bento-item__desc&quot;&gt;自适应探测跨国 BGP 路由，自动规避高丢包海底光缆。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ds-bento-item__stage&quot;&gt;&lt;span class=&quot;ds-status-dot ds-status-dot--live&quot;&gt;&lt;/span&gt;&lt;strong style=&quot;margin-left:8px&quot;&gt;180+ 全球边缘节点在网&lt;/strong&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;ds-bento-item&quot;&gt;&lt;div&gt;&lt;span class=&quot;ds-badge&quot;&gt;安全防线&lt;/span&gt;&lt;h3 class=&quot;ds-bento-item__title&quot; style=&quot;margin-top:8px&quot;&gt;零信任隧道&lt;/h3&gt;&lt;p class=&quot;ds-bento-item__desc&quot;&gt;端到端 ChaCha20-Poly1305 密文传输。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ds-bento-item__stage&quot;&gt;&lt;kbd class=&quot;ds-key&quot;&gt;256-bit&lt;/kbd&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;BentoCard title=&quot;Anycast 多径加速&quot; description=&quot;自动规避高丢包光缆&quot; colSpan={2} stage={&lt;span className=&quot;ds-status-dot ds-status-dot--live&quot; /&gt;} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 便当卡片在移动端自适应折叠为单列\u003c/li>\u003cli>□ 悬停微浮动流畅无卡顿\u003c/li>\u003cli>□ 文字与背景形成充分对比\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/bento-tilt-spotlight-tile","title":"VisionOS 空间视差微光倾斜便当块","html":"\u003ch1>VisionOS 空间视差微光倾斜便当块\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple VisionOS 与 Linear 风格的 3D 视差微光倾斜便当格子；集成鼠标光标距离反光跟随、微上浮抬升微动效与圆润边角高光。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>视差便当卡片外壳 (.ds-tilt-tile)\u003c/li>\u003cli>鼠标跟随高光聚光层 (.ds-tilt-tile__glow)\u003c/li>\u003cli>顶部大号业务图标 (.ds-tilt-tile__icon)\u003c/li>\u003cli>卡片主标题 (.ds-tilt-tile__title)\u003c/li>\u003cli>详述介绍文案 (.ds-tilt-tile__desc)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦便当块；Enter 打开该便当块对应的工作区或功能面板。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>高光跟随层采用动态 CSS 变量 --ds-tilt-x 与 --ds-tilt-y 驱动的径向渐变，天然契合 pointermove 事件。\u003c/li>\u003cli>卡片抬升仅使用 translateY(-2px)，配合 200ms cubic-bezier(0.16,1,0.3,1) 缓动，流畅无比。\u003c/li>\u003cli>适合首页 Bento Grid、产品功能特性矩阵或 VisionOS 风格的空间卡片展示。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-tilt-tile&quot; role=&quot;article&quot; tabindex=&quot;0&quot;&gt;&lt;div class=&quot;ds-tilt-tile__glow&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;ds-tilt-tile__icon&quot; aria-hidden=&quot;true&quot;&gt;🌌&lt;/span&gt;&lt;h3 class=&quot;ds-tilt-tile__title&quot;&gt;VisionOS 空间视差计算&lt;/h3&gt;&lt;p class=&quot;ds-tilt-tile__desc&quot;&gt;基于三维渲染管线对视点坐标进行逐帧透视补偿，提供沉浸式深度分层感知。&lt;/p&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SpatialTiltSpotlightTile icon=&quot;🌌&quot; title=&quot;VisionOS 空间视差计算&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 卡片微上浮与阴影扩散自然\u003c/li>\u003cli>□ 径向高光柔和不刺眼\u003c/li>\u003cli>□ 键盘聚焦与操作可访问性良好\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/biometric-fingerprint-wave","title":"Android 15 屏下指纹超声波水波纹触感核验器","html":"\u003ch1>Android 15 屏下指纹超声波水波纹触感核验器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Google Pixel 与三星 Galaxy 风格的屏下超声波指纹按压识别圆盘；带有同心超声波扩散环动效、触感下沉缩放与核验成功绿光/勾选反馈。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>88px 圆形指纹底座 (.ds-bio-scanner)\u003c/li>\u003cli>外扩超声波脉冲环 (.ds-bio-scanner__ring)\u003c/li>\u003cli>中央按压指纹图元 (.ds-bio-scanner__glyph)\u003c/li>\u003cli>扫描中与成功完成态修饰类 (.is-scanning)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦指纹区域；Enter 或 Space 触发核验模拟；支持触控设备长按指纹区。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>扩散光环采用纯 GPU 合成的 transform: scale() 与 opacity，利用 ds-ping 或 cubic-bezier(0.16,1,0.3,1) 自然加速度，绝无掉帧。\u003c/li>\u003cli>尺寸遵循 Android 15 触摸规范（88px），指腹命中极为舒适。\u003c/li>\u003cli>适合用于支付确认、隐私锁屏解锁与敏感系统配置核验。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-bio-scanner is-scanning&quot; role=&quot;button&quot; aria-label=&quot;屏下指纹超声波核验&quot; tabindex=&quot;0&quot;&gt;&lt;div class=&quot;ds-bio-scanner__ring&quot;&gt;&lt;/div&gt;&lt;span class=&quot;ds-bio-scanner__glyph&quot; aria-hidden=&quot;true&quot;&gt;👆&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;BiometricFingerprintWave isScanning={scanning} onScan={handleScan} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 超声波环发散动效平滑无抖动\u003c/li>\u003cli>□ 键盘回车与空格键支持触发\u003c/li>\u003cli>□ 成功态与错误态对比分明\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/bottom-nav","title":"底栏主导航","html":"\u003ch1>底栏主导航\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Android 原生 AOSP Material 3 底部导航栏与 iOS Tab Bar；移动端或桌面轻量客户端的核心视图切换器。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>毛玻璃底栏主容器\u003c/li>\u003cli>色调药丸激活背板 (Tonal Pill)\u003c/li>\u003cli>语义状态图标\u003c/li>\u003cli>文字小标签\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 进入底栏；左右方向键在各主页面之间顺畅切换；Enter 确认切换。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>激活项采用 Material 3 标志性的高对比圆角药丸底色，图标沉浸在药丸中心。\u003c/li>\u003cli>磨砂材质背景结合 1px 顶部分割线，浮于页面内容上层。\u003c/li>\u003cli>默认保证触摸模式下拥有不少于 48px 的舒适触控空间。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;nav class=&quot;ds-bottom-nav&quot; aria-label=&quot;移动端主导航&quot; style=&quot;max-width:380px;border:1px solid var(--ds-line);border-radius:16px&quot;&gt;&lt;div class=&quot;ds-bottom-nav__item is-active&quot; aria-current=&quot;page&quot;&gt;&lt;div class=&quot;ds-bottom-nav__pill&quot;&gt;&lt;span class=&quot;ds-bottom-nav__icon&quot;&gt;⚡&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-bottom-nav__label&quot;&gt;状态&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-bottom-nav__item&quot;&gt;&lt;div class=&quot;ds-bottom-nav__pill&quot;&gt;&lt;span class=&quot;ds-bottom-nav__icon&quot;&gt;🌐&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-bottom-nav__label&quot;&gt;节点&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-bottom-nav__item&quot;&gt;&lt;div class=&quot;ds-bottom-nav__pill&quot;&gt;&lt;span class=&quot;ds-bottom-nav__icon&quot;&gt;🔀&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-bottom-nav__label&quot;&gt;分流&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-bottom-nav__item&quot;&gt;&lt;div class=&quot;ds-bottom-nav__pill&quot;&gt;&lt;span class=&quot;ds-bottom-nav__icon&quot;&gt;⚙️&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-bottom-nav__label&quot;&gt;设置&lt;/span&gt;&lt;/div&gt;&lt;/nav&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;BottomNav items={navItems} activeId=&quot;status&quot; onSelect={setActiveTab} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 激活状态下 Tonal Pill 背景清晰可见\u003c/li>\u003cli>□ 文字标签与图标居中对齐\u003c/li>\u003cli>□ 键盘左右键能在项间流畅遍历\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/breadcrumb","title":"面包屑","html":"\u003ch1>面包屑\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>说明深层页面的父级路径，帮助返回上下文。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>nav 地标\u003c/li>\u003cli>按层级排序的链接\u003c/li>\u003cli>视觉分隔符\u003c/li>\u003cli>当前页文本\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 到父级链接；当前页无需做重复可点击链接。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>浅层单页不强行加入面包屑。\u003c/li>\u003cli>分隔符 aria-hidden。\u003c/li>\u003cli>移动端可保留最近两级并允许展开。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;nav aria-label=&quot;面包屑&quot;&gt;&lt;a href=&quot;#overview&quot;&gt;设计系统&lt;/a&gt; &lt;span aria-hidden=&quot;true&quot;&gt; / &lt;/span&gt;&lt;a href=&quot;#components&quot;&gt;组件&lt;/a&gt; &lt;span aria-hidden=&quot;true&quot;&gt; / &lt;/span&gt;&lt;span aria-current=&quot;page&quot;&gt;按钮&lt;/span&gt;&lt;/nav&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 链接文本具有上下文\u003c/li>\u003cli>□ 当前页面有 aria-current\u003c/li>\u003cli>□ 分隔符不会被反复读出\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/button","title":"按钮","html":"\u003ch1>按钮\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>提交一个明确且可完成的动作；每个任务区域最多一个主要按钮。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>可读的动词标签\u003c/li>\u003cli>可选前置图标\u003c/li>\u003cli>异步加载指示\u003c/li>\u003cli>44px 默认点击区域\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 进入；Enter 或 Space 执行动作；loading 和 disabled 期间禁止重复执行。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>主要按钮使用 action/onAction；次要按钮使用实底和描边。\u003c/li>\u003cli>异步开始立即显示加载状态，只有确认成功才显示成功反馈。\u003c/li>\u003cli>删除等高影响动作使用 danger；不能只用红色表达风险。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-toolbar&quot;&gt;&lt;button class=&quot;ds-button&quot; data-toast=&quot;已触发示例操作&quot;&gt;主要操作&lt;/button&gt;&lt;button class=&quot;ds-button ds-button--secondary&quot;&gt;次要操作&lt;/button&gt;&lt;button class=&quot;ds-button ds-button--ghost&quot;&gt;文本操作&lt;/button&gt;&lt;button class=&quot;ds-button&quot; disabled&gt;不可用&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Button loading={saving} onClick={save}&gt;保存设置&lt;/Button&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 连续点击只发送一个请求\u003c/li>\u003cli>□ 禁用状态不改变布局\u003c/li>\u003cli>□ 标签扩大 200% 时仍可读\u003c/li>\u003cli>□ 按钮文本与底色对比度至少 4.5:1\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/callout","title":"情境引述卡","html":"\u003ch1>情境引述卡\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>比 Alert 更亲和、适合长篇文档的情境引述通告；兼顾 Notion 与 GitHub Primer 的阅读质感。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>前置语义图标或 Emoji\u003c/li>\u003cli>加粗标题\u003c/li>\u003cli>结构化说明正文\u003c/li>\u003cli>左侧语义强化边条\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>纯展示类卡片不参与键盘焦点；若内部包含链接或按钮，内部控件依序 Tab。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>背景使用柔和的软色调，与正文内容形成温和对比。\u003c/li>\u003cli>左侧细色条强化信息等级（info, success, warning, danger）。\u003c/li>\u003cli>文字段落保持合适行高与最大行宽。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;aside class=&quot;ds-callout ds-callout--info&quot; role=&quot;region&quot; aria-label=&quot;订阅更新通知&quot;&gt;&lt;span class=&quot;ds-callout__icon&quot; aria-hidden=&quot;true&quot;&gt;💡&lt;/span&gt;&lt;div class=&quot;ds-callout__body&quot;&gt;&lt;strong&gt;内核自动更新已就绪&lt;/strong&gt;&lt;p&gt;当前运行核心为 2026.10 增强版，已自动启用多路径 Multipath-TCP 支持。&lt;/p&gt;&lt;/div&gt;&lt;/aside&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Callout tone=&quot;info&quot; icon=&quot;💡&quot; title=&quot;内核更新已就绪&quot;&gt;{children}&lt;/Callout&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 图标与首行标题对齐整洁\u003c/li>\u003cli>□ 浅深与暖纸主题下文字对比度合格\u003c/li>\u003cli>□ 多行长文本排版自然不局促\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/card","title":"内容卡片","html":"\u003ch1>内容卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>把相关信息组合在同一实底区域，不增加不必要的层级。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>标题或标签\u003c/li>\u003cli>正文/数据\u003c/li>\u003cli>可选动作区\u003c/li>\u003cli>1px 分界和 16px 圆角\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>静态卡片不获得焦点；整个卡片是导航时使用链接；卡片内按钮保持独立语义。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>可点击卡片才做轻量悬停位移。\u003c/li>\u003cli>非交互卡片不使用 cursor:pointer。\u003c/li>\u003cli>不要在整张可点击卡片内嵌套交互按钮。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;section class=&quot;ds-panel&quot;&gt;&lt;span class=&quot;ds-badge ds-badge--info&quot;&gt;配置&lt;/span&gt;&lt;h3&gt;本地优先&lt;/h3&gt;&lt;p&gt;节点内容保存在当前设备，敏感链接不写入日志。&lt;/p&gt;&lt;/section&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Panel aria-label=&quot;内核配置&quot;&gt;{children}&lt;/Panel&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 卡片没有 backdrop-filter\u003c/li>\u003cli>□ 正文可以选择复制\u003c/li>\u003cli>□ 无嵌套按钮或链接\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/cassette-reel-spindle-hub","title":"复古开盘磁带机 3 爪转盘轮毂驱动牙盘","html":"\u003ch1>复古开盘磁带机 3 爪转盘轮毂驱动牙盘\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 多媒体 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>致敬专业开盘带机与卡式磁带的三爪驱动机械轮毂（Vintage Tape Spindle Hub）；同心金属与塑料复合圆环、3 个等分 120° 辐射啮合凸爪、中央金属定位圆孔。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>正圆内凹机械底盘 (.ds-tape-spindle)\u003c/li>\u003cli>同心内凹牙盘圈 (.ds-tape-spindle__teeth)\u003c/li>\u003cli>120° 三向辐射啮合卡齿 (.ds-tape-spindle__spoke)\u003c/li>\u003cli>中央精密定位深孔 (.ds-tape-spindle__hole)\u003c/li>\u003cli>支持任意旋转角度动态传参\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>无需直接按键，伴随播放控制按键联动旋转。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>role=&quot;img&quot; 配合 aria-label 说明磁带轮毂与当前旋转角度。\u003c/li>\u003cli>纯 CSS 几何实现，不依赖外部静态图片，缩放不失真。\u003c/li>\u003cli>适合复古音频录音机、音乐播放动画、数字音频母带界面。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-tape-spindle&quot; role=&quot;img&quot; aria-label=&quot;磁带驱动轴心牙盘，旋转角度 45度&quot; style=&quot;transform:rotate(45deg)&quot;&gt;&lt;div class=&quot;ds-tape-spindle__teeth&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;ds-tape-spindle__spoke ds-tape-spindle__spoke--1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-tape-spindle__spoke ds-tape-spindle__spoke--2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-tape-spindle__spoke ds-tape-spindle__spoke--3&quot;&gt;&lt;/span&gt;&lt;div class=&quot;ds-tape-spindle__hole&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;RetroTapeSpindleHub angle={45} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 三爪严格 120 度对称分布\u003c/li>\u003cli>□ 内凹阴影与外圈高光层次分明\u003c/li>\u003cli>□ 中央圆孔精密居中\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/cassette-rotary-potentiometer-knob","title":"复古音频电位器旋钮与刻度弧线","html":"\u003ch1>复古音频电位器旋钮与刻度弧线\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 多媒体 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>致敬 SSL / Neve 录音棚调音台模拟旋钮电位器（Analog Rotary Potentiometer Knob）；270 度径向刻度虚线环、径向渐变金属旋钮滚花外圈、发光指示针与中心金属倒角盖帽、等宽 dB 增益指示。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>径向深色金属旋钮壳体 (.ds-rotary-potentiometer__body)\u003c/li>\u003cli>外围 270° 径向虚线刻度环 (.ds-rotary-potentiometer__ticks)\u003c/li>\u003cli>青色高光旋转指示针 (.ds-rotary-potentiometer__pointer)\u003c/li>\u003cli>中心双色斜面金属盖帽 (.ds-rotary-potentiometer__cap)\u003c/li>\u003cli>下方大写声道标题与 dB 数值 (.ds-rotary-potentiometer__label, .ds-rotary-potentiometer__val)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>ArrowLeft / ArrowDown 逆时针调小；ArrowRight / ArrowUp 顺时针调大。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;slider&quot; 与 aria-valuenow 完整反映旋钮旋转刻度。\u003c/li>\u003cli>高对比度发光指示指针，支持无缝旋转角度动态控制。\u003c/li>\u003cli>适合音频合成器、专业混音推子、专业调音台、硬件拟物控制面板。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-rotary-potentiometer&quot; role=&quot;group&quot; aria-label=&quot;模拟电位器旋钮 MASTER GAIN&quot;&gt;&lt;div class=&quot;ds-rotary-potentiometer__body&quot; style=&quot;--ds-knob-rot:45deg&quot; tabindex=&quot;0&quot; role=&quot;slider&quot; aria-label=&quot;MASTER GAIN&quot; aria-valuenow=&quot;45&quot;&gt;&lt;div class=&quot;ds-rotary-potentiometer__ticks&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-rotary-potentiometer__pointer&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-rotary-potentiometer__cap&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;ds-rotary-potentiometer__label&quot;&gt;MASTER GAIN&lt;/span&gt;&lt;span class=&quot;ds-rotary-potentiometer__val&quot;&gt;+4.5 dB&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;AnalogRotaryPotentiometerKnob label=&quot;MASTER GAIN&quot; value=&quot;+4.5 dB&quot; rotation={45} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 旋钮圆润且带金属渐变立体感\u003c/li>\u003cli>□ 指针朝向 45 度清晰可见\u003c/li>\u003cli>□ 下方标注与 dB 增益数字居中\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/cassette-tape-counter-odometer","title":"复古开盘磁带机 3 位机械滚轮计数器","html":"\u003ch1>复古开盘磁带机 3 位机械滚轮计数器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 多媒体 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>致敬 Revox 与 Studer 开盘母带机的高精度 3 位数机械滚轮计数器（Analog Tape Mechanical Counter）；黑色内陷视窗、高光压纹滚轮数字滚筒、右侧机械按压式归零复位圆钮。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>金属深陷外壳框 (.ds-tape-odometer)\u003c/li>\u003cli>独立滚筒视窗容器 (.ds-tape-odometer__drums)\u003c/li>\u003cli>立体高光数字滚轮格 (.ds-tape-odometer__digit)\u003c/li>\u003cli>物理圆形归零复位按键 (.ds-tape-odometer__btn)\u003c/li>\u003cli>机械按压缩放微动效反馈\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦归零按键；Enter 或 Space 触发归零重置。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;status&quot; 与 aria-label 实时反映当前刻度数值。\u003c/li>\u003cli>归零按钮具备清晰的 aria-label=&quot;机械归零重置&quot;。\u003c/li>\u003cli>适合复古音频播放器、母带处理插件、机械计时器与长音频播放标记。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-tape-odometer&quot; role=&quot;status&quot; aria-label=&quot;磁带机械计数器: 342&quot;&gt;&lt;div class=&quot;ds-tape-odometer__drums&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;ds-tape-odometer__digit&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;ds-tape-odometer__digit&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;ds-tape-odometer__digit&quot;&gt;2&lt;/span&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ds-tape-odometer__btn&quot; aria-label=&quot;机械归零重置&quot;&gt;0&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;AnalogTapeMechanicalCounter count={342} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 数字等宽立体高光自然\u003c/li>\u003cli>□ 圆钮按压物理微反馈\u003c/li>\u003cli>□ 滚筒边框内嵌分明\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/cassette-tape-head-azimuth-meter","title":"复古母带机磁头方位角李萨如图形相位仪","html":"\u003ch1>复古母带机磁头方位角李萨如图形相位仪\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 多媒体 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>致敬 Studer / Otari 录音母带开盘机磁头校准李萨如示波仪（Tape Head Azimuth Lissajous Meter）；圆形深绿荧光示波器显像管、X/Y 中心十字瞄准基准线、倾斜 45° 极化相位椭圆轨迹、底部相位一致性百分比与对齐判定指示。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>纯黑发烧级机架外壳 (.ds-azimuth-meter)\u003c/li>\u003cli>正圆微发光磷光绿色示波屏幕 (.ds-azimuth-meter__screen)\u003c/li>\u003cli>十字中心定位准星网线 (.ds-azimuth-meter__crosshair-x, .ds-azimuth-meter__crosshair-y)\u003c/li>\u003cli>发光 45° 旋转李萨如动态相位环 (.ds-azimuth-meter__phase-ellipse)\u003c/li>\u003cli>底部等宽立体角位状态徽章 (.ds-azimuth-meter__foot)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>无需直接按键，通过音频校准通道输入信号动态呈现相位椭圆。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;region&quot; 与 aria-label 说明磁头方位角相位仪与对齐状态。\u003c/li>\u003cli>示波图形绿色荧光在暗底环境下对比度超过 12:1。\u003c/li>\u003cli>适合母带级音频分析仪、双声道立体声相位监测、拟物专业录音室工作台。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-azimuth-meter&quot; role=&quot;region&quot; aria-label=&quot;磁头方位角李萨如图形相位仪&quot;&gt;&lt;div class=&quot;ds-azimuth-meter__screen&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;ds-azimuth-meter__crosshair-x&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-azimuth-meter__crosshair-y&quot;&gt;&lt;/span&gt;&lt;div class=&quot;ds-azimuth-meter__phase-ellipse&quot; style=&quot;transform:rotate(-45deg)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-azimuth-meter__foot&quot;&gt;&lt;span&gt;PHASE: 98.4%&lt;/span&gt;&lt;span&gt;ALIGNED&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;AnalogTapeHeadAzimuthMeter phaseAngle={-45} coherence=&quot;98.4%&quot; status=&quot;ALIGNED&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 正圆示波管带绿色暗部晕光\u003c/li>\u003cli>□ 十字准星纤细精准\u003c/li>\u003cli>□ 45度发光椭圆相位极佳\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/cassette-tape-head-demagnetizer-wand","title":"复古开盘磁头消磁仪动态残磁表","html":"\u003ch1>复古开盘磁头消磁仪动态残磁表\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 多媒体 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>专业录音母带开盘机磁头消磁校准仪（Tape Head Demagnetizer AC Flux Meter）；深黑防爆工程塑料外壳、残磁量百分比光电刻度条（绿黄红瞬态渐变）、消磁进行中告警指示与 50Hz 交流强磁脉冲触发物理按键。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>纯黑工程级机身槽板 (.ds-demagnetizer-wand)\u003c/li>\u003cli>顶部状态双态微指示 (.ds-demagnetizer-wand__head)\u003c/li>\u003cli>横向残余磁通量刻度光条 (.ds-demagnetizer-wand__gauge, .ds-demagnetizer-wand__bar)\u003c/li>\u003cli>等宽百分比读数与标尺 (.ds-demagnetizer-wand__flux)\u003c/li>\u003cli>红色危险高磁脉冲瞬态按钮 (.ds-demagnetizer-wand__trigger)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>点击触发脉冲高频消磁循环；自动倒计时完成退磁消磁动作。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;region&quot; 与 aria-label 说明磁带机磁头退磁校准仪。\u003c/li>\u003cli>高压/高磁危险提示具备明显视觉警示，红黄绿刻度层次丰富。\u003c/li>\u003cli>适合复古录音室拟物设备、硬件声卡控制面板、复古音频交互套件。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-demagnetizer-wand&quot; role=&quot;region&quot; aria-label=&quot;磁带机磁头退磁校准仪&quot;&gt;&lt;div class=&quot;ds-demagnetizer-wand__head&quot;&gt;&lt;span&gt;DEMAGNETIZER AC FLUX&lt;/span&gt;&lt;span style=&quot;color:#10b981&quot;&gt;○ READY&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-demagnetizer-wand__gauge&quot;&gt;&lt;div class=&quot;ds-demagnetizer-wand__bar&quot; style=&quot;width:42%&quot;&gt;&lt;/div&gt;&lt;span class=&quot;ds-demagnetizer-wand__flux&quot;&gt;RESIDUAL FLUX&lt;/span&gt;&lt;span class=&quot;ds-demagnetizer-wand__flux&quot;&gt;42%&lt;/span&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ds-demagnetizer-wand__trigger&quot;&gt;⚡ 脉冲高频消磁循环 (50Hz AC)&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;AnalogTapeHeadDemagnetizer fluxPercentage={42} isDemagnetizing={false} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 纯黑仪表壳扎实\u003c/li>\u003cli>□ 42% 残磁进度条清晰\u003c/li>\u003cli>□ 红色消磁按钮拟物有力\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/cassette-tape-transport-controls","title":"复古开盘磁带走带机物理传输控制面板","html":"\u003ch1>复古开盘磁带走带机物理传输控制面板\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 多媒体 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>致敬 Braun 与 Nagra 复古磁带录音机的纯物理走带传输控制按键组（Tape Transport Controls）；具有倒带、播放、快进、停止、录音按键，录音按键触发红色 LED 发光微灯珠。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>金属微内陷底托 (.ds-tape-transport)\u003c/li>\u003cli>方形高反弹走带按键 (.ds-tape-transport__btn)\u003c/li>\u003cli>独立鲜红录音高亮状态 (.ds-tape-transport__btn--rec)\u003c/li>\u003cli>红色微发光录音指示灯珠 (.ds-tape-transport__led)\u003c/li>\u003cli>按压物理微下凹动效反馈\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>ArrowLeft / ArrowRight 切换控制按键，Space 触发播放/停止，R 触发录音。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>role=&quot;toolbar&quot; 与 aria-label 声明走带控制工具栏。\u003c/li>\u003cli>每个按钮具备明确的 aria-label 说明当前动作与快捷键。\u003c/li>\u003cli>适合播客录音工具、音频剪辑工作站、复古音乐播放器及语音备忘录。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-tape-transport&quot; role=&quot;toolbar&quot; aria-label=&quot;磁带走带机传输控制面板&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-tape-transport__btn&quot; aria-label=&quot;倒带&quot;&gt;⏮&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-tape-transport__btn is-active&quot; aria-label=&quot;播放&quot;&gt;▶&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-tape-transport__btn&quot; aria-label=&quot;快进&quot;&gt;⏭&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-tape-transport__btn&quot; aria-label=&quot;停止&quot;&gt;⏹&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-tape-transport__btn ds-tape-transport__btn--rec&quot; aria-label=&quot;录音&quot;&gt;⏺&lt;/button&gt;&lt;span class=&quot;ds-tape-transport__led&quot; aria-label=&quot;录音指示灯激活&quot;&gt;&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;RetroTapeTransportDeck isPlaying={true} isRecording={false} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 按键边角微弧度与微阴影\u003c/li>\u003cli>□ 录音红点与LED高亮呼应\u003c/li>\u003cli>□ 按压有明确的缩放反馈\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/cassette-vu-needle-meter","title":"复古发烧级双指针白炽暖光模拟 VU 表","html":"\u003ch1>复古发烧级双指针白炽暖光模拟 VU 表\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 媒体 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>经典 McIntosh 与 Marantz 胆机风格的双通道指针式模拟 VU 表；暖金发光表盘背光、-20dB 至 +3dB 精确刻度、超快响应摆针及红光削波过载指示灯。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>深木纹/黑金属外壳 (.ds-analog-vu)\u003c/li>\u003cli>暖黄色白炽微光渐变表盘 (.ds-analog-vu__meter)\u003c/li>\u003cli>等宽分贝刻度字列 (.ds-analog-vu__scale)\u003c/li>\u003cli>底部固定旋转细针 (.ds-analog-vu__needle)\u003c/li>\u003cli>右上角峰值红光过载报警点 (.ds-analog-vu__peak)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为专业音频监测仪表呈现，Tab 遍历并在无障碍层通过 role=&quot;region&quot; 报读分贝读数。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>表盘刻度符合高反差暗黑/暖黄对比，避免细针丢失视觉焦点。\u003c/li>\u003cli>摆针旋转角度与峰值通过 CSS 变量绑定，性能纯 compositor 渲染。\u003c/li>\u003cli>适合母带处理工作站、流媒体直播推流台、复古音乐播放器及专业声卡驱动面板。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-analog-vu&quot; role=&quot;region&quot; aria-label=&quot;模拟双指针 VU 表：左声道 -14dB，右声道 -8dB&quot;&gt;&lt;div class=&quot;ds-analog-vu__meter&quot;&gt;&lt;div class=&quot;ds-analog-vu__scale&quot;&gt;&lt;span&gt;-20&lt;/span&gt;&lt;span&gt;-10&lt;/span&gt;&lt;span&gt;-5&lt;/span&gt;&lt;span&gt;0&lt;/span&gt;&lt;span style=&quot;color:#991b1b&quot;&gt;+3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-analog-vu__needle&quot; style=&quot;--ds-vu-angle:-14deg&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-analog-vu__peak&quot; style=&quot;--ds-vu-peak:0.2&quot; title=&quot;通道 1 正常&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-analog-vu__meter&quot;&gt;&lt;div class=&quot;ds-analog-vu__scale&quot;&gt;&lt;span&gt;-20&lt;/span&gt;&lt;span&gt;-10&lt;/span&gt;&lt;span&gt;-5&lt;/span&gt;&lt;span&gt;0&lt;/span&gt;&lt;span style=&quot;color:#991b1b&quot;&gt;+3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-analog-vu__needle&quot; style=&quot;--ds-vu-angle:-8deg&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-analog-vu__peak&quot; style=&quot;--ds-vu-peak:0.2&quot; title=&quot;通道 2 正常&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;AnalogDualVuMeter leftAngle={-14} rightAngle={-8} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 双表盘左右对称平衡\u003c/li>\u003cli>□ 细针旋转原点在底部中央\u003c/li>\u003cli>□ 刻度字型清晰工整\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> ·
