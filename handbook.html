\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 导航至关联徽标；Enter 或 Space 打开目标工单详情浮层。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;link&quot; 与 tabindex=&quot;0&quot;，通过 aria-label 完整报读关系类型、工单 ID 与状态。\u003c/li>\u003cli>微型状态圆点配合文字提示，不单独依赖颜色传达语义。\u003c/li>\u003cli>适合复杂敏捷项目依赖图谱、缺陷追踪、阻塞分析与版本发布清单。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-issue-relation&quot; role=&quot;link&quot; tabindex=&quot;0&quot; aria-label=&quot;工单关联: blocks ENG-402, 当前状态 In Progress&quot;&gt;&lt;span class=&quot;ds-issue-relation__icon&quot; aria-hidden=&quot;true&quot;&gt;⛔&lt;/span&gt;&lt;span class=&quot;ds-issue-relation__label&quot;&gt;blocks&lt;/span&gt;&lt;span class=&quot;ds-issue-relation__id&quot;&gt;ENG-402&lt;/span&gt;&lt;span class=&quot;ds-issue-relation__status&quot; title=&quot;工单状态: In Progress&quot;&gt;&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;LinearIssueRelationBadge relation=&quot;blocks&quot; issueId=&quot;ENG-402&quot; status=&quot;In Progress&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 关系标签与工单号层次分明\u003c/li>\u003cli>□ 状态小圆点圆润且色彩鲜艳\u003c/li>\u003cli>□ 悬浮背景变暗微反馈细腻\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/linear-subtask-progress-ring","title":"Linear 工单子任务环形比例进度指示器","html":"\u003ch1>Linear 工单子任务环形比例进度指示器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Linear 风格的子问题完成度进度指示微组件；包含微型圆锥渐变进度圆环、分数比例（如 3/5）及自适应状态说明，兼具极致紧凑与信息完整度。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角微底色胶囊容器 (.ds-subtask-progress)\u003c/li>\u003cli>圆锥渐变微环图元 (.ds-subtask-progress__ring)\u003c/li>\u003cli>等宽分数显示字型 (.ds-subtask-progress__ratio)\u003c/li>\u003cli>次级灰度完成度说明 (.ds-subtask-progress__text)\u003c/li>\u003cli>自适应主题强调色变量\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为语义化 progressbar 读取，可设置 tabindex=&quot;0&quot; 接受焦点并响应键盘回车展开详细子任务列表。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;progressbar&quot;、aria-valuenow、aria-valuemin 与 aria-valuemax。\u003c/li>\u003cli>在有限空间内呈现图形与数值双重编码，色盲用户亦能通过 3/5 明确进度。\u003c/li>\u003cli>适合敏捷研发工单列表、项目里程碑清单、Checklist 完成度展示及多步骤流水线。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-subtask-progress&quot; role=&quot;progressbar&quot; aria-label=&quot;子工单进度&quot; aria-valuenow=&quot;3&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;5&quot; style=&quot;--ds-subtask-pct:60%&quot;&gt;&lt;div class=&quot;ds-subtask-progress__ring&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;ds-subtask-progress__ratio&quot;&gt;3/5&lt;/span&gt;&lt;span class=&quot;ds-subtask-progress__text&quot;&gt;60% 完成&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;LinearSubtaskProgressIndicator completed={3} total={5} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 微型环外圈圆润内凹适中\u003c/li>\u003cli>□ 文字与微环垂直居中对齐\u003c/li>\u003cli>□ 进度百分比计算精准无误\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/live-countdown-badge","title":"实时流转倒计时胶囊","html":"\u003ch1>实时流转倒计时胶囊\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple 灵动岛 (Dynamic Island) 与 Uber Live Activity 风格的呼吸倒计时药丸；带有呼吸光环圆点、高对比等宽数字与状态说明。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>呼吸缩放脉冲指示点 (animation: ds-pulse)\u003c/li>\u003cli>等宽等高倒计时时分秒数字\u003c/li>\u003cli>微型状态说明标签\u003c/li>\u003cli>超椭圆圆角高光底板\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为动态状态提醒图元提供 role=&quot;status&quot; 与完整 aria-label。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>呼吸灯动画纯使用 scale(1) 到 scale(1.35) 与 opacity 变换，纯 GPU 合成无重排。\u003c/li>\u003cli>时间数字严格使用等宽 tabular-nums，秒数跳动时药丸宽度绝对稳定。\u003c/li>\u003cli>在紧急状态（如 SLA 即将超期或证书即将失效）时自动变为红色光晕。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-countdown-pill&quot; role=&quot;status&quot; aria-label=&quot;SLA 宽限期剩余 04:58&quot;&gt;&lt;span class=&quot;ds-countdown-pill__pulse&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-countdown-pill__time&quot;&gt;04:58&lt;/span&gt;&lt;span class=&quot;ds-countdown-pill__label&quot;&gt;SLA 宽限期&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;LiveCountdownPill label=&quot;SLA 宽限期&quot; remaining=&quot;04:58&quot; isUrgent={false} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 呼吸脉冲光晕柔和无撕裂\u003c/li>\u003cli>□ 时间字符等宽且秒数跳动不改变药丸宽度\u003c/li>\u003cli>□ 高对比模式下轮廓分明\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/live-voice-waveform-orb","title":"Siri & Gemini 拟态声波多彩呼吸发光球","html":"\u003ch1>Siri &amp; Gemini 拟态声波多彩呼吸发光球\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple Intelligence Siri 与 Google Gemini 2.0 风格的动态多色径向渐变流光语音助手球；支持听取、思考与脉冲光环环形发散动效。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>72px 极光流体圆形球体 (.ds-voice-orb)\u003c/li>\u003cli>径向扩散外发光光晕 (.ds-voice-orb__pulse)\u003c/li>\u003cli>内部居中麦克风或火花图元 (.ds-voice-orb__icon)\u003c/li>\u003cli>鼠标悬停放大与立体内阴影\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦发光球；Enter 或 Space 开始或停止语音收音。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>采用多色复合径向渐变（天蓝、紫罗兰、粉红、群青），呈现饱满多维光感。\u003c/li>\u003cli>脉冲光环完全基于 GPU 合成层（scale + opacity），零页面排版开销。\u003c/li>\u003cli>适合用于 AI 对话工作区唤醒入口、实时语音交互面板及智能助手组件。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-voice-orb&quot; role=&quot;button&quot; aria-label=&quot;智能语音交互助手&quot; tabindex=&quot;0&quot;&gt;&lt;div class=&quot;ds-voice-orb__pulse&quot;&gt;&lt;/div&gt;&lt;span class=&quot;ds-voice-orb__icon&quot; aria-hidden=&quot;true&quot;&gt;🎙️&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;VoiceAssistantOrb isListening={true} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 径向渐变色彩过渡丝滑绚丽\u003c/li>\u003cli>□ 脉冲光环扩散动效平顺无断点\u003c/li>\u003cli>□ 键盘聚焦无障碍标签清晰\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/log-diff-viewer","title":"实时云原生日志流监控行","html":"\u003ch1>实时云原生日志流监控行\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Datadog 与 Kubernetes Pod 控制台级别的流式结构化日志查看窗；集成等宽时间戳微列、日志级别彩色胶囊 (INFO/WARN/ERR) 与防折行流式消息正文。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>顶部容器状态头（含标题与捕获状态指示灯）\u003c/li>\u003cli>纵向滚动日志流主体\u003c/li>\u003cli>等宽绝对毫秒时间戳\u003c/li>\u003cli>日志严重度语义色徽标 (.ds-log-row__level)\u003c/li>\u003cli>单行自适应日志正文\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦日志流容器；上下方向键可在日志历史中滚动；支持直接拖选高亮文字复制。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>字体使用统一的等宽 --ds-type-mono，毫秒时间戳严格保持对齐。\u003c/li>\u003cli>WARN 与 ERR 分别映射至 warning 与 danger 语义变量，在深浅主题下均通过 WCAG AA 对比度要求。\u003c/li>\u003cli>单行日志文本 hover 时呈现 --ds-surface 微高亮底色，辅助开发者逐行视线对齐。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-log-stream&quot; role=&quot;log&quot; aria-label=&quot;Pod 实时日志&quot;&gt;&lt;div class=&quot;ds-log-stream__header&quot;&gt;&lt;span&gt;edge-proxy-pod · stdout&lt;/span&gt;&lt;span style=&quot;color:var(--ds-success)&quot;&gt;● 实时捕获中&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-log-stream__body&quot;&gt;&lt;div class=&quot;ds-log-row&quot;&gt;&lt;span class=&quot;ds-log-row__time&quot;&gt;12:00:14.281&lt;/span&gt;&lt;span class=&quot;ds-log-row__level ds-log-row__level--info&quot;&gt;INFO&lt;/span&gt;&lt;span class=&quot;ds-log-row__msg&quot;&gt;BGP peering session established with ASN 13335&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-log-row&quot;&gt;&lt;span class=&quot;ds-log-row__time&quot;&gt;12:00:18.042&lt;/span&gt;&lt;span class=&quot;ds-log-row__level ds-log-row__level--warn&quot;&gt;WARN&lt;/span&gt;&lt;span class=&quot;ds-log-row__msg&quot;&gt;Packet loss threshold spike: 2.1% on HKG-01&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-log-row&quot;&gt;&lt;span class=&quot;ds-log-row__time&quot;&gt;12:00:22.910&lt;/span&gt;&lt;span class=&quot;ds-log-row__level ds-log-row__level--err&quot;&gt;ERR&lt;/span&gt;&lt;span class=&quot;ds-log-row__msg&quot;&gt;TLS handshake timeout on edge-ingress-04&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;LogStreamViewer title=&quot;edge-proxy-pod · stdout&quot; logs={[{time:&quot;12:00:14.281&quot;, level:&quot;INFO&quot;, msg:&quot;BGP established&quot;}]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 等宽时间戳列严格垂直对齐\u003c/li>\u003cli>□ 长日志单行省略不换行错乱\u003c/li>\u003cli>□ 错误与警告色标签辨识度高\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/mac-dock-stack","title":"macOS Dock 堆叠展开扇区","html":"\u003ch1>macOS Dock 堆叠展开扇区\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS Sequoia 与 iPadOS 风格的 Dock 快捷文件堆叠组件；支持折叠图标、角标未读计数、悬停放大及向上扇形/网格平铺弹出的快捷访问菜单。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>底栏快捷圆角磁贴图标\u003c/li>\u003cli>右上角强调色文件计数微徽章\u003c/li>\u003cli>向上展开的毛玻璃微浮层 (.ds-dock-stack__popup)\u003c/li>\u003cli>垂直排列的文件快捷条目行\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦堆叠触发器；Space/Enter 切换弹开或关闭；上下方向键在展开的文件列表条目间导航；Escape 迅速收起。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>展开浮层采用 transform: translateY(0) scale(1) 结合 cubic-bezier(0.16,1,0.3,1) 果冻弹性动画展开。\u003c/li>\u003cli>未读/文件数量角标采用超椭圆胶囊形状，保证 1 位与 2 位数字均美观居中。\u003c/li>\u003cli>文件条目悬停具有 --ds-inset 微背景高亮，提供细腻利落的操作确认。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-dock-stack is-open&quot; role=&quot;region&quot; aria-label=&quot;Dock 堆叠快捷栏&quot;&gt;&lt;div class=&quot;ds-dock-stack__popup&quot; role=&quot;menu&quot;&gt;&lt;div class=&quot;ds-dock-stack__row&quot; role=&quot;menuitem&quot; tabindex=&quot;0&quot; data-toast=&quot;打开拓扑图&quot;&gt;&lt;span&gt;📄&lt;/span&gt;&lt;span class=&quot;ds-dock-stack__title&quot;&gt;季度链路拓扑图.pdf&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-dock-stack__row&quot; role=&quot;menuitem&quot; tabindex=&quot;0&quot; data-toast=&quot;打开监控报表&quot;&gt;&lt;span&gt;📊&lt;/span&gt;&lt;span class=&quot;ds-dock-stack__title&quot;&gt;Anycast延时监控.csv&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-dock-stack__row&quot; role=&quot;menuitem&quot; tabindex=&quot;0&quot; data-toast=&quot;打开集群证书&quot;&gt;&lt;span&gt;🔑&lt;/span&gt;&lt;span class=&quot;ds-dock-stack__title&quot;&gt;集群接入证书.pem&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ds-dock-stack__trigger&quot; aria-label=&quot;最近文件堆叠&quot; data-toast=&quot;展开堆叠文件夹&quot;&gt;&lt;span&gt;📁&lt;/span&gt;&lt;span class=&quot;ds-dock-stack__badge&quot;&gt;3&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;DockFolderStack badge={3} items={[{icon:&quot;📄&quot;, title:&quot;季度链路拓扑图.pdf&quot;}, {icon:&quot;📊&quot;, title:&quot;Anycast延时监控.csv&quot;}]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 展开弹层动画跟手且无卡顿\u003c/li>\u003cli>□ 角标文字高对比且无溢出\u003c/li>\u003cli>□ 键盘可顺畅穿透导航内部条目\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/mac-quick-look-preview-hud","title":"macOS 空格键快速查看悬浮预览 HUD","html":"\u003ch1>macOS 空格键快速查看悬浮预览 HUD\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS Finder 空格键快速查看悬浮卡片（Quick Look Floating Preview HUD）；带有深色文件视窗预览、半透明像素分辨率标签、文件类型大小元数据行与右下角快速打开方式动作按钮。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>高景深圆角悬浮视窗 (.ds-quick-look)\u003c/li>\u003cli>大号文件类型图标视窗 (.ds-quick-look__preview)\u003c/li>\u003cli>半透明高反差规格徽标 (.ds-quick-look__meta-badge)\u003c/li>\u003cli>底部元数据双行排版 (.ds-quick-look__info)\u003c/li>\u003cli>主操作动作按钮 (.ds-quick-look__action)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Space 键快速打开/关闭；ArrowDown 预览同目录下一个文件；Enter 触发打开方式。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>role=&quot;dialog&quot; 带有 aria-modal=&quot;false&quot; 与清晰的 aria-label 报读文件名与规格。\u003c/li>\u003cli>支持 Escape 退出预览并将焦点归还至原文件列表行。\u003c/li>\u003cli>适合桌面文件管理器、设计资源库、附件预览抽屉与云盘检索列表。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-quick-look&quot; role=&quot;dialog&quot; aria-modal=&quot;false&quot; aria-label=&quot;快速查看: Architecture-2026.fig&quot;&gt;&lt;div class=&quot;ds-quick-look__preview&quot;&gt;&lt;span class=&quot;ds-quick-look__icon&quot; aria-hidden=&quot;true&quot;&gt;🎨&lt;/span&gt;&lt;span class=&quot;ds-quick-look__meta-badge&quot;&gt;3840 × 2160&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-quick-look__info&quot;&gt;&lt;div&gt;&lt;div class=&quot;ds-quick-look__title&quot;&gt;Architecture-2026.fig&lt;/div&gt;&lt;div class=&quot;ds-quick-look__sub&quot;&gt;Figma Document · 42.8 MB&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ds-quick-look__action&quot;&gt;打开方式&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MacQuickLookPreviewHud fileName=&quot;Architecture-2026.fig&quot; fileType=&quot;Figma Document&quot; fileSize=&quot;42.8 MB&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 大号图标投影温和\u003c/li>\u003cli>□ 右下角胶囊磨砂透明自然\u003c/li>\u003cli>□ 按钮点击态微透明反馈\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/mac-spotlight-bar","title":"macOS 悬浮指令搜索栏","html":"\u003ch1>macOS 悬浮指令搜索栏\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS Sequoia 与 Raycast 风格的高斯模糊浮动全局指令搜索条；集成放大镜检索图标、即时输入、分类过滤微胶囊 (如 系统动作) 与键盘快捷键键帽提示 (如 ⌘K / ↵)。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>高斯模糊半透明背板 (.ds-spotlight-bar)\u003c/li>\u003cli>搜索放大镜微图标\u003c/li>\u003cli>无边框自适应输入区\u003c/li>\u003cli>右侧分类过滤胶囊与快捷键微键帽\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>全局 ⌘K / Ctrl+K 唤起；Enter 提交检索动作；Tab 切换过滤标签；Escape 退出关闭。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>采用 backdrop-filter: blur(20px) 极高深度高斯模糊，与底层内容完美隔离。\u003c/li>\u003cli>右侧快捷键键帽采用等宽字体与微立体边框，提示极速击键流。\u003c/li>\u003cli>宽度最大支持 540px，自适应移动端与桌面端屏幕。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spotlight-bar&quot; role=&quot;search&quot; aria-label=&quot;Spotlight 快速启动&quot;&gt;&lt;span class=&quot;ds-spotlight-bar__icon&quot; aria-hidden=&quot;true&quot;&gt;🔍&lt;/span&gt;&lt;input type=&quot;text&quot; class=&quot;ds-spotlight-bar__input&quot; placeholder=&quot;搜索应用、文件或快捷指令…&quot; value=&quot;Anycast 测速&quot; aria-label=&quot;输入指令&quot;&gt;&lt;div class=&quot;ds-spotlight-bar__badges&quot;&gt;&lt;span class=&quot;ds-spotlight-bar__tag&quot;&gt;系统动作&lt;/span&gt;&lt;kbd class=&quot;ds-spotlight-bar__shortcut&quot;&gt;⌘↵ 执行&lt;/kbd&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SpotlightSearchBar filterTag=&quot;系统动作&quot; shortcut=&quot;⌘↵&quot; onSubmit={runCommand} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 毛玻璃质感在深浅主题下均能看清文字\u003c/li>\u003cli>□ 输入框文字高对比度且无外框突兀重绘\u003c/li>\u003cli>□ 快捷键标签排版对齐\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/mac-touch-bar-slider-scrub","title":"MacBook Pro OLED Touch Bar 触控动态滑块","html":"\u003ch1>MacBook Pro OLED Touch Bar 触控动态滑块\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>致敬 MacBook Pro OLED Touch Bar 沉浸式动态触控滑块（OLED Touch Bar Slider）；全黑极客底色、前置功能微图标、平滑青紫霓虹渐变发光填充条及实时等宽数值。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>全圆角纯黑深槽容器 (.ds-touchbar-slider)\u003c/li>\u003cli>左侧明度/音量微图标 (.ds-touchbar-slider__icon)\u003c/li>\u003cli>青蓝向电紫渐变发光进度条 (.ds-touchbar-slider__fill)\u003c/li>\u003cli>右侧高亮等宽实时百分比 (.ds-touchbar-slider__val)\u003c/li>\u003cli>支持点击与滑动手势调节\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>ArrowLeft / ArrowDown 递减 1%；ArrowRight / ArrowUp 递增 1%；Home / End 快速归零或满载。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;slider&quot; 与 aria-valuenow 完整反映当前调节百分比。\u003c/li>\u003cli>发光渐变条具备良好可视范围，纯黑底色与高亮填充对比度极高。\u003c/li>\u003cli>适合车载中控屏、专业音频外设工作台、极客外设虚拟控制坞。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-touchbar-slider&quot; role=&quot;group&quot; aria-label=&quot;Touch Bar 触控滑块&quot;&gt;&lt;span class=&quot;ds-touchbar-slider__icon&quot; aria-hidden=&quot;true&quot;&gt;🔆&lt;/span&gt;&lt;div class=&quot;ds-touchbar-slider__track&quot; style=&quot;--ds-tb-val:64%&quot; role=&quot;slider&quot; aria-valuenow=&quot;64&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot; aria-label=&quot;Touch Bar 亮度或音量调节&quot; tabindex=&quot;0&quot;&gt;&lt;div class=&quot;ds-touchbar-slider__fill&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;ds-touchbar-slider__val&quot;&gt;64%&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MacTouchBarSliderScrub value={64} icon=&quot;🔆&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 纯黑药丸胶囊精致立体\u003c/li>\u003cli>□ 渐变发光滑块色彩亮丽\u003c/li>\u003cli>□ 百分比右对齐等宽显示\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/mac-traffic-light-toolbar","title":"macOS Sequoia 沉浸式交通灯红黄绿窗口控制栏","html":"\u003ch1>macOS Sequoia 沉浸式交通灯红黄绿窗口控制栏\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS Sequoia 风格的沉浸式无缝标题与窗口控制栏；配备左侧红黄绿物理交通灯按键（带悬停符号展示）、居中窗口标题与右侧就绪状态胶囊。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>40px 高度磨砂高斯模糊标题栏 (.ds-mac-titlebar)\u003c/li>\u003cli>左侧三色交通灯容器 (.ds-mac-lights)\u003c/li>\u003cli>红、黄、绿独立控制圆点 (.ds-mac-light--close, --min, --max)\u003c/li>\u003cli>中部居中文档/应用标题 (.ds-mac-titlebar__title)\u003c/li>\u003cli>右侧操作状态区 (.ds-mac-titlebar__actions)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦各个控制按钮；Enter/Space 触发关闭、最小化或最大化。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>交通灯符号默认 color: transparent，悬停容器整体显示真实微符号，精准还原 macOS 原生交互。\u003c/li>\u003cli>采用 backdrop-filter: blur(20px) 与微细边框，贴合系统窗口视觉层次。\u003c/li>\u003cli>左右两侧采用等宽预留（70px），确保中间标题几何居中不偏移。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-mac-titlebar&quot; role=&quot;toolbar&quot; aria-label=&quot;macOS 窗口标题控制栏&quot;&gt;&lt;div class=&quot;ds-mac-lights&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-mac-light ds-mac-light--close&quot; aria-label=&quot;关闭窗口&quot;&gt;×&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-mac-light ds-mac-light--min&quot; aria-label=&quot;最小化窗口&quot;&gt;−&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-mac-light ds-mac-light--max&quot; aria-label=&quot;最大化窗口&quot;&gt;+&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ds-mac-titlebar__title&quot;&gt;&lt;span&gt;🍎&lt;/span&gt;&lt;span&gt;AetherLink Client — macOS Sequoia&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-mac-titlebar__actions&quot;&gt;&lt;span class=&quot;ds-badge&quot; style=&quot;font-size:10px&quot;&gt;就绪&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MacTrafficLightBar title=&quot;AetherLink Client&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 交通灯悬停时符号平滑显现\u003c/li>\u003cli>□ 标题文字严格处于中间位置\u003c/li>\u003cli>□ 浅色深色主题下磨砂背景通透\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/mac-window","title":"macOS 风格窗口壳体","html":"\u003ch1>macOS 风格窗口壳体\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS Sequoia 原生视窗镀铬外壳；整合三色可交互红绿灯控制按钮、磨砂标题栏与窗口内容画布。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角窗口轮廓与深层投影\u003c/li>\u003cli>红黄绿物理红绿灯按钮\u003c/li>\u003cli>居中应用标题栏\u003c/li>\u003cli>内容隔离底层画布\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 可导航至窗口内交互控件；红绿灯按钮支持点击与键盘 Enter 触发关闭或最小化。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>标题栏底色采用 chrome 语义变量与毛玻璃通透质感，极具 macOS 工业质感。\u003c/li>\u003cli>窗口外边框具备微妙 1px 细线描边与 42px 大景深阴影，浮层感强烈。\u003c/li>\u003cli>红黄绿三色控制点尺寸为 12px，间距 7px，精确还原原生物理比例。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-mac-window&quot;&gt;&lt;div class=&quot;ds-mac-titlebar&quot;&gt;&lt;div class=&quot;ds-mac-lights&quot;&gt;&lt;span class=&quot;ds-mac-light ds-mac-light--close&quot; role=&quot;button&quot; aria-label=&quot;关闭窗口&quot; data-toast=&quot;关闭窗口&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-mac-light ds-mac-light--min&quot; role=&quot;button&quot; aria-label=&quot;最小化窗口&quot; data-toast=&quot;最小化窗口&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-mac-light ds-mac-light--max&quot; role=&quot;button&quot; aria-label=&quot;最大化窗口&quot; data-toast=&quot;全屏最大化&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-mac-title&quot;&gt;AetherLink — 节点调度中心&lt;/span&gt;&lt;div style=&quot;width:48px&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-mac-content&quot;&gt;&lt;div style=&quot;display:flex;align-items:center;justify-content:space-between&quot;&gt;&lt;strong style=&quot;font-size:14px&quot;&gt;系统就绪&lt;/strong&gt;&lt;span class=&quot;ds-badge ds-badge--success&quot;&gt;多径模式已激活&lt;/span&gt;&lt;/div&gt;&lt;p style=&quot;font-size:12px;color:var(--ds-muted);margin:8px 0 0&quot;&gt;已接入 12 个边缘网关，自动优选延迟最低的出口路径。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MacWindow title=&quot;AetherLink&quot;&gt;&lt;DashboardContent /&gt;&lt;/MacWindow&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 红绿灯三色比例与圆角精确匹配 macOS 规范\u003c/li>\u003cli>□ 深浅模式下标题栏与内容区明暗层级自然\u003c/li>\u003cli>□ 红绿灯按钮具备可访问名称与点击反馈\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/macos-app-switcher-dock","title":"macOS ⌘Tab 悬浮毛玻璃应用切换面板","html":"\u003ch1>macOS ⌘Tab 悬浮毛玻璃应用切换面板\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS 经典的 ⌘Tab 快捷应用切换器（App Switcher HUD）；大圆角深层亚克力毛玻璃背景、56px 高精图标单元、高亮选中外框与运行中绿色微点指示。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>大圆角居中悬浮底座 (.ds-mac-switcher)\u003c/li>\u003cli>56px 独立应用图标格 (.ds-mac-switcher__item)\u003c/li>\u003cli>应用运行状态指示小绿点 (.ds-mac-switcher__badge)\u003c/li>\u003cli>当前选定高亮外轮廓态 (.is-active)\u003c/li>\u003cli>悬停微缩放微交互\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 或方向键右在各运行中 App 间切换选中；Shift+Tab 或方向键左反向移动；Enter 切换至对应 App；Esc 退出面板。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>悬浮居中排布，选中项外轮廓包含 2px 高亮 outline 与强调背景色，视觉焦点极其明晰。\u003c/li>\u003cli>右下角绿点指示当前进程活动状态，重现 macOS 经典系统交互细节。\u003c/li>\u003cli>适合桌面客户端多任务管理、标签页快速跳转 HUD 及全屏快捷抽屉。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-mac-switcher&quot; role=&quot;listbox&quot; aria-label=&quot;macOS ⌘Tab 应用程序切换窗口&quot;&gt;&lt;div role=&quot;option&quot; aria-selected=&quot;true&quot; class=&quot;ds-mac-switcher__item is-active&quot; title=&quot;Finder&quot;&gt;&lt;span&gt;📁&lt;/span&gt;&lt;span class=&quot;ds-mac-switcher__badge&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div role=&quot;option&quot; aria-selected=&quot;false&quot; class=&quot;ds-mac-switcher__item&quot; title=&quot;Terminal&quot;&gt;&lt;span&gt;⌨️&lt;/span&gt;&lt;span class=&quot;ds-mac-switcher__badge&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div role=&quot;option&quot; aria-selected=&quot;false&quot; class=&quot;ds-mac-switcher__item&quot; title=&quot;Xcode&quot;&gt;&lt;span&gt;🛠️&lt;/span&gt;&lt;span class=&quot;ds-mac-switcher__badge&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div role=&quot;option&quot; aria-selected=&quot;false&quot; class=&quot;ds-mac-switcher__item&quot; title=&quot;Safari&quot;&gt;&lt;span&gt;🧭&lt;/span&gt;&lt;span class=&quot;ds-mac-switcher__badge&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MacAppSwitcherHud /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 图标单元正方圆润排列整齐\u003c/li>\u003cli>□ 运行中微绿点醒目不突兀\u003c/li>\u003cli>□ 选中外框间距均匀\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/macos-color-matrix-palette","title":"macOS 数码测色计 32 色阵列取色板","html":"\u003ch1>macOS 数码测色计 32 色阵列取色板\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS Sequoia 数码测色计与 Adobe 调色板风格的 32 色网格色盘；支持单色悬停放大浮出、十六进制色值实时采样及底部预览块联动。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>色盘控制台面板 (.ds-color-matrix)\u003c/li>\u003cli>顶栏色板统计标题 (.ds-color-matrix__head)\u003c/li>\u003cli>8x4 三十二宫格色块矩阵 (.ds-color-matrix__grid)\u003c/li>\u003cli>单独色块微交互放大单元 (.ds-color-matrix__cell)\u003c/li>\u003cli>底部十六进制采样预览栏 (.ds-color-matrix__meta)\u003c/li>\u003cli>方形实时色样块 (.ds-color-matrix__preview)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>方向键在色块网格间移动；Enter 或 Space 采样当前色彩；Tab 导航出矩阵。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>色块悬停采用 GPU transform scale 放大配合细微投影浮出，操作反馈细腻明确。\u003c/li>\u003cli>底部展示选中色的 Hex 编码与方形样块，提供即时采样反馈。\u003c/li>\u003cli>适合设计工具画板着色器、主题色自定义配置中心及图表配色方案切换器。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-color-matrix&quot; role=&quot;region&quot; aria-label=&quot;macOS 32色阵列取色板&quot;&gt;&lt;div class=&quot;ds-color-matrix__head&quot;&gt;&lt;span&gt;macOS Digital Color Matrix&lt;/span&gt;&lt;span&gt;32 SWATCHES&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-color-matrix__grid&quot;&gt;&lt;div class=&quot;ds-color-matrix__cell&quot; style=&quot;background-color:#ef4444&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;拾取颜色 #ef4444&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-color-matrix__cell&quot; style=&quot;background-color:#f97316&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;拾取颜色 #f97316&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-color-matrix__cell&quot; style=&quot;background-color:#f59e0b&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;拾取颜色 #f59e0b&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-color-matrix__cell&quot; style=&quot;background-color:#84cc16&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;拾取颜色 #84cc16&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-color-matrix__cell&quot; style=&quot;background-color:#10b981&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;拾取颜色 #10b981&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-color-matrix__cell&quot; style=&quot;background-color:#06b6d4&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;拾取颜色 #06b6d4&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-color-matrix__cell&quot; style=&quot;background-color:#3b82f6&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;拾取颜色 #3b82f6&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-color-matrix__cell&quot; style=&quot;background-color:#6366f1&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;拾取颜色 #6366f1&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-color-matrix__meta&quot;&gt;&lt;div style=&quot;display:flex;align-items:center;gap:6px&quot;&gt;&lt;div class=&quot;ds-color-matrix__preview&quot; style=&quot;background-color:#3b82f6&quot;&gt;&lt;/div&gt;&lt;span&gt;#3B82F6&lt;/span&gt;&lt;/div&gt;&lt;span style=&quot;color:var(--ds-muted);font-size:10px&quot;&gt;HEX SAMPLER&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MacColorMatrixPalette selectedColor=&quot;#3b82f6&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 网格缝隙严谨等距\u003c/li>\u003cli>□ 悬停色块放大且层次置顶\u003c/li>\u003cli>□ 采样读数十六进制清晰\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/macos-finder-column-view","title":"macOS Sequoia 级联分栏文件目录浏览器","html":"\u003ch1>macOS Sequoia 级联分栏文件目录浏览器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS Sequoia Finder 经典的 NeXTSTEP 多列分级级联目录浏览器；支持横向平铺多层级文件夹、高亮选定项目及右侧指引箭头。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>横向可横滚分栏容器 (.ds-finder-columns)\u003c/li>\u003cli>纵向单列滚动目录栏 (.ds-finder-col)\u003c/li>\u003cli>文件与文件夹行项 (.ds-finder-item)\u003c/li>\u003cli>选中高亮行态 (.ds-finder-item.is-selected)\u003c/li>\u003cli>左侧类型图标与文件名 (.ds-finder-item__left)\u003c/li>\u003cli>右侧子层级前进指示箭头 (.ds-finder-item__chevron)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>上下箭头在当前列各文件间导航；右箭头进入子文件夹展开新列；左箭头返回上一级父列。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>选中项采用系统强调色（--ds-action）反白展示，提供直观的路径追踪体验。\u003c/li>\u003cli>每列独立纵向滚动，多列超出时容器横向滚动，重现 Finder 的层级展开逻辑。\u003c/li>\u003cli>适合复杂云存储文件管理、知识库文档树、代码工程模块检索及资产管理器。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-finder-columns&quot; role=&quot;region&quot; aria-label=&quot;macOS 分栏文件浏览器&quot;&gt;&lt;div class=&quot;ds-finder-col&quot; role=&quot;listbox&quot; aria-label=&quot;第 1 层目录&quot;&gt;&lt;div role=&quot;option&quot; aria-selected=&quot;false&quot; class=&quot;ds-finder-item&quot;&gt;&lt;div class=&quot;ds-finder-item__left&quot;&gt;&lt;span&gt;📁&lt;/span&gt;&lt;span class=&quot;ds-finder-item__text&quot;&gt;Applications&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-finder-item__chevron&quot; aria-hidden=&quot;true&quot;&gt;›&lt;/span&gt;&lt;/div&gt;&lt;div role=&quot;option&quot; aria-selected=&quot;true&quot; class=&quot;ds-finder-item is-selected&quot;&gt;&lt;div class=&quot;ds-finder-item__left&quot;&gt;&lt;span&gt;📁&lt;/span&gt;&lt;span class=&quot;ds-finder-item__text&quot;&gt;Projects&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-finder-item__chevron&quot; aria-hidden=&quot;true&quot;&gt;›&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-finder-col&quot; role=&quot;listbox&quot; aria-label=&quot;第 2 层目录&quot;&gt;&lt;div role=&quot;option&quot; aria-selected=&quot;true&quot; class=&quot;ds-finder-item is-selected&quot;&gt;&lt;div class=&quot;ds-finder-item__left&quot;&gt;&lt;span&gt;📁&lt;/span&gt;&lt;span class=&quot;ds-finder-item__text&quot;&gt;ui-design-system&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-finder-item__chevron&quot; aria-hidden=&quot;true&quot;&gt;›&lt;/span&gt;&lt;/div&gt;&lt;div role=&quot;option&quot; aria-selected=&quot;false&quot; class=&quot;ds-finder-item&quot;&gt;&lt;div class=&quot;ds-finder-item__left&quot;&gt;&lt;span&gt;📁&lt;/span&gt;&lt;span class=&quot;ds-finder-item__text&quot;&gt;AetherLink&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-finder-item__chevron&quot; aria-hidden=&quot;true&quot;&gt;›&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-finder-col&quot; role=&quot;listbox&quot; aria-label=&quot;第 3 层目录&quot;&gt;&lt;div role=&quot;option&quot; aria-selected=&quot;true&quot; class=&quot;ds-finder-item is-selected&quot;&gt;&lt;div class=&quot;ds-finder-item__left&quot;&gt;&lt;span&gt;📁&lt;/span&gt;&lt;span class=&quot;ds-finder-item__text&quot;&gt;web&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-finder-item__chevron&quot; aria-hidden=&quot;true&quot;&gt;›&lt;/span&gt;&lt;/div&gt;&lt;div role=&quot;option&quot; aria-selected=&quot;false&quot; class=&quot;ds-finder-item&quot;&gt;&lt;div class=&quot;ds-finder-item__left&quot;&gt;&lt;span&gt;📁&lt;/span&gt;&lt;span class=&quot;ds-finder-item__text&quot;&gt;tokens&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-finder-item__chevron&quot; aria-hidden=&quot;true&quot;&gt;›&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MacFinderColumnView /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 分栏边框垂直贯通无截断\u003c/li>\u003cli>□ 选定项高亮与箭头色彩协调\u003c/li>\u003cli>□ 长文件名自适应省略号截断\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/macos-menu-bar-clock-calendar-flyout","title":"macOS 顶部菜单栏时钟与月历微面板","html":"\u003ch1>macOS 顶部菜单栏时钟与月历微面板\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS Sequoia 顶部菜单栏点击时间弹出的半透明微型日历与日程面板（Menu Bar Clock &amp; Calendar Flyout）；包含加粗大字体等宽数字时钟、周几与日期、整月 7 列日历网格及高亮今日红点、待办日程微胶囊。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>大圆角高斯模糊浮层 (.ds-menubar-calendar)\u003c/li>\u003cli>顶部大号等宽时钟与日期标题 (.ds-menubar-calendar__clock, .ds-menubar-calendar__date)\u003c/li>\u003cli>周日至周六 7 列紧凑表头 (.ds-menubar-calendar__day-name)\u003c/li>\u003cli>日历网格微单元与今日实心高亮圆 (.ds-menubar-calendar__cell.is-today)\u003c/li>\u003cli>近期日程提示微徽标 (.ds-menubar-calendar__event)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>ArrowLeft / ArrowRight / ArrowUp / ArrowDown 在日历单元格间导航；Escape 关闭浮层。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;dialog&quot; 与内部日历表格 role=&quot;grid&quot; 及各单元 role=&quot;gridcell&quot;。\u003c/li>\u003cli>今日日期高亮显眼，且日期数字清晰可辨。\u003c/li>\u003cli>适合系统菜单栏扩展、桌面小组件、日程速查浮层与考勤打卡卡片。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-menubar-calendar&quot; role=&quot;dialog&quot; aria-label=&quot;macOS 日历与时钟飞出浮层&quot;&gt;&lt;div class=&quot;ds-menubar-calendar__head&quot;&gt;&lt;span class=&quot;ds-menubar-calendar__clock&quot;&gt;09:41&lt;/span&gt;&lt;span class=&quot;ds-menubar-calendar__date&quot;&gt;10月16日 周四&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__grid&quot; role=&quot;grid&quot; aria-label=&quot;月历&quot;&gt;&lt;div class=&quot;ds-menubar-calendar__day-name&quot; role=&quot;columnheader&quot;&gt;日&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__day-name&quot; role=&quot;columnheader&quot;&gt;一&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__day-name&quot; role=&quot;columnheader&quot;&gt;二&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__day-name&quot; role=&quot;columnheader&quot;&gt;三&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__day-name&quot; role=&quot;columnheader&quot;&gt;四&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__day-name&quot; role=&quot;columnheader&quot;&gt;五&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__day-name&quot; role=&quot;columnheader&quot;&gt;六&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell is-muted&quot; role=&quot;gridcell&quot;&gt;28&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell is-muted&quot; role=&quot;gridcell&quot;&gt;29&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell is-muted&quot; role=&quot;gridcell&quot;&gt;30&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;1&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;2&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;3&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;4&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;5&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;6&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;7&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;8&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;9&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;10&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;11&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;12&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;13&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;14&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;15&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell is-today&quot; role=&quot;gridcell&quot;&gt;16&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;17&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__cell&quot; role=&quot;gridcell&quot;&gt;18&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-menubar-calendar__event&quot;&gt;&lt;span class=&quot;ds-menubar-calendar__event-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span&gt;10:30 产品设计评审&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MacMenuBarCalendarFlyout time=&quot;09:41&quot; date=&quot;10月16日 周四&quot; today={16} upcomingEvent=&quot;10:30 产品设计评审&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 大号时钟数字醒目\u003c/li>\u003cli>□ 日历 7 列网格平分整齐\u003c/li>\u003cli>□ 今日 16 号圆形实心高亮突出\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/macos-safari-reader-font-switcher","title":"Safari 阅读器字体与版式选择微面板","html":"\u003ch1>Safari 阅读器字体与版式选择微面板\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS 与 iOS Safari 阅读器（Reader Mode）顶栏点击弹出字体与纸张配色选择面板（Reader Typographic Font &amp; Theme Switcher）；顶部四颗圆形纸张底色药丸（白纸、羊皮纸、深灰、夜间纯黑）及经典高质量排版字体列表单选。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>规整浮动气泡容器 (.ds-safari-font-switcher)\u003c/li>\u003cli>顶部四色圆形纸质主题选择药丸 (.ds-safari-font-switcher__themes, .ds-safari-font-switcher__pill)\u003c/li>\u003cli>垂直经典阅读字体列表项 (.ds-safari-font-switcher__fonts, .ds-safari-font-switcher__item)\u003c/li>\u003cli>选中状态高亮浅底与右侧对勾标记 (.is-selected)\u003c/li>\u003cli>符合人机工程学的舒适行高与触控热区\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>ArrowDown / ArrowUp 切换字体；Enter 选中当前字体或主题；Escape 关闭面板。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;dialog&quot; 与 aria-label 说明 Safari 阅读器字体与版式面板。\u003c/li>\u003cli>四色主题药丸均配备明确无障碍标签，对勾状态清晰可感知。\u003c/li>\u003cli>适合电子书阅读器、文档沉浸模式、富文本排版定制工具。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-safari-font-switcher&quot; role=&quot;dialog&quot; aria-label=&quot;Safari 阅读器字体与版式面板&quot;&gt;&lt;div class=&quot;ds-safari-font-switcher__themes&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-safari-font-switcher__pill is-active&quot; style=&quot;background-color:#ffffff&quot; aria-label=&quot;主题：白纸&quot;&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-safari-font-switcher__pill&quot; style=&quot;background-color:#fbf0d9&quot; aria-label=&quot;主题：羊皮纸&quot;&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-safari-font-switcher__pill&quot; style=&quot;background-color:#4a4a4c&quot; aria-label=&quot;主题：深灰&quot;&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-safari-font-switcher__pill&quot; style=&quot;background-color:#1c1c1e&quot; aria-label=&quot;主题：夜间&quot;&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ds-safari-font-switcher__fonts&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-safari-font-switcher__item is-selected&quot;&gt;&lt;span&gt;San Francisco&lt;/span&gt;&lt;span&gt;✓&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-safari-font-switcher__item&quot;&gt;&lt;span&gt;New York (Serif)&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-safari-font-switcher__item&quot;&gt;&lt;span&gt;Charter&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MacSafariReaderFontSwitcher currentFont=&quot;San Francisco&quot; currentTheme=&quot;white&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 四色主题圆点排列整齐\u003c/li>\u003cli>□ 字体列表紧凑易点\u003c/li>\u003cli>□ 当前字体选中带浅色底与勾号\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/macos-sound-volume-indicator-hud","title":"macOS 经典微光音量微调浮动 HUD","html":"\u003ch1>macOS 经典微光音量微调浮动 HUD\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS 经典毛玻璃半透明大圆角方块音量调节提示浮层（Sound Volume Bezel HUD）；深色磨砂高斯模糊壳体、喇叭声波图标、16 段白色高亮微刻度条。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>正方大圆角毛玻璃外壳 (.ds-volume-bezel)\u003c/li>\u003cli>拟物喇叭声波微投影图标 (.ds-volume-bezel__icon)\u003c/li>\u003cli>微内嵌刻度槽 (.ds-volume-bezel__meter)\u003c/li>\u003cli>16 格白色发光微刻度方块 (.ds-volume-bezel__tick)\u003c/li>\u003cli>静音独立图标切换\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>快捷音量键（VolumeUp / VolumeDown / Mute）触发播报与动画。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>role=&quot;status&quot; 与 aria-live=&quot;polite&quot; 实时语音报读当前系统音量级别（如 10/16 或 静音）。\u003c/li>\u003cli>白色高亮刻度与暗底对比度达到 14:1。\u003c/li>\u003cli>适合音视频播放器、系统状态提示、耳机音量调节与多媒体工作台。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-volume-bezel&quot; role=&quot;status&quot; aria-live=&quot;polite&quot; aria-label=&quot;系统音量: 10/16&quot;&gt;&lt;span class=&quot;ds-volume-bezel__icon&quot; aria-hidden=&quot;true&quot;&gt;🔊&lt;/span&gt;&lt;div class=&quot;ds-volume-bezel__meter&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;ds-volume-bezel__tick is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick is-active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-volume-bezel__tick&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MacAudioVolumeBezelHud level={10} maxLevel={16} isMuted={false} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 磨砂半透明方块居中悬浮\u003c/li>\u003cli>□ 10 格白色激活微方块排列齐整\u003c/li>\u003cli>□ 喇叭微投影温润\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/marquee","title":"无限跑马灯","html":"\u003ch1>无限跑马灯\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 布局 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Linear 与 Stripe 首页级别的 60fps 硬件加速无限滚动横幅；用于合作品牌、支持协议、特性徽章的无缝巡展。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>溢出裁剪容器\u003c/li>\u003cli>两端羽化渐变遮罩 (Mask)\u003c/li>\u003cli>双轨滚动循环轨道 (Track)\u003c/li>\u003cli>独立徽章胶囊项\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>非必要交互控件不占用键盘焦点；鼠标悬停或焦点进入时自动暂停滚动，方便阅读。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>使用 -webkit-mask-image 实现左右两侧的无感淡出过渡。\u003c/li>\u003cli>纯 transform3d 动画，绝对不触发浏览器布局回流。\u003c/li>\u003cli>悬停时 animation-play-state 自动切换为 paused。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-marquee&quot; role=&quot;region&quot; aria-label=&quot;支持的协议矩阵&quot; style=&quot;width:100%&quot;&gt;&lt;div class=&quot;ds-marquee__track&quot;&gt;&lt;span class=&quot;ds-marquee__item&quot;&gt;⚡ WireGuard&lt;/span&gt;&lt;span class=&quot;ds-marquee__item&quot;&gt;🛡️ VLESS&lt;/span&gt;&lt;span class=&quot;ds-marquee__item&quot;&gt;🔒 Shadowsocks-2022&lt;/span&gt;&lt;span class=&quot;ds-marquee__item&quot;&gt;🚀 Hysteria 2&lt;/span&gt;&lt;span class=&quot;ds-marquee__item&quot;&gt;🌐 TUIC v5&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-marquee__track&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;ds-marquee__item&quot;&gt;⚡ WireGuard&lt;/span&gt;&lt;span class=&quot;ds-marquee__item&quot;&gt;🛡️ VLESS&lt;/span&gt;&lt;span class=&quot;ds-marquee__item&quot;&gt;🔒 Shadowsocks-2022&lt;/span&gt;&lt;span class=&quot;ds-marquee__item&quot;&gt;🚀 Hysteria 2&lt;/span&gt;&lt;span class=&quot;ds-marquee__item&quot;&gt;🌐 TUIC v5&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Marquee items={[&quot;WireGuard&quot;, &quot;VLESS&quot;, &quot;Hysteria 2&quot;, &quot;TUIC&quot;]} speed={20} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 首尾交接处无闪烁或跳动\u003c/li>\u003cli>□ 鼠标悬停时平稳暂停滚动\u003c/li>\u003cli>□ 减弱动效偏好下停止自动滚动\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/matrix-code-rain","title":"黑客帝国代码字符雨视窗","html":"\u003ch1>黑客帝国代码字符雨视窗\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Cyberpunk 与 Matrix 终端风格的动态数字流雨帘视窗；带有垂直多列字符交错下坠动效、末端高亮白光引导字符 (.ds-matrix-glyph--lead) 与绿色荧光文字阴影。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>深黑绿终端外框容器 (.ds-matrix-rain)\u003c/li>\u003cli>多列垂直交错下坠列 (.ds-matrix-col)\u003c/li>\u003cli>高亮荧光字符与微光扩散\u003c/li>\u003cli>首位引导高光白字符\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为动态视效背景组件，提供 role=&quot;img&quot; 与清晰无障碍标签 aria-label。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>动效采用 GPU 加速的 transform: translateY() 与不同列随机延时，纯合成器运行零重排。\u003c/li>\u003cli>字符首位带有 #fff 白色高光与双层 text-shadow，模拟物理阴极射线管 CRT 荧光拖尾。\u003c/li>\u003cli>适合用作黑客模式、数据加密解密中或极客开发者面板的沉浸式加载态。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-matrix-rain&quot; role=&quot;img&quot; aria-label=&quot;动态代码雨&quot;&gt;&lt;div class=&quot;ds-matrix-col&quot;&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;λ&lt;/span&gt;&lt;span class=&quot;ds-matrix-glyph--lead&quot;&gt;9&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-matrix-col&quot;&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;7&lt;/span&gt;&lt;span class=&quot;ds-matrix-glyph--lead&quot;&gt;a&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-matrix-col&quot;&gt;&lt;span&gt;z&lt;/span&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;8&lt;/span&gt;&lt;span class=&quot;ds-matrix-glyph--lead&quot;&gt;3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-matrix-col&quot;&gt;&lt;span&gt;4&lt;/span&gt;&lt;span&gt;q&lt;/span&gt;&lt;span&gt;0&lt;/span&gt;&lt;span class=&quot;ds-matrix-glyph--lead&quot;&gt;1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-matrix-col&quot;&gt;&lt;span&gt;9&lt;/span&gt;&lt;span&gt;w&lt;/span&gt;&lt;span&gt;1&lt;/span&gt;&lt;span class=&quot;ds-matrix-glyph--lead&quot;&gt;8&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-matrix-col&quot;&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;x&lt;/span&gt;&lt;span&gt;7&lt;/span&gt;&lt;span class=&quot;ds-matrix-glyph--lead&quot;&gt;y&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MatrixDigitalRain /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 字符下落动效平滑无卡顿\u003c/li>\u003cli>□ 荧光阴影边缘柔和无撕裂\u003c/li>\u003cli>□ 减弱动效偏好下自动静止\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a>
