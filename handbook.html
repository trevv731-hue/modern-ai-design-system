;⚡&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SpeedDial icon=&quot;+&quot; actions={[{label:&quot;导入&quot;, icon:&quot;📥&quot;}, {label:&quot;扫码&quot;, icon:&quot;📷&quot;}]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 点击主按钮平滑展开子选项\u003c/li>\u003cli>□ 展开后子选项可通过键盘 Tab 获取焦点\u003c/li>\u003cli>□ Escape 键可迅速关闭展开菜单\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/speedometer-dial","title":"仪表盘罗盘指针","html":"\u003ch1>仪表盘罗盘指针\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>网络测速与系统负载仪表罗盘；带有半圆彩色环形刻度、物理红色指示针与大字号实时读数。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>半圆刻度圆弧底槽\u003c/li>\u003cli>高亮主题强调色活跃弧段\u003c/li>\u003cli>红色物理指针 (transform-origin: bottom)\u003c/li>\u003cli>中心金属圆心锚点\u003c/li>\u003cli>当前速率读数与单位\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为状态测量图元提供 role=&quot;meter&quot; 与当前数值的 aria-valuenow 与 aria-valuemax。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>指针旋转角度纯通过 CSS 自定义属性 (--ds-needle-deg) 与 transform:rotate 驱动，性能极高。\u003c/li>\u003cli>指针下端固定于圆心，配合立方贝塞尔平滑减速，具有真实的物理指针阻尼感。\u003c/li>\u003cli>大字号数字采用 tabular-nums 等宽排版，频繁刷新速率时不产生横向抖动。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-speedometer&quot; role=&quot;meter&quot; aria-valuenow=&quot;85&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot; aria-label=&quot;实时下行速率&quot;&gt;&lt;div class=&quot;ds-speedometer__gauge&quot;&gt;&lt;div class=&quot;ds-speedometer__arc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-speedometer__needle&quot; style=&quot;--ds-needle-deg:63deg&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-speedometer__center&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-speedometer__val&quot;&gt;850 &lt;span class=&quot;ds-speedometer__unit&quot;&gt;Mbps&lt;/span&gt;&lt;/div&gt;&lt;small style=&quot;font-size:11px;color:var(--ds-muted);margin-top:2px&quot;&gt;下行峰值带宽&lt;/small&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SpeedometerDial value={85} max={100} unit=&quot;Mbps&quot; label=&quot;下行峰值带宽&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 指针旋转平滑带物理阻尼感\u003c/li>\u003cli>□ 刻度弧线圆滑规整无锯齿\u003c/li>\u003cli>□ 读屏器能正确感知实时速率\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/split-button","title":"组合分裂按钮","html":"\u003ch1>组合分裂按钮\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>主操作与次级衍生操作合二为一，兼顾 GitHub PR 合并与 Windows Fluent 的精巧布局。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>主要动作触发面\u003c/li>\u003cli>1px 微分割线\u003c/li>\u003cli>下拉更多选项触发箭头\u003c/li>\u003cli>统一步调的外层轮廓\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>左侧主按钮与右侧微箭头分别独立 Tab；Space/Enter 分别触发主操作与呼出菜单。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>两部分共享相同的外轮廓与内高光，视觉浑然一体。\u003c/li>\u003cli>右侧箭头触发时与 DropdownMenu 无缝配合。\u003c/li>\u003cli>移动端触摸密度模式保证两部分都有至少 44px 点击命中区。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-split-button&quot;&gt;&lt;button class=&quot;ds-button ds-split-button__main&quot; data-toast=&quot;已启动核心代理&quot;&gt;启动连接&lt;/button&gt;&lt;button class=&quot;ds-button ds-split-button__arrow&quot; data-toggle-menu aria-label=&quot;更多启动选项&quot; aria-haspopup=&quot;true&quot;&gt;▾&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SplitButton label=&quot;启动连接&quot; onMain={start} onMore={openOptions} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 两个按钮均拥有独立清晰的键盘焦点环\u003c/li>\u003cli>□ 主要操作与下拉触发互不干扰\u003c/li>\u003cli>□ 高对比度模式下分割界线清楚\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/spotlight-card","title":"光影跟随聚光卡片","html":"\u003ch1>光影跟随聚光卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Vercel 与 Linear 官网风格的聚光灯追踪卡片；鼠标划过时沿坐标投射柔和高光并点亮边框。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角内容卡片容器\u003c/li>\u003cli>跟随光标坐标的径向聚光层\u003c/li>\u003cli>微弱 1px 强调色边框高亮\u003c/li>\u003cli>卡片标题与功能正文\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦至卡片；键盘聚焦时自动在中心呈现柔和高光环绕，保障键盘无障碍。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>通过 CSS 自定义属性 (--ds-mouse-x, --ds-mouse-y) 实现纯 GPU 加速光斑投影。\u003c/li>\u003cli>聚光层透明度柔和（低于 10%），不影响文本可读性与对比度。\u003c/li>\u003cli>悬浮时运用 translateY(-2px) 物理微上浮，增强质感。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spotlight-card&quot; style=&quot;width:100%&quot; onmousemove=&quot;const r=this.getBoundingClientRect();this.style.setProperty(&#39;--ds-mouse-x&#39;,(event.clientX-r.left)+&#39;px&#39;);this.style.setProperty(&#39;--ds-mouse-y&#39;,(event.clientY-r.top)+&#39;px&#39;)&quot;&gt;&lt;div class=&quot;ds-spotlight-glow&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div style=&quot;position:relative;z-index:1&quot;&gt;&lt;span class=&quot;ds-badge ds-badge--info&quot;&gt;零重排物理渲染&lt;/span&gt;&lt;h4 style=&quot;font-size:15px;margin:10px 0 6px;color:var(--ds-ink)&quot;&gt;边缘智能 Anycast 路由&lt;/h4&gt;&lt;p style=&quot;font-size:12px;color:var(--ds-muted);margin:0&quot;&gt;全自动探测跨国光缆拥塞情况，光标划过时动态计算最短物理延迟。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SpotlightCard&gt;&lt;h4&gt;边缘 Anycast 路由&lt;/h4&gt;&lt;p&gt;自适应延迟探测&lt;/p&gt;&lt;/SpotlightCard&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 鼠标移动时光斑跟随丝滑无卡顿\u003c/li>\u003cli>□ 深浅主题下光斑与卡片背景融合自然\u003c/li>\u003cli>□ 卡片文字与底色对比度满足 4.5:1\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/stacked-avatar-cluster","title":"协同办公重叠头像群 Facepile","html":"\u003ch1>协同办公重叠头像群 Facepile\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 通用 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Figma 与 GitHub 协作看板风格的负间距重叠圆形头像组；带有表面实底白色/深色外描边隔离圈、鼠标悬停上浮微交互与末尾溢出人数胶囊。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>水平头像容器 (.ds-avatar-stack)\u003c/li>\u003cli>负间距重叠圆形头像 (.ds-avatar-pill)\u003c/li>\u003cli>表面隔离外边框\u003c/li>\u003cli>悬浮升起 Z 轴提升\u003c/li>\u003cli>末尾剩余人数徽章 (.ds-avatar-pill--more)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在每个协作者头像间切换；Enter 弹出协作者个人卡片；末尾溢出徽章可查看完整协作者名单。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>重叠头像利用 margin-left: -8px 制造密集协作氛围，边框匹配背景消除相交线混淆。\u003c/li>\u003cli>悬停时通过 translateY(-3px) scale(1.1) 与 z-index: 10 凸显当前用户，极具物理层级趣味。\u003c/li>\u003cli>末尾以 +N 呈现超出头像，保证布局紧凑不变形。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-avatar-stack&quot; role=&quot;group&quot; aria-label=&quot;协作者头像群&quot;&gt;&lt;div class=&quot;ds-avatar-pill&quot; style=&quot;background:var(--ds-accent);color:#fff&quot; title=&quot;Alex&quot; aria-label=&quot;Alex&quot; tabindex=&quot;0&quot;&gt;A&lt;/div&gt;&lt;div class=&quot;ds-avatar-pill&quot; style=&quot;background:var(--ds-action);color:#fff&quot; title=&quot;Sarah&quot; aria-label=&quot;Sarah&quot; tabindex=&quot;0&quot;&gt;S&lt;/div&gt;&lt;div class=&quot;ds-avatar-pill&quot; style=&quot;background:var(--ds-warning);color:#fff&quot; title=&quot;David&quot; aria-label=&quot;David&quot; tabindex=&quot;0&quot;&gt;D&lt;/div&gt;&lt;div class=&quot;ds-avatar-pill&quot; style=&quot;background:var(--ds-success);color:#fff&quot; title=&quot;Elena&quot; aria-label=&quot;Elena&quot; tabindex=&quot;0&quot;&gt;E&lt;/div&gt;&lt;div class=&quot;ds-avatar-pill ds-avatar-pill--more&quot; aria-label=&quot;还有 12 位协作者&quot; tabindex=&quot;0&quot;&gt;+12&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;StackedAvatarFacepile /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 头像悬停上浮与缩放自然流畅\u003c/li>\u003cli>□ 隔离边框与背景色严密贴合\u003c/li>\u003cli>□ 溢出数量药丸清晰可辨\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/stat","title":"数据指标","html":"\u003ch1>数据指标\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>展示真实的当前值、单位和统计范围；未知值应明确显示。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>指标名称\u003c/li>\u003cli>大号数值\u003c/li>\u003cli>单位\u003c/li>\u003cli>采样或变化说明\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>静态指标无需 Tab；更新不要逐秒触发 assertive live region。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>使用 tabular-nums 避免每秒布局抖动。\u003c/li>\u003cli>未知用“—”，未测速用“未测速”，不要随机生成数值。\u003c/li>\u003cli>图表和数值采用同一数据源。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;section class=&quot;ds-panel&quot;&gt;&lt;div class=&quot;ds-stat__label&quot;&gt;本地节点&lt;/div&gt;&lt;div class=&quot;ds-stat__value&quot;&gt;19 &lt;small style=&quot;font-size:14px&quot;&gt;个&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;ds-stat__note&quot;&gt;最近一次成功导入&lt;/div&gt;&lt;/section&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;StatCard label=&quot;节点数量&quot; value={nodes.length} note=&quot;当前设备&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 数值和单位在同一区域\u003c/li>\u003cli>□ 空值和零值区分\u003c/li>\u003cli>□ 切换密度后没有跳字\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/status-bar-pill","title":"状态栏动态驻留胶囊","html":"\u003ch1>状态栏动态驻留胶囊\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS 顶部菜单栏与 visionOS 状态条风格的常驻胶囊；集成活跃呼吸灯点、当前连接状态与下拉指示三角。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>实时状态活跃呼吸圆点\u003c/li>\u003cli>状态图标与文字\u003c/li>\u003cli>展开指示下拉三角 (Caret)\u003c/li>\u003cli>半透明磨砂圆角胶囊底槽\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦至驻留胶囊；Enter 或 Space 打开状态菜单浮层；按压时带 scale(0.96) 物理弹性反馈。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>圆角采用 999px 超圆润药丸形态，高度 26px，适合桌面顶栏与移动端灵动空间。\u003c/li>\u003cli>实时绿灯带有柔和 6px 外发光，清晰传达在线与连接健康度。\u003c/li>\u003cli>展开时下拉三角顺滑旋转 180 度，状态切换反馈即时。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-bar-pill is-open&quot; role=&quot;button&quot; tabindex=&quot;0&quot; data-toast=&quot;切换节点连接&quot;&gt;&lt;span class=&quot;ds-bar-pill__dot&quot;&gt;&lt;/span&gt;&lt;span&gt;香港 Core-01&lt;/span&gt;&lt;span class=&quot;ds-bar-pill__caret&quot; aria-hidden=&quot;true&quot;&gt;▼&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MenuBarPill label=&quot;香港 Core-01&quot; isLive={true} onClick={toggleMenu} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 呼吸圆点居中对齐且发光柔和\u003c/li>\u003cli>□ 悬停微放缩与按压弹性反馈顺畅\u003c/li>\u003cli>□ 高分屏下边缘无锯齿\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/stepper","title":"向导分步器","html":"\u003ch1>向导分步器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Stripe Checkout 与 Linear 任务引导的分步进度向导；展示任务链路各环节的完成状态。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆形数字/对勾步骤节点\u003c/li>\u003cli>节点间状态连接线\u003c/li>\u003cli>步骤名称标签\u003c/li>\u003cli>激活态微放大外框\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>键盘 Tab 在各可点击步骤间导航；Enter 或 Space 切换至对应步骤。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>已完成步骤自动呈现绿色实心微勾（✓），清晰表达成果。\u003c/li>\u003cli>激活当前步骤具备微妙外扩环（scale(1.08)）与主题色高亮。\u003c/li>\u003cli>连接线随步骤完成度动态自适应填充色。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-stepper&quot; role=&quot;navigation&quot; aria-label=&quot;订阅配置向导&quot; style=&quot;width:100%&quot;&gt;&lt;div class=&quot;ds-step is-complete&quot;&gt;&lt;div class=&quot;ds-step__pill&quot;&gt;✓&lt;/div&gt;&lt;span class=&quot;ds-step__label&quot;&gt;订阅导入&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-stepper__line is-active&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-step is-active&quot;&gt;&lt;div class=&quot;ds-step__pill&quot;&gt;2&lt;/div&gt;&lt;span class=&quot;ds-step__label&quot;&gt;节点分流&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-stepper__line&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-step&quot;&gt;&lt;div class=&quot;ds-step__pill&quot;&gt;3&lt;/div&gt;&lt;span class=&quot;ds-step__label&quot;&gt;启动连接&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Stepper steps={wizardSteps} currentStep={1} onStepClick={setStep} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 数字居中对齐，完成态符号清晰\u003c/li>\u003cli>□ 连接线随当前步骤平滑衔接\u003c/li>\u003cli>□ 向导步骤支持读屏器朗读当前进度\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/stripe-animated-receipt-card","title":"Stripe 拟物折痕锯齿纸质电子账单票据","html":"\u003ch1>Stripe 拟物折痕锯齿纸质电子账单票据\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Stripe、Apple Pay 与 Uber 风格的拟物纸质发票账单小票；具备虚线撕裂打孔线（perforation）、锯齿状折边阴影、明细项目金额与仿真防伪条形码。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>小票拟物纸质卡片 (.ds-stripe-receipt)\u003c/li>\u003cli>顶部商户名与支付状态徽章 (.ds-stripe-receipt__head)\u003c/li>\u003cli>超大加粗总金额与币种 (.ds-stripe-receipt__total)\u003c/li>\u003cli>虚线撕裂折痕分界线 (.ds-stripe-receipt__perf)\u003c/li>\u003cli>逐项清单与右对齐金额 (.ds-stripe-receipt__rows)\u003c/li>\u003cli>仿真条形码纹理 (.ds-stripe-receipt__barcode)\u003c/li>\u003cli>底部放射锯齿阴影边缘 (.ds-stripe-receipt__zigzag)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦小票；Enter 复制交易流水号或触发小票打印/下载 PDF。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>底部锯齿采用纯 CSS radial-gradient 与 drop-shadow 构建，无需引入任何额外位图或 SVG 依赖。\u003c/li>\u003cli>金额与订单号使用等宽字体呈现，增强财务数字的严谨可信度。\u003c/li>\u003cli>适合支付完成通知、订阅续费确认、结账成功页面与财务电子凭据。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-stripe-receipt&quot; role=&quot;article&quot; aria-label=&quot;电子交易收据票据&quot;&gt;&lt;div class=&quot;ds-stripe-receipt__head&quot;&gt;&lt;span class=&quot;ds-stripe-receipt__logo&quot;&gt;STRIPE PLATFORM&lt;/span&gt;&lt;span class=&quot;ds-stripe-receipt__badge&quot;&gt;PAID&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-stripe-receipt__total&quot;&gt;$149.00 &lt;span style=&quot;font-size:13px;color:var(--ds-muted)&quot;&gt;USD&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;font-size:11px;color:var(--ds-muted);font-family:var(--ds-type-mono)&quot;&gt;inv_1Oq4wX2eZvKYlo2C · 2026-10-16&lt;/div&gt;&lt;hr class=&quot;ds-stripe-receipt__perf&quot;&gt;&lt;div class=&quot;ds-stripe-receipt__rows&quot;&gt;&lt;div class=&quot;ds-stripe-receipt__row&quot;&gt;&lt;span&gt;Pro Annual Subscription&lt;/span&gt;&lt;span style=&quot;font-weight:600&quot;&gt;$120.00&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-stripe-receipt__row&quot;&gt;&lt;span&gt;AI Copilot Add-on&lt;/span&gt;&lt;span style=&quot;font-weight:600&quot;&gt;$29.00&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-stripe-receipt__barcode&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-stripe-receipt__zigzag&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;StripeFoldedReceipt amount=&quot;$149.00&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 虚线折痕与底部锯齿边缘自然\u003c/li>\u003cli>□ 金额与币种层次鲜明\u003c/li>\u003cli>□ 打印或导出时不产生布局异常\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/swipeable-toast-stack","title":"iOS 18 灵动卡片堆叠展开通知","html":"\u003ch1>iOS 18 灵动卡片堆叠展开通知\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 18 与 Sonner 风格的物理层叠通知卡片栈；默认多条通知以尺度 scale() 与 translateY() 层叠收敛，悬停或点击时自动展开平铺。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>堆叠通知容器 (.ds-toast-stack)\u003c/li>\u003cli>多张按层级放缩的物理卡片 (.ds-toast-item)\u003c/li>\u003cli>左侧通知图标\u003c/li>\u003cli>右侧通知单行摘要文案\u003c/li>\u003cli>悬停展开平铺微动效\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在展开的各个通知项间移动；Enter/Space 查看详情；Escape 全部清除。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>默认态下前 3 张卡片以 translateY(0px)、6px、12px 与 scale(1)、0.95、0.9 递减堆叠，极具真实物理厚度。\u003c/li>\u003cli>悬停触发平滑向下扇出展开（transform: translateY(...) scale(1)），展示每条通知的完整上下文。\u003c/li>\u003cli>卡片背景自带毛玻璃与细腻边框，与页面背景层次鲜明。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-toast-stack&quot; role=&quot;region&quot; aria-label=&quot;堆叠通知&quot;&gt;&lt;div class=&quot;ds-toast-item&quot; tabindex=&quot;0&quot; data-toast=&quot;查看带宽扩容通知&quot;&gt;&lt;span class=&quot;ds-toast-item__icon&quot;&gt;🚀&lt;/span&gt;&lt;span class=&quot;ds-toast-item__text&quot;&gt;边缘节点 HKG-01 专线带宽扩容至 40Gbps&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-toast-item&quot; tabindex=&quot;0&quot; data-toast=&quot;查看防护通知&quot;&gt;&lt;span class=&quot;ds-toast-item__icon&quot;&gt;🛡&lt;/span&gt;&lt;span class=&quot;ds-toast-item__text&quot;&gt;DDOS 流量清洗规则库自动热更新完成&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-toast-item&quot; tabindex=&quot;0&quot; data-toast=&quot;查看算法优化通知&quot;&gt;&lt;span class=&quot;ds-toast-item__icon&quot;&gt;⚡&lt;/span&gt;&lt;span class=&quot;ds-toast-item__text&quot;&gt;Anycast 延迟优化算法自动生效&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;StackedNotificationDeck notifications={[{icon:&quot;🚀&quot;, text:&quot;专线带宽扩容完成&quot;}, {icon:&quot;🛡&quot;, text:&quot;规则库更新完成&quot;}]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 卡片层叠与展开动效丝滑自然\u003c/li>\u003cli>□ 各层级卡片文字与图标清晰对齐\u003c/li>\u003cli>□ 键盘可顺畅聚焦触发通知操作\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/switch","title":"开关","html":"\u003ch1>开关\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>立即切换一个独立的二元设置；用于设置，不用于选择选项。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>52×32px 轨道\u003c/li>\u003cli>22px 滑块\u003c/li>\u003cli>可见文本标签\u003c/li>\u003cli>checked / disabled 状态\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 进入；Space 切换；role=switch；原生 checked 是唯一真值。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>真正应用成功后才更新已启用状态。\u003c/li>\u003cli>尚未实现的功能明确禁用并提供原因。\u003c/li>\u003cli>on 状态采用 Material 紫；不能靠颜色单独区分。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;label class=&quot;ds-switch&quot;&gt;&lt;input class=&quot;ds-switch__input&quot; type=&quot;checkbox&quot; role=&quot;switch&quot; checked&gt;&lt;span class=&quot;ds-switch__track&quot;&gt;&lt;span class=&quot;ds-switch__thumb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span&gt;启用系统代理&lt;/span&gt;&lt;/label&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Switch label=&quot;系统代理&quot; checked={enabled} disabled={pending} onChange={toggle} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 鼠标点击标签也可切换\u003c/li>\u003cli>□ 关闭后的滑块位置明显不同\u003c/li>\u003cli>□ 键盘焦点显示在轨道上\u003c/li>\u003cli>□ 异步失败保持原值\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/table","title":"数据表格","html":"\u003ch1>数据表格\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>在多条记录之间精确比较多个属性。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>表格标题或 caption\u003c/li>\u003cli>列标题 th\u003c/li>\u003cli>记录行\u003c/li>\u003cli>行内动作\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>非交互单元格不获得焦点；动作通过真实按钮 Tab；大表格提供可聚焦滚动区域。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>窄屏水平滚动，不挤压每列到无法阅读。\u003c/li>\u003cli>排序按钮需要 aria-sort，实际改变排序。\u003c/li>\u003cli>没有结果时显示空状态而非空白表格。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-table-scroll&quot; tabindex=&quot;0&quot; aria-label=&quot;节点示例表格&quot;&gt;&lt;table class=&quot;ds-table&quot;&gt;&lt;caption class=&quot;ds-sr-only&quot;&gt;节点信息&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;名称&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;协议&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;状态&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;香港线路&lt;/td&gt;&lt;td&gt;VLESS&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;ds-badge ds-badge--success&quot;&gt;就绪&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;日本线路&lt;/td&gt;&lt;td&gt;Trojan&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;ds-badge ds-badge--warning&quot;&gt;未测速&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 列标题 scope 正确\u003c/li>\u003cli>□ 表格滚动不改变整个页面宽度\u003c/li>\u003cli>□ 排序后的视觉和读屏结果一致\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/tabs","title":"标签页","html":"\u003ch1>标签页\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>切换同一区域内的内容面板，用于真正的 tab/tabpanel 关系。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>tablist\u003c/li>\u003cli>tab\u003c/li>\u003cli>对应 tabpanel\u003c/li>\u003cli>活动面板标题\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>方向键移动并激活；Home/End 首尾跳转；Tab 离开标签组进入面板。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>使用 roving tabindex，只让当前 tab 参与普通 Tab。\u003c/li>\u003cli>aria-controls 与 aria-labelledby 互相指向。\u003c/li>\u003cli>网络加载慢的面板使用手动激活并说明 Enter 的行为。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-segment&quot; role=&quot;tablist&quot; aria-label=&quot;示例信息&quot;&gt;&lt;button role=&quot;tab&quot; id=&quot;tab-a&quot; aria-selected=&quot;true&quot; aria-controls=&quot;panel-a&quot;&gt;概览&lt;/button&gt;&lt;button role=&quot;tab&quot; id=&quot;tab-b&quot; tabindex=&quot;-1&quot; aria-selected=&quot;false&quot; aria-controls=&quot;panel-b&quot;&gt;详情&lt;/button&gt;&lt;/div&gt;&lt;div role=&quot;tabpanel&quot; id=&quot;panel-a&quot; aria-labelledby=&quot;tab-a&quot;&gt;概览内容&lt;/div&gt;&lt;div role=&quot;tabpanel&quot; id=&quot;panel-b&quot; aria-labelledby=&quot;tab-b&quot; hidden&gt;详情内容&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 方向键和 Home/End 可用\u003c/li>\u003cli>□ 隐藏面板内不能获得焦点\u003c/li>\u003cli>□ 切换后标题与内容一致\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/telemetry-compass-pill","title":"户外高精度经纬度海拔气压罗盘药丸","html":"\u003ch1>户外高精度经纬度海拔气压罗盘药丸\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple Watch Ultra 与 Garmin 风格的专业户外遥测罗盘胶囊；集成旋转磁北针、航向角度 (例如 315° NW)、实时海拔高度与气压传感器读数。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>紧凑等宽遥测胶囊 (.ds-compass-pill)\u003c/li>\u003cli>磁北微型罗盘圆盘 (.ds-compass-dial)\u003c/li>\u003cli>红色物理磁北指针 (.ds-compass-needle)\u003c/li>\u003cli>航向、海拔与气压三组指标单元 (.ds-compass-stat)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>作为动态遥测图元，提供完整无障碍名称与 role=&quot;region&quot; 说明。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>指针旋转采用 transform: rotate(...) 与 cubic-bezier(0.16,1,0.3,1)，模拟真实机械指南针的微冲回弹阻尼感。\u003c/li>\u003cli>文本全部采用等宽字体（--ds-type-mono），在数值频繁变动时不产生横向挤压抖动。\u003c/li>\u003cli>适合用于车载 HUD、户外探索界面、无人机遥测或边缘节点地理位置卡片。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-compass-pill&quot; role=&quot;region&quot; aria-label=&quot;战术罗盘与气压遥测药丸&quot;&gt;&lt;div class=&quot;ds-compass-dial&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;ds-compass-needle&quot; style=&quot;--ds-heading:315deg&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-compass-stat&quot;&gt;&lt;span class=&quot;ds-compass-stat__val&quot;&gt;315° NW&lt;/span&gt;&lt;span class=&quot;ds-compass-stat__lbl&quot;&gt;航向&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-compass-stat&quot;&gt;&lt;span class=&quot;ds-compass-stat__val&quot;&gt;1,842m&lt;/span&gt;&lt;span class=&quot;ds-compass-stat__lbl&quot;&gt;海拔&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-compass-stat&quot;&gt;&lt;span class=&quot;ds-compass-stat__val&quot;&gt;1013hPa&lt;/span&gt;&lt;span class=&quot;ds-compass-stat__lbl&quot;&gt;气压&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;TelemetryCompassPill heading={315} direction=&quot;NW&quot; altitude=&quot;1,842m&quot; pressure=&quot;1013hPa&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 指南针指针旋转角度与文本严格一致\u003c/li>\u003cli>□ 等宽数字在数值跳动时不产生抖动\u003c/li>\u003cli>□ 红色磁北针在深浅主题下均清晰高亮\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/terminal-key-badge-sequence","title":"Vim & Emacs 连续多段按键动作链徽标","html":"\u003ch1>Vim &amp; Emacs 连续多段按键动作链徽标\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Vim、Neovim 与 Emacs 风格的连续多键位动作链徽标（Sequential Key Combo Badge）；以箭头指引步骤（如 d → i → w），展示连续敲击热键的逻辑链条。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>暗色行内徽章外壳 (.ds-key-sequence)\u003c/li>\u003cli>独立按键步骤 (.ds-key-sequence__step)\u003c/li>\u003cli>前进关联箭头 (.ds-key-sequence__arrow)\u003c/li>\u003cli>右侧命令意图释义说明\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>纯展示与辅助学习徽标，作为视觉说明嵌入文档或快捷键弹窗。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>按键使用物理微凸等宽键帽，按键间以细箭头清晰连接，大幅降低复杂组合键的理解门槛。\u003c/li>\u003cli>适合代码编辑器设置、CLI 工具文档、Vim 模式引导与 IDE 快捷键索引。\u003c/li>\u003cli>浅深主题下等宽键帽对比鲜明，背景沉稳。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-key-sequence&quot; role=&quot;group&quot; aria-label=&quot;快捷键序列: d 然后 i 然后 w (删除词内内容)&quot;&gt;&lt;kbd class=&quot;ds-key-sequence__step&quot;&gt;d&lt;/kbd&gt;&lt;span class=&quot;ds-key-sequence__arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;kbd class=&quot;ds-key-sequence__step&quot;&gt;i&lt;/kbd&gt;&lt;span class=&quot;ds-key-sequence__arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;kbd class=&quot;ds-key-sequence__step&quot;&gt;w&lt;/kbd&gt;&lt;span style=&quot;font-size:11px;color:var(--ds-muted);margin-left:4px&quot;&gt;删除词内内容&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;KeyComboSequenceBadge keys={[&quot;d&quot;, &quot;i&quot;, &quot;w&quot;]} description=&quot;删除词内内容&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 按键步骤与指示箭头垂直对齐\u003c/li>\u003cli>□ 等宽字体排版严谨\u003c/li>\u003cli>□ 文字注释清晰无折行\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/terminal-split-multiplexer","title":"tmux & Warp 分屏多窗格终端虚拟工作台","html":"\u003ch1>tmux &amp; Warp 分屏多窗格终端虚拟工作台\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>tmux、Warp 与 Zed 风格的高性能多窗格分屏虚拟终端；支持横向/纵向多窗格平铺、高亮激活窗格边框、独立命令标题栏与底部会话状态指示条。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>分屏终端容器 (.ds-term-multiplexer)\u003c/li>\u003cli>双栏分屏工作区 (.ds-term-multiplexer__panes)\u003c/li>\u003cli>独立终端窗格 (.ds-term-pane)\u003c/li>\u003cli>激活窗格高亮指示 (.ds-term-pane.is-active)\u003c/li>\u003cli>窗格命令标题栏 (.ds-term-pane__head)\u003c/li>\u003cli>底部 tmux 绿色会话状态栏 (.ds-term-multiplexer__status)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Ctrl+b 配合方向键在窗格间切换焦点；支持标准等宽输入与滚屏操作。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>窗格激活时利用 box-shadow: inset 0 0 0 1px var(--ds-accent) 实现无布局抖动的焦点高亮。\u003c/li>\u003cli>底部状态栏模拟原生终端的窗口索引与电源指示，增强沉浸式开发者体验。\u003c/li>\u003cli>适用于云原生监控终端、DevOps 流水线日志及集成式代码编辑预览环境。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-term-multiplexer&quot; role=&quot;region&quot; aria-label=&quot;分屏多窗格终端&quot;&gt;&lt;div class=&quot;ds-term-multiplexer__panes&quot;&gt;&lt;div class=&quot;ds-term-pane is-active&quot;&gt;&lt;div class=&quot;ds-term-pane__head&quot;&gt;&lt;span&gt;nvim src/index.ts&lt;/span&gt;&lt;span&gt;pane 1&lt;/span&gt;&lt;/div&gt;&lt;pre class=&quot;ds-term-pane__body&quot;&gt;const server = createServer();\nserver.listen(8080);&lt;/pre&gt;&lt;/div&gt;&lt;div class=&quot;ds-term-pane&quot;&gt;&lt;div class=&quot;ds-term-pane__head&quot;&gt;&lt;span&gt;cargo watch -x run&lt;/span&gt;&lt;span&gt;pane 2&lt;/span&gt;&lt;/div&gt;&lt;pre class=&quot;ds-term-pane__body&quot;&gt;Finished dev [unoptimized] target(s)\nRunning `target/debug/app`&lt;/pre&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-term-multiplexer__status&quot;&gt;&lt;span class=&quot;ds-term-multiplexer__window-pill&quot;&gt;0:bash*&lt;/span&gt;&lt;span&gt;tmux: 2 windows · session: main&lt;/span&gt;&lt;span&gt;⚡ 100%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SplitTerminalMultiplexer activePane={0} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 激活窗格边框高亮对比鲜明\u003c/li>\u003cli>□ 窗格内代码使用等宽字体对齐\u003c/li>\u003cli>□ 底部状态栏在不同屏幕自适应\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/terminal-tab-group","title":"多窗格终端标签栏","html":"\u003ch1>多窗格终端标签栏\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Warp 与 Ghostty 风格的高性能开发者终端标签条；带有进程状态呼吸灯、标签切换、多屏分窗按钮与新建标签操作。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>等宽字体标签按钮群\u003c/li>\u003cli>进程活跃状态圆点 (Running)\u003c/li>\u003cli>分屏布局微按钮 (◫)\u003c/li>\u003cli>新建终端标签按钮 (+)\u003c/li>\u003cli>一体化深色底栏\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在标签与快捷按钮间移动；左右方向键切换标签；Enter 激活选定终端窗格。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>标签栏高度 34px，与下方终端控制台无缝连成一体（border-bottom: none）。\u003c/li>\u003cli>运行中状态指示点尺寸 5px，绿色常亮代表活跃进程，一目了然。\u003c/li>\u003cli>分屏按钮与加号按钮悬停微高亮，交互响应即时利落。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-term-bar&quot; role=&quot;tablist&quot; aria-label=&quot;终端标签&quot;&gt;&lt;div class=&quot;ds-term-bar__tabs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-term-tab is-active&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;&lt;span class=&quot;ds-term-tab__status&quot;&gt;&lt;/span&gt;&lt;span&gt;zsh · aether-core&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-term-tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;&lt;span&gt;node · dev-server&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ds-term-bar__actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-term-btn&quot; aria-label=&quot;分屏&quot; data-toast=&quot;水平分屏&quot;&gt;◫&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-term-btn&quot; aria-label=&quot;新建&quot; data-toast=&quot;新建终端标签&quot;&gt;+&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;TerminalTabBar tabs={[{id:&quot;1&quot;, title:&quot;zsh&quot;, isRunning:true}]} activeId=&quot;1&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 标签激活阴影与底栏融合严密\u003c/li>\u003cli>□ 状态指示灯绿光点居中无偏位\u003c/li>\u003cli>□ 分屏与新建按钮点击响应顺畅\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/terminal","title":"终端窗口卡片","html":"\u003ch1>终端窗口卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>macOS 与 Hyper/Warp 风格的开发终端窗口；带红黄绿红绿灯标题栏、打字机光标与等宽输出日志。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>三色交通灯操作点\u003c/li>\u003cli>居中标题栏说明\u003c/li>\u003cli>命令提示行 Prompt (➜ ~)\u003c/li>\u003cli>闪烁方块光标 (Blink Cursor)\u003c/li>\u003cli>标准等宽输出行\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>滚动条可获得键盘焦点按方向键滚动；代码正文支持双击复制与全选。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>交通灯原点使用纯 CSS 渲染，不加载外部位图。\u003c/li>\u003cli>光标闪烁动画使用 opacity 硬件加速，零重排。\u003c/li>\u003cli>深浅模式自适应背景，等宽字系统字体优先。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-terminal&quot; style=&quot;width:100%&quot;&gt;&lt;div class=&quot;ds-terminal__header&quot;&gt;&lt;div class=&quot;ds-terminal__dots&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;ds-terminal__dot ds-terminal__dot--red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-terminal__dot ds-terminal__dot--yellow&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-terminal__dot ds-terminal__dot--green&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-terminal__title&quot;&gt;bash — modern-ai-core&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-terminal__body&quot;&gt;&lt;div&gt;&lt;span class=&quot;ds-terminal__prompt&quot;&gt;➜ ~&lt;/span&gt;&lt;span&gt;curl -I https://api.openai.com/v1/models&lt;/span&gt;&lt;span class=&quot;ds-terminal__cursor&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;opacity:.85;margin-top:4px&quot;&gt;HTTP/2 200 OK&lt;br&gt;content-type: application/json&lt;br&gt;server: cloudflare · rtt: 28ms&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;TerminalWindow title=&quot;bash — 80x24&quot; command=&quot;curl -I https://...&quot; output={[&quot;HTTP/2 200 OK&quot;, &quot;rtt: 28ms&quot;]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 终端三色红绿灯在高分屏下圆润\u003c/li>\u003cli>□ 光标闪烁在减弱动效下平稳静止\u003c/li>\u003cli>□ 日志输出横向超出可平滑滚动\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/textarea","title":"多行输入","html":"\u003ch1>多行输入\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>容纳长文本和多行节点链接，内容可以选择和复制。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>持久标签\u003c/li>\u003cli>112px 最小高度\u003c/li>\u003cli>纵向调整把手\u003c/li>\u003cli>字符或格式说明\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Enter 换行；Tab 移动焦点；若提供提交快捷键，需在帮助文本标明。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>禁止把 Enter 作为唯一提交方式。\u003c/li>\u003cli>保留换行与原始值，不自动修改凭据。\u003c/li>\u003cli>过长内容垂直滚动；错误行应指出行号而非输出密钥。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-field&quot;&gt;&lt;div class=&quot;ds-field__control&quot;&gt;&lt;textarea id=&quot;gallery-text&quot; placeholder=&quot; &quot;&gt;&lt;/textarea&gt;&lt;label class=&quot;ds-field__label&quot; for=&quot;gallery-text&quot;&gt;节点内容&lt;/label&gt;&lt;/div&gt;&lt;span class=&quot;ds-field__hint&quot;&gt;每行一个分享链接&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 中文输入法可正常换行\u003c/li>\u003cli>□ 粘贴 1000 行仍可编辑\u003c/li>\u003cli>□ 超长单行不撑开页面\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/thought-chain","title":"深度思考链展开器","html":"\u003ch1>深度思考链展开器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Claude 与 Cursor 风格的 AI 推理步骤折叠卡片；展示思考时长、执行环节勾选与折叠详情。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>大脑微图标与标题\u003c/li>\u003cli>思考用时徽标 (如 3.8s)\u003c/li>\u003cli>展开/收起切换箭头\u003c/li>\u003cli>各阶段执行勾选清单\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦至折叠栏；Enter 或 Space 展开或收起内部推理过程详情。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>折叠头背景为内陷底色 (ds-inset)，与正文回答形成明确视觉主次。\u003c/li>\u003cli>已完成步骤使用绿勾 (✓)，进行中步骤使用旋转或强调色标识。\u003c/li>\u003cli>推理内容采用 muted 辅助字色与 12px 紧凑排版，保持界面整洁。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-thought&quot;&gt;&lt;div class=&quot;ds-thought__summary&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-expanded=&quot;true&quot;&gt;&lt;div class=&quot;ds-thought__left&quot;&gt;&lt;span aria-hidden=&quot;true&quot;&gt;🧠&lt;/span&gt;&lt;span&gt;深度思考链&lt;/span&gt;&lt;span class=&quot;ds-thought__timer&quot;&gt;(耗时 2.4s)&lt;/span&gt;&lt;/div&gt;&lt;span style=&quot;font-size:11px;color:var(--ds-muted)&quot;&gt;收起 ▲&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-thought__body&quot;&gt;&lt;div class=&quot;ds-thought__step&quot;&gt;&lt;span style=&quot;color:var(--ds-success)&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;div style=&quot;color:var(--ds-ink);font-weight:600&quot;&gt;解析 DNS 多径解析记录&lt;/div&gt;&lt;div style=&quot;font-size:11px;color:var(--ds-muted);margin-top:2px&quot;&gt;已验证 4 个 Anycast 节点 IP，选取 RTT 最低路由。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-thought__step&quot;&gt;&lt;span style=&quot;color:var(--ds-success)&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;div style=&quot;color:var(--ds-ink);font-weight:600&quot;&gt;协商 TLS 1.3 0-RTT 握手&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;ThoughtChain title=&quot;多径路由分析&quot; duration=&quot;2.4s&quot; steps={reasoningSteps} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 思考耗时数字等宽对齐无跳变\u003c/li>\u003cli>□ 展开折叠仅切换内容显隐无卡顿\u003c/li>\u003cli>□ 步骤完成图标与文案对齐规整\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ticker","title":"动态数字滚轮","html":"\u003ch1>动态数字滚轮\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Stripe 与 Linear 风格的数字里程表滚动动画；为活跃节点数、并发流量、财务指标赋予生动且流畅的步进质感。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>等宽字体内联容器\u003c/li>\u003cli>滚动数字切片 (Ribbon)\u003c/li>\u003cli>前后缀修饰标签\u003c/li>\u003cli>涨跌微浮标 (Delta)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>纯数据展示容器不拦截键盘焦点；容器带有 aria-label 供屏幕朗读器播报完整数值。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>使用 font-variant-numeric: tabular-nums 防止数字滚动时外层容器抖动。\u003c/li>\u003cli>滚动通过 transform: translateY 进行，GPU 独立加速无重排。\u003c/li>\u003cli>数字变化附带语义颜色微标签（如绿色涨幅、红色跌幅）。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-toolbar&quot; style=&quot;justify-content:flex-start;gap:20px&quot;&gt;&lt;div class=&quot;ds-ticker&quot; aria-label=&quot;活跃连接数 1428&quot;&gt;&lt;span class=&quot;ds-ticker__prefix&quot;&gt;#&lt;/span&gt;&lt;span class=&quot;ds-ticker__digit&quot; style=&quot;--ds-ticker-val:1&quot;&gt;&lt;span class=&quot;ds-ticker__ribbon&quot;&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;2&lt;/span&gt;&lt;span&gt;3&lt;/span&gt;&lt;span&gt;4&lt;/span&gt;&lt;span&gt;5&lt;/span&gt;&lt;span&gt;6&lt;/span&gt;&lt;span&gt;7&lt;/span&gt;&lt;span&gt;8&lt;/span&gt;&lt;span&gt;9&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ds-ticker__digit&quot; style=&quot;--ds-ticker-val:4&quot;&gt;&lt;span class=&quot;ds-ticker__ribbon&quot;&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;2&lt;/span&gt;&lt;span&gt;3&lt;/span&gt;&lt;span&gt;4&lt;/span&gt;&lt;span&gt;5&lt;/span&gt;&lt;span&gt;6&lt;/span&gt;&lt;span&gt;7&lt;/span&gt;&lt;span&gt;8&lt;/span&gt;&lt;span&gt;9&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ds-ticker__digit&quot; style=&quot;--ds-ticker-val:2&quot;&gt;&lt;span class=&quot;ds-ticker__ribbon&quot;&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;2&lt;/span&gt;&lt;span&gt;3&lt;/span&gt;&lt;span&gt;4&lt;/span&gt;&lt;span&gt;5&lt;/span&gt;&lt;span&gt;6&lt;/span&gt;&lt;span&gt;7&lt;/span&gt;&lt;span&gt;8&lt;/span&gt;&lt;span&gt;9&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ds-ticker__digit&quot; style=&quot;--ds-ticker-val:8&quot;&gt;&lt;span class=&quot;ds-ticker__ribbon&quot;&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;2&lt;/span&gt;&lt;span&gt;3&lt;/span&gt;&lt;span&gt;4&lt;/span&gt;&lt;span&gt;5&lt;/span&gt;&lt;span&gt;6&lt;/span&gt;&lt;span&gt;7&lt;/span&gt;&lt;span&gt;8&lt;/span&gt;&lt;span&gt;9&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ds-ticker__delta ds-ticker__delta--up&quot;&gt;+14.2%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;NumberTicker value={1428} prefix=&quot;#&quot; delta=&quot;+14.2%&quot; isDeltaUp /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 数字等宽对齐不挤压外层排版\u003c/li>\u003cli>□ 滚动动画使用 transform 硬件加速无掉帧\u003c/li>\u003cli>□ 高对比度与无障碍读屏软件能准确播报数值\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/timeline","title":"时间轴与步骤","html":"\u003ch1>时间轴与步骤\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>按时序或依赖阶段展示任务流转状态（如连接协商、节点测速、审计日志）。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>纵向连接导轨\u003c/li>\u003cli>节点状态圆环/呼吸灯\u003c/li>\u003cli>步骤标题与时间戳\u003c/li>\u003cli>可选说明详情\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>若包含交互展开项，按 Tab 顺序进入；静态时间轴作为有序步骤朗读。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>区分完成态（绿色）、进行态（高亮+呼吸脉冲）与未开始态（柔和中性）。\u003c/li>\u003cli>时间戳统一使用等宽数字（tabular-nums）。\u003c/li>\u003cli>失败节点应明确标出错误说明与重试引导。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-timeline&quot;&gt;&lt;div class=&quot;ds-timeline__item&quot;&gt;&lt;div class=&quot;ds-timeline__node&quot;&gt;&lt;span class=&quot;ds-status-dot&quot; style=&quot;color:var(--ds-success)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-timeline__content&quot;&gt;&lt;span class=&quot;ds-timeline__title&quot;&gt;本地配置解析就绪&lt;/span&gt;&lt;span class=&quot;ds-timeline__time&quot;&gt;10:40:12&lt;/span&gt;&lt;div class=&quot;ds-timeline__desc&quot;&gt;加载 32 个节点规则与分流策略&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-timeline__item&quot;&gt;&lt;div class=&quot;ds-timeline__node&quot;&gt;&lt;span class=&quot;ds-status-dot ds-status-dot--live&quot; style=&quot;color:var(--ds-secondary)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-timeline__content&quot;&gt;&lt;span class=&quot;ds-timeline__title&quot;&gt;全链路握手与测速中&lt;/span&gt;&lt;span class=&quot;ds-timeline__time&quot;&gt;10:40:15&lt;/span&gt;&lt;div class=&quot;ds-timeline__desc&quot;&gt;正在对优质专线进行 RTT 测量&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Timeline items={pipelineSteps} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 时间轴步骤连线在不同缩放下不发生断裂\u003c/li>\u003cli>□ 当前进行中的步骤有动态呼吸区分\u003c/li>\u003cli>□ 时间戳在不同字体下稳定对齐\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/toast","title":"临时通知","html":"\u003ch1>临时通知\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>确认低风险动作的结果，不能承载唯一的恢复路径。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>简洁结果\u003c/li>\u003cli>可选撤销\u003c/li>\u003cli>短时出现\u003c/li>\u003cli>独立通知区域\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>使用 polite live region；不自动把键盘焦点拉到 Toast。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>常规提示约 4 秒；需要阅读的错误保持在页面。\u003c/li>\u003cli>消息更新不重复朗读旧内容。\u003c/li>\u003cli>减少动效模式不使用 bounce。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u
