ing:28px 24px}.handbook-bar{padding:14px 24px}}@media(max-width:650px){.handbook{grid-template-columns:1fr}.handbook-nav{position:relative;height:auto;max-height:320px;border-right:0;border-bottom:1px solid var(--ds-line)}.document-list{max-height:180px}.document-content{padding:24px 18px}.document-content h1{font-size:27px}.handbook-bar{padding:12px 18px}.document-content .ds-table{font-size:12px}}
</style></head><body><div class="handbook"><aside class="handbook-nav ds-chrome"><div><a href="index.html" style="font-size:12px;color:var(--ds-accent);text-decoration:none">← 返回组件目录</a><h2>设计系统详细手册</h2><span class="ds-badge" id="document-count"></span></div><input type="search" id="guide-search" aria-label="搜索手册标题" placeholder="搜索组件或规范…"><nav class="document-list" id="document-list" aria-label="手册文档"></nav></aside><div class="handbook-main"><header class="handbook-bar ds-chrome"><span class="app-kicker" id="current-category">实施指南</span><button class="ds-button ds-button--secondary" id="theme">深色主题</button></header><main class="document-content" id="document" tabindex="-1"></main></div></div><script>window.DS_GUIDES=[{"id":"components/accordion","title":"手风琴折叠","html":"\u003ch1>手风琴折叠\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>垂直堆叠多组可折叠面板；兼顾 Radix 与 Apple 系统偏好设置的平滑指示箭头与紧凑布局。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>外层容器边框\u003c/li>\u003cli>项触发标题栏\u003c/li>\u003cli>旋转指示箭头 Chevron\u003c/li>\u003cli>独立展开内容区域\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 切换各折叠项；Enter 或 Space 展开或收起；无障碍读屏软件识别展开状态。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>指示箭头通过 transform: rotate 旋转，避免布局重排。\u003c/li>\u003cli>内容展开保持实底展示，无视觉穿透。\u003c/li>\u003cli>每个项目可独立展开或配置为互斥手风琴。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-accordion&quot;&gt;&lt;details class=&quot;ds-accordion__item&quot;&gt;&lt;summary class=&quot;ds-accordion__trigger&quot;&gt;&lt;span&gt;基础代理路由策略&lt;/span&gt;&lt;span class=&quot;ds-accordion__chevron&quot;&gt;›&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;ds-accordion__content&quot;&gt;&lt;p&gt;默认对局域网与国内直连域名跳过代理，国外域名自动分流至指定节点组。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;ds-accordion__item&quot;&gt;&lt;summary class=&quot;ds-accordion__trigger&quot;&gt;&lt;span&gt;DNS 防污染与嗅探设置&lt;/span&gt;&lt;span class=&quot;ds-accordion__chevron&quot;&gt;›&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;ds-accordion__content&quot;&gt;&lt;p&gt;启用 fake-ip 模式以降低 DNS 解析往返延迟，支持针对 UDP/53 流量的强制重定向。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Accordion items={settingsGroups} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 箭头旋转动效平滑且在减弱动效下瞬间完成\u003c/li>\u003cli>□ 键盘回车能无障碍触发展开\u003c/li>\u003cli>□ 内容无 JavaScript 时也能原生展开\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/action-sheet-dialog","title":"底部弹性操作表","html":"\u003ch1>底部弹性操作表\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 与 Android Material 3 移动端底部模态快捷操作抽屉；带居中拖拽把手、操作标题、危险操作警示项与取消选项。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>顶部横向圆角拖动指示条 (Handle)\u003c/li>\u003cli>操作表标题与辅助提示\u003c/li>\u003cli>纵向平铺的圆角操作按钮列表\u003c/li>\u003cli>红色高警示危险动作项\u003c/li>\u003cli>底部取消确认按钮\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在各个动作按钮间流转；Enter 触发选择并关闭；Escape 触发取消。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>顶栏把手尺寸 36px × 4px，居中提示可拖拽性，物理质感明确。\u003c/li>\u003cli>危险动作（如“断开全部节点连接”）采用 danger-soft 红色背景，防止误触。\u003c/li>\u003cli>圆角为 20px 大倒角，支持移动端自适应满宽或桌面端居中小弹窗。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-action-sheet&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;节点操作选项&quot;&gt;&lt;div class=&quot;ds-action-sheet__handle&quot;&gt;&lt;/div&gt;&lt;h3 class=&quot;ds-action-sheet__title&quot;&gt;节点链路操作&lt;/h3&gt;&lt;p class=&quot;ds-action-sheet__desc&quot;&gt;对当前选中的 12 个亚太 Anycast 节点执行集群动作&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;ds-action-sheet__btn&quot; data-toast=&quot;执行全量测速&quot;&gt;⚡ 全量延迟重新探测&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-action-sheet__btn&quot; data-toast=&quot;导出节点列表&quot;&gt;📥 导出为 Clash Meta 订阅&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-action-sheet__btn ds-action-sheet__btn--danger&quot; data-toast=&quot;断开全部连接&quot;&gt;⚠ 断开所有活跃长连接&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-action-sheet__btn&quot; style=&quot;margin-top:4px;font-weight:700&quot; data-toast=&quot;已取消操作&quot;&gt;取消&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;ActionSheetModal title=&quot;节点链路操作&quot; actions={[{label:&quot;全量测速&quot;}, {label:&quot;断开&quot;, isDanger:true}]} onCancel={cancel} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 危险按钮警示色辨识度高\u003c/li>\u003cli>□ 各操作按钮悬停轻微放缩\u003c/li>\u003cli>□ 移动端与桌面端居中排版合理\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/activity-spark-stat","title":"多维活动趋势微指标卡","html":"\u003ch1>多维活动趋势微指标卡\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Stripe 与 Datadog 监控大盘风格的指标卡；集成核心数值、正负增幅徽标与轻量内嵌矢量走势折线/面积图。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>指标标题与说明\u003c/li>\u003cli>26px 大字号等宽数字\u003c/li>\u003cli>正负增长百分比徽章 (如 +14.2%)\u003c/li>\u003cli>SVG 矢量折线与半透明填充阴影区\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦指标卡；Enter 打开该指标的历史明细报表；悬停上浮 translateY(-2px)。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>SVG 折线采用 round 笔触与填充区域半透明渐变，曲线平滑无锯齿。\u003c/li>\u003cli>数字采用 tabular-nums 等宽字体，大额数据刷新时布局坚固稳定。\u003c/li>\u003cli>正向增长采用 success 绿色徽标，负向衰减自动切换 danger 红色。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spark-card&quot; role=&quot;region&quot; aria-label=&quot;实时吞吐量&quot;&gt;&lt;div class=&quot;ds-spark-card__header&quot;&gt;&lt;span&gt;全球并发会话流&lt;/span&gt;&lt;span class=&quot;ds-badge ds-badge--success&quot;&gt;+14.2%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-spark-card__body&quot;&gt;&lt;span class=&quot;ds-spark-card__num&quot;&gt;28,490&lt;/span&gt;&lt;svg class=&quot;ds-spark-card__svg&quot; viewBox=&quot;0 0 96 32&quot; aria-hidden=&quot;true&quot;&gt;&lt;polygon class=&quot;ds-spark-card__area&quot; points=&quot;0,32 0,26 16,20 32,22 48,15 64,18 80,8 96,4 96,32&quot;&gt;&lt;/polygon&gt;&lt;polyline class=&quot;ds-spark-card__line&quot; points=&quot;0,26 16,20 32,22 48,15 64,18 80,8 96,4&quot;&gt;&lt;/polyline&gt;&lt;/svg&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SparkStatCard title=&quot;并发会话流&quot; value=&quot;28,490&quot; delta=&quot;+14.2%&quot; trendPoints={[8, 14, 12, 18, 16, 24, 28]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ SVG 曲线平滑饱满无裁切溢出\u003c/li>\u003cli>□ 增幅徽标色彩与背景对比符合 4.5:1\u003c/li>\u003cli>□ 卡片悬停上浮动效精致利落\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/alert","title":"行内提示","html":"\u003ch1>行内提示\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 反馈 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>把重要信息或错误放在相关上下文附近，并给出修复路径。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>标题或摘要\u003c/li>\u003cli>具体影响\u003c/li>\u003cli>可执行下一步\u003c/li>\u003cli>可选关闭按钮\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>错误可使用 role=alert；常规信息使用 role=status；交互按钮可 Tab。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>消息说明失败原因和可行下一步。\u003c/li>\u003cli>避免把技术堆栈直接展示给普通用户。\u003c/li>\u003cli>不要只用短时 Toast 承载必须处理的错误。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-alert ds-alert--danger&quot; role=&quot;alert&quot;&gt;&lt;strong&gt;订阅下载失败&lt;/strong&gt;&lt;div&gt;请检查链接是否有效，保留输入后重试。&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;Alert tone=&quot;danger&quot;&gt;请检查订阅地址后重试。&lt;/Alert&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 消息不包含 token 或密码\u003c/li>\u003cli>□ 失败后保留输入\u003c/li>\u003cli>□ 错误与字段通过 aria-describedby 关联\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/analog-clock-chronograph","title":"Dieter Rams 精密计时机械刻度表盘","html":"\u003ch1>Dieter Rams 精密计时机械刻度表盘\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>博朗 Dieter Rams 工业美学与 Apple Watch Hermès 风格的高精度机械计时表盘；配备立体秒针、分针、时针动态旋转，顶部独立秒表子表盘与右侧实体日历窗。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>140px 正圆表壳 (.ds-chronograph)\u003c/li>\u003cli>秒表分钟小表盘 (.ds-chronograph__subdial)\u003c/li>\u003cli>赤红超细高对比秒针 (.ds-chronograph__hand-sec)\u003c/li>\u003cli>墨黑圆角分针与时针 (.ds-chronograph__hand-min, --hour)\u003c/li>\u003cli>轴心防脱红白固定圆心 (.ds-chronograph__center)\u003c/li>\u003cli>右侧等宽物理日历窗 (.ds-chronograph__date)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>具备完整 aria-label 报读时分秒与当前日期，屏幕阅读器完全无障碍。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>指针旋转严格采用 CSS 自定义属性 --ds-chrono-sec/min/hour，配合 GPU 合成旋转层，零排版重绘。\u003c/li>\u003cli>秒针使用纯色亮红（#fa114f），重现经典工业设计物理手表的视觉焦点。\u003c/li>\u003cli>适合桌面仪表盘时钟、任务倒计时看板、高精度秒表及工业传感器时间戳。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-chronograph&quot; role=&quot;img&quot; aria-label=&quot;机械精密计时表盘：10点24分12秒&quot; style=&quot;--ds-chrono-sec:72deg;--ds-chrono-min:146deg;--ds-chrono-hour:312deg&quot;&gt;&lt;div class=&quot;ds-chronograph__subdial&quot; aria-hidden=&quot;true&quot;&gt;60&lt;/div&gt;&lt;div class=&quot;ds-chronograph__hand-hour&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-chronograph__hand-min&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-chronograph__hand-sec&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-chronograph__center&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;ds-chronograph__date&quot; aria-label=&quot;当前日期 16日&quot;&gt;16&lt;/span&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;AnalogClockChronograph seconds={12} minutes={24} hours={10} date={16} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 三指针旋转轴心严格重合\u003c/li>\u003cli>□ 日期视窗字号清晰对齐\u003c/li>\u003cli>□ 深浅主题下金属边缘立体感突出\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/android-material-segmented-button","title":"Android 15 Material 3 连体分段按钮组","html":"\u003ch1>Android 15 Material 3 连体分段按钮组\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Google Android 15 (Material You / M3 Expressive) 规范的连体分段药丸按钮组；支持单选状态切换、平滑对勾符号淡入及外轮廓融合。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>整体圆角外轮廓外壳 (.ds-m3-segmented)\u003c/li>\u003cli>分段独立单选项 (.ds-m3-segment)\u003c/li>\u003cli>分段间内部垂直边框线\u003c/li>\u003cli>选中态对勾指示符 (.ds-m3-segment__check)\u003c/li>\u003cli>背景与前景色语义过渡\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>方向键在各单选项间切换；Space 或 Enter 激活选中当前项。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>遵循 WAI-ARIA role=&quot;radiogroup&quot; 与 role=&quot;radio&quot; 规范。\u003c/li>\u003cli>选中项使用 --ds-secondary-soft 背景色并显示紧凑小对勾，无障碍状态识别清晰。\u003c/li>\u003cli>适合时间跨度切换（日/周/月）、视图排版模式（列表/网格）与筛选模式。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-m3-segmented&quot; role=&quot;radiogroup&quot; aria-label=&quot;视图分段切换&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;radio&quot; aria-checked=&quot;true&quot; class=&quot;ds-m3-segment is-active&quot;&gt;&lt;span class=&quot;ds-m3-segment__check&quot;&gt;✓&lt;/span&gt;&lt;span&gt;日视图&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;radio&quot; aria-checked=&quot;false&quot; class=&quot;ds-m3-segment&quot;&gt;&lt;span&gt;周视图&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;radio&quot; aria-checked=&quot;false&quot; class=&quot;ds-m3-segment&quot;&gt;&lt;span&gt;月视图&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;MaterialSegmentedButtonGroup options={[&quot;日视图&quot;, &quot;周视图&quot;, &quot;月视图&quot;]} selectedIndex={0} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 首尾外角圆润，内部直角无毛刺\u003c/li>\u003cli>□ 选中态对勾与文字排版居中\u003c/li>\u003cli>□ 点击切换反馈平顺无延迟\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/apple-vision-spatial-checkbox","title":"Apple VisionOS 空间磨砂玻璃全息复选框","html":"\u003ch1>Apple VisionOS 空间磨砂玻璃全息复选框\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple VisionOS 空间悬浮界面专属的全息复选框；具备圆润厚玻璃圆角垫、悬停空间浮空微隆起微动效、轻量勾选弹出动效与双行文字排版。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>弹性水平触控行容器 (.ds-spatial-checkbox)\u003c/li>\u003cli>隐藏原生无障碍输入框 (.ds-spatial-checkbox__input)\u003c/li>\u003cli>双层边框质感玻璃垫元 (.ds-spatial-checkbox__puck)\u003c/li>\u003cli>勾选状态高饱和主色与高亮对勾 (.ds-spatial-checkbox__icon)\u003c/li>\u003cli>主副标题双行排版结构 (.ds-spatial-checkbox__label)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦到复选框；Space 切换选中/未选中状态。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>保持原生 input type=&quot;checkbox&quot; 语义，无障碍软件完全识别且支持表单原生提交。\u003c/li>\u003cli>聚焦与悬停具有明显的立体微膨胀（scale 1.08）视觉线索。\u003c/li>\u003cli>适合空间计算系统设置、AR/VR 设备功能开关、桌面高精设置面板及触控大屏应用。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;label class=&quot;ds-spatial-checkbox&quot; for=&quot;vision-cb-demo&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;vision-cb-demo&quot; class=&quot;ds-spatial-checkbox__input&quot; checked&gt;&lt;div class=&quot;ds-spatial-checkbox__puck&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;ds-spatial-checkbox__icon&quot;&gt;✓&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-spatial-checkbox__label&quot;&gt;&lt;span&gt;空间凝视触觉反馈&lt;/span&gt;&lt;span class=&quot;ds-spatial-checkbox__desc&quot;&gt;开启 VisionOS 深度眼动跟随与微压震动模拟&lt;/span&gt;&lt;/div&gt;&lt;/label&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;VisionSpatialCheckbox label=&quot;空间凝视触觉反馈&quot; checked={true} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 复选框玻璃垫微反光细腻\u003c/li>\u003cli>□ 勾选时主色均匀包裹\u003c/li>\u003cli>□ 双行文字主次灰度分明\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/apple-vision-spatial-glass-pill","title":"VisionOS 空间悬浮毛玻璃胶囊快捷栏","html":"\u003ch1>VisionOS 空间悬浮毛玻璃胶囊快捷栏\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple VisionOS 空间计算空间悬浮毛玻璃胶囊选项卡组（Spatial Floating Glass Capsule Tab Bar）；超厚毛玻璃磨砂高斯模糊底板、高光边缘切角反光、触觉悬浮白色激活高亮底板及图标文字组合排版。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>全圆角超厚玻璃容器 (.ds-spatial-glass-bar)\u003c/li>\u003cli>极简透明胶囊按钮项 (.ds-spatial-glass-bar__item)\u003c/li>\u003cli>选中项高亮实底药丸 (.ds-spatial-glass-bar__item.is-active)\u003c/li>\u003cli>微弱边缘内高光反光 (.ds-spatial-glass-bar)\u003c/li>\u003cli>触碰悬浮微透明渐变 (.ds-spatial-glass-bar__item:hover)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>ArrowLeft / ArrowRight 在选项卡间切换聚焦；Enter 激活切换。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;tablist&quot; 与各子项 role=&quot;tab&quot; 及 aria-selected 属性。\u003c/li>\u003cli>支持键盘无缝轮转导航，prefers-reduced-motion 下直接跳切。\u003c/li>\u003cli>适合空间视窗常驻主控条、媒体播放器浮动工具条、沉浸式全屏快速切换坞。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spatial-glass-bar&quot; role=&quot;tablist&quot; aria-label=&quot;空间毛玻璃胶囊快捷栏&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; class=&quot;ds-spatial-glass-bar__item&quot;&gt;&lt;span class=&quot;ds-spatial-glass-bar__icon&quot; aria-hidden=&quot;true&quot;&gt;🏠&lt;/span&gt;&lt;span&gt;主页&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; class=&quot;ds-spatial-glass-bar__item is-active&quot;&gt;&lt;span class=&quot;ds-spatial-glass-bar__icon&quot; aria-hidden=&quot;true&quot;&gt;🪐&lt;/span&gt;&lt;span&gt;空间&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; class=&quot;ds-spatial-glass-bar__item&quot;&gt;&lt;span class=&quot;ds-spatial-glass-bar__icon&quot; aria-hidden=&quot;true&quot;&gt;⚙️&lt;/span&gt;&lt;span&gt;偏好&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;VisionSpatialGlassPill items={[{ id: &quot;home&quot;, label: &quot;主页&quot;, icon: &quot;🏠&quot; }, { id: &quot;spatial&quot;, label: &quot;空间&quot;, icon: &quot;🪐&quot; }]} activeId=&quot;spatial&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 外壳全圆角且带有微弱反光\u003c/li>\u003cli>□ 激活项有实体背景微投影\u003c/li>\u003cli>□ 图标文字水平对齐居中\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/apple-vision-spatial-hover-halo-ring","title":"VisionOS 空间注视焦点光环按钮","html":"\u003ch1>VisionOS 空间注视焦点光环按钮\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple VisionOS 空间眼动追踪注视光环微交互按钮（Spatial Gaze Hover Halo Ring）；半透明超曲率毛玻璃圆盘底座、视线注视触发的环形多层柔和光晕扩散、中心高亮灵动定位原点及捏合轻触物理反馈。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>正圆空间超薄双曲玻璃圆环 (.ds-spatial-halo-ring)\u003c/li>\u003cli>注视高亮外发光扩散射线圈 (.ds-spatial-halo-ring:hover)\u003c/li>\u003cli>中心高斯聚光点阵 (.ds-spatial-halo-ring__dot)\u003c/li>\u003cli>捏合点击缩放微动效 (transform: scale)\u003c/li>\u003cli>高对比度毛玻璃边缘与景深反射\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>视线注视触发外光环扩展；拇指与食指捏合触发轻微缩放与点击动作。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;button&quot; 与 aria-label 明确说明空间焦点光环按钮功能。\u003c/li>\u003cli>光环扩散动效平滑克制，符合无障碍视觉引导规范。\u003c/li>\u003cli>适合空间计算浮空操作坞、MR 交互热点、3D 模型点选把手。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;button type=&quot;button&quot; class=&quot;ds-spatial-halo-ring&quot; aria-label=&quot;VisionOS 空间注视焦点光环按钮&quot;&gt;&lt;div class=&quot;ds-spatial-halo-ring__dot&quot;&gt;&lt;/div&gt;&lt;/button&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;VisionSpatialHoverHaloRing label=&quot;空间注视焦点光环&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 半透明玻璃小圆盘精巧悬浮\u003c/li>\u003cli>□ 中间微光圆点居中定位\u003c/li>\u003cli>□ 悬浮时外发光环层层散开\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/apple-vision-spatial-input-field","title":"VisionOS 空间悬浮毛玻璃文本输入框","html":"\u003ch1>VisionOS 空间悬浮毛玻璃文本输入框\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple VisionOS 空间计算视线注视悬浮磨砂玻璃输入框（Spatial Frosted Glass Text Input Field）；空间毛玻璃超高模糊底板、聚光聚焦高亮外边框、前置半透明图标及带一键快速清空动作圆钮。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>双曲高景深毛玻璃框 (.ds-spatial-input)\u003c/li>\u003cli>聚焦外圈微光晕 (.ds-spatial-input:focus-within)\u003c/li>\u003cli>前置微弱功能图标 (.ds-spatial-input__icon)\u003c/li>\u003cli>无边框透明原生输入区 (.ds-spatial-input__control)\u003c/li>\u003cli>圆形微透明清空按键 (.ds-spatial-input__clear)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 导航聚焦；输入文字后 Escape 或点击清空按键快速归零。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;search&quot; 与 aria-label，输入框具备明确的占位与无障碍标签。\u003c/li>\u003cli>聚焦态光晕不依赖纯颜色，附带清晰的高亮轮廓线。\u003c/li>\u003cli>适合全屏空间计算搜索、沉浸式浮动控制台、AR/VR 虚拟键盘输入。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spatial-input&quot; role=&quot;search&quot; aria-label=&quot;空间模糊搜索输入框&quot;&gt;&lt;span class=&quot;ds-spatial-input__icon&quot; aria-hidden=&quot;true&quot;&gt;🔍&lt;/span&gt;&lt;input type=&quot;text&quot; class=&quot;ds-spatial-input__control&quot; placeholder=&quot;搜索空间场景或指令…&quot; value=&quot;VisionOS&quot; aria-label=&quot;搜索空间场景或指令…&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-spatial-input__clear&quot; aria-label=&quot;清空输入&quot;&gt;×&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;VisionSpatialGlassInput placeholder=&quot;搜索空间场景或指令…&quot; value=&quot;VisionOS&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 毛玻璃底板通透自然\u003c/li>\u003cli>□ 聚焦时边框发光微高亮\u003c/li>\u003cli>□ 右侧叉号微圆钮对齐居中\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/apple-vision-spatial-media-transport","title":"VisionOS 空间悬浮毛玻璃媒体播放主控条","html":"\u003ch1>VisionOS 空间悬浮毛玻璃媒体播放主控条\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 多媒体 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple VisionOS 空间计算视窗底部浮动磨砂玻璃媒体播放器控件（Spatial Glass Media Transport Bar）；全透明双曲高斯模糊长药丸底座、播放/暂停纯色宝石圆钮、前后 15 秒快速跳跃钮、细粒度进度滑槽与空间音频沉浸开关。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>全圆角悬浮空间玻璃底板 (.ds-spatial-transport)\u003c/li>\u003cli>居中突出纯色高亮播放圆钮 (.ds-spatial-transport__btn--play)\u003c/li>\u003cli>两翼快退/快进 15 秒微按钮 (.ds-spatial-transport__btn)\u003c/li>\u003cli>横向半透明时间进度滑轨 (.ds-spatial-transport__scrub, .ds-spatial-transport__fill)\u003c/li>\u003cli>独立空间音频耳机图标切换按钮 (.ds-spatial-transport__btn.is-active)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Space 快速切换播放与暂停；ArrowLeft / ArrowRight 步进快退与快进。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;region&quot; 与 aria-label=&quot;VisionOS 浮动空间媒体播放条&quot;。\u003c/li>\u003cli>播放进度带有 role=&quot;progressbar&quot; 与 aria-valuenow。\u003c/li>\u003cli>适合沉浸式空间影音播放器、全景音频控制台、VR/AR 媒体视窗。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spatial-transport&quot; role=&quot;region&quot; aria-label=&quot;VisionOS 浮动空间媒体播放条&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-spatial-transport__btn&quot; aria-label=&quot;快退 15 秒&quot;&gt;↺&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-spatial-transport__btn ds-spatial-transport__btn--play&quot; aria-label=&quot;暂停&quot;&gt;⏸&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-spatial-transport__btn&quot; aria-label=&quot;快进 15 秒&quot;&gt;↻&lt;/button&gt;&lt;div class=&quot;ds-spatial-transport__scrub&quot; role=&quot;progressbar&quot; aria-valuenow=&quot;37&quot; aria-label=&quot;播放进度&quot;&gt;&lt;div class=&quot;ds-spatial-transport__fill&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;ds-spatial-transport__time&quot;&gt;01:24 / 03:48&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-spatial-transport__btn is-active&quot; aria-label=&quot;空间音频 已开启&quot; aria-pressed=&quot;true&quot; title=&quot;空间全景音效&quot;&gt;🎧&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;VisionSpatialMediaTransport isPlaying={true} currentTime=&quot;01:24&quot; totalTime=&quot;03:48&quot; isSpatialAudio={true} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 毛玻璃底座通透漂浮\u003c/li>\u003cli>□ 中间播放按键青色显眼\u003c/li>\u003cli>□ 空间音频耳机按键微高亮\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/apple-vision-spatial-slider","title":"Apple VisionOS 空间浮空景深音量滑块","html":"\u003ch1>Apple VisionOS 空间浮空景深音量滑块\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple VisionOS 空间计算与拟态深度立体滑杆；展示浮动玻璃质感导轨、双色能量填充条与悬浮发光立体圆滑块。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>悬浮控制台面板 (.ds-spatial-slider)\u003c/li>\u003cli>顶栏景深毫米刻度与名称 (.ds-spatial-slider__head)\u003c/li>\u003cli>圆角凹陷立体滑道 (.ds-spatial-slider__track)\u003c/li>\u003cli>渐变能量充盈条 (.ds-spatial-slider__fill)\u003c/li>\u003cli>高光悬浮微发光滑块 (.ds-spatial-slider__thumb)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>左右方向键以 1% 步进调节景深；PageUp/PageDown 以 10% 步进快调；Home/End 瞬切极值。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>滑块悬停时尺寸放大 1.15 倍并增强外发光，模拟空间凝视与手势捏合意图。\u003c/li>\u003cli>支持 role=&quot;slider&quot; 与 aria-valuenow 读数，支持屏幕阅读器精确报读。\u003c/li>\u003cli>适合空间音频景深调节、三维模型视差位移、立体光源高度控制与 VR 音量调节。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spatial-slider&quot; role=&quot;region&quot; aria-label=&quot;空间音频景深距离&quot;&gt;&lt;div class=&quot;ds-spatial-slider__head&quot;&gt;&lt;span&gt;空间音频景深距离&lt;/span&gt;&lt;span style=&quot;font-family:var(--ds-type-mono);color:var(--ds-accent)&quot;&gt;65mm&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-spatial-slider__track&quot; style=&quot;--ds-spatial-val:65%&quot; role=&quot;slider&quot; aria-valuenow=&quot;65&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot; aria-label=&quot;空间音频景深距离&quot; tabindex=&quot;0&quot;&gt;&lt;div class=&quot;ds-spatial-slider__fill&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-spatial-slider__thumb&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;VisionSpatialDepthSlider value={65} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 渐变充盈条与滑块位置严格对齐\u003c/li>\u003cli>□ 悬停外发光过渡柔和\u003c/li>\u003cli>□ 方向键步进无延迟\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/apple-vision-spatial-stepper","title":"VisionOS 3D 浮动触觉景深数字微调步进器","html":"\u003ch1>VisionOS 3D 浮动触觉景深数字微调步进器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple VisionOS 空间计算空间景深数字步进微调器（Spatial Depth Numeric Stepper）；玻璃微悬浮外壳、触控物理微按压缩放反馈、等宽大号居中数值、防越界自禁用状态。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>双曲圆角浮动外壳 (.ds-spatial-stepper)\u003c/li>\u003cli>触控按键带微按压弹性 (.ds-spatial-stepper__btn)\u003c/li>\u003cli>等宽字号核心数值居中 (.ds-spatial-stepper__val)\u003c/li>\u003cli>悬浮主色光晕反馈 (.ds-spatial-stepper__btn:hover)\u003c/li>\u003cli>极简无边框减增符号\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>ArrowUp / ArrowRight 增加数值，ArrowDown / ArrowLeft 减少数值，Home/End 跳至极值。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>role=&quot;group&quot; 配合数值 span aria-live=&quot;polite&quot; 实时播报当前步进量。\u003c/li>\u003cli>按钮到达 min / max 自动禁用并带有明确 aria-disabled。\u003c/li>\u003cli>适合空间视差距离微调、3D图层Z轴高度设置、字体字号滑块伴生微调。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spatial-stepper&quot; role=&quot;group&quot; aria-label=&quot;空间深度微调步进器&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-spatial-stepper__btn&quot; aria-label=&quot;减少数值&quot;&gt;−&lt;/button&gt;&lt;span class=&quot;ds-spatial-stepper__val&quot; aria-live=&quot;polite&quot;&gt;5&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-spatial-stepper__btn&quot; aria-label=&quot;增加数值&quot;&gt;+&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;VisionSpatialDepthStepper value={5} min={0} max={10} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 加减按钮正方圆角微内凹\u003c/li>\u003cli>□ 数值居中等宽不抖动\u003c/li>\u003cli>□ 按压缩放动效顺畅\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/apple-vision-spatial-volume-cube","title":"VisionOS 空间容积场景边界线框卡","html":"\u003ch1>VisionOS 空间容积场景边界线框卡\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 布局 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple VisionOS 空间计算 3D 容积场景边界指示框（Volumetric Scene Bounding Cube）；四角空间坐标瞄准刻度拐角、虚线空间容积框架、空间定位锚点状态徽标（ANCHORED）及实时米制空间画幅尺寸（1.2m × 0.8m × 0.6m）。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>空间微透虚线边界框 (.ds-spatial-volume-cube)\u003c/li>\u003cli>四角高亮坐标直角刻线 (.ds-spatial-volume-cube__corner)\u003c/li>\u003cli>顶部场景标题与定位徽标 (.ds-spatial-volume-cube__meta, .ds-spatial-volume-cube__badge)\u003c/li>\u003cli>居中空间三维尺寸读数 (.ds-spatial-volume-cube__dims)\u003c/li>\u003cli>底部空间定位基准提示\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>眼动追踪注视查看空间尺寸；通过空间变换捏合手势调整容积包围盒。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;region&quot; 与 aria-label 完整描述空间容积边界与三维尺寸。\u003c/li>\u003cli>虚线框架与拐角刻度高对比度可见，不影响内部全息内容展示。\u003c/li>\u003cli>适合 VisionOS 空间应用、AR 场景锚定器、3D 物体空间定位器。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spatial-volume-cube&quot; role=&quot;region&quot; aria-label=&quot;空间容积场景边界，尺寸：1.2m × 0.8m × 0.6m&quot;&gt;&lt;span class=&quot;ds-spatial-volume-cube__corner ds-spatial-volume-cube__corner--tl&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-spatial-volume-cube__corner ds-spatial-volume-cube__corner--br&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;div class=&quot;ds-spatial-volume-cube__meta&quot;&gt;&lt;span&gt;空间容积场景边界&lt;/span&gt;&lt;span class=&quot;ds-spatial-volume-cube__badge&quot;&gt;ANCHORED&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-spatial-volume-cube__dims&quot;&gt;&lt;span&gt;📦&lt;/span&gt;&lt;span&gt;1.2m × 0.8m × 0.6m&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;font-size:11px;color:var(--ds-muted);text-align:center&quot;&gt;空间定位基准点保持锁定&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;VisionSpatialVolumeBoundingCube dimensions=&quot;1.2m × 0.8m × 0.6m&quot; anchorStatus=&quot;ANCHORED&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 虚线框通透带科技感\u003c/li>\u003cli>□ 拐角坐标刻度鲜明\u003c/li>\u003cli>□ ANCHORED 胶囊与三维尺寸居中\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/apple-vision-spatial-window-resize-corner","title":"VisionOS 空间视窗右下角注视缩放把手","html":"\u003ch1>VisionOS 空间视窗右下角注视缩放把手\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 布局 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple VisionOS 空间计算视窗右下角的自由缩放把手弧线（Spatial Window Corner Resize Affordance Arc）；大圆角磨砂全息视窗、右下角注视发光弧形把手、视线锁定高亮青色光晕与空间画幅比例指示（16:9）。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>空间双曲毛玻璃视窗 (.ds-spatial-resize-corner)\u003c/li>\u003cli>右下角注视发光弧形把手支架 (.ds-spatial-resize-corner__bracket)\u003c/li>\u003cli>实时画幅宽高比例提示胶囊 (.ds-spatial-resize-corner__ratio)\u003c/li>\u003cli>视线注视发光微光晕 (.ds-spatial-resize-corner__bracket)\u003c/li>\u003cli>对角线双向缩放光标指示 (nwse-resize)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>视线锁定或按住 Command 配合方向键自由缩放空间视窗。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;region&quot; 与 aria-label 说明空间视窗缩放把手。\u003c/li>\u003cli>把手发光状态与背景具备明显亮度差，且支持 nwse-resize 光标。\u003c/li>\u003cli>适合空间计算应用视窗、全景画板容器、沉浸式窗口管理器。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-spatial-resize-corner&quot; role=&quot;region&quot; aria-label=&quot;空间计算视窗，右下角带有空间缩放把手&quot;&gt;&lt;div class=&quot;ds-spatial-resize-corner__content&quot;&gt;&lt;strong&gt;空间计算视窗&lt;/strong&gt;&lt;p style=&quot;margin:6px 0 0;opacity:0.7&quot;&gt;注视右下角弧形把手并捏合手势以调整窗口尺寸。&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;ds-spatial-resize-corner__ratio&quot;&gt;16:9&lt;/span&gt;&lt;div class=&quot;ds-spatial-resize-corner__bracket&quot; aria-label=&quot;双向自由缩放把手&quot;&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;VisionSpatialWindowResizeCorner ratio=&quot;16:9&quot; label=&quot;空间计算视窗&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 右下角圆弧把手微泛青光\u003c/li>\u003cli>□ 16:9 比例微胶囊小巧居底\u003c/li>\u003cli>□ 大圆角玻璃壳体通透\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/apple-watch-activity-rings","title":"Apple Watch 三环同心运动活力圆环图元","html":"\u003ch1>Apple Watch 三环同心运动活力圆环图元\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple Watch 标志性的同心活力三环（活动 Move、锻炼 Exercise、站立 Stand）；基于高精度 SVG 动态弧度与圆角端点渲染，旁边附带各项指标数值与目标对照。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>卡片底座 (.ds-activity-rings)\u003c/li>\u003cli>同心圆 SVG 绘制视窗 (.ds-activity-rings__svg-box)\u003c/li>\u003cli>红、绿、青三色独立圆弧轨迹 (.ds-activity-rings__track)\u003c/li>\u003cli>右侧指标图例群 (.ds-activity-rings__legend)\u003c/li>\u003cli>彩色指示圆点与等宽数值 (.ds-activity-rings__dot, --val)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦圆环卡片；屏幕阅读器按顺序朗读三项维度的达成百分比与数值。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>圆弧轨迹使用 stroke-dasharray 与 stroke-dashoffset 精确计算百分比，端点带 stroke-linecap=&quot;round&quot;。\u003c/li>\u003cli>采用高纯度鲜艳霓虹原色（红 #fa114f、荧光绿 #a1ff00、天青 #00f0ff），在暗色与亮色模式均具强对比。\u003c/li>\u003cli>适合健身打卡、系统资源三维分配率（CPU、内存、I/O）及多维任务完成度展示。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-activity-rings&quot; role=&quot;region&quot; aria-label=&quot;Apple Watch 活力三环&quot;&gt;&lt;div class=&quot;ds-activity-rings__svg-box&quot;&gt;&lt;svg viewBox=&quot;0 0 100 100&quot; width=&quot;100&quot; height=&quot;100&quot;&gt;&lt;circle cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;40&quot; stroke=&quot;rgba(250,17,79,0.2)&quot; stroke-width=&quot;8&quot; fill=&quot;none&quot;&gt;&lt;/circle&gt;&lt;circle cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;40&quot; stroke=&quot;#fa114f&quot; stroke-width=&quot;8&quot; class=&quot;ds-activity-rings__track&quot; stroke-dasharray=&quot;251.3&quot; stroke-dashoffset=&quot;62.8&quot; transform=&quot;rotate(-90 50 50)&quot;&gt;&lt;/circle&gt;&lt;circle cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;28&quot; stroke=&quot;rgba(161,255,0,0.2)&quot; stroke-width=&quot;8&quot; fill=&quot;none&quot;&gt;&lt;/circle&gt;&lt;circle cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;28&quot; stroke=&quot;#a1ff00&quot; stroke-width=&quot;8&quot; class=&quot;ds-activity-rings__track&quot; stroke-dasharray=&quot;175.9&quot; stroke-dashoffset=&quot;0&quot; transform=&quot;rotate(-90 50 50)&quot;&gt;&lt;/circle&gt;&lt;circle cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;16&quot; stroke=&quot;rgba(0,240,255,0.2)&quot; stroke-width=&quot;8&quot; fill=&quot;none&quot;&gt;&lt;/circle&gt;&lt;circle cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;16&quot; stroke=&quot;#00f0ff&quot; stroke-width=&quot;8&quot; class=&quot;ds-activity-rings__track&quot; stroke-dasharray=&quot;100.5&quot; stroke-dashoffset=&quot;16.7&quot; transform=&quot;rotate(-90 50 50)&quot;&gt;&lt;/circle&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;ds-activity-rings__legend&quot;&gt;&lt;div class=&quot;ds-activity-rings__row&quot;&gt;&lt;span class=&quot;ds-activity-rings__dot ds-activity-rings__dot--red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-activity-rings__val&quot;&gt;450&lt;/span&gt;&lt;span class=&quot;ds-activity-rings__target&quot;&gt;/ 600 KCAL&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-activity-rings__row&quot;&gt;&lt;span class=&quot;ds-activity-rings__dot ds-activity-rings__dot--green&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-activity-rings__val&quot;&gt;35&lt;/span&gt;&lt;span class=&quot;ds-activity-rings__target&quot;&gt;/ 30 MIN&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-activity-rings__row&quot;&gt;&lt;span class=&quot;ds-activity-rings__dot ds-activity-rings__dot--cyan&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ds-activity-rings__val&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;ds-activity-rings__target&quot;&gt;/ 12 HRS&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;AppleWatchActivityRings move={450} exercise={35} stand={10} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 同心圆端点圆润无锯齿\u003c/li>\u003cli>□ 三色图例数值对齐清晰\u003c/li>\u003cli>□ 超额完成时无圆弧断裂\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/arc-tab-tile","title":"Arc 浏览器侧边微标签","html":"\u003ch1>Arc 浏览器侧边微标签\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Arc Browser 与 Safari 18 竖向侧栏微标签磁贴；支持图标、音频播放指示、悬停右滑微弹与悬停关闭按钮。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>应用/网站微图标\u003c/li>\u003cli>标题单行截断文本\u003c/li>\u003cli>音频播放指示扬声器\u003c/li>\u003cli>悬停显隐关闭微按钮 (×)\u003c/li>\u003cli>激活强调色背板\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦至标签磁贴；Enter 切换当前标签页；聚焦关闭按钮时 Space 关闭。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>悬停时使用 translateX(2px) 进行极微小横向右移，模拟物理书签微探出的触感。\u003c/li>\u003cli>关闭按钮在默认状态下 opacity: 0，悬停或聚焦时平滑显现，保持侧栏视觉极简。\u003c/li>\u003cli>激活状态带有主题 accent-soft 柔底与 1px 细线边框，主次层级清晰。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-arc-tab is-active&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; tabindex=&quot;0&quot; data-toast=&quot;切换至控制台标签&quot;&gt;&lt;div class=&quot;ds-arc-tab__main&quot;&gt;&lt;span class=&quot;ds-arc-tab__icon&quot;&gt;🪐&lt;/span&gt;&lt;span class=&quot;ds-arc-tab__title&quot;&gt;AetherLink 控制台&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-arc-tab__actions&quot;&gt;&lt;span class=&quot;ds-arc-tab__audio&quot;&gt;🔊&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-arc-tab__close&quot; aria-label=&quot;关闭标签&quot; data-toast=&quot;关闭标签&quot;&gt;×&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;ArcTabTile icon=&quot;🪐&quot; title=&quot;AetherLink 控制台&quot; isAudio={true} isActive={true} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 悬停右移与关闭按钮淡入平滑无卡顿\u003c/li>\u003cli>□ 音频扬声器图标与标题对齐协调\u003c/li>\u003cli>□ 深浅主题下激活色块文字辨识度高\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/arcade-joystick-gate","title":"Neo-Geo 8 向八角街机摇杆限位盘","html":"\u003ch1>Neo-Geo 8 向八角街机摇杆限位盘\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>SNK Neo-Geo、Capcom 与日本三和（Sanwa Denshi）街机摇杆内部经典的八角限位门（Octagonal Gate）；实时可视化摇杆物理球头方位角与 8 方向微动开关触发。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>外层圆形/八角视窗底座 (.ds-arcade-gate)\u003c/li>\u003cli>八角形物理限位卡槽 (.ds-arcade-gate__octagon)\u003c/li>\u003cli>红色摇杆物理球头 (.ds-arcade-gate__stick)\u003c/li>\u003cli>八向方位微动开关点阵 (.ds-arcade-gate__dir)\u003c/li>\u003cli>平滑物理轨迹位移\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>八向方向键（上/下/左/右/左上/右上/左下/右下）控制球头朝向并点亮对应限位角。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>球头位置使用 CSS 变量 --ds-stick-x/y 控制，依托 GPU 合成转换，保证极高帧率零掉帧。\u003c/li>\u003cli>八角卡槽利用 CSS clip-path polygon 生成标准八边形，完美还原实体街机控台手感。\u003c/li>\u003cli>适合游戏外设调试面板、机器人遥测舵机指示、虚拟手柄设置及复古街机模拟器。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-arcade-gate&quot; role=&quot;region&quot; aria-label=&quot;街机摇杆 8 向限位门 当前方向: 右上&quot;&gt;&lt;div class=&quot;ds-arcade-gate__octagon&quot;&gt;&lt;div class=&quot;ds-arcade-gate__stick&quot; style=&quot;--ds-stick-x:20px;--ds-stick-y:-20px&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;RetroArcade8WayGate dir=&quot;up-right&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 八角形几何轮廓平滑无毛边\u003c/li>\u003cli>□ 球头移动定位精准\u003c/li>\u003cli>□ 深色与浅色底座对比鲜明\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/audio-dj-crossfader","title":"Pioneer DJ 硬件双通道触觉交叉推子","html":"\u003ch1>Pioneer DJ 硬件双通道触觉交叉推子\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Pioneer DJ、Native Instruments Traktor 与专业混音台风格的物理交叉淡入淡出滑杆（Crossfader）；包含 Deck A / Deck B 声道标识、物理推子凹槽、中点刻度与立体拨帽。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>推子控制台外壳 (.ds-dj-crossfader)\u003c/li>\u003cli>顶栏双声道标签与名称 (.ds-dj-crossfader__head)\u003c/li>\u003cli>深色内凹推子轨道 (.ds-dj-crossfader__slot)\u003c/li>\u003cli>居中物理盲点刻度线 (.ds-dj-crossfader__center-notch)\u003c/li>\u003cli>等宽立体金属拨帽 (.ds-dj-crossfader__cap)\u003c/li>\u003cli>拨帽居中红色指示刻度 (.ds-dj-crossfader__cap-line)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>左右方向键微调推子位置（1% 步进）；PageUp/PageDown 快速切至 Deck A 或 Deck B；Home/End 瞬切两端。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>采用 role=&quot;slider&quot; 并具备完整的 aria-valuenow 与上下界限定义。\u003c/li>\u003cli>推子拨帽包含垂直红色指示线，重现顶级物理调音台的盲操体验。\u003c/li>\u003cli>适合音频混音器、视频前后 A/B 轨道过渡比例控制及模型对比权重调节。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-dj-crossfader&quot; role=&quot;group&quot; aria-label=&quot;双通道 DJ 混音交叉推子&quot;&gt;&lt;div class=&quot;ds-dj-crossfader__head&quot;&gt;&lt;span class=&quot;ds-dj-crossfader__deck-a&quot;&gt;◄ DECK A&lt;/span&gt;&lt;span style=&quot;color:var(--ds-muted)&quot;&gt;CROSSFADER&lt;/span&gt;&lt;span class=&quot;ds-dj-crossfader__deck-b&quot;&gt;DECK B ►&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-dj-crossfader__slot&quot; style=&quot;--ds-fader-pos:50%&quot; role=&quot;slider&quot; aria-valuenow=&quot;50&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot; tabindex=&quot;0&quot;&gt;&lt;div class=&quot;ds-dj-crossfader__center-notch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-dj-crossfader__cap&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;ds-dj-crossfader__cap-line&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;DjMixerCrossfader position={50} deckAName=&quot;DECK A&quot; deckBName=&quot;DECK B&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 推子拨帽滑动位置与百分比变量一致\u003c/li>\u003cli>□ 中点刻度对齐清晰\u003c/li>\u003cli>□ 方向键调整无障碍无抖动\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/audio-eq-parametric-band","title":"DAW 5段参量均衡滤波曲线视窗","html":"\u003ch1>DAW 5段参量均衡滤波曲线视窗\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 多媒体 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Ableton Live、Logic Pro 与 FabFilter Pro-Q 级别的专业 5 段参量均衡器（Parametric EQ）；展示网格频响背景、动态平滑 SVG 贝塞尔滤波曲线与拖拽调节节点。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>音频面板外壳 (.ds-eq-band)\u003c/li>\u003cli>顶栏频段状态标题 (.ds-eq-band__head)\u003c/li>\u003cli>暗黑滤波示波视窗 (.ds-eq-band__screen)\u003c/li>\u003cli>等距频响网格参考线 (.ds-eq-band__grid)\u003c/li>\u003cli>矢量滤波动态平滑曲线 (.ds-eq-band__curve)\u003c/li>\u003cli>发光中心控制频点手柄 (.ds-eq-band__node)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在各 EQ 节点间遍历；方向键微调选中频点的中心频率（X轴）与增益衰减（Y轴）。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>曲线使用矢量 SVG 配合系统高亮色，手柄节点自带外发光光晕与精确坐标指示。\u003c/li>\u003cli>手柄节点具备 role=&quot;slider&quot; 与 aria-label，保障专业音频界面的可访问性。\u003c/li>\u003cli>适合数字音频工作站（DAW）、声卡控制中心、流媒体音效器及会议室降噪调音台。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-eq-band&quot; role=&quot;region&quot; aria-label=&quot;5-Band 参量均衡曲线器&quot;&gt;&lt;div class=&quot;ds-eq-band__head&quot;&gt;&lt;span&gt;5-Band 参量均衡曲线器&lt;/span&gt;&lt;span style=&quot;color:var(--ds-accent)&quot;&gt;EQ ACTIVE&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-eq-band__screen&quot;&gt;&lt;div class=&quot;ds-eq-band__grid&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;svg class=&quot;ds-eq-band__curve&quot; viewBox=&quot;0 0 100 100&quot; preserveAspectRatio=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M 0 50 Q 20 20, 40 65 T 80 25 T 100 50&quot; fill=&quot;none&quot; stroke=&quot;var(--ds-accent)&quot; stroke-width=&quot;2.5&quot;&gt;&lt;/path&gt;&lt;/svg&gt;&lt;div class=&quot;ds-eq-band__node&quot; style=&quot;left:20%;top:35%&quot; title=&quot;80Hz: +3dB&quot; role=&quot;slider&quot; aria-label=&quot;80Hz 频段增益&quot; tabindex=&quot;0&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-eq-band__node&quot; style=&quot;left:40%;top:65%&quot; title=&quot;250Hz: -2dB&quot; role=&quot;slider&quot; aria-label=&quot;250Hz 频段增益&quot; tabindex=&quot;0&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-eq-band__node&quot; style=&quot;left:80%;top:25%&quot; title=&quot;4kHz: +4.5dB&quot; role=&quot;slider&quot; aria-label=&quot;4kHz 频段增益&quot; tabindex=&quot;0&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;ParametricEqBandVisualizer /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 示波曲线平滑无锯齿断裂\u003c/li>\u003cli>□ 频点手柄居中吸附在曲线上\u003c/li>\u003cli>□ 暗黑示波视窗深邃专业\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guid
