-unlock__fill&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;span class=&quot;ds-slide-unlock__text&quot;&gt;滑动以确认操作 ››&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-slide-unlock__thumb&quot; aria-label=&quot;拖动或按回车以确认&quot;&gt;››&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;IosSwipeToUnlockSlider text=&quot;滑动以确认操作 ››&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 滑块圆形居左无多余偏移\u003c/li>\u003cli>□ 文字在滑块移动时居中保持\u003c/li>\u003cli>□ 滑轨内阴影深浅适度\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-action-toggle-row","title":"iOS 18 设置项分栏图标与状态触感行","html":"\u003ch1>iOS 18 设置项分栏图标与状态触感行\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 18 与 iPadOS 设置面板风格的内嵌分组表单列表行；集成圆角鲜亮图标徽章、标题副标与右侧状态文本或箭头，支持点按触感背景反馈。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>分组设置行外层 (.ds-setting-row)\u003c/li>\u003cli>左侧图标与文本组 (.ds-setting-row__lead)\u003c/li>\u003cli>30px 超椭圆高亮功能图标 (.ds-setting-row__icon)\u003c/li>\u003cli>主标题与辅助说明列 (.ds-setting-row__titles)\u003c/li>\u003cli>右侧状态值与前进箭头 (.ds-setting-row__tail)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦各个设置行；Enter 或 Space 打开对应子页面或触发切换。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>图标底色采用语义变量驱动，例如系统网络（action）、安全加密（success）与高级设置（accent）。\u003c/li>\u003cli>底部边框利用 :last-child 自适应隐藏。\u003c/li>\u003cli>文本自适应截断，保证不同屏幕宽度下右侧状态值始终完整展示。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-setting-row&quot; role=&quot;button&quot; tabindex=&quot;0&quot;&gt;&lt;div class=&quot;ds-setting-row__lead&quot;&gt;&lt;div class=&quot;ds-setting-row__icon&quot; style=&quot;background:var(--ds-action)&quot;&gt;⚙️&lt;/div&gt;&lt;div class=&quot;ds-setting-row__titles&quot;&gt;&lt;span class=&quot;ds-setting-row__title&quot;&gt;通用网络代理&lt;/span&gt;&lt;span class=&quot;ds-setting-row__sub&quot;&gt;智能分流与全局规则设置&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-setting-row__tail&quot;&gt;&lt;span&gt;自动 PAC&lt;/span&gt;&lt;span class=&quot;ds-setting-row__chevron&quot; aria-hidden=&quot;true&quot;&gt;›&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;SettingActionRow title=&quot;通用网络代理&quot; subtitle=&quot;智能分流与全局规则设置&quot; tail=&quot;自动 PAC&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 图标与双行文本垂直居中对齐\u003c/li>\u003cli>□ 点击瞬时背景反馈自然流畅\u003c/li>\u003cli>□ 键盘回车可顺畅触发交互\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-control-center-connectivity-cluster","title":"iOS 18 控制中心 2×2 连接矩阵面板","html":"\u003ch1>iOS 18 控制中心 2×2 连接矩阵面板\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 18 经典深色毛玻璃控制中心 2×2 连接性快捷模块（Connectivity Quick Action Matrix）；高透磨砂圆角容器中排列飞行模式、蜂窝网络、Wi-Fi 与蓝牙四大核心无线功能高亮触控微药丸。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>大圆角高斯模糊磨砂底板 (.ds-connectivity-cluster)\u003c/li>\u003cli>2×2 极简网格布局 (display: grid)\u003c/li>\u003cli>圆形大触控按钮与各功能原生色彩 (.ds-connectivity-cluster__item)\u003c/li>\u003cli>飞行模式暖橙高亮、蜂窝网络鲜绿高亮、Wi-Fi/蓝牙纯蓝高亮\u003c/li>\u003cli>原生弹簧触感缩放交互 (transform: scale)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在 4 个按键间循环导航；Space 或 Enter 切换对应开关状态。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;group&quot; 与 aria-label 说明 iOS 控制中心连接矩阵。\u003c/li>\u003cli>每个子按键均有独立 aria-label 与 aria-pressed 开关状态。\u003c/li>\u003cli>适合系统快捷控制中心、多状态无线管理器、车载移动终端主屏。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-connectivity-cluster&quot; role=&quot;group&quot; aria-label=&quot;iOS 控制中心连接矩阵&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-connectivity-cluster__item&quot; aria-label=&quot;飞行模式&quot; aria-pressed=&quot;false&quot;&gt;✈️&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-connectivity-cluster__item is-active&quot; style=&quot;background-color:#34c759&quot; aria-label=&quot;蜂窝移动网络&quot; aria-pressed=&quot;true&quot;&gt;📶&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-connectivity-cluster__item is-active&quot; aria-label=&quot;无线局域网 Wi-Fi&quot; aria-pressed=&quot;true&quot;&gt;📡&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-connectivity-cluster__item is-active&quot; aria-label=&quot;蓝牙连接&quot; aria-pressed=&quot;true&quot;&gt;ᛒ&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;IosControlCenterConnectivityCluster isAirplane={false} isCellular={true} isWifi={true} isBluetooth={true} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 2x2 四个正圆大按钮排列工整\u003c/li>\u003cli>□ 深色毛玻璃底板通透\u003c/li>\u003cli>□ 绿色蜂窝与蓝色 Wi-Fi/蓝牙各具色彩\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-focus-mode-status-chip","title":"iOS 18 锁屏与控制中心专注模式胶囊","html":"\u003ch1>iOS 18 锁屏与控制中心专注模式胶囊\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 操作 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 18 锁屏与控制中心快速切换专注模式的触感胶囊（Focus Mode Status Chip）；柔和微阴影胶囊、模式发光微图标（月亮/工作/个人/睡眠）、状态标题与微型指示绿点，点击即刻循环切态。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>全圆角微阴影灵动胶囊 (.ds-focus-chip)\u003c/li>\u003cli>前置模式语义小图标 (.ds-focus-chip__icon)\u003c/li>\u003cli>模式中文标题 (.ds-focus-chip__title)\u003c/li>\u003cli>右侧开启态微绿发光点 (.ds-focus-chip__status)\u003c/li>\u003cli>轻微按压弹性缩放反馈\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 导航聚焦；Enter 或 Space 点击切换当前专注模式。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 button 属性与 aria-pressed 明确宣布是否处于开启态。\u003c/li>\u003cli>文本与图标具备良好色彩对比度，状态点发光明显。\u003c/li>\u003cli>适合系统锁屏常驻组件、个人状态发布、勿扰模式快速切换器。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;button type=&quot;button&quot; class=&quot;ds-focus-chip&quot; aria-label=&quot;专注模式切换：专注模式，已开启&quot; aria-pressed=&quot;true&quot;&gt;&lt;span class=&quot;ds-focus-chip__icon&quot; aria-hidden=&quot;true&quot;&gt;🌙&lt;/span&gt;&lt;span class=&quot;ds-focus-chip__title&quot;&gt;专注模式&lt;/span&gt;&lt;span class=&quot;ds-focus-chip__status&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/button&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;IosFocusModeStatusChip mode=&quot;专注模式&quot; icon=&quot;🌙&quot; isActive={true} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 胶囊圆润小巧\u003c/li>\u003cli>□ 月牙图标青绿醒目\u003c/li>\u003cli>□ 右侧绿光状态微圆点纯净\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-live-activity-flight-tracker","title":"iOS 18 灵动岛航旅实时活动追踪卡","html":"\u003ch1>iOS 18 灵动岛航旅实时活动追踪卡\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 18 锁屏与灵动岛展开态实时航班动态卡片（Dynamic Island Live Activity）；纯黑深色背景、起降机场等宽大字号代码、飞行弧线小飞机航迹动画、登机口与准点胶囊状态指示。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>黑底圆角卡片容器 (.ds-flight-tracker)\u003c/li>\u003cli>航线起止点大号字徽 (.ds-flight-tracker__code)\u003c/li>\u003cli>动态航迹虚线与小飞机标 (.ds-flight-tracker__plane)\u003c/li>\u003cli>准点绿色微晶胶囊 (.ds-flight-tracker__pill)\u003c/li>\u003cli>底部航旅关键元信息栏 (.ds-flight-tracker__meta)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 键可聚焦至卡片，Enter 展开全屏航线地图。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>通过 role=&quot;region&quot; 与 aria-label 完整描述航班号、起降地与剩余时间。\u003c/li>\u003cli>色彩采用高对比度荧光青与翠绿，强光下高可读性。\u003c/li>\u003cli>适合航班动态追踪、网约车行程卡、外卖骑手进度锁屏提醒。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-flight-tracker&quot; role=&quot;region&quot; aria-label=&quot;航班动态: UA 857 SFO 至 PVG&quot;&gt;&lt;div class=&quot;ds-flight-tracker__route&quot;&gt;&lt;div&gt;&lt;div class=&quot;ds-flight-tracker__code&quot;&gt;SFO&lt;/div&gt;&lt;div class=&quot;ds-flight-tracker__city&quot;&gt;旧金山&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-flight-tracker__arc&quot;&gt;&lt;span class=&quot;ds-flight-tracker__plane&quot; aria-hidden=&quot;true&quot;&gt;✈&lt;/span&gt;&lt;div class=&quot;ds-flight-tracker__line&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;text-align:right&quot;&gt;&lt;div class=&quot;ds-flight-tracker__code&quot;&gt;PVG&lt;/div&gt;&lt;div class=&quot;ds-flight-tracker__city&quot;&gt;上海浦东&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-flight-tracker__meta&quot;&gt;&lt;span class=&quot;ds-flight-tracker__pill&quot;&gt;&lt;span aria-hidden=&quot;true&quot;&gt;●&lt;/span&gt;&lt;span&gt;飞行中 · 准点&lt;/span&gt;&lt;/span&gt;&lt;span&gt;登机口: &lt;strong&gt;G92&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;剩余: &lt;strong&gt;4小时18分&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;IosLiveActivityFlightCard flightNumber=&quot;UA 857&quot; origin=&quot;SFO&quot; destination=&quot;PVG&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 机场三字码加粗醒目\u003c/li>\u003cli>□ 航迹飞机居中悬浮投影\u003c/li>\u003cli>□ 绿色准点药丸微发光\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-passcode-keypad","title":"iOS 18 锁屏触感磨砂玻璃数字键盘","html":"\u003ch1>iOS 18 锁屏触感磨砂玻璃数字键盘\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple iOS 18 锁屏密码核验界面的正圆毛玻璃数字按键矩阵；支持 1-9 与 0 数字点按、英文字母副标、退格删除与物理触觉按压微缩反馈。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>三列对称按键网格 (.ds-passcode-keypad)\u003c/li>\u003cli>68px 正圆毛玻璃微按键 (.ds-passcode-key)\u003c/li>\u003cli>轻量等宽主数字 (.ds-passcode-key__num)\u003c/li>\u003cli>等宽英文三字符副标 (.ds-passcode-key__letters)\u003c/li>\u003cli>按压轻微缩放态 (.ds-passcode-key:active)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 依次聚焦各按键；物理键盘数字键 0-9 与 Backspace 直接映射并触发对应触感反馈。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>按压瞬间触发 scale(0.92) 并配合 --ds-accent-soft 高亮，模拟物理导电橡胶与玻璃盖板的回弹感。\u003c/li>\u003cli>键盘布局严格对齐 iOS 规范，包含 ABC、DEF 等拼音与字母映射。\u003c/li>\u003cli>适合锁屏安全验证、PIN 码解锁、金融支付授权与离线设备终端。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-passcode-keypad&quot; role=&quot;group&quot; aria-label=&quot;锁屏触感密码数字键盘&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-passcode-key&quot; aria-label=&quot;数字 1&quot;&gt;&lt;span class=&quot;ds-passcode-key__num&quot;&gt;1&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-passcode-key&quot; aria-label=&quot;数字 2 ABC&quot;&gt;&lt;span class=&quot;ds-passcode-key__num&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;ds-passcode-key__letters&quot;&gt;ABC&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-passcode-key&quot; aria-label=&quot;数字 3 DEF&quot;&gt;&lt;span class=&quot;ds-passcode-key__num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;ds-passcode-key__letters&quot;&gt;DEF&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-passcode-key&quot; aria-label=&quot;数字 4 GHI&quot;&gt;&lt;span class=&quot;ds-passcode-key__num&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;ds-passcode-key__letters&quot;&gt;GHI&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-passcode-key&quot; aria-label=&quot;数字 5 JKL&quot;&gt;&lt;span class=&quot;ds-passcode-key__num&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;ds-passcode-key__letters&quot;&gt;JKL&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-passcode-key&quot; aria-label=&quot;数字 6 MNO&quot;&gt;&lt;span class=&quot;ds-passcode-key__num&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;ds-passcode-key__letters&quot;&gt;MNO&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-passcode-key&quot; aria-label=&quot;数字 7 PQRS&quot;&gt;&lt;span class=&quot;ds-passcode-key__num&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;ds-passcode-key__letters&quot;&gt;PQRS&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-passcode-key&quot; aria-label=&quot;数字 8 TUV&quot;&gt;&lt;span class=&quot;ds-passcode-key__num&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;ds-passcode-key__letters&quot;&gt;TUV&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-passcode-key&quot; aria-label=&quot;数字 9 WXYZ&quot;&gt;&lt;span class=&quot;ds-passcode-key__num&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;ds-passcode-key__letters&quot;&gt;WXYZ&lt;/span&gt;&lt;/button&gt;&lt;div aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ds-passcode-key&quot; aria-label=&quot;数字 0&quot;&gt;&lt;span class=&quot;ds-passcode-key__num&quot;&gt;0&lt;/span&gt;&lt;span class=&quot;ds-passcode-key__letters&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-passcode-key&quot; aria-label=&quot;退格删除&quot;&gt;&lt;span class=&quot;ds-passcode-key__num&quot;&gt;⌫&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;IosPasscodeKeypad /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 按键正圆且排列严格对称\u003c/li>\u003cli>□ 副标字母大写且间距舒适\u003c/li>\u003cli>□ 触控微缩动效无重排抖动\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-passkey-sheet","title":"Apple Passkey 生物特征通行密钥认证单","html":"\u003ch1>Apple Passkey 生物特征通行密钥认证单\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Apple Passkey、WebAuthn 与 1Password 风格的生物特征通行密钥核验浮层面板；集成 Face ID 全息图标、凭据账户卡片、受信任安全域名与一键认证按钮。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>卡片模态底座 (.ds-passkey-sheet)\u003c/li>\u003cli>Face ID 全息方圆形图标 (.ds-passkey-sheet__faceid)\u003c/li>\u003cli>核验主标题与安全域名行 (.ds-passkey-sheet__title, --domain)\u003c/li>\u003cli>内嵌凭据账号卡 (.ds-passkey-sheet__account)\u003c/li>\u003cli>主操作认证按钮 (.ds-passkey-sheet__btn)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 在账号卡与操作按钮间移动；Enter 或 Space 确认执行 Face ID 认证；Escape 取消核验。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>使用大圆角 24px 与柔和阴影，还原 iOS 18 原生系统级核验弹窗视觉。\u003c/li>\u003cli>账号行展示清晰的单字母头像、显示名与登录邮箱，杜绝凭据混淆。\u003c/li>\u003cli>适合作为高安全等级操作（导出密钥、修改全局配置、重置订阅）的核验屏障。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-passkey-sheet&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;通行密钥生物特征核验&quot;&gt;&lt;div class=&quot;ds-passkey-sheet__faceid&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;👤&lt;/span&gt;&lt;/div&gt;&lt;h3 class=&quot;ds-passkey-sheet__title&quot;&gt;通行密钥登录&lt;/h3&gt;&lt;div class=&quot;ds-passkey-sheet__domain&quot;&gt;&lt;span&gt;🔒&lt;/span&gt;&lt;span&gt;apple.com&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-passkey-sheet__account&quot;&gt;&lt;div class=&quot;ds-passkey-sheet__avatar&quot;&gt;T&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;ds-passkey-sheet__name&quot;&gt;Trevv Developer&lt;/div&gt;&lt;div class=&quot;ds-passkey-sheet__sub&quot;&gt;trevv@icloud.com&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ds-passkey-sheet__btn&quot;&gt;&lt;span&gt;使用 Face ID 继续&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;PasskeyAuthSheet domain=&quot;apple.com&quot; username=&quot;trevv@icloud.com&quot; displayName=&quot;Trevv Developer&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ Face ID 图标与标题层次分明\u003c/li>\u003cli>□ 凭据账户卡片文字对比清晰\u003c/li>\u003cli>□ 按钮悬停与点按微反馈流畅\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-safari-page-zoom-hud","title":"iOS 18 Safari 地址栏网页缩放与阅读器控制 HUD","html":"\u003ch1>iOS 18 Safari 地址栏网页缩放与阅读器控制 HUD\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 18 Safari 地址栏点击 aA 弹出的网页缩放与阅读视图微调面板（Safari Page Zoom &amp; Reader HUD）；包含减号/百分比/加号一体步进微控、点击百分比直接重置、竖线分隔符及一键阅读视图切换快捷按钮。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角微阴影浮动气泡卡片 (.ds-safari-zoom-hud)\u003c/li>\u003cli>紧凑加减号三段式步进药丸 (.ds-safari-zoom-hud__stepper)\u003c/li>\u003cli>等宽百分比数值与居中重置交互 (.ds-safari-zoom-hud__pct)\u003c/li>\u003cli>垂直分割细线 (.ds-safari-zoom-hud__sep)\u003c/li>\u003cli>右侧书本图样阅读器模式切换 (.ds-safari-zoom-hud__action)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 导航各按钮；Enter 或 Space 调整百分比或打开阅读器；Escape 关闭浮层。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;dialog&quot; 与 aria-label，加减按钮附带明确的无障碍标签。\u003c/li>\u003cli>缩放百分比数值字体加粗居中，与背景对比度良好。\u003c/li>\u003cli>适合浏览器扩展、阅读器应用、排版调试工作台、无障碍视图调整面板。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-safari-zoom-hud&quot; role=&quot;dialog&quot; aria-label=&quot;Safari 网页文字缩放与阅读器控制 HUD&quot;&gt;&lt;div class=&quot;ds-safari-zoom-hud__stepper&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-safari-zoom-hud__btn&quot; aria-label=&quot;缩小字号&quot;&gt;-&lt;/button&gt;&lt;span class=&quot;ds-safari-zoom-hud__pct&quot; title=&quot;点击重置为 100%&quot;&gt;100%&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-safari-zoom-hud__btn&quot; aria-label=&quot;放大字号&quot;&gt;+&lt;/button&gt;&lt;/div&gt;&lt;span class=&quot;ds-safari-zoom-hud__sep&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;ds-safari-zoom-hud__action&quot;&gt;&lt;span&gt;📖&lt;/span&gt;&lt;span&gt;阅读视图&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;IosSafariPageZoomHud zoom={100} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 减号、百分比、加号排列紧凑\u003c/li>\u003cli>□ 竖线分割自然\u003c/li>\u003cli>□ 阅读视图文字与图标水平居中\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-segmented-control-slider","title":"iOS 18 弹性滑块分段胶囊选择器","html":"\u003ch1>iOS 18 弹性滑块分段胶囊选择器\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 18 经典物理弹性滑块分段选择器（Segmented Control with Spring Slider）；轻量微内凹基底、浮动毛玻璃白色滑块底板随选中平滑位移、触控按压轻微收缩。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>微内陷外框槽底 (.ds-ios-segment)\u003c/li>\u003cli>浮动白色微阴影滑块底板 (.ds-ios-segment__thumb)\u003c/li>\u003cli>均分无边框选项按钮组 (.ds-ios-segment__btn)\u003c/li>\u003cli>高亮加粗激活字色 (.is-active)\u003c/li>\u003cli>平滑无抖动的 translate 运动\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>ArrowLeft / ArrowRight 在分段项间快速滑动切换，Enter 确认。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;tablist&quot; 与各按钮 role=&quot;tab&quot; 及 aria-selected 属性。\u003c/li>\u003cli>运动采用符合物理阻尼的 cubic-bezier 曲线，prefers-reduced-motion 下直接跳切。\u003c/li>\u003cli>适合日期范围筛选、视图模式切换（网格/列表）、深浅偏好设置及主导航子分段。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-ios-segment&quot; role=&quot;tablist&quot; style=&quot;--ds-seg-count:3;--ds-seg-active:0&quot;&gt;&lt;div class=&quot;ds-ios-segment__thumb&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; class=&quot;ds-ios-segment__btn is-active&quot;&gt;日视图&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; class=&quot;ds-ios-segment__btn&quot;&gt;周视图&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; class=&quot;ds-ios-segment__btn&quot;&gt;月视图&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;IosSlidingSegmentedControl options={[&quot;日视图&quot;, &quot;周视图&quot;, &quot;月视图&quot;]} value={0} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 滑块完全覆盖当前选项宽度\u003c/li>\u003cli>□ 选项文字垂直居中对齐\u003c/li>\u003cli>□ 底框内边距上下左右对称\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/ios-standby-clock-nightstand-card","title":"iOS 18 StandBy 待机床头时钟卡片","html":"\u003ch1>iOS 18 StandBy 待机床头时钟卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 17/18 横屏充电待机模式巨型数字时钟卡片（StandBy Mode Nightstand Clock Card）；深黑 OLED 纯净背景、极高字重的并排巨幅时间读数、微型秒数显示、顶部日期与闹钟提示及专为暗室防眩目优化的红光夜间模式。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>纯黑圆角卡片基底 (.ds-standby-clock)\u003c/li>\u003cli>支持暗室柔光红色夜景变体 (.ds-standby-clock--night) 与暖橙日光变体 (.ds-standby-clock--solar)\u003c/li>\u003cli>巨幅粗体等宽时间读数 (.ds-standby-clock__time)\u003c/li>\u003cli>顶部精简日期与下次闹钟时间 (.ds-standby-clock__meta)\u003c/li>\u003cli>底部 StandBy 模式状态与天文日出提示 (.ds-standby-clock__footer)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>横屏锁屏自动激活；单击切换红色夜间防眩光模式。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>具备 role=&quot;region&quot; 与清晰的 aria-label 反映当前完整时间。\u003c/li>\u003cli>红光夜间模式符合暗室暗适应无障碍标准，字体大而清晰。\u003c/li>\u003cli>适合桌面时钟、大屏信息看板、锁屏待机常显（AOD）界面。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-standby-clock ds-standby-clock--night&quot; role=&quot;region&quot; aria-label=&quot;iOS StandBy 待机时钟：09:41&quot;&gt;&lt;div class=&quot;ds-standby-clock__meta&quot;&gt;&lt;span&gt;10月16日 星期四&lt;/span&gt;&lt;span&gt;⏰ 07:30&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-standby-clock__time&quot;&gt;&lt;span&gt;09:41&lt;/span&gt;&lt;span class=&quot;ds-standby-clock__sec&quot;&gt;28&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-standby-clock__footer&quot;&gt;&lt;span&gt;STANDBY MODE&lt;/span&gt;&lt;span&gt;☀️ 日出 06:12&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;IosStandbyClockCard hours=&quot;09&quot; minutes=&quot;41&quot; seconds=&quot;28&quot; mode=&quot;night&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 纯黑背景衬托纯红巨幅时间\u003c/li>\u003cli>□ 秒数与时分主次分明\u003c/li>\u003cli>□ 顶部与底部细字规范平衡\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/island","title":"灵动胶囊浮岛","html":"\u003ch1>灵动胶囊浮岛\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 浮层 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>iOS 灵动岛与 macOS 顶部通知胶囊；悬浮于视窗正上方，以形变动效实时展示核心连接状态、播放进度或下载摘要。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>自适应圆角胶囊外壳\u003c/li>\u003cli>前置状态微指示点\u003c/li>\u003cli>中间主状态说明\u003c/li>\u003cli>尾部轻量操作或徽标\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦至灵动岛内部交互控件；Space/Enter 展开扩展面板；Escape 退出展开。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>默认呈现极致紧凑的微药丸轮廓，不遮挡主操作视区。\u003c/li>\u003cli>展开时自顶部居中向四周弹性延展（scale &amp; transform）。\u003c/li>\u003cli>高层级阴影（0 12px 28px -6px）与内嵌细高光保证任何背景下皆清晰可见。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div style=&quot;display:flex;justify-content:center;width:100%;padding:12px 0&quot;&gt;&lt;div class=&quot;ds-island&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;div class=&quot;ds-island__capsule&quot;&gt;&lt;div class=&quot;ds-island__leading&quot;&gt;&lt;span class=&quot;ds-status-dot ds-status-dot--live&quot;&gt;&lt;/span&gt;&lt;span&gt;香港 IPLC 专线&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-island__trailing&quot;&gt;&lt;span class=&quot;ds-badge ds-badge--success&quot;&gt;24ms&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;DynamicIsland leading={&lt;&gt;&lt;span className=&quot;ds-status-dot ds-status-dot--live&quot; /&gt;&lt;span&gt;香港专线&lt;/span&gt;&lt;/&gt;} trailing={&lt;span className=&quot;ds-badge ds-badge--success&quot;&gt;24ms&lt;/span&gt;} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 胶囊悬浮高光在深色浅色下层次清晰\u003c/li>\u003cli>□ 展开动效流畅无布局重排\u003c/li>\u003cli>□ 状态切换时读屏器通过 aria-live 播报\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/kanban-card","title":"敏捷任务看板卡片","html":"\u003ch1>敏捷任务看板卡片\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 容器 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Linear 与 Notion 风格的可拖拽任务看板卡片；集成业务标签、优先级图标、任务编号与负责人头像。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>任务分类微胶囊标签\u003c/li>\u003cli>任务标题正文\u003c/li>\u003cli>任务 ID 标识符\u003c/li>\u003cli>优先级红黄绿指示圆点\u003c/li>\u003cli>负责人微头像\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦至卡片；Enter 打开卡片详情模态窗；Space 可配合拖拽动作。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>悬停时运用 translateY(-2px) 与主题阴影上浮，营造纸质卡片被拿起的物理手感。\u003c/li>\u003cli>优先级点与标签色彩统一采用语义变量，不硬编码色值。\u003c/li>\u003cli>标题文字两行截断，避免卡片过长破坏看板纵向规整性。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-kanban&quot; role=&quot;article&quot; tabindex=&quot;0&quot; data-toast=&quot;打开任务详情&quot;&gt;&lt;div class=&quot;ds-kanban__tags&quot;&gt;&lt;span class=&quot;ds-kanban__tag&quot;&gt;网络内核&lt;/span&gt;&lt;span class=&quot;ds-kanban__tag&quot;&gt;v3.2&lt;/span&gt;&lt;/div&gt;&lt;h4 class=&quot;ds-kanban__title&quot;&gt;支持 QUIC 协议多径流聚合传输&lt;/h4&gt;&lt;div class=&quot;ds-kanban__meta&quot;&gt;&lt;div style=&quot;display:inline-flex;align-items:center;gap:6px&quot;&gt;&lt;span style=&quot;font-family:var(--ds-type-mono);font-size:11px&quot;&gt;AET-284&lt;/span&gt;&lt;span style=&quot;color:var(--ds-danger);font-weight:700&quot;&gt;● 紧急&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ds-avatar ds-avatar--xs&quot; title=&quot;Trevor&quot;&gt;T&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;KanbanCard title=&quot;支持 QUIC 协议&quot; priority=&quot;urgent&quot; id=&quot;AET-284&quot; assignee=&quot;Trevor&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 悬浮上浮动效平滑顺畅\u003c/li>\u003cli>□ 聚焦边框完整包裹卡片边缘\u003c/li>\u003cli>□ 标签与正文对比度达标\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/kbd-matrix","title":"快捷键矩阵画板","html":"\u003ch1>快捷键矩阵画板\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Raycast、macOS 与 Warp 风格的快捷键速查速记画板；提供立体拟物键帽与分类清单。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>分组大类标题栏\u003c/li>\u003cli>操作说明名称\u003c/li>\u003cli>立体下沉按键帽 (Kbd Keycap)\u003c/li>\u003cli>组合按键序列\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>画板内容为静态展示；用户在操作系统中按下对应热键直接触发实际功能。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>键帽采用底部 2px 强化硬边与微妙投影，还原物理键盘真实按压手感。\u003c/li>\u003cli>鼠标悬停整行时键帽微幅浮动 (translateY(-1px))，提升交互愉悦感。\u003c/li>\u003cli>字体严格采用等宽字体 (ds-type-mono)，保证 ⌘, ⌥, ⇧, ⌃ 符号美观。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-kbd-matrix&quot;&gt;&lt;div class=&quot;ds-kbd-group&quot;&gt;&lt;div class=&quot;ds-kbd-group__title&quot;&gt;全局操作&lt;/div&gt;&lt;div class=&quot;ds-kbd-row&quot;&gt;&lt;span class=&quot;ds-kbd-row__label&quot;&gt;唤起指令中心&lt;/span&gt;&lt;span class=&quot;ds-kbd-combo&quot;&gt;&lt;kbd class=&quot;ds-kbd-key&quot;&gt;⌘&lt;/kbd&gt;&lt;kbd class=&quot;ds-kbd-key&quot;&gt;K&lt;/kbd&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-kbd-row&quot;&gt;&lt;span class=&quot;ds-kbd-row__label&quot;&gt;快速切换节点&lt;/span&gt;&lt;span class=&quot;ds-kbd-combo&quot;&gt;&lt;kbd class=&quot;ds-kbd-key&quot;&gt;⌘&lt;/kbd&gt;&lt;kbd class=&quot;ds-kbd-key&quot;&gt;P&lt;/kbd&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-kbd-row&quot;&gt;&lt;span class=&quot;ds-kbd-row__label&quot;&gt;刷新连接延迟&lt;/span&gt;&lt;span class=&quot;ds-kbd-combo&quot;&gt;&lt;kbd class=&quot;ds-kbd-key&quot;&gt;⌘&lt;/kbd&gt;&lt;kbd class=&quot;ds-kbd-key&quot;&gt;R&lt;/kbd&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;ShortcutCheatsheet categories={shortcutList} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 拟物键帽按压投影真实分明\u003c/li>\u003cli>□ 等宽字符与修饰符号对齐规整\u003c/li>\u003cli>□ 深浅模式下键帽对比度均满足标准\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/keyboard","title":"快捷键提示","html":"\u003ch1>快捷键提示\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>展示可用的键盘命令，而不把显示标签误当真实绑定。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>kbd 元素\u003c/li>\u003cli>平台正确的修饰键\u003c/li>\u003cli>对应动作说明\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>提示本身不接受焦点；只有已实现的快捷键才展示。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>macOS 用 ⌘，Windows/Linux 用 Ctrl。\u003c/li>\u003cli>应用在输入框中不拦截原生编辑快捷键。\u003c/li>\u003cli>冲突快捷键提供替代按钮。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;span&gt;搜索组件 &lt;kbd class=&quot;ds-key&quot;&gt;Ctrl&lt;/kbd&gt; + &lt;kbd class=&quot;ds-key&quot;&gt;K&lt;/kbd&gt;&lt;/span&gt;\u003c/code>\u003c/pre>\n\u003cp>该组件提供 HTML/CSS 示例，尚未提供独立 React 封装；业务代码应保留原生语义。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 快捷键实际绑定\u003c/li>\u003cli>□ 输入框中行为不冲突\u003c/li>\u003cli>□ 不同平台标签正确\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/linear-command-fuzzy-search-row","title":"Linear & Raycast 模糊匹配指令搜索结果行","html":"\u003ch1>Linear &amp; Raycast 模糊匹配指令搜索结果行\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Linear 与 Raycast 风格的高效模糊匹配结果搜索行（Fuzzy Search Command Row）；支持搜索关键字高亮下划线渲染、前置语义图标、右侧分组徽标与快捷键徽章组合。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>高密度横向结果行 (.ds-fuzzy-row)\u003c/li>\u003cli>前置微型语义图标 (.ds-fuzzy-row__icon)\u003c/li>\u003cli>关键字着色下划线高亮 (.ds-fuzzy-row__highlight)\u003c/li>\u003cli>分组分类微胶囊 (.ds-fuzzy-row__badge)\u003c/li>\u003cli>右侧等宽快捷键提示 (.ds-fuzzy-row__kbd)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>ArrowDown / ArrowUp 在结果间移动高亮；Enter 触发执行；Space 展开该指令子选项。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>role=&quot;option&quot; 配合 aria-selected 声明当前选中态。\u003c/li>\u003cli>高亮字符与普通字符具备强色彩对比度与下划线双重区分。\u003c/li>\u003cli>适合全局命令面板、快捷操作浮层、IDE 指令面板与动作速查器。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-fuzzy-row is-active&quot; role=&quot;option&quot; aria-selected=&quot;true&quot; tabindex=&quot;0&quot; aria-label=&quot;指令项: Git: Checkout branch..., 属于 Git 操作&quot;&gt;&lt;div class=&quot;ds-fuzzy-row__main&quot;&gt;&lt;span class=&quot;ds-fuzzy-row__icon&quot; aria-hidden=&quot;true&quot;&gt;⌥&lt;/span&gt;&lt;span class=&quot;ds-fuzzy-row__title&quot;&gt;Git: &lt;span class=&quot;ds-fuzzy-row__highlight&quot;&gt;Checkout&lt;/span&gt; branch...&lt;/span&gt;&lt;span class=&quot;ds-fuzzy-row__badge&quot;&gt;Git 操作&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-fuzzy-row__kbd&quot; aria-hidden=&quot;true&quot;&gt;&lt;kbd class=&quot;ds-key&quot;&gt;⌘&lt;/kbd&gt;&lt;kbd class=&quot;ds-key&quot;&gt;B&lt;/kbd&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;LinearFuzzyCommandItem title=&quot;Git: Checkout branch...&quot; highlight=&quot;Checkout&quot; shortcut={[&quot;⌘&quot;, &quot;B&quot;]} isActive={true} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 高亮文字青色且带下划线清晰可见\u003c/li>\u003cli>□ 右侧快捷键等宽居中\u003c/li>\u003cli>□ 选中行背景微内凹变暗\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/linear-command-hotkey-badge","title":"Linear 风格实体微凹快捷键组合徽章","html":"\u003ch1>Linear 风格实体微凹快捷键组合徽章\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 通用 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Linear、Raycast 与 GitHub 风格的实体微凹立体机械快捷键组合行；具备独立上下光照渐变键帽底座、微加厚底边与中间连接符。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>快捷键组合容器 (.ds-keycap-combo)\u003c/li>\u003cli>独立键帽小胶囊 (.ds-keycap-cap)\u003c/li>\u003cli>键盘特殊符号与字母\u003c/li>\u003cli>键位间连接符 (.ds-keycap-sep)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>提供完整可读可访问名称，屏幕阅读器按序列读出组合快捷键。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>键帽背景采用垂直微阶梯渐变与 2px 底边边框，重现机械键盘键帽的物理高度。\u003c/li>\u003cli>字体严格采用等宽字体（--ds-type-mono），符号居中平衡。\u003c/li>\u003cli>适合嵌入命令菜单、工具栏提示气泡、帮助手册与设置页面。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-keycap-combo&quot; role=&quot;group&quot; aria-label=&quot;快捷键组合 ⌘ ⇧ P&quot;&gt;&lt;kbd class=&quot;ds-keycap-cap&quot;&gt;⌘&lt;/kbd&gt;&lt;span class=&quot;ds-keycap-sep&quot;&gt;+&lt;/span&gt;&lt;kbd class=&quot;ds-keycap-cap&quot;&gt;⇧&lt;/kbd&gt;&lt;span class=&quot;ds-keycap-sep&quot;&gt;+&lt;/span&gt;&lt;kbd class=&quot;ds-keycap-cap&quot;&gt;P&lt;/kbd&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;KeycapComboBadge keys={[&quot;⌘&quot;, &quot;⇧&quot;, &quot;P&quot;]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 键帽微阴影与底部厚度立体感真实\u003c/li>\u003cli>□ 等宽符号在不同缩放比下对齐良好\u003c/li>\u003cli>□ 组合键文本可访问性无障碍完整\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/linear-command-hotkey-hint","title":"Linear & Raycast 浮动快捷键微提示 HUD","html":"\u003ch1>Linear &amp; Raycast 浮动快捷键微提示 HUD\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 导航 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Linear 与 Raycast 底部浮动常驻快捷键引导胶囊（Hotkey Helper HUD）；以小号圆角微阴影按键展示当前视窗常用操作（搜索、新建工单、呼出帮助），视觉极轻且不抢夺主视觉。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>胶囊全圆角容器 (.ds-hotkey-hint)\u003c/li>\u003cli>组合提示子项 (.ds-hotkey-hint__item)\u003c/li>\u003cli>物理微微内凹键帽 (.ds-hotkey-hint__key)\u003c/li>\u003cli>点状微弱分隔符 (.ds-hotkey-hint__sep)\u003c/li>\u003cli>等宽加粗按键字形\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>无需直接交互；提示的快捷键（如 ⌘K、C、?）在全页面全局监听。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>role=&quot;status&quot; 声明为非侵入式微提示，不会打断屏幕阅读器主流程。\u003c/li>\u003cli>按键符号配合文字提示，无额外视觉歧义。\u003c/li>\u003cli>适合底部常驻状态条、命令面板底部操作栏、表单底部辅助区。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-hotkey-hint&quot; role=&quot;status&quot; aria-label=&quot;快捷键提示&quot;&gt;&lt;div class=&quot;ds-hotkey-hint__item&quot;&gt;&lt;span&gt;搜索&lt;/span&gt;&lt;kbd class=&quot;ds-hotkey-hint__key&quot;&gt;⌘&lt;/kbd&gt;&lt;kbd class=&quot;ds-hotkey-hint__key&quot;&gt;K&lt;/kbd&gt;&lt;/div&gt;&lt;span class=&quot;ds-hotkey-hint__sep&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;div class=&quot;ds-hotkey-hint__item&quot;&gt;&lt;span&gt;新建工单&lt;/span&gt;&lt;kbd class=&quot;ds-hotkey-hint__key&quot;&gt;C&lt;/kbd&gt;&lt;/div&gt;&lt;span class=&quot;ds-hotkey-hint__sep&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;div class=&quot;ds-hotkey-hint__item&quot;&gt;&lt;span&gt;帮助&lt;/span&gt;&lt;kbd class=&quot;ds-hotkey-hint__key&quot;&gt;?&lt;/kbd&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;LinearCommandHotkeyHint hints={[{ label: &quot;搜索&quot;, keys: [&quot;⌘&quot;, &quot;K&quot;] }, { label: &quot;新建工单&quot;, keys: [&quot;C&quot;] }]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 按键高光微内阴影层次清晰\u003c/li>\u003cli>□ 点状分隔符垂直居中对齐\u003c/li>\u003cli>□ 胶囊整体微弱悬浮投影自然\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/linear-command-shortcut-input","title":"Linear & Raycast 热键组合录制输入框","html":"\u003ch1>Linear &amp; Raycast 热键组合录制输入框\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Linear、Raycast 与 Warp 风格的交互式全局快捷键热键录制器；支持直接按下键盘组合键实时捕获、按键药丸高亮与录制中脉冲反馈。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>录制按钮容器 (.ds-shortcut-recorder)\u003c/li>\u003cli>功能命令标签 (.ds-shortcut-recorder__label)\u003c/li>\u003cli>按键药丸容器 (.ds-shortcut-recorder__keys)\u003c/li>\u003cli>立体键帽按键 (.ds-shortcut-recorder__k)\u003c/li>\u003cli>录制中聚焦态 (.is-recording)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 聚焦录制器；Enter 或 Space 进入录制状态；随后捕获物理按下的键位并写入组合；Esc 取消录制。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>支持 WAI-ARIA role=&quot;button&quot; 与 aria-label 报读当前绑定热键，可访问性优良。\u003c/li>\u003cli>立体键帽采用等宽字体与细微底部投影，增强键盘敲击的物理触觉暗示。\u003c/li>\u003cli>适合效率工具设置面板、桌面客户端热键定制中心及游戏辅助配置。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-shortcut-recorder&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;全局搜索命令 快捷键录制: ⌘+Shift+P&quot;&gt;&lt;span class=&quot;ds-shortcut-recorder__label&quot;&gt;全局搜索命令&lt;/span&gt;&lt;div class=&quot;ds-shortcut-recorder__keys&quot;&gt;&lt;kbd class=&quot;ds-shortcut-recorder__k&quot;&gt;⌘&lt;/kbd&gt;&lt;kbd class=&quot;ds-shortcut-recorder__k&quot;&gt;Shift&lt;/kbd&gt;&lt;kbd class=&quot;ds-shortcut-recorder__k&quot;&gt;P&lt;/kbd&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;LinearShortcutRecorder label=&quot;全局搜索命令&quot; shortcut={[&quot;⌘&quot;, &quot;Shift&quot;, &quot;P&quot;]} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 聚焦外发光与主题焦点色一致\u003c/li>\u003cli>□ 按键键帽间距均匀\u003c/li>\u003cli>□ 键盘可导航并能回车触发\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/linear-cycle-burnup-chart","title":"Linear 迭代周期范围与燃尽进度仪表卡","html":"\u003ch1>Linear 迭代周期范围与燃尽进度仪表卡\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Linear 敏捷项目管理风格的 Sprint 周期范围与完成度燃尽卡片（Cycle Burnup &amp; Scope Progress Tracker）；展示当前已交付点数与总工作量范围、线性渐变完成度进度槽、预期理想目标标记线与剩余天数。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角微阴影数据卡 (.ds-cycle-burnup)\u003c/li>\u003cli>头部周期名与等宽点数计数 (.ds-cycle-burnup__title, .ds-cycle-burnup__stats)\u003c/li>\u003cli>线性渐变完成度进度条 (.ds-cycle-burnup__fill)\u003c/li>\u003cli>橙黄理想进度基准标记线 (.ds-cycle-burnup__target)\u003c/li>\u003cli>底部完成百分比徽标与剩余天数 (.ds-cycle-burnup__foot)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 键聚焦燃尽卡片；Enter 键展开详细每日燃尽曲线抽屉。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>role=&quot;region&quot; 配合 aria-label 完整播报周期名称、完成点数与百分比。\u003c/li>\u003cli>颜色满足 WCAG AAA 标级，且具备数值文字与位置双重标识。\u003c/li>\u003cli>适合项目看板、Sprint 规划复盘、里程碑交付监控与团队周报。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-cycle-burnup&quot; role=&quot;region&quot; aria-label=&quot;Cycle 42 · Q4 Sprint 燃尽进度: 84/120 点 (70%)&quot;&gt;&lt;div class=&quot;ds-cycle-burnup__head&quot;&gt;&lt;span class=&quot;ds-cycle-burnup__title&quot;&gt;Cycle 42 · Q4 Sprint&lt;/span&gt;&lt;span class=&quot;ds-cycle-burnup__stats&quot;&gt;84 / 120 pts&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-cycle-burnup__track&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;ds-cycle-burnup__fill&quot; style=&quot;width:70%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ds-cycle-burnup__target&quot; style=&quot;left:80%&quot; title=&quot;预期目标: 80%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ds-cycle-burnup__foot&quot;&gt;&lt;span class=&quot;ds-cycle-burnup__badge&quot;&gt;70% 完成&lt;/span&gt;&lt;span&gt;剩余 &lt;strong&gt;4&lt;/strong&gt; 天&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;LinearCycleBurnupChart cycleName=&quot;Cycle 42 · Q4 Sprint&quot; completedPoints={84} totalScope={120} /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 渐变进度条两端圆润\u003c/li>\u003cli>□ 目标基准线垂直贯穿\u003c/li>\u003cli>□ 数字点数等宽排列\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/linear-filter-popover","title":"Linear & Notion 多条件筛选规则微面板","html":"\u003ch1>Linear &amp; Notion 多条件筛选规则微面板\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Linear 与 Notion 现代协作软件中标志性的高级属性筛选规则微浮层；由“属性名 ▾”、“逻辑符 ▾”与“值 ✕”三个连贯药丸胶囊组成，支持一键重置与应用。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>弹出面板外壳 (.ds-filter-popover)\u003c/li>\u003cli>大写辅助说明标题 (.ds-filter-popover__title)\u003c/li>\u003cli>三段式过滤条件胶囊行 (.ds-filter-popover__row)\u003c/li>\u003cli>独立属性过滤胶囊 (.ds-filter-popover__pill)\u003c/li>\u003cli>底部重置与确认动作栏 (.ds-filter-popover__actions)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>Tab 依次聚焦各过滤胶囊并回车展开选项；Esc 取消并关闭浮层；Enter 确认应用筛选。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>规则胶囊行紧凑排列，高亮显示已过滤的数值药丸，直观呈现查询逻辑。\u003c/li>\u003cli>底部操作栏分离重置与应用操作，避免误触丢失已构建的复合条件。\u003c/li>\u003cli>适合任务看板多维过滤、复杂日志查询台、电商商品聚合筛选及数据库视图构建。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-filter-popover&quot; role=&quot;dialog&quot; aria-label=&quot;数据多条件筛选器&quot;&gt;&lt;span class=&quot;ds-filter-popover__title&quot;&gt;筛选规则 (Filter Rule)&lt;/span&gt;&lt;div class=&quot;ds-filter-popover__row&quot;&gt;&lt;span class=&quot;ds-filter-popover__pill&quot;&gt;Priority ▾&lt;/span&gt;&lt;span class=&quot;ds-filter-popover__pill&quot;&gt;is ▾&lt;/span&gt;&lt;span class=&quot;ds-filter-popover__pill&quot; style=&quot;color:var(--ds-action)&quot;&gt;Urgent ✕&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ds-filter-popover__actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ds-button ds-button--ghost&quot; style=&quot;min-height:26px;font-size:11px&quot;&gt;重置&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ds-button ds-button--primary&quot; style=&quot;min-height:26px;font-size:11px&quot;&gt;应用筛选&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;LinearPropertyFilterPopover property=&quot;Priority&quot; operator=&quot;is&quot; value=&quot;Urgent&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 三个条件药丸水平排布整齐\u003c/li>\u003cli>□ 高亮条件值可一键移除\u003c/li>\u003cli>□ 弹窗投影立体感符合设计规范\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/linear-issue-priority-menu","title":"Linear 触觉多级工单优先级选择微面板","html":"\u003ch1>Linear 触觉多级工单优先级选择微面板\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 表单 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Linear 与 Jira 风格的精细工单优先级选择弹出面板；包含 Urgent（赤红）、High（橙红）、Medium（黄）、Low（天蓝）与无优先级选项，支持单键快捷键与选定标记。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角微型浮层底座 (.ds-priority-menu)\u003c/li>\u003cli>多级优先级菜单项 (.ds-priority-item)\u003c/li>\u003cli>状态彩色语义图标 (.ds-priority-item__icon)\u003c/li>\u003cli>优先级中文/英文标签\u003c/li>\u003cli>右侧数字快捷键徽章 (.ds-priority-item__kbd)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n\u003cdiv class=\"ds-table-scroll\" tabindex=\"0\" aria-label=\"规范表格\">\u003ctable class=\"ds-table\">\u003cthead>\u003ctr>\u003cth scope=\"col\">状态\u003c/th>\u003cth scope=\"col\">处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>默认\u003c/td>\u003ctd>使用语义主题变量；不由组件硬编码主题颜色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover\u003c/td>\u003ctd>仅精细指针启用；颜色与空间变化分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus\u003c/td>\u003ctd>focus-visible 清晰且不被容器裁切\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active\u003c/td>\u003ctd>保留标签与上下文；避免修改控件的宽高\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disabled\u003c/td>\u003ctd>仅对交互控件适用；原生 disabled 并说明原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loading\u003c/td>\u003ctd>只对异步任务适用；阻止重复请求并标明 busy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>在对应上下文提供原因和恢复操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty\u003c/td>\u003ctd>无数据时明确说明原因，不伪造数据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>操作与键盘\u003c/h2>\n\u003cp>上下箭头在各优先级选项间导航；按数字键 1~4 或 0 瞬间选定；Enter 确认；Escape 关闭。\u003c/p>\n\u003ch2>使用细则\u003c/h2>\n\u003cul>\u003cli>采用 role=&quot;menu&quot; 与 role=&quot;menuitemradio&quot;，严格遵循 WAI-ARIA 菜单无障碍约定。\u003c/li>\u003cli>选定项使用柔和强调背景 (.is-selected) 与加粗字重，辨识度极高。\u003c/li>\u003cli>适合工单管理、任务看板、缺陷跟踪与敏捷协作工具。\u003c/li>\u003c/ul>\n\u003ch2>主题、密度与布局\u003c/h2>\n\u003cp>采用 \u003ccode>--ds-ink\u003c/code>、\u003ccode>--ds-muted\u003c/code>、\u003ccode>--ds-surface\u003c/code>、\u003ccode>--ds-line\u003c/code> 和对应语义颜色。浅色与深色分别构建，不做全局反相。默认 44px 控件高度；桌面紧凑模式可为 36px，触摸模式为 48px。内容层实底，不添加 backdrop-filter。\u003c/p>\n\u003ch2>HTML 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"html示例\">\u003ccode>&lt;div class=&quot;ds-priority-menu&quot; role=&quot;menu&quot; aria-label=&quot;优先级选择菜单&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;menuitemradio&quot; aria-checked=&quot;true&quot; class=&quot;ds-priority-item is-selected&quot;&gt;&lt;div class=&quot;ds-priority-item__left&quot;&gt;&lt;span class=&quot;ds-priority-item__icon ds-priority-item__icon--urgent&quot;&gt;!&lt;/span&gt;&lt;span&gt;紧急 Urgent&lt;/span&gt;&lt;/div&gt;&lt;kbd class=&quot;ds-priority-item__kbd&quot;&gt;1&lt;/kbd&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;menuitemradio&quot; aria-checked=&quot;false&quot; class=&quot;ds-priority-item&quot;&gt;&lt;div class=&quot;ds-priority-item__left&quot;&gt;&lt;span class=&quot;ds-priority-item__icon ds-priority-item__icon--high&quot;&gt;▲&lt;/span&gt;&lt;span&gt;高 High&lt;/span&gt;&lt;/div&gt;&lt;kbd class=&quot;ds-priority-item__kbd&quot;&gt;2&lt;/kbd&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;menuitemradio&quot; aria-checked=&quot;false&quot; class=&quot;ds-priority-item&quot;&gt;&lt;div class=&quot;ds-priority-item__left&quot;&gt;&lt;span class=&quot;ds-priority-item__icon ds-priority-item__icon--med&quot;&gt;■&lt;/span&gt;&lt;span&gt;中 Medium&lt;/span&gt;&lt;/div&gt;&lt;kbd class=&quot;ds-priority-item__kbd&quot;&gt;3&lt;/kbd&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;menuitemradio&quot; aria-checked=&quot;false&quot; class=&quot;ds-priority-item&quot;&gt;&lt;div class=&quot;ds-priority-item__left&quot;&gt;&lt;span class=&quot;ds-priority-item__icon ds-priority-item__icon--low&quot;&gt;▼&lt;/span&gt;&lt;span&gt;低 Low&lt;/span&gt;&lt;/div&gt;&lt;kbd class=&quot;ds-priority-item__kbd&quot;&gt;4&lt;/kbd&gt;&lt;/button&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>React 示例\u003c/h2>\n\u003cpre class=\"ds-code\" tabindex=\"0\" aria-label=\"tsx示例\">\u003ccode>&lt;LinearPriorityMenu selected=&quot;urgent&quot; /&gt;\u003c/code>\u003c/pre>\n\u003cp>组件源码见 \u003ca href=\"web/react.tsx\">web/react.tsx\u003c/a>。\u003c/p>\n\u003ch2>验收\u003c/h2>\n\u003cul>\u003cli>□ 优先级色标符合国际通行规范\u003c/li>\u003cli>□ 快捷键徽标垂直居中\u003c/li>\u003cli>□ 菜单项悬停平滑反馈\u003c/li>\u003cli>□ 浅色、深色、200% 缩放和减少动效均可完成任务\u003c/li>\u003cli>□ 错误、禁用和加载状态没有虚构成功结果\u003c/li>\u003c/ul>\n\u003ch2>相关规范\u003c/h2>\n\u003cp>\u003ca href=\"#guides/accessibility\">无障碍\u003c/a> · \u003ca href=\"#guides/states\">状态和异步\u003c/a> · \u003ca href=\"#guides/themes\">主题\u003c/a> · \u003ca href=\"#guides/quality\">验收流程\u003c/a>\u003c/p>","group":"组件规范"},{"id":"components/linear-issue-relation-badge","title":"Linear 工单双向关联依赖徽标","html":"\u003ch1>Linear 工单双向关联依赖徽标\u003c/h1>\n\u003cp>\u003ca href=\"#README\">返回组件目录\u003c/a> · 数据 · CSS / HTML / React\u003c/p>\n\u003ch2>目的与边界\u003c/h2>\n\u003cp>Linear 风格的高密度工单相互关联标记微胶囊；展示关系类型（blocks、blocked by、relates to）、关联目标工单号及目标工单的当前完成状态圆点。\u003c/p>\n\u003ch2>结构\u003c/h2>\n\u003cul>\u003cli>圆角微边框药丸 (.ds-issue-relation)\u003c/li>\u003cli>语义动作小图标 (.ds-issue-relation__icon)\u003c/li>\u003cli>关系类型说明 (.ds-issue-relation__label)\u003c/li>\u003cli>等宽工单标识 (.ds-issue-relation__id)\u003c/li>\u003cli>目标工单状态彩色圆点 (.ds-issue-relation__status)\u003c/li>\u003c/ul>\n\u003ch2>状态约定\u003c/h2>\n
