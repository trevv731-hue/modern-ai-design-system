<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设计系统 · 详细手册</title><link rel="stylesheet" href="dist/web/theme.css"><link rel="stylesheet" href="dist/web/components.css"><style>
.handbook{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.handbook-nav{height:100vh;position:sticky;top:0;display:flex;flex-direction:column;padding:24px 16px;border-right:1px solid var(--ds-line);gap:16px}.handbook-nav h2{margin:0;font-size:18px;letter-spacing:-.03em}.handbook-nav>input{min-height:42px;border:1px solid var(--ds-control-line);border-radius:10px;background:var(--ds-surface);color:var(--ds-ink);padding:8px 12px}.document-list{overflow:auto;flex:1}.document-list summary{font-weight:600;font-size:12px;padding:14px 8px;color:var(--ds-muted)}.document-list a{display:block;padding:8px 10px;font-size:13px;text-decoration:none;color:var(--ds-muted);border-radius:9px;min-height:36px}.document-list a[aria-current=page]{background:var(--ds-surface);color:var(--ds-accent)}.handbook-main{min-width:0}.handbook-bar{position:sticky;top:0;border-bottom:1px solid var(--ds-line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 36px;z-index:10}.document-content{max-width:900px;padding:44px 40px 80px;margin:auto}.document-content h1{font-size:32px;line-height:1.3;letter-spacing:-.045em;margin:0 0 16px}.document-content h2{font-size:21px;margin:32px 0 12px;letter-spacing:-.02em}.document-content h3{font-size:17px;margin:24px 0 8px}.document-content p{margin:12px 0;line-height:1.85}.document-content li{margin:7px 0;line-height:1.8}.document-content code:not(pre code){font-size:12px;background:var(--ds-inset);padding:2px 5px;border-radius:5px;overflow-wrap:anywhere}.document-content pre{margin:16px 0}.document-content .ds-table{white-space:normal}.document-content .ds-table th,.document-content .ds-table td{vertical-align:top;min-width:120px}.document-content a{color:var(--ds-accent)}.document-footnote{margin-top:40px;padding-top:20px;border-top:1px solid var(--ds-line);color:var(--ds-muted);font-size:12px}@media(max-width:850px){.handbook{grid-template-columns:220px 1fr}.handbook-nav{padding:18px 12px}.document-content{padding:28px 24px}.handbook-bar{padding:14px 24px}}@media(max-width:650px){.handbook{grid-template-columns:1fr}.handbook-nav{position:relative;height:auto;max-height:320px;border-right:0;border-bottom:1px solid var(--ds-line)}.document-list{max-height:180px}.document-content{padding:24px 18px}.document-content h1{font-size:27px}.handbook-bar{padding:12px 18px}.document-content .ds-table{font-size:12px}}
</style></head><body><div class="handbook"><aside class="handbook-nav ds-chrome"><div><a href="index.html" style="font-size:12px;color:var(--ds-accent);text-decoration:none">← 返回组件目录</a><h2>设计系统详细手册</h2><span class="ds-badge" id="document-count"></span></div><input type="search" id="guide-search" aria-label="搜索手册标题" placeholder="搜索组件或规范…"><nav class="document-list" id="document-list" aria-label="手册文档"></nav></aside><div class="handbook-main"><header class="handbook-bar ds-chrome"><span class="app-kicker" id="current-category">实施指南</span><button class="ds-button ds-button--secondary" id="theme">深色主题</button></header><main class="document-content" id="document" tabindex="-1"></main></div></div><script>/*__GUIDES__*/</script><script>
const guides=window.DS_GUIDES;const list=document.getElementById('document-list');document.getElementById('document-count').textContent=guides.length+' 篇详细规范';
for(const group of ['实施指南','组件规范','页面场景']){const section=document.createElement('details');section.open=true;const summary=document.createElement('summary');summary.textContent=group;section.append(summary);for(const guide of guides.filter(d=>d.group===group)){const link=document.createElement('a');link.href='#'+guide.id;link.textContent=guide.title;link.dataset.id=guide.id;section.append(link)}list.append(section)}
function render(){const id=decodeURIComponent(location.hash.slice(1)||'README');const guide=guides.find(d=>d.id===id)||guides.find(d=>d.id==='README');document.getElementById('document').innerHTML=guide.html+'<div class="document-footnote">Modern AI Design System v3 · 当前文档源：docs/'+guide.id+'.md · 规范为本系统约定，用户当前请求优先。</div>';document.title=guide.title+' · 设计系统';document.getElementById('current-category').textContent=guide.group;list.querySelectorAll('a').forEach(a=>{if(a.dataset.id===guide.id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
document.getElementById('guide-search').oninput=e=>{const q=e.target.value.trim().toLowerCase();list.querySelectorAll('a').forEach(a=>a.hidden=!a.textContent.toLowerCase().includes(q));list.querySelectorAll('details').forEach(d=>{d.hidden=![...d.querySelectorAll('a')].some(a=>!a.hidden)})};
const theme=localStorage.getItem('ds-gallery-theme');if(['light','dark'].includes(theme))document.documentElement.dataset.theme=theme;const button=document.getElementById('theme');const label=()=>button.textContent=document.documentElement.dataset.theme==='light'?'深色主题':'浅色主题';label();button.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';localStorage.setItem('ds-gallery-theme',document.documentElement.dataset.theme);label()};
</script></body></html>
